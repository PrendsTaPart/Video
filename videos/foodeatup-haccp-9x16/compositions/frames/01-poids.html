<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 1 — Le poids de la conformité (portrait)</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter", sans-serif; color: #1b2a41; isolation: isolate; }
        .bg { position: absolute; inset: 0; background-color: #f7f9fc; background-image: radial-gradient(circle at 50% 26%, rgba(30,155,240,0.05), transparent 55%), radial-gradient(circle, rgba(27,42,65,0.09) 1.6px, transparent 1.6px); background-size: 100% 100%, 46px 46px; }
        .shake { position: absolute; inset: 0; }

        .figure { position: absolute; z-index: 2; top: 60px; left: 220px; width: 640px; height: 620px; mix-blend-mode: multiply; opacity: 0; will-change: transform, opacity; }
        .figure img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .fiches { position: absolute; left: 110px; top: 700px; width: 860px; z-index: 3; display: flex; flex-direction: column; gap: 18px; }
        .fiche { position: relative; box-sizing: border-box; background: #ffffff; border: 1.5px solid rgba(27,42,65,0.1); border-radius: 16px; padding: 22px 30px; display: flex; align-items: center; gap: 22px; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
        .fiche::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 7px; border-radius: 4px; background: #1e9bf0; }
        .fiche-ic { flex: 0 0 58px; width: 58px; height: 58px; display: grid; place-items: center; background: rgba(30,155,240,0.08); border-radius: 50%; }
        .fiche-ic svg { width: 32px; height: 32px; fill: none; stroke: #1e9bf0; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .fiche-label { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em; color: #1b2a41; line-height: 1.12; }
        .fiche-sub { display: block; font-family: "Inter", sans-serif; font-weight: 500; font-size: 24px; color: #566472; margin-top: 3px; }

        .stamp { position: absolute; z-index: 5; left: 50%; top: 500px; transform: translateX(-50%) rotate(-7deg); padding: 18px 46px; border: 6px solid #1b2a41; border-radius: 16px; background: rgba(247,249,252,0.85); font-family: "Poppins", sans-serif; font-weight: 800; font-size: 58px; letter-spacing: 0.08em; color: #1b2a41; transform-origin: 50% 50%; opacity: 0; white-space: nowrap; will-change: transform, opacity; }
      </style>

      <div id="root" data-composition-id="01-poids" data-width="1080" data-height="1920" data-duration="13.117">
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="12.617" data-track-index="0"></div>
        <div id="scene" class="clip" data-start="0" data-duration="12.617" data-track-index="1" style="position:absolute; inset:0;">
          <div class="shake">
            <div class="figure" id="figure"><img src="public/haccp-paperwork.png" alt="Chef débordé par la paperasse HACCP" /></div>
            <div class="fiches">
              <div class="fiche" id="f1"><span class="fiche-ic"><svg viewBox="0 0 24 24"><path d="M14 4v10.5a3.5 3.5 0 1 1-4 0V4a2 2 0 0 1 4 0z" /><path d="M12 15v-6" /></svg></span><span class="fiche-label">Relevés de température<span class="fiche-sub">plusieurs fois par jour</span></span></div>
              <div class="fiche" id="f2"><span class="fiche-ic"><svg viewBox="0 0 24 24"><path d="M21 8V7l-9-4-9 4v10l9 4 9-4v-1" /><path d="M3 7l9 4 9-4M12 11v10" /></svg></span><span class="fiche-label">Contrôles à réception<span class="fiche-sub">chaque livraison</span></span></div>
              <div class="fiche" id="f3"><span class="fiche-ic"><svg viewBox="0 0 24 24"><path d="M9 12a3 3 0 0 1 3-3h2a3 3 0 0 0 0-6H8a3 3 0 0 0 0 6" /><path d="M15 12a3 3 0 0 1-3 3h-2a3 3 0 0 0 0 6h6a3 3 0 0 0 0-6" /></svg></span><span class="fiche-label">Traçabilité<span class="fiche-sub">chaque produit</span></span></div>
              <div class="fiche" id="f4"><span class="fiche-ic"><svg viewBox="0 0 24 24"><path d="M20 12l-8 8-8-8V4h8z" /><circle cx="8" cy="8" r="1.4" /></svg></span><span class="fiche-label">Étiquettes DLC<span class="fiche-sub">à imprimer, à jour</span></span></div>
              <div class="fiche" id="f5"><span class="fiche-ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" /><path d="M9 8l1.5 1.5L13 7M9 14l1.5 1.5L13 13" /></svg></span><span class="fiche-label">Checklists d'hygiène<span class="fiche-sub">à cocher, à archiver</span></span></div>
            </div>
            <div class="stamp" id="stamp">OBLIGATOIRE</div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var root = document.querySelector('[data-composition-id="01-poids"][id="root"]') || document.querySelector('[data-composition-id="01-poids"]');
          var tl = gsap.timeline({ paused: true });
          var shakeEl = root.querySelector(".shake");
          tl.fromTo(root.querySelector("#figure"), { y: -34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.0);
          var cues = [1.0, 2.2, 3.4, 4.6, 5.8];
          ["#f1", "#f2", "#f3", "#f4", "#f5"].forEach(function (id, i) {
            tl.fromTo(root.querySelector(id), { scale: 0.85, y: 30, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, cues[i]);
          });
          tl.fromTo(root.querySelector("#stamp"), { scale: 1.6, opacity: 0, rotation: -7 }, { scale: 1, opacity: 1, rotation: -7, duration: 0.4, ease: "power4.out" }, 8.0);
          tl.to(root.querySelector(".fiches"), { scale: 0.96, duration: 0.8, ease: "power2.inOut" }, 9.6);
          var shk = { t: 0 };
          tl.to(shk, { t: 1, duration: 1.2, ease: "none", onUpdate: function () {
            var tt = shk.t; var env = Math.max(0, Math.min(1, tt / 0.16, (1 - tt) / 0.18));
            var ph = tt * 1.2 * Math.PI * 2;
            shakeEl.style.transform = "translate(" + (Math.sin(ph * 3.5) * 3.2 * env) + "px," + (Math.sin(ph * 2.7 + 1.1) * 2.3 * env) + "px)";
          } }, 9.6);
          window.__timelines["01-poids"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
