<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 02 — Le break (physique réelle)</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
        #root {
          position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
          background: #05070c; font-family: "Inter", sans-serif; color: #f7f9fc;
        }
        #bg { position: absolute; inset: 0; }
        .felt { position: absolute; inset: 0;
          background:
            radial-gradient(ellipse 900px 620px at 50% 46%, rgba(30, 155, 240, 0.16), transparent 62%),
            radial-gradient(ellipse 1400px 1000px at 50% 50%, #14395f 0%, #0e2a4d 45%, #081826 78%, #05070c 100%);
        }
        .felt::after { content: ""; position: absolute; inset: 0;
          background: radial-gradient(ellipse 1100px 780px at 50% 48%, transparent 60%, rgba(0, 0, 0, 0.55) 100%);
        }
        .rail { position: absolute; left: 120px; top: 90px; right: 120px; bottom: 90px; border-radius: 28px;
          border: 14px solid #1a2436; box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
        }
        .pocket { position: absolute; width: 52px; height: 52px; margin-left: -26px; margin-top: -26px;
          border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2a2f3a, #05070a 70%);
          box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
        }

        .shakeWrap { position: absolute; inset: 0; }

        .ball { position: absolute; left: 0; top: 0; width: 88px; height: 88px; margin-left: -44px; margin-top: -44px;
          border-radius: 50%; box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
        }
        .ball .disc { position: absolute; inset: 0; border-radius: 50%; background: var(--bc); overflow: hidden; }
        .ball .shine { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.85), transparent 46%); }
        .ball .band { position: absolute; left: 0; right: 0; top: 30px; bottom: 30px; background: #f4f2ea; }
        .ball .numWrap { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin-left: -22px; margin-top: -22px; border-radius: 50%; background: #f4f2ea; display: flex; align-items: center; justify-content: center; }
        .ball .num { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 24px; color: #191b1f; }
        .ball.ghost .outline { position: absolute; inset: 0; border-radius: 50%; border: 3px dashed rgba(247, 249, 252, 0.55); background: rgba(247, 249, 252, 0.03); }

        .cueBall { position: absolute; left: 0; top: 0; width: 78px; height: 78px; margin-left: -39px; margin-top: -39px;
          border-radius: 50%; background: radial-gradient(circle at 34% 28%, #ffffff, #dfe6ee 70%);
          box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
        }
        .cueGlow { position: absolute; left: 0; top: 0; width: 160px; height: 160px; margin-left: -80px; margin-top: -80px;
          border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 70%); opacity: 0;
        }

        .flash { position: absolute; inset: 0;
          background: radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.9), transparent 55%); opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="02-break" data-width="1920" data-height="1080" data-duration="7.5">
        <div class="clip" id="bg" data-start="0" data-duration="7.5" data-track-index="0">
          <div class="felt"></div>
          <div class="rail">
            <div class="pocket" style="left: 0px; top: 0px"></div>
            <div class="pocket" style="left: 800px; top: -36px"></div>
            <div class="pocket" style="left: 1600px; top: 0px"></div>
            <div class="pocket" style="left: 0px; top: 800px"></div>
            <div class="pocket" style="left: 800px; top: 836px"></div>
            <div class="pocket" style="left: 1600px; top: 800px"></div>
          </div>
        </div>

        <div class="clip shakeWrap" data-start="0" data-duration="7.5" data-track-index="1">
          <div class="ballLayer"></div>
          <div class="cueGlow"></div>
          <div class="cueBall"></div>
        </div>

        <div class="clip flash" data-start="0" data-duration="7.5" data-track-index="2"></div>

        <audio id="sfx02a" src="assets/sfx/impact-bass-1.mp3" data-start="2.5" data-duration="2.758" data-track-index="20" data-volume="0.85"></audio>
        <audio id="sfx02b" src="assets/sfx/click-soft.mp3" data-start="0.9" data-duration="0.264" data-track-index="21" data-volume="0.3"></audio>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script src="compositions/data/physics-data.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var root = document.querySelector('[data-composition-id="02-break"][id="root"]');
          if (!root) root = document.querySelector('[data-composition-id="02-break"]');
          var PHYS = window.__PHYSICS__;
          var APPROACH = 2.5; // cosmetic tension beat before the (real-physics) impact

          // Rack starting layout — identical to scripts/bake-physics.mjs, so the cut
          // from "held" to "physics frame 0" at t=APPROACH is seamless.
          var CX = 960;
          var ROWS_Y = [300, 378, 456, 534, 612];
          function rowX(row, col) {
            var count = row + 1;
            var start = CX - ((count - 1) * 88) / 2;
            return start + col * 88;
          }
          var RACK = PHYS.balls.map(function (b, i) {
            return b;
          });
          // row/col layout must match the bake script exactly
          var LAYOUT = {
            1: [0, 0], 2: [1, 0], 3: [1, 1], 4: [2, 0], 8: [2, 1], 5: [2, 2],
            6: [3, 0], 7: [3, 1], 9: [3, 2], 10: [3, 3], 11: [4, 0], 12: [4, 1],
          };
          RACK.forEach(function (b) {
            var rc = LAYOUT[b.id];
            b.startX = rowX(rc[0], rc[1]);
            b.startY = ROWS_Y[rc[0]];
          });

          var ballLayer = root.querySelector(".ballLayer");
          RACK.forEach(function (b) {
            var el = document.createElement("div");
            el.className = "ball";
            el.style.setProperty("--bc", b.c);
            var inner = '<div class="disc">' + (b.stripe ? '<div class="band"></div>' : "") + "</div>";
            inner += '<div class="shine"></div>';
            inner += '<div class="numWrap"><span class="num">' + b.id + "</span></div>";
            el.innerHTML = inner;
            el.style.transform = "translate(" + b.startX + "px," + b.startY + "px)";
            ballLayer.appendChild(el);
            b._el = el;
          });

          // 3 chalk-outline ghosts, static the whole film — never physical bodies,
          // so they sit undisturbed at the back of the rack through the break.
          var GHOSTS = [[960, 612], [1048, 612], [1136, 612]];
          GHOSTS.forEach(function (p) {
            var el = document.createElement("div");
            el.className = "ball ghost";
            el.innerHTML = '<div class="outline"></div>';
            el.style.transform = "translate(" + p[0] + "px," + p[1] + "px)";
            ballLayer.appendChild(el);
          });

          var cueBall = root.querySelector(".cueBall");
          var cueGlow = root.querySelector(".cueGlow");
          var CUE_START = { x: 960, y: 250 };
          cueBall.style.transform = "translate(" + CUE_START.x + "px," + CUE_START.y + "px)";
          cueGlow.style.transform = "translate(" + CUE_START.x + "px," + CUE_START.y + "px)";

          function renderAt(localT) {
            if (localT < APPROACH) {
              // held rack + pulsing cue ball, handled by the tension tween below
              return;
            }
            var physT = localT - APPROACH;
            var idx = Math.min(PHYS.breakEndFrame - 1, Math.max(0, Math.round(physT * PHYS.fps)));
            var frame = PHYS.frames[idx];
            RACK.forEach(function (b) {
              var p = frame[b.id];
              if (p) b._el.style.transform = "translate(" + p.x + "px," + p.y + "px)";
            });
            if (frame.cue) {
              cueBall.style.opacity = 1;
              cueBall.style.transform = "translate(" + frame.cue.x + "px," + frame.cue.y + "px)";
            } else {
              cueBall.style.opacity = 0;
            }
          }

          var tl = gsap.timeline({ paused: true });
          var driver = { t: 0 };
          tl.to(
            driver,
            {
              t: 7.5,
              duration: 7.5,
              ease: "none",
              onUpdate: function () {
                renderAt(driver.t);
              },
            },
            0
          );

          // Cosmetic tension beat (0 → APPROACH): the cue ball breathes, a glow
          // builds, then a sharp squash right on the cut into the real break.
          tl.fromTo(cueGlow, { opacity: 0, scale: 0.6 }, { opacity: 0.7, scale: 1, duration: 1.6, ease: "sine.inOut" }, 0.3);
          tl.to(cueBall, { scale: 1.05, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.3);
          tl.to(cueBall, { scale: 0.82, duration: 0.14, ease: "power2.in" }, APPROACH - 0.14);
          tl.set(cueGlow, { opacity: 0 }, APPROACH);
          tl.set(cueBall, { scale: 1 }, APPROACH);

          // Impact: flash + camera shake, right on the cut to physics playback
          var flash = root.querySelector(".flash");
          var shake = root.querySelector(".shakeWrap");
          tl.fromTo(flash, { opacity: 0 }, { opacity: 0.85, duration: 0.07, ease: "power1.out" }, APPROACH);
          tl.to(flash, { opacity: 0, duration: 0.32, ease: "power2.out" }, APPROACH + 0.07);
          var shk = { t: 0 };
          tl.to(
            shk,
            {
              t: 1,
              duration: 0.55,
              ease: "none",
              onUpdate: function () {
                var env = 1 - shk.t;
                var x = Math.sin(shk.t * Math.PI * 10) * 9 * env;
                var y = Math.sin(shk.t * Math.PI * 8) * 6 * env;
                shake.style.transform = "translate(" + x + "px," + y + "px)";
              },
            },
            APPROACH
          );

          window.__timelines["02-break"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
