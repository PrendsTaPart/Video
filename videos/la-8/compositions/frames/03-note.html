<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 03 — La note (physique réelle)</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root {
          position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
          background: #05070c; font-family: "Inter", sans-serif; color: #f7f9fc;
        }
        #bg { position: absolute; inset: 0; }
        .felt { position: absolute; inset: 0;
          background:
            radial-gradient(ellipse 900px 620px at 50% 46%, rgba(30, 155, 240, 0.16), transparent 62%),
            radial-gradient(ellipse 1400px 1000px at 50% 50%, #14395f 0%, #0e2a4d 45%, #081826 78%, #05070c 100%);
        }
        .felt::after { content: ""; position: absolute; inset: 0;
          background: radial-gradient(ellipse 1100px 780px at 50% 48%, transparent 60%, rgba(0, 0, 0, 0.55) 100%);
        }
        .rail { position: absolute; left: 120px; top: 90px; right: 120px; bottom: 90px; border-radius: 28px;
          border: 14px solid #1a2436; box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
        }
        .pocket { position: absolute; width: 52px; height: 52px; margin-left: -26px; margin-top: -26px;
          border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2a2f3a, #05070a 70%);
          box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
        }
        .glow { position: absolute; left: 0; top: 0; width: 100px; height: 100px; margin-left: -50px; margin-top: -50px;
          border-radius: 50%; background: radial-gradient(circle, rgba(30,155,240,0.6), transparent 70%); opacity: 0;
        }

        .ball { position: absolute; left: 0; top: 0; width: 88px; height: 88px; margin-left: -44px; margin-top: -44px; border-radius: 50%;
          box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
        }
        .ball .disc { position: absolute; inset: 0; border-radius: 50%; background: var(--bc); overflow: hidden; }
        .ball .shine { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.85), transparent 46%); }
        .ball .band { position: absolute; left: 0; right: 0; top: 30px; bottom: 30px; background: #f4f2ea; }
        .ball .numWrap { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin-left: -22px; margin-top: -22px; border-radius: 50%; background: #f4f2ea; display: flex; align-items: center; justify-content: center; }
        .ball .num { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 24px; color: #191b1f; }
        .ball.ghost .outline { position: absolute; inset: 0; border-radius: 50%; border: 3px dashed rgba(247, 249, 252, 0.55); background: rgba(247, 249, 252, 0.03); }

        .receipt { position: absolute; right: 90px; top: 110px; width: 430px; display: flex; flex-direction: column; gap: 9px; }
        .rline { display: flex; align-items: center; gap: 12px; padding: 9px 16px; background: rgba(5,7,12,0.78);
          border: 1.5px solid rgba(247,249,252,0.18); border-radius: 10px; font-size: 19px; font-weight: 500; opacity: 0;
        }
        .rline .rdot { width: 10px; height: 10px; border-radius: 50%; background: var(--dc); flex: none; }

        .counterWrap { position: absolute; left: 0; right: 0; bottom: 190px; text-align: center; opacity: 0; }
        .counterLabel { font-family: "Inter", sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(247,249,252,0.7); margin-bottom: 10px; }
        .counterValue { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 92px; color: #ffffff; }
        .counterValue .range { color: #1E9BF0; }
        .counterSub { font-family: "Inter", sans-serif; font-weight: 500; font-size: 26px; color: rgba(247,249,252,0.85); margin-top: 6px; }

        .legal { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-family: "Inter", sans-serif;
          font-size: 17px; color: rgba(247,249,252,0.55); padding: 0 200px; opacity: 0;
        }

        .subtitle { position: absolute; left: 0; right: 0; bottom: 260px; text-align: center; font-family: "Poppins", sans-serif;
          font-weight: 700; font-size: 38px; color: #ffffff; -webkit-text-stroke: 5px #000000; paint-order: stroke fill; opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="03-note" data-width="1920" data-height="1080" data-duration="12.233">
        <div class="clip" id="bg" data-start="0" data-duration="12.233" data-track-index="0">
          <div class="felt"></div>
          <div class="rail">
            <div class="pocket" style="left: 0px; top: 0px"></div>
            <div class="pocket" style="left: 800px; top: -36px"></div>
            <div class="pocket" style="left: 1600px; top: 0px"></div>
            <div class="pocket" style="left: 0px; top: 800px"></div>
            <div class="pocket" style="left: 800px; top: 836px"></div>
            <div class="pocket" style="left: 1600px; top: 800px"></div>
          </div>
        </div>

        <div class="clip scene" data-start="0" data-duration="12.233" data-track-index="1">
          <div class="ballLayer"></div>
          <div class="glowLayer"></div>
        </div>

        <div class="clip subLayer" data-start="0" data-duration="12.233" data-track-index="2"></div>
        <div class="clip receipt" data-start="0" data-duration="12.233" data-track-index="3"></div>

        <div class="clip counterWrap" data-start="0" data-duration="12.233" data-track-index="4">
          <div class="counterLabel">Un restaurant équipé paie</div>
          <div class="counterValue"><span class="tumble">0 €</span></div>
          <div class="counterSub">par mois · hors caisse · hors paie</div>
        </div>

        <div class="clip legal" data-start="0" data-duration="12.233" data-track-index="5">
          Fourchette relevée sur les grilles publiques des éditeurs, juillet 2026 — hors caisse et hors paie.
          Marques citées à titre d'identification. site.foodeatup.com/comparateur
        </div>

        <audio id="voice03" src="assets/voice/03.mp3" data-start="0.3" data-duration="6.217" data-track-index="10" data-volume="1"></audio>
        <audio id="sfx03e" src="assets/sfx/chime.mp3" data-start="9.3" data-duration="0.72" data-track-index="24" data-volume="0.45"></audio>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script src="compositions/data/physics-data.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var root = document.querySelector('[data-composition-id="03-note"][id="root"]');
          if (!root) root = document.querySelector('[data-composition-id="03-note"]');
          var PHYS = window.__PHYSICS__;
          var LOCAL_DURATION = (PHYS.totalFrames - PHYS.breakEndFrame) / PHYS.fps;

          var ballLayer = root.querySelector(".ballLayer");
          var glowLayer = root.querySelector(".glowLayer");
          var receipt = root.querySelector(".receipt");

          var ballsById = {};
          PHYS.balls.forEach(function (b) {
            if (b.eight) return; // the 8 isn't part of this clearance — it never falls
            var el = document.createElement("div");
            el.className = "ball";
            el.style.setProperty("--bc", b.c);
            var inner = '<div class="disc">' + (b.stripe ? '<div class="band"></div>' : "") + "</div>";
            inner += '<div class="shine"></div>';
            inner += '<div class="numWrap"><span class="num">' + b.id + "</span></div>";
            el.innerHTML = inner;
            ballLayer.appendChild(el);
            ballsById[b.id] = { el: el, cat: b.cat, c: b.c };
          });
          // the 8, present but untouched throughout
          var eightMeta = PHYS.balls.find(function (b) { return b.eight; });
          var eightEl = document.createElement("div");
          eightEl.className = "ball";
          eightEl.style.setProperty("--bc", eightMeta.c);
          eightEl.innerHTML = '<div class="disc"></div><div class="shine"></div><div class="numWrap"><span class="num">8</span></div>';
          ballLayer.appendChild(eightEl);

          var GHOSTS = [[960, 612], [1048, 612], [1136, 612]];
          GHOSTS.forEach(function (p) {
            var el = document.createElement("div");
            el.className = "ball ghost";
            el.innerHTML = '<div class="outline"></div>';
            el.style.transform = "translate(" + p[0] + "px," + p[1] + "px)";
            ballLayer.appendChild(el);
          });

          // one glow + one receipt line per real pot event, in the order it actually happened
          var pocketPos = PHYS.pockets;
          PHYS.events.forEach(function (ev) {
            var glow = document.createElement("div");
            var pk = pocketPos[ev.pocket];
            glow.className = "glow";
            glow.style.transform = "translate(" + pk.x + "px," + pk.y + "px)";
            glowLayer.appendChild(glow);
            ev._glowEl = glow;

            var meta = ballsById[ev.id];
            var line = document.createElement("div");
            line.className = "rline";
            line.innerHTML = '<span class="rdot" style="background:' + meta.c + '"></span>' + meta.cat;
            receipt.appendChild(line);
            ev._lineEl = line;
            ev.localFrame = ev.frame - PHYS.breakEndFrame;
          });

          function renderAt(localT) {
            var idx = Math.min(PHYS.totalFrames - PHYS.breakEndFrame - 1, Math.max(0, Math.round(localT * PHYS.fps)));
            var frame = PHYS.frames[PHYS.breakEndFrame + idx];
            Object.keys(ballsById).forEach(function (id) {
              var b = ballsById[id];
              var p = frame[id];
              if (p) {
                b.el.style.opacity = 1;
                b.el.style.transform = "translate(" + p.x + "px," + p.y + "px)";
              } else {
                b.el.style.opacity = 0;
              }
            });
            var eightP = frame["8"];
            if (eightP) eightEl.style.transform = "translate(" + eightP.x + "px," + eightP.y + "px)";

            PHYS.events.forEach(function (ev) {
              var since = idx - ev.localFrame;
              var visible = since >= 0;
              ev._lineEl.style.opacity = visible ? Math.min(1, since / 8 + 0.4) : 0;
              ev._lineEl.style.transform = visible ? "none" : "translateX(24px)";
              var glowT = since / 12;
              ev._glowEl.style.opacity = visible ? Math.max(0, 1 - glowT) : 0;
              ev._glowEl.style.transform = "translate(" + pocketPos[ev.pocket].x + "px," + pocketPos[ev.pocket].y + "px) scale(" + (1 + glowT * 0.6) + ")";
            });
          }

          var tl = gsap.timeline({ paused: true });
          var driver = { t: 0 };
          tl.to(
            driver,
            {
              t: LOCAL_DURATION,
              duration: LOCAL_DURATION,
              ease: "none",
              onUpdate: function () {
                renderAt(driver.t);
              },
            },
            0
          );

          // Counter: tumble through nonsense-fast numbers, resolve on the real range
          // once the table's actually clear (last real pot event), not on a guess.
          var lastEventLocalT = Math.max.apply(
            null,
            PHYS.events.map(function (e) { return e.localFrame / PHYS.fps; })
          );
          var counterAt = Math.min(LOCAL_DURATION - 2.0, lastEventLocalT + 0.5);
          var tumble = root.querySelector(".tumble");
          var counterWrap = root.querySelector(".counterWrap");
          tl.fromTo(counterWrap, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, counterAt);
          var tumbleSteps = ["120 €", "260 €", "410 €", "590 €", "730 €", "880 €", "1 010 €"];
          tumbleSteps.forEach(function (v, i) {
            tl.set(tumble, { textContent: v }, counterAt + 0.1 + i * 0.09);
          });
          tl.call(
            function () {
              tumble.innerHTML = '<span class="range">540 € – 1 040 €</span> / mois';
            },
            null,
            counterAt + 0.75
          );
          tl.fromTo(tumble, { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, counterAt + 0.75);

          var legal = root.querySelector(".legal");
          tl.fromTo(legal, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, counterAt + 1.0);
          tl.to(legal, { opacity: 0, duration: 0.3 }, LOCAL_DURATION - 0.4);

          // Subtitles
          var subLayer = root.querySelector(".subLayer");
          var LINES = [
            [0.3, 2.8, "Un restaurant équipé paie entre"],
            [2.8, 5.25, "cinq cent quarante et mille quarante euros par mois"],
            [5.25, 5.94, "Hors caisse."],
            [5.94, 6.52, "Hors paie."],
          ];
          LINES.forEach(function (l) {
            var el = document.createElement("div");
            el.className = "subtitle";
            el.textContent = l[2];
            subLayer.appendChild(el);
            tl.set(el, { opacity: 1 }, l[0]);
            tl.set(el, { opacity: 0 }, l[1] - 0.05);
          });

          window.__timelines["03-note"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
