<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 04 — Les trous</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root {
          position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
          background: #05070c; font-family: "Inter", sans-serif; color: #f7f9fc;
        }
        .cam { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
        .felt { position: absolute; inset: 0;
          background:
            radial-gradient(ellipse 900px 620px at 50% 46%, rgba(30, 155, 240, 0.14), transparent 62%),
            radial-gradient(ellipse 1400px 1000px at 50% 50%, #14395f 0%, #0e2a4d 45%, #081826 78%, #05070c 100%);
        }
        .felt::after { content: ""; position: absolute; inset: 0;
          background: radial-gradient(ellipse 1100px 780px at 50% 48%, transparent 60%, rgba(0, 0, 0, 0.55) 100%);
        }
        .rail { position: absolute; left: 120px; top: 90px; right: 120px; bottom: 90px; border-radius: 28px;
          border: 14px solid #1a2436; box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
        }
        .pocket { position: absolute; width: 46px; height: 46px; margin-left: -23px; margin-top: -23px;
          border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2a2f3a, #05070a 70%);
          box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
        }

        .ball { position: absolute; width: 88px; height: 88px; margin-left: -44px; margin-top: -44px; border-radius: 50%;
          box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
        }
        .ball .disc { position: absolute; inset: 0; border-radius: 50%; background: var(--bc); }
        .ball .shine { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.85), transparent 46%); }
        .ball .numWrap { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin-left: -22px; margin-top: -22px; border-radius: 50%; background: #f4f2ea; display: flex; align-items: center; justify-content: center; }
        .ball .num { font-family: "Poppins", sans-serif; font-weight: 700; font-size: 24px; color: #191b1f; }

        .ghost { position: absolute; width: 88px; height: 88px; margin-left: -44px; margin-top: -44px; }
        .ghost .outline { position: absolute; inset: 0; border-radius: 50%; border: 3px dashed rgba(247, 249, 252, 0.6);
          background: rgba(247, 249, 252, 0.04);
        }
        .ghostLabel { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); white-space: nowrap;
          display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: rgba(5,7,12,0.85);
          border: 1.5px solid rgba(247,249,252,0.3); border-radius: 100px; font-size: 19px; font-weight: 500;
          color: rgba(247,249,252,0.85); opacity: 0;
        }
        .ghostLabel .q { color: rgba(247,249,252,0.4); font-weight: 700; }

        .caption { position: absolute; left: 0; right: 0; top: 90px; text-align: center; font-family: "Poppins", sans-serif;
          font-weight: 600; font-size: 40px; color: #f7f9fc; opacity: 0;
        }
        .subtitle { position: absolute; left: 0; right: 0; bottom: 76px; text-align: center; font-family: "Poppins", sans-serif;
          font-weight: 700; font-size: 38px; color: #ffffff; -webkit-text-stroke: 5px #000000; paint-order: stroke fill; opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="04-trous" data-width="1920" data-height="1080" data-duration="7">
        <div class="clip camWrap" data-start="0" data-duration="7" data-track-index="0">
          <div class="cam">
            <div class="felt"></div>
            <div class="rail">
              <div class="pocket" style="left: 40px; top: 44px"></div>
              <div class="pocket" style="left: 800px; top: 8px"></div>
              <div class="pocket" style="left: 1560px; top: 44px"></div>
              <div class="pocket" style="left: 40px; top: 846px"></div>
              <div class="pocket" style="left: 800px; top: 882px"></div>
              <div class="pocket" style="left: 1560px; top: 846px"></div>
            </div>
            <div class="ballLayer"></div>
          </div>
        </div>

        <div class="clip caption" data-start="0" data-duration="7" data-track-index="1">Et puis il y a celles-là.</div>
        <div class="clip subLayer" data-start="0" data-duration="7" data-track-index="2"></div>

        <audio id="voice04" src="assets/voice/04.mp3" data-start="0.5" data-duration="4.911" data-track-index="10" data-volume="1"></audio>
        <audio id="sfx04a" src="assets/sfx/click-soft.mp3" data-start="3.4" data-duration="0.264" data-track-index="20" data-volume="0.4"></audio>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var root = document.querySelector('[data-composition-id="04-trous"][id="root"]');
          if (!root) root = document.querySelector('[data-composition-id="04-trous"]');

          var ballLayer = root.querySelector(".ballLayer");

          // the 8, still centered, still there
          var eight = document.createElement("div");
          eight.className = "ball";
          eight.style.left = "960px";
          eight.style.top = "480px";
          eight.style.setProperty("--bc", "#15181d");
          eight.innerHTML = '<div class="disc"></div><div class="shine"></div><div class="numWrap"><span class="num">8</span></div>';
          ballLayer.appendChild(eight);

          var GHOSTS = [
            { x: 960, y: 612, cat: "OCR factures" },
            { x: 1048, y: 612, cat: "Prédiction IA stock & ventes" },
            { x: 1136, y: 612, cat: "Agents IA internes" },
          ];
          GHOSTS.forEach(function (g) {
            var el = document.createElement("div");
            el.className = "ghost";
            el.style.left = g.x + "px";
            el.style.top = g.y + "px";
            el.innerHTML = '<div class="outline"></div>';
            ballLayer.appendChild(el);
            g._el = el;

            var label = document.createElement("div");
            label.className = "ghostLabel";
            label.innerHTML = '<span class="q">?</span>' + g.cat;
            el.appendChild(label);
            g._label = label;
          });

          var tl = gsap.timeline({ paused: true });
          var cam = root.querySelector(".cam");
          var caption = root.querySelector(".caption");

          tl.fromTo(caption, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.5);
          tl.to(caption, { opacity: 0, duration: 0.4 }, 3.0);

          // Travelling: slow zoom/pan onto the 3 chalk outlines
          tl.to(
            cam,
            { x: -132, y: -108, scale: 1.55, duration: 2.0, ease: "power2.inOut" },
            3.5
          );

          GHOSTS.forEach(function (g, i) {
            tl.fromTo(
              g._label,
              { opacity: 0, y: 8 },
              { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
              5.3 + i * 0.25
            );
          });

          var subLayer = root.querySelector(".subLayer");
          var LINES = [
            [0.5, 1.95, "Et puis il y a celles-là"],
            [1.95, 3.62, "Celles que vous ne payez pas…"],
            [3.62, 5.41, "parce que vous ne les avez pas"],
          ];
          LINES.forEach(function (l) {
            var el = document.createElement("div");
            el.className = "subtitle";
            el.textContent = l[2];
            subLayer.appendChild(el);
            tl.set(el, { opacity: 1 }, l[0]);
            tl.set(el, { opacity: 0 }, l[1] - 0.05);
          });

          window.__timelines["04-trous"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
