<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Plats Villa Beach · habillage</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#st{position:absolute;inset:0;overflow:hidden}
#grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,4,.5) 0%,rgba(10,7,4,0) 20%,rgba(10,7,4,0) 52%,rgba(10,7,4,.8) 100%)}
#dip{position:absolute;inset:0;background:#0d0a07;opacity:0}
.t{position:absolute;left:70px;right:70px;text-align:center;color:#f6efe2;opacity:0;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.l{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:98px;line-height:1.05}
.l em,.gold{color:#d9b46a}
.serif{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1}
.it{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500}
.caps{font-family:Inter;font-weight:700;letter-spacing:12px;text-transform:uppercase}
.rule{display:block;width:120px;height:2px;background:#d9b46a;margin:0 auto}
#top{position:absolute;top:110px;left:0;right:0;text-align:center;font-family:Inter;font-weight:700;font-size:26px;letter-spacing:14px;color:rgba(246,239,226,.9);opacity:0}
#fin{position:absolute;inset:0;opacity:0}
#fin .bg{position:absolute;inset:-40px;background-position:center;background-size:cover;filter:blur(26px) brightness(.3) saturate(1.2)}
#fin .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,rgba(217,180,106,.22),rgba(0,0,0,0) 55%)}
#logo{position:absolute;left:50%;top:400px;width:400px;margin-left:-200px;opacity:0}
</style></head><body><div id="st">
<div id="grad"></div><div id="top">VILLA BEACH</div>
<div id="fin"><div class="bg" id="bg"></div><div class="glow"></div><img id="logo" src="logo-villa-beach.png"></div>
<div id="txt"></div><div id="dip"></div></div>
<script>
// la vidéo à habiller est désignée par ?s=<slug> ; seul un nom simple est accepté, puis cfg/<slug>.js est chargé
const slug=new URLSearchParams(location.search).get('s')||'';
if(!/^[a-z0-9-]{1,60}$/.test(slug))throw new Error('nom de vidéo invalide');
const sc=document.createElement('script');sc.src='cfg/'+encodeURIComponent(slug)+'.js';sc.onload=init;document.head.appendChild(sc);
function init(){
const C=window.CFG;document.getElementById('bg').style.backgroundImage=`url(${C.fond})`;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), eo=x=>1-Math.pow(1-cl(x),3);
const T=C.lignes.map(l=>[l[0],l[1],`<div class="l">${l[2]}</div>`,1400]);
T.push([C.titre[0],C.titre[1]-0.1,`<div><span class="rule"></span><div class="serif" style="font-size:${C.nom.length>34?90:108}px;margin-top:36px">${C.nom}</div><div class="it gold" style="font-size:66px;margin-top:20px">à la Villa Beach</div></div>`,1270]);
T.push([C.carte+0.6,C.dur,`<div><div class="serif" style="font-size:${C.nom.length>34?74:88}px">${C.nom}</div></div>`,960]);
T.push([C.carte+1.3,C.dur,`<div><span class="rule"></span><div class="caps" style="font-size:30px;margin-top:40px">Réservez votre table</div><div style="font-family:Inter;font-weight:500;font-size:40px;margin-top:22px;color:#d9b46a">villabeach.foodeatup.fr</div></div>`,1300]);
const box=document.getElementById('txt');
const EL=T.map(t=>{const d=document.createElement('div');d.className='t';d.innerHTML=t[2];d.style.top=t[3]+'px';box.appendChild(d);return d;});
function render(t){
 T.forEach((x,i)=>{const e=EL[i];if(t<x[0]||t>=x[1]){e.style.opacity=0;return;}
  const u=t-x[0],p=eo(u/0.8),out=cl((x[1]-t)/0.3);
  e.style.opacity=Math.min(cl(u/0.6),out);e.style.transform=`translateY(${(1-p)*40}px)`;e.style.filter=`blur(${(1-cl(u/0.45))*8}px)`;});
 let d=t<0.5?1-t/0.5:0;const u=Math.abs(t-C.carte);if(u<0.25)d=Math.max(d,0.8*(1-u/0.25));
 if(t>C.dur-0.6)d=Math.max(d,(t-(C.dur-0.6))/0.6);document.getElementById('dip').style.opacity=d;
 const tp=document.getElementById('top');tp.style.opacity=t<C.titre[0]?0.9*cl((t-0.3)/0.7)*cl((C.titre[0]-t)/0.4):0;
 document.getElementById('fin').style.opacity=t>=C.carte?cl((t-C.carte)/0.4):0;
 const lg=document.getElementById('logo'),lu=t-C.carte-0.1;lg.style.opacity=lu>0?cl(lu/0.7):0;lg.style.transform=`scale(${1.08-0.08*eo(lu/1.5)})`;
 document.getElementById('grad').style.opacity=t<C.carte?1:0;
}
window.render=render;window.thumb=()=>render((C.titre[0]+C.titre[1])/2);
}
</script></body></html>
