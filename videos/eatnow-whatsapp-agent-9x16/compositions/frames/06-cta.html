          font-family: "Geist";
          font-weight: 400;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Geist-Regular-400.ttf") format("truetype");
        }
        @font-face {
          font-family: "Geist";
          font-weight: 500;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Geist-Medium-500.ttf") format("truetype");
        }
        @font-face {
          font-family: "Geist";
          font-weight: 700;
          font-style: normal;
          font-display: block;
          src: url("assets/fonts/Geist-Bold-700.ttf") format("truetype");
        }

        #root {
          position: absolute;
          inset: 0;
          background: #141210;
          overflow: hidden;
          font-family: "Geist", sans-serif;
        }

        .dot-field {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(
            circle,
            rgba(250, 248, 242, 0.14) 4px,
            transparent 4px
          );
          background-size: 36px 36px;
          background-position: 18px 18px;
        }

        .stack {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 30px;
        }

        .mark {
          width: 184px;
          height: 184px;
          color: #faf8f2;
        }

        .mark rect {
          fill: currentColor;
          opacity: 0;
          transform-box: fill-box;
          transform-origin: 50% 50%;
        }

        .wordmark {
          width: 320px;
          height: auto;
          color: #faf8f2;
          opacity: 0;
          transform: translateY(14px);
        }

        .wordmark path {
          fill: currentColor;
        }

        .tagline {
          font-weight: 400;
          font-size: 30px;
          color: #ddd6c6;
          opacity: 0;
          transform: translateY(10px);
        }

        .cta-row {
          margin-top: 14px;
          display: flex;
          align-items: center;
          gap: 26px;
          opacity: 0;
          transform: scale(0.94);
        }

        .cta-pill {
          background: #10386b;
          color: #faf8f2;
          font-weight: 500;
          font-size: 26px;
          padding: 18px 34px;
          border-radius: 999px;
        }

        .proof {
          display: flex;
          gap: 22px;
          font-weight: 500;
          font-size: 22px;
          color: #ddd6c6;
        }
      </style>

      <div

        data-width="1080"

      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-0.8s): the dot field returns — visual bookend with Frame 1.
        tl.fromTo("#dots", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);

        // Scene 2 (0.8-2.0s): the mark draws itself case by case — deterministic,
        // index-derived stagger (a spring-pop per square, never simultaneous).
        const squares = gsap.utils.toArray("#mark rect");
        squares.forEach((el, i) => {
          tl.fromTo(
            el,
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
            0.85 + i * 0.045,
          );
        });

        // Scene 3 (2.0-2.8s): the wordmark locks under the mark, tagline follows.
        tl.to("#wordmark", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.05);
        tl.to("#tagline", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.3);

        // Scene 4 (2.8-4.0s): the CTA + proof points spring-pop, final hold.
        tl.fromTo(
          "#cta-row",
          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          2.85,
        );

        window.__timelines["06-cta"] = tl;
      </script>
