<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 3 — La chaîne complète</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", "Inter", sans-serif; isolation: isolate; }
        .bg { position: absolute; inset: 0; background: #f7f9fc; }
        .panel { position: absolute; left: 0; right: 0; top: 320px; height: 320px; background: rgba(30, 155, 240, 0.04); opacity: 0; will-change: opacity; }

        .eyebrow-wrap { position: absolute; left: 0; right: 0; top: 168px; text-align: center; z-index: 3; }
        .eyebrow { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 32px; letter-spacing: 0.08em; text-transform: uppercase; color: #1e9bf0; opacity: 0; will-change: transform, opacity; margin: 0; }
        .eyebrow-line { width: 64px; height: 4px; border-radius: 2px; background: #1e9bf0; margin: 0 auto 18px; transform-origin: center; opacity: 0; will-change: transform, opacity; }

        /* chain node cards */
        .node { position: absolute; top: 360px; width: 250px; height: 250px; box-sizing: border-box; background: #ffffff; border: 1.5px solid rgba(30, 155, 240, 0.2); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; z-index: 2; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
        .node .ic { width: 76px; height: 76px; border-radius: 50%; background: rgba(30, 155, 240, 0.08); display: grid; place-items: center; }
        .node .ic svg { width: 40px; height: 40px; fill: none; stroke: #1e9bf0; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .node .label { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 25px; line-height: 1.15; letter-spacing: -0.01em; color: #1b2a41; text-align: center; }
        .node.ai { border-color: rgba(30, 155, 240, 0.45); }
        .node.ai .ic { background: rgba(30, 155, 240, 0.14); }
        .node .step { position: absolute; top: 14px; left: 18px; font-family: "Poppins", sans-serif; font-weight: 700; font-size: 16px; color: #566472; }

        /* connecting arrows in the gaps */
        .arrow { position: absolute; top: 462px; width: 60px; height: 46px; z-index: 2; }
        .arrow svg { width: 60px; height: 46px; }
        .arrow path { fill: none; stroke: #1e9bf0; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 70; stroke-dashoffset: 70; }
      </style>

      <div id="root" data-composition-id="03-chaine" data-width="1920" data-height="1080" data-duration="12.569">
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="12.069" data-track-index="0">
          <div class="panel" id="panel"></div>
        </div>

        <div id="content" class="clip" data-start="0" data-duration="12.069" data-track-index="1" style="position:absolute; inset:0;">
          <div class="eyebrow-wrap">
            <div class="eyebrow-line" id="eyebrow-line"></div>
            <p class="eyebrow" id="eyebrow">Toute votre chaîne, connectée</p>
          </div>

          <!-- 6 nodes -->
          <div class="node" id="n1" style="left: 60px;"><span class="step">01</span><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2z" /><path d="M12 6.5v13" /></svg></span><span class="label">Recette</span></div>
          <div class="node" id="n2" style="left: 370px;"><span class="step">02</span><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" /><path d="M8 8h8M8 12h8M8 16h5" /></svg></span><span class="label">Carte</span></div>
          <div class="node" id="n3" style="left: 680px;"><span class="step">03</span><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5" /><circle cx="18" cy="20" r="1.5" /><path d="M2 3h3l2.4 12.5h11L21 7H6.2" /></svg></span><span class="label">Liste de<br />courses</span></div>
          <div class="node" id="n4" style="left: 990px;"><span class="step">04</span><span class="ic"><svg viewBox="0 0 24 24"><rect x="1" y="6" width="13" height="11" rx="1.5" /><path d="M14 9h4l3 3v5h-7z" /><circle cx="6" cy="19" r="1.8" /><circle cx="17" cy="19" r="1.8" /></svg></span><span class="label">Livraison</span></div>
          <div class="node" id="n5" style="left: 1300px;"><span class="step">05</span><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 9h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" /><path d="M8 9V6M16 9V6M2 9h20" /></svg></span><span class="label">Production</span></div>
          <div class="node ai" id="n6" style="left: 1610px;"><span class="step">06</span><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 7-7" /><path d="M17 8h4v4" /></svg></span><span class="label">Prédiction<br />des ventes</span></div>

          <!-- 5 arrows -->
          <div class="arrow" id="a1" style="left: 310px;"><svg viewBox="0 0 60 46"><path d="M6 23 H46 M39 15 L50 23 L39 31" /></svg></div>
          <div class="arrow" id="a2" style="left: 620px;"><svg viewBox="0 0 60 46"><path d="M6 23 H46 M39 15 L50 23 L39 31" /></svg></div>
          <div class="arrow" id="a3" style="left: 930px;"><svg viewBox="0 0 60 46"><path d="M6 23 H46 M39 15 L50 23 L39 31" /></svg></div>
          <div class="arrow" id="a4" style="left: 1240px;"><svg viewBox="0 0 60 46"><path d="M6 23 H46 M39 15 L50 23 L39 31" /></svg></div>
          <div class="arrow" id="a5" style="left: 1550px;"><svg viewBox="0 0 60 46"><path d="M6 23 H46 M39 15 L50 23 L39 31" /></svg></div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#panel", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.0);
        tl.fromTo("#eyebrow-line", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.0);
        tl.fromTo("#eyebrow", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);

        // nodes pop on VO cues; arrow before each subsequent node draws just ahead of it
        const nodeCues = [0.5, 1.0, 1.6, 3.5, 5.5, 8.7];
        const arrowIds = ["#a1", "#a2", "#a3", "#a4", "#a5"];
        for (let i = 0; i < 6; i++) {
          tl.fromTo("#n" + (i + 1), { scale: 0, opacity: 0, y: 18 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, nodeCues[i]);
          if (i > 0) {
            tl.to(arrowIds[i - 1] + " path", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, nodeCues[i] - 0.35);
          }
        }

        // Scene 3 — flow pulse on « connectée »: arrows flash + nodes pulse once
        tl.fromTo(".arrow path", { stroke: "#1e9bf0" }, { stroke: "#1476c8", duration: 0.24, ease: "power2.out" }, 11.0);
        tl.fromTo(".arrow path", { stroke: "#1476c8" }, { stroke: "#1e9bf0", duration: 0.5, ease: "power2.inOut" }, 11.3);
        tl.fromTo(".node", { scale: 1 }, { scale: 1.03, duration: 0.2, ease: "power2.out" }, 11.0);
        tl.fromTo(".node", { scale: 1.03 }, { scale: 1, duration: 0.5, ease: "power2.inOut" }, 11.3);
        // hold to 12.069

        window.__timelines["03-chaine"] = tl;
      </script>
    </template>
  </body>
</html>
