<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 5 — Le bénéfice + CTA</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", "Inter", sans-serif; }
        .bg { position: absolute; inset: 0; background: #f7f9fc; }
        .ring { position: absolute; border-radius: 50%; opacity: 0; pointer-events: none; will-change: transform, opacity; }
        #ring-1 { left: 1010px; top: 210px; width: 460px; height: 460px; border: 2px solid rgba(30,155,240,0.14); }
        #ring-2 { left: 910px; top: 110px; width: 660px; height: 660px; border: 2px solid rgba(30,155,240,0.1); }
        #ring-3 { left: 810px; top: 10px; width: 860px; height: 860px; border: 2px solid rgba(30,155,240,0.07); }
        .bloom { position: absolute; left: 700px; top: 90px; width: 1080px; height: 700px; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(30,155,240,0.22) 0%, rgba(30,155,240,0.08) 48%, rgba(30,155,240,0) 74%); opacity: 0; pointer-events: none; will-change: transform, opacity; }

        /* chef + réserve (fond intégré) — bloc arrondi, côté gauche */
        .photo { position: absolute; z-index: 2; left: 110px; top: 150px; width: 520px; height: 748px; border-radius: 28px; overflow: hidden; border: 1.5px solid rgba(27, 42, 65, 0.08); opacity: 0; will-change: transform, opacity; }
        .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; display: block; }

        .benefits { position: absolute; left: 700px; top: 0; width: 1120px; height: 900px; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; will-change: opacity; }
        .benefit { display: flex; align-items: center; gap: 20px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 48px; letter-spacing: -0.01em; color: #1b2a41; opacity: 0; will-change: transform, opacity; }
        .benefit .dot { width: 16px; height: 16px; border-radius: 50%; background: #1e9bf0; flex: none; }

        .lockup { position: absolute; left: 700px; top: 0; width: 1120px; height: 900px; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo { width: 470px; height: auto; object-fit: contain; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
        .tagline { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tag-line { display: flex; gap: 16px; white-space: nowrap; }
        .word { display: inline-block; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 52px; line-height: 1.22; letter-spacing: -0.02em; color: #1b2a41; opacity: 0; will-change: transform, opacity; }
        .word.accent { color: #1e9bf0; }
        .cta-button { margin-top: 40px; padding: 22px 56px; background: #1e9bf0; color: #f7f9fc; border-radius: 100px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 32px; letter-spacing: 0.01em; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
      </style>

      <div id="root" data-composition-id="05-cta" data-width="1920" data-height="1080" data-duration="7.84">
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="7.34" data-track-index="0">
          <div class="ring" id="ring-1"></div>
          <div class="ring" id="ring-2"></div>
          <div class="ring" id="ring-3"></div>
          <div class="bloom" id="bloom"></div>
        </div>

        <div id="photo-clip" class="clip photo" data-start="0" data-duration="7.34" data-track-index="1">
          <img src="public/chef-storeroom.png" alt="Chef serein devant une réserve bien rangée" />
        </div>

        <div class="clip benefits" id="benefits" data-start="0" data-duration="7.34" data-track-index="2" data-layout-allow-overlap>
          <div class="benefit" id="ben-1"><span class="dot"></span>Moins de gaspillage</div>
          <div class="benefit" id="ben-2"><span class="dot"></span>Plus de rupture</div>
          <div class="benefit" id="ben-3"><span class="dot"></span>Marges maîtrisées</div>
        </div>

        <div class="clip lockup" id="lockup" data-start="0" data-duration="7.34" data-track-index="3">
          <img id="logo" class="logo" src="public/foodeatup-logo-mascot.png" alt="FoodEatUp" />
          <div class="tagline">
            <div class="tag-line">
              <span class="word">Votre</span>
              <span class="word">stock,</span>
            </div>
            <div class="tag-line">
              <span class="word">enfin</span>
              <span class="word accent">piloté</span>
              <span class="word accent">par</span>
              <span class="word accent">l'IA.</span>
            </div>
          </div>
          <div class="cta-button" id="cta">Découvrir StockVisionAI</div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(".photo", { x: -220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.85, ease: "power3.out" }, 0.0);
        gsap.utils.toArray(".ring").forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0.2 + i * 0.12);
        });

        tl.fromTo("#ben-1", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.fromTo("#ben-2", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.0);
        tl.fromTo("#ben-3", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.1);

        tl.to("#benefits", { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.5);
        tl.fromTo("#logo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 4.0);
        gsap.utils.toArray(".word").forEach(function (el, i) {
          tl.fromTo(el, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.7 + i * 0.085);
        });
        tl.fromTo("#cta", { scale: 0, opacity: 0, y: 18 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 6.0);
        tl.fromTo("#bloom", { opacity: 0, scale: 0.92 }, { opacity: 0.26, scale: 1, duration: 0.7, ease: "power2.out" }, 6.5);

        window.__timelines["05-cta"] = tl;
      </script>
    </template>
  </body>
</html>
