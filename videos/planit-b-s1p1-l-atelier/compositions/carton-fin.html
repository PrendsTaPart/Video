<template id="carton-fin-template" data-composition-id="carton-fin" data-width="720" data-height="1280">
<script src="assets/vendor/gsap.min.js"></script>

<style data-brand-tokens>
  :root {
    --ink-deep: #1F0D3E;        /* encre, charte officielle (obtenir_charte) */
    --planit-violet: #4F2DF9;   /* primaire, charte officielle */
    --planit-rose: #FE64D5;     /* rose, charte officielle */
  }
  /* Alte Haas Grotesk indisponible (voir sous-titres.html) — repli
     officiel : Sora pour le lock-up (titres), Inter pour la signature
     (texte). Remplacer dès que la vraie police est fournie. */
  @font-face { font-family: "PlanitTitle"; src: url("assets/fonts/Sora-800.woff2") format("woff2"); font-weight: 800; }
  @font-face { font-family: "PlanitText"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; }
</style>

<style>
  #carton-fin-root { position: absolute; inset: 0; overflow: hidden; }

  /* fond encre plein cadre, PAS le dégradé de marque : le carton de fin
     du Quai est sobre, le dégradé reste réservé à la série A */
  #carton-fin-bg {
    position: absolute;
    inset: 0;
    background: var(--ink-deep);
    opacity: 0;
  }

  /* lock-up Plani't complet, largeur ~200px, centré, haut du logo à y=560 */
  #carton-fin-lockup {
    position: absolute;
    left: 50%;
    top: 560px;
    width: 200px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    opacity: 0;
  }
  #carton-fin-mark { height: 48px; width: auto; display: block; }
  #carton-fin-word {
    font-family: "PlanitTitle", system-ui, sans-serif;
    font-weight: 800;
    font-size: 30px;
    color: #FFFFFF;
    white-space: nowrap;
  }

  /* signature, base à y=700 */
  #carton-fin-signature {
    position: absolute;
    left: 0;
    right: 0;
    top: 700px;
    transform: translateY(-100%); /* ancre la BASE du texte à y=700 */
    text-align: center;
    font-family: "PlanitText", system-ui, sans-serif;
    font-weight: 400;
    font-size: 22px;
    color: var(--planit-rose);
    opacity: 0;
  }

  /* liseré du dégradé de marque, pleine largeur, 3px, à y=1040 —
     statique, apparaît avec le fond */
  #carton-fin-liseret {
    position: absolute;
    top: 1040px;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(135deg, var(--planit-violet) 0%, var(--planit-rose) 100%);
    opacity: 0;
  }
</style>

<div
  id="carton-fin-root"
  data-composition-id="carton-fin"
  data-start="0"
  data-duration="2"
  data-width="720"
  data-height="1280"
>
  <div id="carton-fin-bg" class="clip" data-start="0" data-duration="2" data-track-index="0"></div>
  <div id="carton-fin-liseret" class="clip" data-start="0" data-duration="2" data-track-index="1"></div>

  <div id="carton-fin-lockup" class="clip" data-start="0" data-duration="2" data-track-index="2">
    <img id="carton-fin-mark" src="assets/brand/planit-mark-white.png" alt="" />
    <div id="carton-fin-word">Plani&rsquo;t</div>
  </div>

  <div id="carton-fin-signature" class="clip" data-start="0" data-duration="2" data-track-index="3">
    Ce n&rsquo;est pas demain. C&rsquo;est aujourd&rsquo;hui.
  </div>
</div>

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    gsap.set("#carton-fin-bg", { opacity: 0 });
    gsap.set("#carton-fin-liseret", { opacity: 0 });
    gsap.set("#carton-fin-lockup", { opacity: 0 });
    gsap.set("#carton-fin-signature", { opacity: 0 });

    // fond encre + liseré : fondu simple sur 0.3s, par-dessus la dernière
    // image du plan
    tl.to("#carton-fin-bg", { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
    tl.to("#carton-fin-liseret", { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);

    // logo : fondu simple sur 0.35s, sans rebond, sans mouvement
    tl.to("#carton-fin-lockup", { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);

    // signature : fondu simple sur 0.25s, démarre 0.25s après le logo
    tl.to("#carton-fin-signature", { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.25);

    // 0.5s -> 2.0s : tout est immobile

    window.__timelines["carton-fin"] = tl;
  })();
</script>
</template>
