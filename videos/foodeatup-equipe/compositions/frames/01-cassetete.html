<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 1 — Le casse-tête du planning</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root {
          position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden;
          font-family: "Inter", sans-serif; color: #1b2a41; isolation: isolate;
        }
        .bg {
          position: absolute; inset: 0; background-color: #f7f9fc;
          background-image:
            radial-gradient(circle at 46% 44%, rgba(30, 155, 240, 0.05), transparent 55%),
            radial-gradient(circle, rgba(27, 42, 65, 0.09) 1.6px, transparent 1.6px);
          background-size: 100% 100%, 46px 46px;
        }
        .scene { position: absolute; inset: 0; }
        .shake { position: absolute; inset: 0; }

        .figure {
          position: absolute; z-index: 2; top: 96px; left: 1216px; width: 560px; height: 800px;
          mix-blend-mode: multiply; opacity: 0; will-change: transform, opacity;
        }
        .figure img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .fiche {
          position: absolute; z-index: 3; width: 360px; box-sizing: border-box;
          background: #ffffff; border: 1.5px solid rgba(27, 42, 65, 0.1); border-radius: 10px;
          padding: 22px 26px; display: flex; align-items: center; gap: 18px;
          transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity;
        }
        .fiche::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 6px; border-radius: 3px; background: #1e9bf0; }
        .fiche.back { z-index: 1; filter: blur(2.5px); }
        .fiche-ic { flex: 0 0 46px; width: 46px; height: 46px; display: grid; place-items: center; background: rgba(30, 155, 240, 0.08); border-radius: 50%; }
        .fiche-ic svg { width: 26px; height: 26px; fill: none; stroke: #1e9bf0; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .fiche-label { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 28px; letter-spacing: -0.01em; color: #1b2a41; line-height: 1.15; }
        .fiche-sub { display: block; font-family: "Inter", sans-serif; font-weight: 500; font-size: 18px; color: #566472; margin-top: 2px; }

        .stamp {
          position: absolute; z-index: 5; left: 250px; top: 470px; padding: 14px 34px;
          border: 4px solid #1b2a41; border-radius: 12px; font-family: "Poppins", sans-serif;
          font-weight: 800; font-size: 40px; letter-spacing: 0.06em; color: #1b2a41;
          transform: rotate(-8deg); transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity;
        }
      </style>

      <div id="root" data-composition-id="01-cassetete" data-width="1920" data-height="1080" data-duration="10.897">
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="10.397" data-track-index="0"></div>

        <div id="scene" class="clip scene" data-start="0" data-duration="10.397" data-track-index="1">
          <div class="shake">
            <div class="figure" id="figure">
              <img src="public/planning-chaos.png" alt="Chef débordé par le planning" />
            </div>

            <div class="fiche" id="f1" data-cx="330" data-cy="230" style="left: 160px; top: 168px; transform: rotate(-3deg)">
              <span class="fiche-ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg></span>
              <span class="fiche-label">Plannings<span class="fiche-sub">de la semaine</span></span>
            </div>

            <div class="fiche back" id="f2" data-cx="250" data-cy="470" style="left: 92px; top: 408px; transform: rotate(4deg)">
              <span class="fiche-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg></span>
              <span class="fiche-label">Pointages<span class="fiche-sub">entrées &amp; sorties</span></span>
            </div>

            <div class="fiche" id="f3" data-cx="470" data-cy="640" style="left: 300px; top: 578px; transform: rotate(-2deg)">
              <span class="fiche-ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" /><path d="M3 20c0-3.3 2.7-6 6-6c1.2 0 2.3.3 3.3.9" /><path d="M16 15h6" /></svg></span>
              <span class="fiche-label">Absences<span class="fiche-sub">à couvrir</span></span>
            </div>

            <div class="fiche back" id="f4" data-cx="720" data-cy="250" style="left: 560px; top: 196px; transform: rotate(5deg)">
              <span class="fiche-ic"><svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4" /><path d="M3 8h12a4 4 0 0 1 4 4" /><path d="M17 20l4-4-4-4" /><path d="M21 16H9a4 4 0 0 1-4-4" /></svg></span>
              <span class="fiche-label">Remplacements<span class="fiche-sub">dernière minute</span></span>
            </div>

            <div class="fiche" id="f5" data-cx="560" data-cy="820" style="left: 388px; top: 760px; transform: rotate(3deg)">
              <span class="fiche-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19" /></svg></span>
              <span class="fiche-label">Congés<span class="fiche-sub">à valider</span></span>
            </div>

            <div class="stamp" id="stamp">À GÉRER</div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var root = document.querySelector('[data-composition-id="01-cassetete"][id="root"]') || document.querySelector('[data-composition-id="01-cassetete"]');
          var tl = gsap.timeline({ paused: true });
          var shakeEl = root.querySelector(".shake");
          var fiches = Array.prototype.slice.call(root.querySelectorAll(".fiche"));

          tl.fromTo(root.querySelector("#figure"), { x: 200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.0);

          var cues = [0.6, 1.5, 2.6, 3.7, 5.5];
          fiches.forEach(function (el, i) {
            var back = el.classList.contains("back");
            var rot = parseFloat((el.style.transform.match(/rotate\(([-0-9.]+)deg\)/) || [0, 0])[1]) || 0;
            tl.fromTo(el, { scale: 0, opacity: 0, y: 24, rotation: rot }, { scale: 1, opacity: back ? 0.28 : 1, y: 0, rotation: rot, duration: 0.5, ease: "power3.out" }, cues[i]);
          });

          tl.fromTo(root.querySelector("#stamp"), { scale: 1.6, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -8, duration: 0.4, ease: "power4.out" }, 6.7);

          var CX = 1180, CY = 520;
          fiches.forEach(function (el, i) {
            var cx = parseFloat(el.getAttribute("data-cx")), cy = parseFloat(el.getAttribute("data-cy"));
            var back = el.classList.contains("back"); var pull = back ? 0.26 : 0.36;
            tl.to(el, { x: (CX - cx) * pull, y: (CY - cy) * pull, scale: back ? 1 : 1.04, duration: 1.4, ease: "power2.inOut" }, 8.7 + i * 0.06);
          });

          var shk = { t: 0 };
          tl.to(shk, { t: 1, duration: 1.6, ease: "none", onUpdate: function () {
            var tt = shk.t; var env = Math.max(0, Math.min(1, tt / 0.18, (1 - tt) / 0.14));
            var ph = tt * 1.6 * Math.PI * 2;
            shakeEl.style.transform = "translate(" + (Math.sin(ph * 3.5) * 2.4 * env) + "px," + (Math.sin(ph * 2.7 + 1.1) * 1.8 * env) + "px)";
          } }, 8.7);

          window.__timelines["01-cassetete"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
