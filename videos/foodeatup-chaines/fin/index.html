      :root {
        --creme: #FCF9E6;
        --marine: #0F1A23;
        --accent: #007BFF;
        --bleu-sys: #147AFF;
        --orange: #FFA500;
        --muted: rgba(15, 26, 35, 0.34);
        --hair: rgba(15, 26, 35, 0.12);
        --font-display: "Fredoka", sans-serif;
        --font-body: "Baloo 2", sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--creme); color: var(--marine);
      }

      .scene {
        position: absolute; top: 0; left: 0;
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--creme);
      }
      /* Empilement explicite. SANS ça, la scène sortante reste visible SOUS la
         suivante : GSAP promeut les éléments animés en calques de composition,
         et un calque promu se rasterise au-dessus du fond d'une scène frère
         postérieure — alors même que l'ordre DOM, les styles calculés et
         elementFromPoint disent tous l'inverse. Défaut constaté au contrôle
         visuel sur la variante boulangerie, puis corrigé ici pour les deux. */
      #s1 { z-index: 1; }
      #s2 { z-index: 2; }
      #s3 { z-index: 3; }
      #s4 { z-index: 4; }
      #s5 { z-index: 5; }

      .scene-content {
        width: 100%; height: 100%; position: relative; z-index: 1;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
      }

      .kicker {
        font-family: var(--font-body); font-weight: 600; font-size: 26px;
        letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
      }
      .display { font-family: var(--font-display); font-weight: 600; line-height: 1.04; }
      .body { font-family: var(--font-body); font-weight: 400; }

      /* ---------------- séquence 1 : tableau de bord siège ---------------- */
      .board {
        width: 1180px; background: #fff; border-radius: 22px;
        border: 1px solid var(--hair);
        box-shadow: 0 30px 70px rgba(15, 26, 35, 0.09);
        padding: 46px 54px 52px;
      }
      .board-head {
        display: flex; align-items: baseline; gap: 18px;
        padding-bottom: 26px; border-bottom: 1px solid var(--hair); margin-bottom: 12px;
      }
      .board-title { font-family: var(--font-display); font-weight: 600; font-size: 40px; }
      .board-scope {
        font-family: var(--font-body); font-weight: 600; font-size: 22px;
        color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
      }
      .row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 25px 4px; border-bottom: 1px solid var(--hair);
      }
      .row:last-child { border-bottom: none; }
      .row-label { font-family: var(--font-body); font-weight: 600; font-size: 31px; }
      .row-empty .row-label { color: var(--muted); font-weight: 400; }
      .row-dash { font-family: var(--font-body); font-size: 34px; color: var(--muted); }
      /* Valeur volontairement non chiffrée : aucun chiffre n'est [SOURCÉ]. */
      .row-value {
        display: block; width: 210px; height: 34px; border-radius: 8px;
        background: var(--marine); transform-origin: right center;
      }
      .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; }

      /* ---------------- séquence 2 : les douze barres ---------------- */
      .bars { width: 1200px; display: flex; flex-direction: column; gap: 15px; }
      .bar-row { display: flex; align-items: center; gap: 26px; }
      .bar-label {
        width: 210px; flex: none; text-align: right;
        font-family: var(--font-body); font-weight: 600; font-size: 25px; color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .bar-track {
        flex: 1; height: 30px; background: rgba(15, 26, 35, 0.07);
        border-radius: 15px; overflow: hidden; display: block;
      }
      .bar-fill { display: block; height: 100%; background: var(--bleu-sys); border-radius: 15px; }

      /* ---------------- séquence 4 : la frise du délai ---------------- */
      .frise { width: 1380px; position: relative; height: 4px; background: var(--hair); }
      .frise-prog {
        position: absolute; left: 0; top: 0; height: 4px; width: 0;
        background: var(--marine); transform-origin: left center;
      }
      .frise-cap { position: absolute; top: -13px; width: 4px; height: 30px; background: var(--marine); }
      .frise-label {
        position: absolute; top: 30px;
        font-family: var(--font-body); font-weight: 600; font-size: 25px; color: var(--muted);
      }

      .logo {

    <div id="main" data-composition-id="main"
         data-width="1920" data-height="1080"

      <div class="scene clip" id="s1" data-start="0.0" data-duration="12.0" data-track-index="0">

            Le contr&ocirc;le porte sur un site.<br />
            <span style="font-weight:600;">La r&eacute;putation porte sur la marque.</span>
          </div>
        </div>
      </div>

      <!-- ============ SÉQUENCE 9 — l'offre ============ -->
      <div class="scene clip" id="s2" data-start="12.0" data-duration="10.0" data-track-index="0"
           style="visibility:hidden;">
        <div class="scene-content">
          <div class="offre" id="offre">
            Trois sites. Soixante jours.<br /><span id="offre-2">Vos chiffres.</span>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* --- visibilité : deux scènes non-ancres, coupes franches --- */
      tl.set("#s1", { autoAlpha: 0 }, 12.0);
      tl.set("#s2", { autoAlpha: 1 }, 12.0);

      /* ================= SÉQUENCE 7 — le risque d'enseigne ================= */
      /* Registre sobre : la carte ne bouge pas, seuls les points apparaissent. */
      tl.from("#carte-wrap", { autoAlpha: 0, duration: 1.0, ease: "power2.out" }, 0.2);
      tl.from("#enseigne", { autoAlpha: 0, y: -16, duration: 0.7, ease: "power2.out" }, 0.4);
      tl.from("#pt-0", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.00);
      tl.from("#pt-1", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.09);
      tl.from("#pt-2", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.18);
      tl.from("#pt-3", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.27);
      tl.from("#pt-4", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.36);
      tl.from("#pt-5", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.45);
      tl.from("#pt-6", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.54);
      tl.from("#pt-7", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.63);
      tl.from("#pt-8", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.72);
      tl.from("#pt-9", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.81);
      tl.from("#pt-10", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.90);
      tl.from("#pt-11", { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)" }, 1.99);
      /* un seul point bascule — l'orange est réservé aux alertes */
      tl.to("#pt-7", { backgroundColor: "#FFA500", scale: 1.35,
        duration: 0.5, ease: "power2.out" }, 4.2);
      tl.fromTo("#halo", { scale: 1, opacity: 0.9 },
        { scale: 3.4, opacity: 0, duration: 1.8, ease: "power2.out" }, 4.3);
      tl.fromTo("#halo", { scale: 1, opacity: 0.7 },
        { scale: 3.4, opacity: 0, duration: 1.8, ease: "power2.out" }, 6.1);
      tl.to("#enseigne", { color: "#FFA500", duration: 0.6, ease: "power2.out" }, 4.6);
      tl.from("#s1-line", { autoAlpha: 0, y: 22, duration: 0.7, ease: "power3.out" }, 6.6);
      tl.to("#s1-line", { y: -4, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 8.0);

      /* ================= SÉQUENCE 9 — l'offre ================= */
      /* Entrée calée sur le DÉBUT EXACT de la scène, sans les 0,2 s d'usage :
         tous les éléments de ce plan sont animés en `tl.from()`, et GSAP applique
         leur état de départ dès la construction (immediateRender). Avec un retard,
         la scène était visible mais tout son contenu encore invisible — une image
         entièrement vide à la coupe, mesurée sur le MP4. */
      tl.from("#offre", { autoAlpha: 0, y: 30, duration: 0.8, ease: "power3.out" }, 12.0);
      tl.from("#offre-2", { autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 12.9);
      tl.from("#cta", { autoAlpha: 0, scale: 0.86, duration: 0.6, ease: "back.out(1.6)" }, 13.6);
      tl.from("#cta-url", { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 14.2);
      tl.from("#logo", { autoAlpha: 0, duration: 0.6, ease: "sine.out" }, 14.6);
      /* respiration du bouton : un seul point de sortie, on le tient à l'écran */
      tl.to("#cta", { scale: 1.035, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 15.2);
      tl.to("#offre", { y: -5, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 15.4);

      /* cale la durée de la timeline sur data-duration */
      tl.set("#main", {}, 22.0);

      window.__timelines["main"] = tl;
    </script>
