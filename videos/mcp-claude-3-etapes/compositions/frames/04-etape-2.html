      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* ============================================================
           Global coordinates (canvas space, 1920x1080). Window is a
           1400x760 card centered horizontally, top at 140 — identical
           geometry to 03-etape-1.html / 05-etape-3.html for stage
           continuity across the three "Étape" frames.
           ============================================================ */
        const WIN_LEFT = 260;
        const WIN_TOP = 140;

        // Field / control centers, computed from the authored CSS rhythm
        // (see stylesheet comments: eyebrow 34 + title 72 + label 28 stack).
        const URL_FIELD_X = WIN_LEFT + 64 + 380; // content-left(324) + field half-width(380)
        const URL_FIELD_Y = WIN_TOP + 88 + 222 + 32; // window-body(88) + stack-offset(222) + half-height(32)

        const AUTH_SEL_X = WIN_LEFT + 64 + 230;
        const AUTH_SEL_Y = WIN_TOP + 88 + 338 + 32;

        const LOCK_X = WIN_LEFT + 64 + 460 + 20 + 32;
        const LOCK_Y = AUTH_SEL_Y;

        const VALIDATE_X = WIN_LEFT + 64 + 160;
        const VALIDATE_Y = WIN_TOP + 88 + 442 + 32;

        const CURSOR_START_X = 1520;
        const CURSOR_START_Y = 820;

        /* ============================================================
           Scene 1 (0.0-1.8s) — continuity stage (window/badge/titlebar
           already present, static, no re-entrance). Panel heading + the
           empty URL field reveal quickly so the hero form is visible by
           t<=0.5s. Cursor arrives and clicks into the field.
           ============================================================ */
        tl.fromTo("#f4-eyebrow", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0.0);
        tl.fromTo("#f4-title", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.05);
        tl.fromTo("#f4-url-label", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0.15);
        tl.fromTo(
          "#f4-url-wrap",
          { scale: 0.94, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
          0.2
        );

        tl.fromTo(
          "#f4-cursor",
          { x: CURSOR_START_X, y: CURSOR_START_Y },
          { x: URL_FIELD_X, y: URL_FIELD_Y, duration: 0.6, ease: "power2.inOut" },
          0.6
        );

        const CLICK1_AT = 1.3;
        tl.to("#f4-cursor", { scale: 0.85, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1 }, CLICK1_AT);
        tl.set("#f4-ripple-1", { x: URL_FIELD_X, y: URL_FIELD_Y, opacity: 1 }, CLICK1_AT);
        tl.fromTo(
          "#f4-ripple-1",
          { scale: 0, opacity: 1 },
          { scale: 3.2, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false },
          CLICK1_AT
        );
        tl.to(
          ".url-field",
          { borderColor: "#60a5fa", duration: 0.3, ease: "power2.out" },
          CLICK1_AT
        );

        // Caret blinks once the field is focused. Finite yoyo, computed span.
        const CARET_BLINK_START = 1.3;
        const CARET_BLINK_END = 4.2;
        const BLINK_HALF_PERIOD = 0.3;
        const blinkRepeats = Math.max(
          0,
          Math.ceil((CARET_BLINK_END - CARET_BLINK_START) / BLINK_HALF_PERIOD) - 1
        );
        tl.to(
          "#f4-caret",
          { opacity: 0, duration: BLINK_HALF_PERIOD, ease: "steps(1)", yoyo: true, repeat: blinkRepeats },
          CARET_BLINK_START
        );

        /* ============================================================
           Scene 2 (1.8-4.1s) — type-on reveal of the stylised MCP
           address, paced to "renseignez l'adresse de votre serveur MCP".
           ============================================================ */
        const urlTextEl = document.getElementById("f4-url-text");
        const fullUrlWidth = urlTextEl.scrollWidth;
        tl.fromTo(
          "#f4-url-text",
          { maxWidth: 0 },
          { maxWidth: fullUrlWidth, duration: 2.0, ease: "none" },
          1.85
        );
        tl.to("#f4-caret", { opacity: 0, duration: 0.2, ease: "power1.out" }, 4.2);

        /* ============================================================
           Scene 3 (4.1-6.5s) — auth-mode selector reveals per-word,
           cursor clicks it, a neutral (unlocked) padlock spring-pops in
           beside it, then the cursor travels toward "Valider".
           ============================================================ */
        tl.fromTo(
          "#f4-auth-word-1",
          { y: 8, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" },
          4.1
        );
        tl.fromTo(
          "#f4-auth-word-2",
          { y: 8, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
          4.22
        );
        tl.fromTo(
          "#f4-auth-selector",
          { scale: 0.92, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
          4.4
        );

        tl.fromTo(
          "#f4-cursor",
          { x: URL_FIELD_X, y: URL_FIELD_Y },
          { x: AUTH_SEL_X, y: AUTH_SEL_Y, duration: 0.55, ease: "power2.inOut" },
          4.1
        );

        const CLICK2_AT = 4.85;
        tl.to("#f4-cursor", { scale: 0.85, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1 }, CLICK2_AT);
        tl.to(
          "#f4-auth-selector",
          { scale: 0.97, duration: 0.09, ease: "power2.in", yoyo: true, repeat: 1 },
          CLICK2_AT
        );
        tl.set("#f4-ripple-2", { x: AUTH_SEL_X, y: AUTH_SEL_Y, opacity: 1 }, CLICK2_AT);
        tl.fromTo(
          "#f4-ripple-2",
          { scale: 0, opacity: 1 },
          { scale: 3.2, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false },
          CLICK2_AT
        );
        tl.to("#f4-auth-selector", { borderColor: "#60a5fa", duration: 0.3, ease: "power2.out" }, CLICK2_AT);
        tl.to("#f4-auth-chevron", { rotation: 180, duration: 0.3, ease: "power2.out" }, CLICK2_AT);

        // Neutral (open/unlocked) padlock spring-pops in beside the selector.
        tl.set("#f4-lock-shackle", { rotation: -22, transformOrigin: "16px 20px" }, 5.15);
        tl.fromTo(
          "#f4-lock-badge",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
          5.15
        );

        tl.fromTo(
          "#f4-cursor",
          { x: AUTH_SEL_X, y: AUTH_SEL_Y },
          { x: VALIDATE_X, y: VALIDATE_Y, duration: 0.55, ease: "power2.inOut" },
          5.8
        );

        /* ============================================================
           Scene 4 (6.5-8.856s) — "Valider la connexion" press-release,
           padlock closes (rotation + svg-path-draw snap), a pulsed
           connection line draws from the lock to the Claude mark, green
           success glow, final hold.
           ============================================================ */
        const PRESS_START = 6.5;
        const PRESS_DUR = 0.14;
        const RELEASE_START = PRESS_START + PRESS_DUR;
        const RELEASE_DUR = 0.6;

        tl.to("#f4-cursor", { scale: 0.85, duration: 0.09, ease: "power2.in" }, PRESS_START);
        tl.to("#f4-validate-btn", { scale: 0.94, duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
        tl.to("#f4-cursor", { scale: 1, duration: 0.2, ease: "power2.out" }, RELEASE_START);
        tl.to("#f4-validate-btn", { scale: 1, duration: RELEASE_DUR, ease: "back.out(1.7)" }, RELEASE_START);

        tl.set("#f4-ripple-3", { x: VALIDATE_X, y: VALIDATE_Y, opacity: 1 }, PRESS_START);
        tl.fromTo(
          "#f4-ripple-3",
          { scale: 0, opacity: 1 },
          { scale: 3.5, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false },
          PRESS_START
        );

        // Button confirms: background -> success green, checkmark pops.
        tl.to(".validate-btn", { backgroundColor: "#34d399", duration: 0.4, ease: "power2.out" }, RELEASE_START);
        tl.fromTo(
          "#f4-validate-check",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" },
          RELEASE_START
        );
        tl.fromTo(
          "#f4-btn-glow",
          { scale: 1, opacity: 0 },
          { scale: 1.6, opacity: 0.7, duration: 0.4, ease: "power2.out" },
          RELEASE_START
        );
        tl.to("#f4-btn-glow", { opacity: 0, duration: 0.4, ease: "power2.in" }, RELEASE_START + 0.4);

        // Padlock closes: shackle rotates shut + a quick svg-path-draw snap,
        // body/stroke shift from neutral to success green.
        const LOCK_CLOSE_AT = RELEASE_START + 0.06;
        const shacklePath = document.getElementById("f4-lock-shackle");
        const shackleLen = shacklePath.getTotalLength();
        shacklePath.style.strokeDasharray = `${shackleLen}`;
        shacklePath.style.strokeDashoffset = `${shackleLen * 0.22}`;

        tl.to(
          "#f4-lock-shackle",
          { rotation: 0, duration: 0.5, ease: "back.out(1.3)" },
          LOCK_CLOSE_AT
        );
        tl.to(
          "#f4-lock-shackle",
          { strokeDashoffset: 0, stroke: "#34d399", duration: 0.35, ease: "power2.out" },
          LOCK_CLOSE_AT
        );
        tl.to("#f4-lock-body", { fill: "rgba(52,211,153,0.28)", duration: 0.35, ease: "power2.out" }, LOCK_CLOSE_AT + 0.05);
        tl.to("#f4-lock-badge", { borderColor: "#34d399", duration: 0.35, ease: "power2.out" }, LOCK_CLOSE_AT + 0.05);
        tl.fromTo(
          "#f4-lock-glow",
          { scale: 1, opacity: 0 },
          { scale: 1.5, opacity: 0.7, duration: 0.35, ease: "power2.out" },
          LOCK_CLOSE_AT + 0.1
        );
        tl.to("#f4-lock-glow", { opacity: 0, duration: 0.4, ease: "power2.in" }, LOCK_CLOSE_AT + 0.5);

        tl.to("#f4-status-pending", { opacity: 0, duration: 0.3, ease: "power2.out" }, 7.0);
        tl.to("#f4-status-connected", { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.0);

        // Pulsed connection line: draw once, then two flowing pulses.
        const connectPath = document.getElementById("f4-connect-path");
        const connectLen = connectPath.getTotalLength();
        connectPath.style.strokeDasharray = `${connectLen}`;
        connectPath.style.strokeDashoffset = `${connectLen}`;

        const LINE_DRAW_AT = 7.3;
        tl.to(
          "#f4-connect-path",
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          LINE_DRAW_AT
        );
        tl.set("#f4-connect-path", { strokeDasharray: "14 10" }, LINE_DRAW_AT + 0.5);
        tl.to(
          "#f4-connect-path",
          { strokeDashoffset: -48, duration: 0.5, ease: "none", repeat: 1 },
          LINE_DRAW_AT + 0.5
        );

        // Success glow blooms behind the Claude mark and settles into a
        // single quiet breath for the final hold.
        const GLOW_AT = LINE_DRAW_AT + 0.5;
        tl.fromTo(
          "#f4-mark-glow",
          { scale: 1, opacity: 0 },
          { scale: 1.7, opacity: 0.85, duration: 0.4, ease: "power2.out" },
          GLOW_AT
        );
        tl.to(
          "#f4-mark-glow",
          { scale: 1.5, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 },
          GLOW_AT + 0.4
        );

        // Subtle final jitter to keep the hold from reading dead.
        tl.to(
          "#f4-validate-btn",
          { y: -2, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 },
          8.3
        );

        window.__timelines["04-etape-2"] = tl;
      </script>
    </template>
  </body>
</html>
