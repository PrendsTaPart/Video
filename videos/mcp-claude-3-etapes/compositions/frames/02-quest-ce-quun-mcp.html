        #sat-1 {
          left: 654px;
          top: 250px;
          width: 140px;
          height: 140px;
        }
        #sat-1 .sat-icon {
          width: 46px;
          height: 46px;
        }
        #sat-2 {
          left: 1172px;
          top: 243px;
          width: 120px;
          height: 120px;
        }
        #sat-2 .sat-icon {
          width: 38px;
          height: 38px;
        }
        #sat-3 {
          left: 873px;
          top: 614px;
          width: 130px;
          height: 130px;
        }
        #sat-3 .sat-icon {
          width: 42px;
          height: 42px;
        }

        .text-block {
          position: absolute;
          left: 50%;
          top: 726px;
          transform: translateX(-50%);
          width: 1500px;
          text-align: center;
          z-index: 6;
        }
        .line1-wrap {
          position: relative;
          display: inline-block;
        }
        .line1 {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 500;
          font-size: 46px;
          letter-spacing: -0.01em;
          color: #a8b7c8;
          white-space: nowrap;
        }
        .word {
          display: inline-block;
          opacity: 0;
          will-change: transform, opacity;
        }
        .word + .word {
          margin-left: 0.28em;
        }
        .strike-svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
        }
        .line2 {
          margin-top: 34px;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 74px;
          letter-spacing: -0.02em;
          color: #ffffff;
          opacity: 0;
          will-change: transform, opacity;
        }
        .line2 .accent {
          color: #3b82f6;
        }
      </style>

      <div id="root" data-composition-id="02-quest-ce-quun-mcp" data-width="1920" data-height="1080" data-duration="15.229">
        <div class="bg-layer clip" data-start="0" data-duration="15.229" data-track-index="1"></div>

        <div class="scene clip" data-start="0" data-duration="15.229" data-track-index="2">
          <div class="camera" id="camera">
            <svg class="lines" viewBox="0 0 1920 1080">
              <line id="line-1" x1="960" y1="430" x2="724" y2="320" stroke="rgba(59,130,246,0.55)" stroke-width="2.5" stroke-linecap="round" />
              <line id="line-2" x1="960" y1="430" x2="1232" y2="303" stroke="rgba(59,130,246,0.55)" stroke-width="2.5" stroke-linecap="round" />
              <line id="line-3" x1="960" y1="430" x2="938" y2="679" stroke="rgba(59,130,246,0.55)" stroke-width="2.5" stroke-linecap="round" />
            </svg>

            <div class="mcp-pill" id="mcp-pill">
              <img src="../../assets/logos/mcp-white.svg" alt="MCP" />
              <span>MCP</span>
            </div>

            <div class="hub" id="hub">
              <img src="../../assets/logos/claude-default.svg" alt="Claude" />
            </div>

            <div class="satellite" id="sat-1">
              <svg class="sat-icon" viewBox="0 0 24 24" fill="none">
                <rect x="5" y="4" width="14" height="17" rx="1" stroke="currentColor" stroke-width="1.5" />
                <rect x="7.8" y="7" width="2.4" height="2.4" fill="currentColor" />
                <rect x="13.8" y="7" width="2.4" height="2.4" fill="currentColor" />
                <rect x="7.8" y="11.6" width="2.4" height="2.4" fill="currentColor" />
                <rect x="13.8" y="11.6" width="2.4" height="2.4" fill="currentColor" />
                <rect x="10" y="16.2" width="4" height="4.8" fill="currentColor" />
              </svg>
              <div class="sat-label">CRM</div>
            </div>

            <div class="satellite" id="sat-2">
              <svg class="sat-icon" viewBox="0 0 24 24" fill="none">
                <polygon points="12,3 21,7.5 21,16.5 12,21 3,16.5 3,7.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                <polyline points="3,7.5 12,12 21,7.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                <line x1="12" y1="12" x2="12" y2="21" stroke="currentColor" stroke-width="1.5" />
              </svg>
              <div class="sat-label">Stock</div>
            </div>

            <div class="satellite" id="sat-3">
              <svg class="sat-icon" viewBox="0 0 24 24" fill="none">
                <path
                  d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <div class="sat-label">Outils</div>
            </div>

            <div class="text-block">
              <div class="line1-wrap">
                <div class="line1" id="line1">
                  <span class="word">Claude</span>
                  <span class="word">ne</span>
                  <span class="word">se</span>
                  <span class="word">contente</span>
                  <span class="word">plus</span>
                  <span class="word">de</span>
                  <span class="word">répondre</span>
                </div>
                <svg class="strike-svg" viewBox="0 0 100 10" preserveAspectRatio="none">
                  <path id="strike-path" d="M2,5 L98,5" stroke="#A8B7C8" stroke-width="1" fill="none" vector-effect="non-scaling-stroke" />
                </svg>
              </div>
              <div class="line2" id="line2">il agit dans vos <span class="accent">applications</span></div>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const camera = document.getElementById("camera");

        // ---- Scene 1 (0.0-3.0s): hub lands, then the "MCP" pill spring-pops above it ----
        tl.fromTo(
          "#hub",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.0,
        );
        tl.fromTo(
          "#mcp-pill",
          { scale: 0, opacity: 0, y: 16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          0.55,
        );

        // ---- Scene 2 (3.0-7.6s): satellites spring-pop in one by one on the VO cue,
        // each followed by an svg-path-draw connector line from the hub ----
        const satellites = [
          { sel: "#sat-1", line: "#line-1", popAt: 3.0, lineAt: 3.35 },
          { sel: "#sat-2", line: "#line-2", popAt: 4.6, lineAt: 4.95, finalOpacity: 0.92 },
          { sel: "#sat-3", line: "#line-3", popAt: 6.2, lineAt: 6.55 },
        ];

        satellites.forEach((s) => {
          tl.fromTo(
            s.sel,
            { scale: 0, opacity: 0, y: 20 },
            {
              scale: 1,
              opacity: s.finalOpacity !== undefined ? s.finalOpacity : 1,
              y: 0,
              duration: 0.5,
              ease: "power3.out",
            },
            s.popAt,
          );
        });

        // Measure + prime the connector lines for stroke-draw.
        const connectorLines = document.querySelectorAll(".lines line");
        connectorLines.forEach((line) => {
          const x1 = parseFloat(line.getAttribute("x1"));
          const y1 = parseFloat(line.getAttribute("y1"));
          const x2 = parseFloat(line.getAttribute("x2"));
          const y2 = parseFloat(line.getAttribute("y2"));
          const len = Math.hypot(x2 - x1, y2 - y1);
          line.style.strokeDasharray = `${len}`;
          line.style.strokeDashoffset = `${len}`;
          line.dataset.length = String(len);
        });

        satellites.forEach((s) => {
          tl.to(
            s.line,
            { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
            s.lineAt,
          );
        });

        // ---- Scene 3 (7.6-11.4s): light camera push-in toward the hub; the first
        // kinetic-type line reveals word by word, then a light strike-through draws
        // across it at the end of the phrase ----
        const phase = { scale: 1.0 };
        tl.to(phase, { scale: 1.055, duration: 2.8, ease: "power2.out" }, 7.6);

        const drift = { p: 0 };
        tl.to(
          drift,
          {
            p: Math.PI * 2 * 2,
            duration: 15.229,
            ease: "none",
            onUpdate: () => {
              const dx = Math.sin(drift.p) * 4;
              const dy = Math.sin(drift.p * 1.3) * 2;
              camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
            },
          },
          0,
        );

        const words = document.querySelectorAll("#line1 .word");
        words.forEach((w, i) => {
          tl.fromTo(
            w,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            7.8 + i * 0.32,
          );
        });

        const strikePath = document.getElementById("strike-path");
        const strikeLen = strikePath.getTotalLength();
        strikePath.style.strokeDasharray = `${strikeLen}`;
        strikePath.style.strokeDashoffset = `${strikeLen}`;
        tl.to(strikePath, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 10.6);

        // ---- Scene 4 (11.4-15.229s): "il agit dans vos applications" lands bold
        // beneath the hub; connector lines pulse (dash-flow) to read as an active
        // flow; a subtle jitter holds the hub for the final beat ----
        tl.fromTo(
          "#line2",
          { opacity: 0, y: 20, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
          11.5,
        );

        tl.set(connectorLines, { attr: { "stroke-dasharray": "18 12" } }, 12.0);
        connectorLines.forEach((line) => {
          tl.to(
            line,
            { strokeDashoffset: -240, duration: 3.0, ease: "none" },
            12.2,
          );
        });

        const hub = document.getElementById("hub");
        const jitter = { p: 0 };
        tl.to(
          jitter,
          {
            p: Math.PI * 2,
            duration: 1.629,
            ease: "none",
            onUpdate: () => {
              const s = 1 + Math.sin(jitter.p) * 0.012;
              const y = Math.sin(jitter.p) * 2;
              hub.style.transform = `translateY(${y}px) scale(${s})`;
            },
          },
          13.6,
        );

        window.__timelines["02-quest-ce-quun-mcp"] = tl;
      </script>
    </template>
  </body>
