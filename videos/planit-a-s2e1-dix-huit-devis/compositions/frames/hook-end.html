<template id="hook-end-template" data-composition-id="hook-end" data-width="720" data-height="1280">
<script src="assets/vendor/gsap.min.js"></script>

<style data-brand-tokens>
  :root {
    --ink-deep: #1F0D3E;        /* encre, charte officielle (obtenir_charte) */
    --planit-violet: #4F2DF9;   /* primaire, charte officielle */
    --planit-rose: #FE64D5;     /* rose, charte officielle */
  }
  @font-face { font-family: "PlanitTitle"; src: url("assets/fonts/Sora-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "PlanitTitle"; src: url("assets/fonts/Sora-800.woff2") format("woff2"); font-weight: 800; }
  @font-face { font-family: "PlanitText"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; }
</style>

<style>
  #hook-end-root {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  /* carte de marque plein cadre : dégradé de marque (charte, réservé aux
     hooks) — remplace le fond encre uni, inspiré du carton de fin d'une
     vidéo de référence (carte plein cadre, mark seul + message court, un
     seul élément à la fois) sans en reprendre le contenu ni les graphismes */
  #hook-end-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--planit-violet) 0%, var(--planit-rose) 100%);
    opacity: 0;
  }
  #hook-end-scrim {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 720px;
    height: 860px;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, color-mix(in srgb, var(--ink-deep) 40%, transparent) 0%, transparent 68%);
    pointer-events: none;
  }

  #hook-end-mark {
    position: absolute;
    left: 50%;
    top: 479px;
    height: 104px;
    width: auto;
    display: block;
    opacity: 0;
  }

  /* punchline, deux lignes, centrée */
  #hook-end-punch {
    position: absolute;
    left: 64px;
    right: 64px;
    top: 611px;
    text-align: center;
    font-family: "PlanitTitle", system-ui, sans-serif;
    font-weight: 800;
    font-size: 48px;
    line-height: 1.15;
    color: #FFFFFF;
  }
  #hook-end-punch .line {
    display: block;
    opacity: 0;
  }

  /* liseré blanc uni, simple mise à l'échelle (pas de wipe) */
  #hook-end-rule {
    position: absolute;
    left: calc(50% - 32px);
    top: 749px;
    width: 64px;
    height: 3px;
    background: #FFFFFF;
    opacity: 0.85;
    transform-origin: center center;
  }

  /* signature, sous le liseré */
  #hook-end-signature {
    position: absolute;
    left: 0;
    right: 0;
    top: 778px;
    text-align: center;
    font-family: "PlanitText", system-ui, sans-serif;
    font-weight: 400;
    font-size: 22px;
    color: #FFFFFF;
    opacity: 0;
  }
</style>

<div
  id="hook-end-root"
  data-composition-id="hook-end"
  data-start="0"
  data-duration="4.55"
  data-width="720"
  data-height="1280"
>
  <div id="hook-end-bg" class="clip" data-start="0" data-duration="4.55" data-track-index="0"></div>
  <div id="hook-end-scrim" class="clip" data-start="0" data-duration="4.55" data-track-index="1"></div>

  <img id="hook-end-mark" class="clip" src="assets/brand/planit-mark-white.png" alt="" data-start="0" data-duration="4.55" data-track-index="2" />

  <div id="hook-end-punch" class="clip" data-start="0" data-duration="4.55" data-track-index="3">
    <span class="line">Vos devis ne</span>
    <span class="line">dorment plus.</span>
  </div>

  <div id="hook-end-rule" class="clip" data-start="0" data-duration="4.55" data-track-index="4"></div>

  <div id="hook-end-signature" class="clip" data-start="0" data-duration="4.55" data-track-index="5">
    Ce n&rsquo;est pas demain. C&rsquo;est aujourd&rsquo;hui.
  </div>
</div>

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var lines = document.querySelectorAll("#hook-end-punch .line");

    // état initial masqué, hors timeline
    gsap.set("#hook-end-mark", { xPercent: -50, scale: 0.85, opacity: 0 });
    gsap.set(lines, { y: 14, opacity: 0 });
    gsap.set("#hook-end-rule", { scaleX: 0 });
    gsap.set("#hook-end-signature", { y: 8, opacity: 0 });

    // la carte de marque arrive par-dessus la fin du plan 5
    tl.to("#hook-end-bg", { opacity: 1, duration: 0.45, ease: "power1.out" }, 0);

    // mark : premier élément, fondu + léger scale-in, sans rebond
    tl.fromTo("#hook-end-mark", { xPercent: -50, scale: 0.85, opacity: 0 }, { xPercent: -50, scale: 1, opacity: 1, duration: 0.33, ease: "power2.out" }, 0.35);

    // punchline : un bloc entier à la fois, léger décalage entre les deux lignes
    tl.fromTo(lines[0], { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out", overwrite: "auto" }, 0.60);
    tl.fromTo(lines[1], { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out", overwrite: "auto" }, 0.74);

    // liseré, simple mise à l'échelle
    tl.fromTo("#hook-end-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 1.20);

    // signature, dernier élément
    tl.fromTo("#hook-end-signature", { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power1.out" }, 1.55);

    // 1.80 → 4.55 : tenue, rien n'anime — la carte finit sur une image stable

    window.__timelines["hook-end"] = tl;
  })();
</script>
</template>
