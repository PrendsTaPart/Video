<template id="plan3-screen-conversation-template" data-composition-id="plan3-screen-conversation" data-width="720" data-height="1280">
<script src="assets/vendor/gsap.min.js"></script>

<style data-brand-tokens>
  :root {
    --ink-deep: #1F0D3E;      /* encre, charte officielle (obtenir_charte) */
    --planit-bouton: #8236F8; /* bouton, charte officielle — liseré du cadre */
    --planit-primaire: #4F2DF9; /* primaire, charte officielle — fond de la bulle utilisateur d'origine (prélevé au pixel) */
  }
  @font-face { font-family: "PlanitText"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; }
</style>

<style>
  /* Carte téléphone : hauteur 62% du cadre (1280*0.62=793.6px), centrée
     horizontalement, base à y=1000px -> top=206.4px, left=(720-366.71)/2 */
  #p3sc-outer {
    position: absolute;
    left: 176.64px;
    top: 206.4px;
    width: 366.71px;
    height: 793.6px;
    border-radius: 24px;
    border: 2px solid var(--planit-bouton);
    box-shadow: 0px 12px 32px color-mix(in srgb, var(--ink-deep) 50%, transparent);
    overflow: hidden;
  }
  /* contenu à l'échelle native de la capture (390x844), mis à l'échelle
     d'affichage par un scale fixe non animé (793.6/844) — séparé du
     conteneur d'entrée pour ne jamais mélanger un transform GSAP et un
     transform statique sur le même élément */
  #p3sc-inner {
    position: absolute;
    left: 0;
    top: 0;
    width: 390px;
    height: 844px;
    transform-origin: top left;
    transform: scale(0.940284);
  }
  #p3sc-inner img {
    position: absolute;
    inset: 0;
    width: 390px;
    height: 844px;
    display: block;
  }

  /* rectangles de masquage : couleur exacte prélevée au pixel dans l'image
     d'origine, mêmes coordonnées et même rayon de coin que les bulles */
  .p3sc-patch {
    position: absolute;
    border-radius: 10px;
    display: flex;
    align-items: center;
  }
  #p3sc-bubble-agent {
    left: 74px;
    top: 294px;
    width: 221px;
    height: 56px;
    background: #FFFFFF;
  }
  #p3sc-bubble-user {
    left: 94px;
    top: 376px;
    width: 221px;
    height: 56px;
    background: var(--planit-primaire);
  }
  .p3sc-text {
    font-family: "PlanitText", system-ui, sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 20px;
    padding: 0 14px;
    width: 100%;
  }
  /* le texte de remplacement de la bulle agent est plus long que l'original
     et passe sur 3 lignes : légère réduction de taille pour rester
     strictement dans les mêmes 56px de hauteur que la bulle d'origine */
  #p3sc-bubble-agent .p3sc-text { color: #202020; font-size: 14px; line-height: 18px; }
  #p3sc-bubble-user .p3sc-text { color: #FFFFFF; }
</style>

<div
  id="p3sc-outer"
  class="clip"
  data-composition-id="plan3-screen-conversation"
  data-start="0"
  data-duration="3.0"
  data-track-index="0"
  data-width="720"
  data-height="1280"
>
  <div id="p3sc-inner">
    <img src="assets/img/ecran-conversation.png" alt="" />
    <!-- bulle agent : texte d'origine masqué et remplacé, superposition -->
    <div id="p3sc-bubble-agent" class="p3sc-patch">
      <div class="p3sc-text">Je m&rsquo;en occupe. Nina reprend les devis sans r&eacute;ponse.</div>
    </div>
    <!-- bulle utilisateur : texte d'origine masqué et remplacé, superposition -->
    <div id="p3sc-bubble-user" class="p3sc-patch">
      <div class="p3sc-text">Relance les devis de la semaine derni&egrave;re.</div>
    </div>
  </div>
</div>

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var outer = document.getElementById("p3sc-outer");

    // entrée : translation Y 26px + scale 0,96->1, 0.3s, power3.out —
    // appliquée au conteneur EXTÉRIEUR uniquement (le scale d'échelle
    // native->affichage reste sur #p3sc-inner, jamais les deux sur le
    // même élément)
    gsap.set(outer, { y: 26, scale: 0.96 });
    tl.fromTo(outer, { y: 26, scale: 0.96 }, { y: 0, scale: 1, duration: 0.3, ease: "power3.out" }, 0);

    tl.to({}, { duration: 3.0 }, 0); // full-span anchor
    window.__timelines["plan3-screen-conversation"] = tl;
  })();
</script>
</template>
