<template id="agent-nina-template" data-composition-id="agent-nina" data-width="720" data-height="1280">
<script src="assets/vendor/gsap.min.js"></script>

<style data-brand-tokens>
  :root {
    --planit-violet: #4F2DF9;
    --planit-rose: #FE64D5;
    --ink-deep: #1F0D3E;
  }
  @font-face { font-family: "PlanitTitle"; src: url("assets/fonts/Sora-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "PlanitText"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; }
</style>

<style>
  /* carte-agent, ancrée bas gauche : x=40px, base (bord bas) à y=1090px —
     au-dessus des sous-titres (bandeau de sous-titres ancré à y=1013,
     texte s'étend vers le haut depuis cette base, jamais jusqu'à 1090) */
  #agent-card {
    position: absolute;
    left: 40px;
    top: 1030px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: color-mix(in srgb, var(--ink-deep) 88%, transparent);
    border: 1px solid color-mix(in srgb, var(--planit-rose) 30%, transparent);
    border-radius: 12px;
    opacity: 0;
  }
  /* portrait de Nina, cercle 40px de diamètre */
  #agent-avatar {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
  }
  #agent-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #agent-meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  #agent-name {
    font-family: "PlanitTitle", system-ui, sans-serif;
    font-weight: 700;
    font-size: 19px;
    color: #FFFFFF;
  }
  #agent-role {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "PlanitText", system-ui, sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: color-mix(in srgb, #FFFFFF 80%, transparent);
  }
  #agent-role .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--planit-rose);
  }
</style>

<div
  id="agent-nina-root"
  data-composition-id="agent-nina"
  data-start="0"
  data-duration="6.0"
  data-width="720"
  data-height="1280"
>
  <div id="agent-card" class="clip" data-start="0" data-duration="6.0" data-track-index="0">
    <div id="agent-avatar"><img src="assets/img/nina-portrait.png" alt="" /></div>
    <div id="agent-meta">
      <div id="agent-name">Nina</div>
      <div id="agent-role"><span class="dot"></span>RapidoCRM</div>
    </div>
  </div>
</div>

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    tl.fromTo("#agent-card", { x: -21 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0);
    tl.to("#agent-card", { opacity: 0, x: -16, duration: 0.4, ease: "power2.in" }, 5.6);
    tl.to({}, { duration: 6.0 }, 0); // full-span anchor
    window.__timelines["agent-nina"] = tl;
  })();
</script>
</template>
