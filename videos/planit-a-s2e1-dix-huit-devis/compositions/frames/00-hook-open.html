<template id="hook-open-template" data-composition-id="00-hook-open" data-width="1080" data-height="1920">
<script src="assets/vendor/gsap.min.js"></script>

<style data-brand-tokens>
  :root {
    --planit-violet: #4F2DF9;   /* primaire, charte officielle (obtenir_charte) */
    --planit-rose: #FE64D5;     /* rose, charte officielle */
    --wipe-progress: 0;         /* 0 → 1, un seul tween pilote cette variable */
  }

  /* repli officiel de la charte (Alte Haas Grotesk absente) */
  @font-face {
    font-family: "PlanitTitle";
    src: url("assets/fonts/Sora-700.woff2") format("woff2");
    font-weight: 700;
  }
</style>

<style>
  #hook-open-root {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--planit-violet) 0%, var(--planit-rose) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    /* balayage vertical haut → bas : un seul clip-path piloté par --wipe-progress */
    clip-path: inset(calc(var(--wipe-progress) * 100%) 0 0 0);
  }
  .hook-logo {
    position: absolute;
    top: 42%;
    left: 50%;
    width: 46%;
    opacity: 0;
  }
  .hook-logo img {
    display: block;
    width: 100%;
    height: auto;
  }
  .hook-punchline {
    position: absolute;
    top: calc(42% + 130px);
    left: 50%;
    width: 84%;
    opacity: 0;
    text-align: center;
    font-family: "PlanitTitle", system-ui, sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1.15;
    color: #FFFFFF;
    /* deux lignes maximum */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>

<div
  id="hook-open-root"
  data-composition-id="00-hook-open"
  data-start="0"
  data-duration="1.5"
  data-width="1080"
  data-height="1920"
>
  <div id="hook-logo" class="hook-logo clip" data-start="0" data-duration="1.5" data-track-index="0">
    <img src="assets/brand/planit-mark-white.png" alt="" />
  </div>
  <div id="hook-punchline" class="hook-punchline clip" data-start="0" data-duration="1.5" data-track-index="1">
    Vos devis ne dorment plus.
  </div>
</div>

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // centrage constant (GSAP possède tout le transform, aucun conflit avec du CSS)
    tl.set("#hook-logo", { xPercent: -50, yPercent: -50 }, 0);
    tl.set("#hook-punchline", { xPercent: -50 }, 0);

    // logo : scale 0.88 → 1, back.out(1.4), 0.45s à partir de 0
    tl.fromTo("#hook-logo", { scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 0);

    // punchline : monte de 24px en fondu, décalée de 0.2s, 0.35s (se termine à 0.55s)
    tl.fromTo("#hook-punchline", { y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.2);

    // tenue 0.6s (0.55s → 1.15s) : rien n'anime, la carte reste visible

    // balayage vertical haut → bas, 0.35s (1.15s → 1.5s), une seule variable CSS, un seul tween
    tl.to("#hook-open-root", { "--wipe-progress": 1, duration: 0.35, ease: "power2.inOut" }, 1.15);

    window.__timelines["00-hook-open"] = tl;
  })();
</script>
</template>
