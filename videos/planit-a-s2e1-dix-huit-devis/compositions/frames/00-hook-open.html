<template id="hook-open-template" data-composition-id="00-hook-open" data-width="720" data-height="1280">
<script src="assets/vendor/gsap.min.js"></script>

<style data-brand-tokens>
  :root {
    --ink-deep: #1F0D3E;        /* encre, charte officielle (obtenir_charte) */
    --planit-violet: #4F2DF9;   /* primaire, charte officielle */
    --planit-rose: #FE64D5;     /* rose, charte officielle */
  }
  @font-face { font-family: "PlanitTitle"; src: url("assets/fonts/Sora-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "PlanitTitle"; src: url("assets/fonts/Sora-800.woff2") format("woff2"); font-weight: 800; }
</style>

<style>
  #hook-open-root {
    position: absolute;
    inset: 0;
    background: var(--ink-deep); /* fond encre plein cadre, PAS de dégradé plein cadre */
    overflow: hidden;
  }

  /* lueur radiale du dégradé de marque, discrète (25% d'opacité) */
  #hook-open-glow {
    position: absolute;
    left: 50%;
    top: 25%;
    width: 934px;  /* 2 × rayon 467px */
    height: 934px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, var(--planit-violet) 0%, var(--planit-rose) 60%, transparent 100%);
    opacity: 0.25;
  }

  /* liseré horizontal du dégradé de marque */
  #hook-open-rule {
    position: absolute;
    left: 64px;
    top: 560px;
    width: 80px;
    height: 3px;
    background: linear-gradient(135deg, var(--planit-violet) 0%, var(--planit-rose) 100%);
    transform-origin: left center;
  }

  /* punchline, alignée à gauche, deux lignes maximum */
  #hook-open-punch {
    position: absolute;
    left: 64px;
    top: 600px;
    width: 592px; /* 720 - 64 marge gauche - 64 marge droite symétrique */
    font-family: "PlanitTitle", system-ui, sans-serif;
    font-weight: 700;
    font-size: 50px;
    line-height: 1.08;
    color: #FFFFFF;
    text-align: left;
  }
  #hook-open-punch .line {
    display: block;
    opacity: 0;
  }

  /* lock-up Plani't complet, petit, coin bas gauche */
  #hook-open-lockup {
    position: absolute;
    left: 64px;
    top: 933px;
    width: 173px;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
  }
  #hook-open-mark {
    height: 36px;
    width: auto;
    display: block;
  }
  #hook-open-word {
    font-family: "PlanitTitle", system-ui, sans-serif;
    font-weight: 800;
    font-size: 30px;
    color: #FFFFFF;
    white-space: nowrap;
  }

</style>

<div
  id="hook-open-root"
  class="clip"
  data-composition-id="00-hook-open"
  data-start="0"
  data-duration="2.0"
  data-track-index="0"
  data-width="720"
  data-height="1280"
>
  <div id="hook-open-glow"></div>
  <div id="hook-open-rule"></div>
  <div id="hook-open-punch">
    <span class="line">Vos devis ne</span>
    <span class="line">dorment plus.</span>
  </div>
  <div id="hook-open-lockup">
    <img id="hook-open-mark" src="assets/brand/planit-mark-white.png" alt="" />
    <div id="hook-open-word">Plani&rsquo;t</div>
  </div>
</div>

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var lines = document.querySelectorAll("#hook-open-punch .line");

    // liseré : se dessine de gauche à droite, scaleX 0 → 1, sans rebond
    tl.fromTo("#hook-open-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.30, ease: "power2.out" }, 0);

    // punchline : monte de 18px en fondu, ligne par ligne, 0.12s d'écart, sans rebond
    tl.fromTo(lines[0], { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out", overwrite: "auto" }, 0.15);
    tl.fromTo(lines[1], { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out", overwrite: "auto" }, 0.27);

    // lock-up : fondu simple, sans déplacement
    tl.to("#hook-open-lockup", { opacity: 1, duration: 0.25, ease: "power1.inOut" }, 0.60);

    // 0.85 → 1.60 : immobile (rien n'anime)

    // 1.60 → 2.00 : tout — fond encre compris — monte de 40px et disparaît en fondu.
    // Le plan 1 (piste en dessous dans index.html) est déjà visible et joue depuis
    // t=0 : il apparaît "en fondu dessous" simplement parce que ce calque s'efface —
    // aucune référence croisée à une autre composition n'est nécessaire ni possible.
    tl.to("#hook-open-root", { y: -40, opacity: 0, duration: 0.40, ease: "power2.inOut" }, 1.60);

    window.__timelines["00-hook-open"] = tl;
  })();
</script>
</template>
