<template id="captions-template" data-composition-id="captions" data-width="720" data-height="1280">
<script src="assets/vendor/gsap.min.js"></script>

<style data-brand-tokens>
  :root {
    --ink-deep: #1F0D3E;    /* encre, charte officielle (obtenir_charte) */
    --planit-rose: #FE64D5; /* rose, charte officielle — mot actif */
    /* base du texte à y=1013 (charte, format 720x1280) */
    --cap-baseline: 1013px;
  }

  @font-face { font-family: "PlanitTitle"; src: url("assets/fonts/Sora-700.woff2") format("woff2"); font-weight: 700; }
</style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* pas de pastille : le texte flotte directement sur l'image, la lisibilité
     vient du contour + de l'ombre portée, pas d'un fond */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-baseline);
    transform: translateY(-100%); /* ancre la BASE du texte, pas le haut */
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 40px;
  }
  .caption-group {
    /* un seul groupe visible à la fois, contrôlé par opacity — pas d'animation
       d'entrée : le bloc apparaît net (voir script, tl.set uniquement) */
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    opacity: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.12em 0.36em;
    font-family: "PlanitTitle", system-ui, sans-serif; /* repli officiel Sora, voir studio-planit/CLAUDE.md */
    font-weight: 700;
    font-size: 38px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    max-width: 100%;
  }
  .caption-word {
    color: #FFFFFF;
    -webkit-text-stroke: 4px var(--ink-deep);
    paint-order: stroke fill;
    text-shadow: 0 3px 8px color-mix(in srgb, var(--ink-deep) 60%, transparent);
  }
  /* mot actif : rose, sans fond, sans surlignage — juste un changement de couleur */
  .caption-word.is-active {
    color: var(--planit-rose);
    -webkit-text-stroke: 4px var(--ink-deep);
  }
</style>

>

</div>

,{"id":"caption-word-10-2","text":"personne","start":25.777,"end":26.101},{"id":"caption-word-10-3","text":"n'a","start":26.101,"end":26.298},{"id":"caption-word-10-4","text":"répondu","start":26.298,"end":26.591}]},{"id":"caption-group-11","start":33.0,"end":34.464,"text":"Dix-huit devis relancés ce mardi","words":[{"id":"caption-word-11-0","text":"Dix-huit","start":33.0,"end":33.351},{"id":"caption-word-11-1","text":"devis","start":33.351,"end":33.65},{"id":"caption-word-11-2","text":"relancés","start":33.65,"end":34.023},{"id":"caption-word-11-3","text":"ce","start":34.023,"end":34.246},{"id":"caption-word-11-4","text":"mardi","start":34.246,"end":34.464}]},{"id":"caption-group-12","start":34.844,"end":35.972,"text":"Deux réponses avant midi","words":[{"id":"caption-word-12-0","text":"Deux","start":34.844,"end":35.098},{"id":"caption-word-12-1","text":"réponses","start":35.098,"end":35.487},{"id":"caption-word-12-2","text":"avant","start":35.487,"end":35.741},{"id":"caption-word-12-3","text":"midi","start":35.741,"end":35.972}]},{"id":"caption-group-13","start":36.352,"end":37.64,"text":"Sans ouvrir un seul dossier","words":[{"id":"caption-word-13-0","text":"Sans","start":36.352,"end":36.63},{"id":"caption-word-13-1","text":"ouvrir","start":36.63,"end":36.908},{"id":"caption-word-13-2","text":"un","start":36.908,"end":37.093},{"id":"caption-word-13-3","text":"seul","start":37.093,"end":37.371},{"id":"caption-word-13-4","text":"dossier","start":37.371,"end":37.64}]}];
  var DURATION = 52.95;
  // Fenêtres masquées quoi qu'il arrive : hook d'ouverture et carton de fin
  var MASK_WINDOWS = [[0, 2.0], [46.0, DURATION]];

  (function () {
    var stage = document.getElementById("caption-stage");

    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      groupEl.appendChild(line);
      stage.appendChild(groupEl);
    });

    // état initial masqué, hors timeline (un tl.set(...,0) ne s'appliquerait
    // pas si le lecteur reste exactement sur la frame 0)
    gsap.set("#caption-stage", { autoAlpha: 0 });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // pas d'animation d'entrée : le bloc apparaît net (tl.set, jamais tl.to/fromTo)
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start);
        tl.set(el, { className: "caption-word is-active" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word" }, nextAt); // redevient blanc, sans fond
        }
      });
    });

    // masquage intégral de la piste sur les fenêtres hook d'ouverture / carton
    // de fin, quel que soit l'état des groupes ci-dessus (posé APRÈS, sur le
    // conteneur parent — s'applique par-dessus tout groupe actif)
    MASK_WINDOWS.forEach(function (win) {
      tl.set("#caption-stage", { autoAlpha: 0 }, win[0]);
      tl.set("#caption-stage", { autoAlpha: 1 }, win[1]);
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
