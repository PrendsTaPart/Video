<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      video.plan {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="52.95"
      data-width="1080"
      data-height="1920"
    >
      <!-- les 5 plans, coupe franche, plein cadre -->
      <video
        id="el-plan-01"
        class="scene plan clip"
        src="assets/video/plan-01.mp4"
        muted
        data-start="0"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-02"
        class="scene plan clip"
        src="assets/video/plan-02.mp4"
        muted
        data-start="10"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-03"
        class="scene plan clip"
        src="assets/video/plan-03.mp4"
        muted
        data-start="20"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-04"
        class="scene plan clip"
        src="assets/video/plan-04.mp4"
        muted
        data-start="30"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-05"
        class="scene plan clip"
        src="assets/video/plan-05.mp4"
        muted
        data-start="40"
        data-duration="10"
        data-track-index="0"
      ></video>

      <!-- hook d'ouverture : dégradé + logo + punchline, balayage révèle le plan 1 -->
      <div
        id="el-hook-open"
        class="scene"
        data-composition-id="00-hook-open"
        data-composition-src="compositions/frames/00-hook-open.html"
        data-start="0"
        data-duration="1.5"
        data-track-index="1"
      ></div>

      <!-- carte-agent Nina, pendant le plan 3, hors zone de sécurité -->
      <div
        id="el-agent-nina"
        class="scene"
        data-composition-id="agent-nina"
        data-composition-src="compositions/frames/agent-nina.html"
        data-start="21"
        data-duration="7"
        data-track-index="2"
      ></div>

      <!-- hook de fin : fondu encre par-dessus la fin du plan 5, signature -->
      <div
        id="el-hook-end"
        class="scene"
        data-composition-id="hook-end"
        data-composition-src="compositions/frames/hook-end.html"
        data-start="48.4"
        data-duration="4.55"
        data-track-index="3"
      ></div>

      <!-- sous-titres karaoké -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="52.95"
        data-track-index="10"
      ></div>

      <!-- voix off, piste séparée -->
      <audio
        id="el-voice"
        src="assets/voice/vo.wav"
        data-start="0"
        data-duration="41.33"
        data-track-index="20"
        data-volume="1"
      ></audio>

      <!-- musique de fond, -18dB sous la voix, fondue sur les 2 dernières secondes -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="52.95"
        data-track-index="21"
        data-volume="0.126"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // musique de fond à -18dB (≈0.126 linéaire) sous la voix, fondue sur
        // les 2 dernières secondes (50.95s → 52.95s)
        var bgm = document.getElementById("el-bgm");
        tl.set(bgm, { volume: 0.126 }, 0);
        tl.to(bgm, { volume: 0, duration: 2, ease: "none" }, 50.95);

        tl.to({}, { duration: 52.95 }, 0); // full-span anchor — main.duration() == composition total
      })();
    </script>
  </body>
</html>
