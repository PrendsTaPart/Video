<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      video.plan {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="52.95"
      data-width="720"
      data-height="1280"
    >
      <!-- les 5 plans, coupe franche, plein cadre, son d'ambiance réel (démutés) -->
      <video
        id="el-plan-01"
        class="scene plan clip"
        src="assets/video/plan-01.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="0"
        data-duration="10"
        data-track-index="0"
      ></video>
      <!--
        plan 2 : recadrage numérique (rattrapage cadrage). Le pipeline de rendu
        remplace chaque <video> par une image figée positionnée via
        offsetWidth/offsetHeight/offsetLeft/offsetTop (mise en page réelle) —
        un `transform: scale()` CSS n'est PAS pris en compte. Le zoom est donc
        animé en largeur/hauteur/position réelles (voir script), dans une
        fenêtre de recadrage à overflow:hidden.
      -->
      <div class="scene" style="overflow: hidden;">
        <video
          id="el-plan-02"
          class="plan clip"
          src="assets/video/plan-02.mp4"
          data-has-audio="true"
          data-volume="0.1"
          data-start="10"
          data-duration="10"
          data-track-index="0"
          data-layout-allow-overflow
          style="position: absolute; left: 0px; top: 0px; width: 720px; height: 1280px; object-fit: cover;"
        ></video>
      </div>
      <video
        id="el-plan-03"
        class="scene plan clip"
        src="assets/video/plan-03.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="20"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-04"
        class="scene plan clip"
        src="assets/video/plan-04.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="30"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-05"
        class="scene plan clip"
        src="assets/video/plan-05.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="40"
        data-duration="10"
        data-track-index="0"
      ></video>

      <!-- hook d'ouverture : fond encre, lueur, punchline alignée gauche, petit lock-up -->
      <div
        id="el-hook-open"
        class="scene"
        data-composition-id="00-hook-open"
        data-composition-src="compositions/frames/00-hook-open.html"
        data-start="0"
        data-duration="2.0"
        data-track-index="1"
      ></div>

      <!-- carte-agent Nina, pendant le plan 3, hors zone de sécurité -->
      <div
        id="el-agent-nina"
        class="scene"
        data-composition-id="agent-nina"
        data-composition-src="compositions/frames/agent-nina.html"
        data-start="21"
        data-duration="7"
        data-track-index="2"
      ></div>

      <!-- hook de fin : fondu encre par-dessus la fin du plan 5, carton resserré -->
      <div
        id="el-hook-end"
        class="scene"
        data-composition-id="hook-end"
        data-composition-src="compositions/frames/hook-end.html"
        data-start="48.4"
        data-duration="4.55"
        data-track-index="3"
      ></div>

      <!-- sous-titres karaoké (masqués 0-2s et 46s-fin, voir captions.html) -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="52.95"
        data-track-index="10"
      ></div>

      <!-- voix off : 3 segments séparés, silences réels entre eux (aucun padding) -->
      <audio
        id="el-voice-1"
        src="assets/voice/vo-seg1.wav"
        data-start="0"
        data-duration="8.823583"
        data-track-index="20"
        data-volume="1"
      ></audio>
      <audio
        id="el-voice-2"
        src="assets/voice/vo-seg2.wav"
        data-start="20"
        data-duration="6.965986"
        data-track-index="20"
        data-volume="1"
      ></audio>
      <audio
        id="el-voice-3"
        src="assets/voice/vo-seg3.wav"
        data-start="33"
        data-duration="5.015510"
        data-track-index="20"
        data-volume="1"
      ></audio>

      <!--
        Canal musique de fond : NON câblé, aucun fichier fourni (voir rapport
        final). Dès qu'un fichier existe dans assets/bgm/, ajouter un élément
        audio pointant dessus (data-start 0, data-duration 52.95,
        data-track-index 21, data-volume ~0.1 pour rester sous la voix) —
        pas de balise ici tant que le fichier n'existe pas, pour que le
        linter ne référence jamais un chemin inexistant.
      -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // plan 2 : son d'ambiance à -20dB (≈0.1 linéaire) partout, sauf la
        // réplique de Karim (14.0s → 17.0s, remontée à 0dB = volume 1)
        var plan2 = document.getElementById("el-plan-02");
        tl.set(plan2, { volume: 0.1 }, 10);
        tl.to(plan2, { volume: 1, duration: 0.15, ease: "power1.inOut" }, 13.85);
        tl.set(plan2, { volume: 1 }, 14.0);
        tl.to(plan2, { volume: 0.1, duration: 0.15, ease: "power1.inOut" }, 17.0);

        // plan 2 : recadrage numérique (rattrapage cadrage), centre 68%/38%.
        // Le remplacement vidéo→image du pipeline ignore `transform`, donc le
        // zoom est exprimé en largeur/hauteur/position réelles (720×1280 de
        // base). Le point (68%,38%) reste fixe à l'écran pendant le zoom —
        // équivalent d'un transform-origin: 68% 38% ; scale(1.2).
        // width(s)=720s height(s)=1280s left(s)=489.6(1-s) top(s)=486.4(1-s)
        tl.fromTo(
          plan2,
          { width: 720, height: 1280, left: 0, top: 0 },
          { width: 864, height: 1536, left: -97.92, top: -97.28, duration: 1.0, ease: "power2.inOut" },
          13.0
        );
        // maintien 14.0 → 18.5 (rien n'anime, reste à 1.2×)
        tl.to(plan2, { width: 720, height: 1280, left: 0, top: 0, duration: 1.0, ease: "power2.inOut" }, 18.5);

        tl.to({}, { duration: 52.95 }, 0); // full-span anchor — main.duration() == composition total
      })();
    </script>
  </body>
</html>
