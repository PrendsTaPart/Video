<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      video.plan {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* plan 2 : conteneur de recadrage (overflow:hidden) — aucun attribut
         de timing dessus, il sert uniquement à masquer le débord du push-in */
      #el-plan-02-wrap {
        overflow: hidden;
      }
      #el-plan-02 {
        position: absolute;
        left: 0;
        top: 0;
        width: 720px;
        height: 1280px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="52.95"
      data-width="720"
      data-height="1280"
    >
      <!-- les 5 plans, coupe franche, plein cadre, son d'ambiance réel (démutés) -->
      <video
        id="el-plan-01"
        class="scene plan clip"
        src="assets/video/plan-01.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="0"
        data-duration="10"
        data-track-index="0"
      ></video>
      <!-- plan 2 : cadrage original conservé ; léger push-in numérique
           (1,00→1,06×, centré sur Karim) uniquement pendant sa réplique
           (14,0-17,0s), retour à 1,00× à 18,0s — voir script pour le détail
           des tweens. Conteneur overflow:hidden requis pour le recadrage
           (transform seul est ignoré par le pipeline de rendu vidéo). -->
      <div id="el-plan-02-wrap" class="scene">
        <video
          id="el-plan-02"
          class="clip"
          src="assets/video/plan-02.mp4"
          data-has-audio="true"
          data-volume="0.1"
          data-start="10"
          data-duration="10"
          data-track-index="0"
        ></video>
      </div>
      <video
        id="el-plan-03"
        class="scene plan clip"
        src="assets/video/plan-03.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="20"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-04"
        class="scene plan clip"
        src="assets/video/plan-04.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="30"
        data-duration="10"
        data-track-index="0"
      ></video>
      <!-- plan 4 : le geste final (doigt posé sur le carnet violet) est jugé
           incohérent — image figée sur le dernier repère naturel après la
           fermeture du tiroir (38,7s), avant ce geste. Le plan 4 lui-même
           n'est pas raccourci : son ambiance sonore continue sans coupure
           en dessous, seule l'image est recouverte pour les 1,3 dernières
           secondes de son créneau (38,7-40,0s). -->
      <img
        id="el-plan-04-freeze"
        class="scene clip"
        src="assets/img/plan-04-freeze.png"
        data-start="38.7"
        data-duration="1.3"
        data-track-index="4"
        style="width: 100%; height: 100%; object-fit: cover"
      />
      <video
        id="el-plan-05"
        class="scene plan clip"
        src="assets/video/plan-05.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="40"
        data-duration="10"
        data-track-index="0"
      ></video>

      <!-- hook d'ouverture : fond encre, lueur, punchline alignée gauche, petit lock-up -->
      <div
        id="el-hook-open"
        class="scene"
        data-composition-id="00-hook-open"
        data-composition-src="compositions/frames/00-hook-open.html"
        data-start="0"
        data-duration="2.0"
        data-track-index="1"
      ></div>

      <!-- carte-agent Nina, ancrée bas gauche, pendant les deux incrustations
           d'écran (23,6-29,6s) -->
      <div
        id="el-agent-nina"
        class="scene"
        data-composition-id="agent-nina"
        data-composition-src="compositions/frames/agent-nina.html"
        data-start="23.6"
        data-duration="6.0"
        data-track-index="2"
      ></div>

      <!-- plan 3 : incrustations d'écran, coupe franche entre les deux -->
      <div
        id="el-plan3-screen-conversation"
        class="scene"
        data-composition-id="plan3-screen-conversation"
        data-composition-src="compositions/frames/plan3-screen-conversation.html"
        data-start="23.6"
        data-duration="3.0"
        data-track-index="5"
      ></div>
      <div
        id="el-plan3-screen-taches"
        class="scene"
        data-composition-id="plan3-screen-taches"
        data-composition-src="compositions/frames/plan3-screen-taches.html"
        data-start="26.6"
        data-duration="3.0"
        data-track-index="6"
      ></div>

      <!-- hook de fin : fondu encre par-dessus la fin du plan 5, carton resserré -->
      <div
        id="el-hook-end"
        class="scene"
        data-composition-id="hook-end"
        data-composition-src="compositions/frames/hook-end.html"
        data-start="48.4"
        data-duration="4.55"
        data-track-index="3"
      ></div>

      <!-- sous-titres karaoké (masqués 0-2s et 46s-fin, voir captions.html) -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="52.95"
        data-track-index="10"
      ></div>

      <!-- voix off : 3 segments séparés, silences réels entre eux (aucun padding).
           Démarre à 2.0s (fin du hook d'ouverture) — aucune narration pendant
           le hook, à la demande. -->
      <audio
        id="el-voice-1"
        src="assets/voice/vo-seg1.wav"
        data-start="2"
        data-duration="8.823583"
        data-track-index="20"
        data-volume="1"
      ></audio>
      <audio
        id="el-voice-2"
        src="assets/voice/vo-seg2.wav"
        data-start="20"
        data-duration="6.965986"
        data-track-index="20"
        data-volume="1"
      ></audio>
      <audio
        id="el-voice-3"
        src="assets/voice/vo-seg3.wav"
        data-start="33"
        data-duration="5.015510"
        data-track-index="20"
        data-volume="1"
      ></audio>

      <!-- musique de fond : piste déjà présente dans le dépôt (Académie
           Plan'It), voir rapport pour le choix -->
      <audio
        id="el-bgm"
        src="assets/bgm/musique-produit.mp3"
        data-start="0"
        data-duration="52.95"
        data-track-index="21"
        data-volume="0.126"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // plan 2 : son d'ambiance à -20dB (≈0.1 linéaire) partout, sauf la
        // réplique de Karim (14.0s → 17.0s, remontée à 0dB = volume 1)
        var plan2 = document.getElementById("el-plan-02");
        tl.set(plan2, { volume: 0.1 }, 10);
        tl.to(plan2, { volume: 1, duration: 0.15, ease: "power1.inOut" }, 13.85);
        tl.set(plan2, { volume: 1 }, 14.0);
        tl.to(plan2, { volume: 0.1, duration: 0.15, ease: "power1.inOut" }, 17.0);

        // plan 2 : micro push-in très subtil (1,00→1,06×) pendant la
        // réplique de Karim, centré sur lui (fx=0.95, fy=0.39, coin haut
        // droit du cadre où se trouve son visage). Recadrage par
        // width/height/left/top réels (le transform seul est ignoré par le
        // pipeline de rendu vidéo) — voir CLAUDE.md / historique du projet.
        // Formule : width=W·s, height=H·s, left=fx·W·(1-s), top=fy·H·(1-s).
        gsap.set(plan2, { width: 720, height: 1280, left: 0, top: 0 });
        tl.fromTo(
          plan2,
          { width: 720, height: 1280, left: 0, top: 0 },
          { width: 763.2, height: 1356.8, left: -41.04, top: -29.95, duration: 3.0, ease: "power2.inOut", overwrite: "auto" },
          14.0
        );
        tl.to(
          plan2,
          { width: 720, height: 1280, left: 0, top: 0, duration: 1.0, ease: "power2.inOut", overwrite: "auto" },
          17.0
        );

        // musique de fond : musique-produit.mp3 (Académie Plan'It, voir
        // rapport pour le choix), -18dB (≈0.126 linéaire) sous la voix,
        // fondue sur les 2 dernières secondes.
        var bgm = document.getElementById("el-bgm");
        tl.set(bgm, { volume: 0.126 }, 0);
        tl.to(bgm, { volume: 0, duration: 2, ease: "none" }, 50.95);

        tl.to({}, { duration: 52.95 }, 0); // full-span anchor — main.duration() == composition total
      })();
    </script>
  </body>
</html>
