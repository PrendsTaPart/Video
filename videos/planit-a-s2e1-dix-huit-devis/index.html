<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      video.plan {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="52.95"
      data-width="720"
      data-height="1280"
    >
      <!-- les 5 plans, coupe franche, plein cadre, son d'ambiance réel (démutés) -->
      <video
        id="el-plan-01"
        class="scene plan clip"
        src="assets/video/plan-01.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="0"
        data-duration="10"
        data-track-index="0"
      ></video>
      <!-- plan 2 : cadrage ORIGINAL, aucun recadrage numérique (retiré à la
           demande — Karim doit rester pleinement visible pendant sa réplique) -->
      <video
        id="el-plan-02"
        class="scene plan clip"
        src="assets/video/plan-02.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="10"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-03"
        class="scene plan clip"
        src="assets/video/plan-03.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="20"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-04"
        class="scene plan clip"
        src="assets/video/plan-04.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="30"
        data-duration="10"
        data-track-index="0"
      ></video>
      <video
        id="el-plan-05"
        class="scene plan clip"
        src="assets/video/plan-05.mp4"
        data-has-audio="true"
        data-volume="0.1"
        data-start="40"
        data-duration="10"
        data-track-index="0"
      ></video>

      <!-- hook d'ouverture : fond encre, lueur, punchline alignée gauche, petit lock-up -->
      <div
        id="el-hook-open"
        class="scene"
        data-composition-id="00-hook-open"
        data-composition-src="compositions/frames/00-hook-open.html"
        data-start="0"
        data-duration="2.0"
        data-track-index="1"
      ></div>

      <!-- carte-agent Nina, pendant le plan 3, hors zone de sécurité -->
      <div
        id="el-agent-nina"
        class="scene"
        data-composition-id="agent-nina"
        data-composition-src="compositions/frames/agent-nina.html"
        data-start="21"
        data-duration="7"
        data-track-index="2"
      ></div>

      <!-- hook de fin : fondu encre par-dessus la fin du plan 5, carton resserré -->
      <div
        id="el-hook-end"
        class="scene"
        data-composition-id="hook-end"
        data-composition-src="compositions/frames/hook-end.html"
        data-start="48.4"
        data-duration="4.55"
        data-track-index="3"
      ></div>

      <!-- sous-titres karaoké (masqués 0-2s et 46s-fin, voir captions.html) -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="52.95"
        data-track-index="10"
      ></div>

      <!-- voix off : 3 segments séparés, silences réels entre eux (aucun padding).
           Démarre à 2.0s (fin du hook d'ouverture) — aucune narration pendant
           le hook, à la demande. -->
      <audio
        id="el-voice-1"
        src="assets/voice/vo-seg1.wav"
        data-start="2"
        data-duration="8.823583"
        data-track-index="20"
        data-volume="1"
      ></audio>
      <audio
        id="el-voice-2"
        src="assets/voice/vo-seg2.wav"
        data-start="20"
        data-duration="6.965986"
        data-track-index="20"
        data-volume="1"
      ></audio>
      <audio
        id="el-voice-3"
        src="assets/voice/vo-seg3.wav"
        data-start="33"
        data-duration="5.015510"
        data-track-index="20"
        data-volume="1"
      ></audio>

      <!-- musique de fond : piste déjà présente dans le dépôt (Académie
           Plan'It), voir rapport pour le choix -->
      <audio
        id="el-bgm"
        src="assets/bgm/musique-produit.mp3"
        data-start="0"
        data-duration="52.95"
        data-track-index="21"
        data-volume="0.126"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // plan 2 : son d'ambiance à -20dB (≈0.1 linéaire) partout, sauf la
        // réplique de Karim (14.0s → 17.0s, remontée à 0dB = volume 1)
        var plan2 = document.getElementById("el-plan-02");
        tl.set(plan2, { volume: 0.1 }, 10);
        tl.to(plan2, { volume: 1, duration: 0.15, ease: "power1.inOut" }, 13.85);
        tl.set(plan2, { volume: 1 }, 14.0);
        tl.to(plan2, { volume: 0.1, duration: 0.15, ease: "power1.inOut" }, 17.0);
        // aucun recadrage numérique sur le plan 2 (retiré à la demande) —
        // cadrage original conservé tel quel, seul le volume est automatisé.

        // musique de fond : musique-produit.mp3 (Académie Plan'It, voir
        // rapport pour le choix), -18dB (≈0.126 linéaire) sous la voix,
        // fondue sur les 2 dernières secondes.
        var bgm = document.getElementById("el-bgm");
        tl.set(bgm, { volume: 0.126 }, 0);
        tl.to(bgm, { volume: 0, duration: 2, ease: "none" }, 50.95);

        tl.to({}, { duration: 52.95 }, 0); // full-span anchor — main.duration() == composition total
      })();
    </script>
  </body>
</html>
