<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
html,body{width:1600px;height:900px;overflow:hidden}
.c{position:relative;width:1600px;height:900px;background:var(--nuit)}
.c>img.ill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,26,35,.97) 0%,rgba(15,26,35,.9) 42%,rgba(15,26,35,0) 70%)}
.t{position:absolute;z-index:2;left:80px;top:90px;width:820px}
.ep{display:inline-block;background:var(--orange);color:var(--nuit);font-weight:700;font-size:26px;letter-spacing:2px;padding:8px 20px;border-radius:999px}
.k{margin-top:26px;color:var(--gris);font-weight:600;font-size:24px;letter-spacing:3px;text-transform:uppercase}
h1{margin-top:12px;font-size:60px;line-height:1.08;font-weight:700;letter-spacing:-1px}
.me{position:absolute;z-index:2;left:80px;bottom:70px;display:flex;align-items:center;gap:22px}
.me img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:5px solid #fff}
.me b{display:block;font-size:30px}.me span{font-size:21px;color:var(--gris)}
.g{position:absolute;z-index:2;right:60px;bottom:60px;background:var(--bleu);font-weight:700;font-size:24px;padding:12px 24px;border-radius:16px}
</style></head><body><div class="c" id="c"></div>
<script>
const n=+new URLSearchParams(location.search).get('n');
fetch('formations.json').then(r=>r.json()).then(F=>{const f=F.find(x=>x.episode===n);
document.getElementById('c').innerHTML=`<img class="ill" src="a/ill/formation-${String(n).padStart(2,'0')}.jpg">
<div class="t"><span class="ep">ÉPISODE ${n}</span><div class="k">Comment j'ai fait, étape par étape</div><h1>${f.titre}</h1></div>
<div class="me"><img src="a/portrait.jpg"><div><b>Michael Kebail-Ali</b><span>BraindCode · FoodEatUp · RapidoSoftware</span></div></div>
<div class="g">Formation gratuite + PDF</div>`;
document.fonts.ready.then(()=>{Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r))).then(()=>document.body.dataset.ok=1)})});
</script></body></html>
