<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap"><style>
@page{size:A4;margin:16mm 15mm 18mm}
@page cover{margin:0}
:root{--font:Manrope,sans-serif}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font)}
.cover{page:cover;width:210mm;height:297mm;position:relative;overflow:hidden;break-after:page;background:var(--bg)}
.cover .ill{position:absolute;left:0;top:0;width:100%;height:150mm;object-fit:cover}
.cover .fade{position:absolute;left:0;right:0;top:95mm;height:56mm;background:linear-gradient(transparent,var(--bg))}
.cover .band{position:absolute;left:0;right:0;top:0;height:14mm;background:var(--band);display:flex;align-items:center;justify-content:space-between;padding:0 16mm;color:#fff;font-weight:700;font-size:9pt;letter-spacing:1.5px;text-transform:uppercase;z-index:2}
.cover .band .logo{margin:0;padding:1.2mm 3mm;border-radius:2mm}.cover .band .logo img{height:7mm}
.cover .tx{position:absolute;left:16mm;right:16mm;top:140mm}
.ep{display:inline-block;background:var(--cta);color:var(--cta-fg);font-weight:700;font-size:11pt;letter-spacing:1.5px;padding:2mm 5mm;border-radius:99px}
.kick{margin-top:6mm;color:var(--txt2);font-weight:600;font-size:10pt;letter-spacing:2px;text-transform:uppercase}
.cover h1{margin-top:3mm;font-size:27pt;line-height:1.12;font-weight:700;color:var(--txt)}
.cover .pr{margin-top:5mm;font-size:12.5pt;line-height:1.5;color:var(--txt)}
.cover .me{position:absolute;left:16mm;bottom:18mm;display:flex;align-items:center;gap:5mm}
.cover .me img{width:22mm;height:22mm;border-radius:50%;border:1.2mm solid #fff;object-fit:cover}
.cover .me b{display:block;font-size:13pt}.cover .me span{font-size:9.5pt;color:var(--txt2)}
.cover .gr{position:absolute;right:16mm;bottom:22mm;background:var(--pri);color:var(--pri-fg);font-weight:700;font-size:10pt;padding:2.5mm 5mm;border-radius:3mm}
.strip{height:2mm;background:var(--band);border-radius:1mm;margin-bottom:5mm}
h2{font-size:17pt;font-weight:700;margin:0 0 4mm;color:var(--txt)}
h2 small{display:block;font-size:9pt;letter-spacing:2px;color:var(--acc);text-transform:uppercase;font-weight:700;margin-bottom:1mm}
h3{color:var(--txt)}
.bloc{background:var(--surf);border:.3mm solid var(--bord);border-radius:4mm;padding:5mm 6mm;margin-bottom:5mm;break-inside:avoid}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
p,li{font-size:10.5pt;line-height:1.55;color:var(--txt)}
a{color:var(--link)}
.lbl{font-size:8.5pt;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2);font-weight:700;margin-bottom:1.5mm}
table{width:100%;border-collapse:collapse}td{padding:2mm 0;border-bottom:.2mm solid var(--bord);font-size:10pt;vertical-align:top;color:var(--txt)}
td:first-child{font-weight:600;width:42%}td a{color:var(--link);text-decoration:none;word-break:break-all}
.step{display:flex;gap:5mm;break-inside:avoid;margin-bottom:5mm;background:var(--surf);border:.3mm solid var(--bord);border-left:1.2mm solid var(--pri);border-radius:4mm;padding:5mm}
.num{flex:none;width:10mm;height:10mm;border-radius:50%;background:var(--pri);color:var(--pri-fg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12pt}
.step h3{font-size:12.5pt;font-weight:700;margin-bottom:1.5mm}
.rp{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-top:3mm}
.rp div{border-radius:2.5mm;padding:2.5mm 3mm;font-size:9pt;line-height:1.45;border:.3mm solid var(--bord)}
.rp b{display:block;font-size:7.5pt;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:.8mm}
.rp .ok{background:var(--ok-bg);color:var(--txt)}.rp .ok b{color:var(--ok)}
.rp .ko{background:var(--ko-bg);color:var(--txt)}.rp .ko b{color:var(--ko)}
ul.chk{list-style:none}ul.chk li{padding-left:6mm;position:relative;margin:1.5mm 0}ul.chk li:before{content:"✓";position:absolute;left:0;color:var(--acc);font-weight:700}
ul.pre li:before{content:"•"}
.reel{border-color:var(--cta)}
.page{break-before:page}
.offre{border:.5mm solid var(--cta)}
.badge{display:inline-block;background:var(--cta);color:var(--cta-fg);font-weight:700;font-size:8.5pt;letter-spacing:1px;padding:1.2mm 3mm;border-radius:99px;text-transform:uppercase}
.badge.p{background:var(--pri);color:var(--pri-fg)}
.logo{display:inline-flex;background:#fff;border-radius:3mm;padding:2mm 4mm;margin:3mm 0;border:.3mm solid var(--bord)}
.logo img{height:10mm}
.cta{display:inline-block;margin-top:3mm;background:var(--cta);color:var(--cta-fg);font-weight:700;font-size:10.5pt;padding:2.5mm 5mm;border-radius:3mm;text-decoration:none}
.cta.b{background:var(--pri);color:var(--pri-fg)}
.small{font-size:8.5pt;color:var(--txt2)}
.lg{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:1.5mm;height:6mm;padding:0 1.5mm;margin-right:2mm;vertical-align:middle;border:.2mm solid var(--bord)}
.lg img{max-height:4.2mm;max-width:22mm}
/* prompt en conversation, façon Claude (identique dans toutes les marques) */
.chat{margin-top:3.5mm;background:#FAF9F5;color:#141413;border:.3mm solid #E8E6DC;border-radius:3.5mm;overflow:hidden;break-inside:avoid}
.chat-h{display:flex;align-items:center;justify-content:space-between;padding:2mm 3.5mm;border-bottom:.3mm solid #E8E6DC;font-family:Inter,sans-serif;font-size:7.5pt;color:#5E5D59}
.chat-h img{height:4mm;vertical-align:middle;margin-right:1.5mm}
.bulle{margin:3mm 3.5mm 0 12mm;background:#F0EEE6;border-radius:3.5mm 3.5mm 1mm 3.5mm;padding:3mm 3.5mm;font-family:Inter,sans-serif;font-size:9.5pt;line-height:1.5;white-space:pre-wrap;color:#141413}
.bulle mark{background:#F5E3D9;color:#8A3A1E;border-radius:1mm;padding:0 .8mm}
.astuce{margin:2mm 3.5mm 0 12mm;font-family:'Source Serif 4',serif;font-style:italic;font-size:8.5pt;color:#5E5D59}
.compo{margin:3mm;display:flex;align-items:center;gap:2mm;background:#fff;border:.3mm solid #E8E6DC;border-radius:3mm;padding:1.8mm 2mm 1.8mm 3.5mm;font-family:Inter,sans-serif}
.compo span{flex:1;font-size:8.5pt;color:#6B6A65}
.compo a{background:#AE5630;color:#fff;text-decoration:none;font-weight:600;font-size:8pt;padding:1.5mm 3mm;border-radius:2.2mm}
.compo a.gpt{background:none;color:#5E5D59;font-weight:500}
.ecr{display:flex;gap:3mm;margin-top:3mm}
.ecr figure{flex:1;margin:0;border:.3mm solid var(--bord);border-radius:2.5mm;overflow:hidden;background:#fff}
.ecr figure.v{flex:.45}
.ecr img{display:block;width:100%;height:40mm;object-fit:cover;object-position:top}
.ecr figcaption{font-size:8pt;padding:1.5mm 2.5mm;color:#5E5D59;background:#fff}
.ecr figcaption b{color:#141413;display:block}
</style></head><body><div id="doc"></div>
<script>
const SITE='https://michael.foodeatup.fr';
const Q=new URLSearchParams(location.search); const BLANC=Q.get('t')==='blanc';

const RAPIDO_N={bg:'#232323',surf:'#2E2E2E',bord:'#474747',txt:'#FFFFFF',txt2:'#C9C9C9',font:'Arial,"Helvetica Neue",Helvetica,sans-serif'};
const RAPIDO_B={bg:'#FFFFFF',surf:'#F6F6F6',bord:'#E0E0E0',txt:'#383838',txt2:'#555555',font:RAPIDO_N.font};
const THEMES={
 foodeatup:{n:{bg:'#0F1A23',surf:'#16242F',bord:'#2A3F50',txt:'#FFFFFF',txt2:'#AEB8C2',pri:'#007BFF','pri-fg':'#FFFFFF',cta:'#FFA500','cta-fg':'#0F1A23',link:'#5AA9FF',acc:'#FFA500',band:'linear-gradient(135deg,#0F1A23 0%,#0B4FA8 100%)',font:'Manrope,sans-serif'},
            b:{bg:'#FFFFFF',surf:'#FCF9E6',bord:'#E6E0C4',txt:'#0F1A23',txt2:'#4A5866',pri:'#0B4FA8','pri-fg':'#FFFFFF',cta:'#FFA500','cta-fg':'#0F1A23',link:'#0B4FA8',acc:'#0B4FA8',band:'linear-gradient(135deg,#0F1A23 0%,#0B4FA8 100%)',font:'Manrope,sans-serif'}},
 rapidocrm:{n:{...RAPIDO_N,pri:'#4CAF50','pri-fg':'#0C1F0D',cta:'#4CAF50','cta-fg':'#0C1F0D',link:'#81C784',acc:'#81C784',band:'linear-gradient(135deg,#383838 0%,#2E7D32 100%)'},
            b:{...RAPIDO_B,pri:'#2E7D32','pri-fg':'#FFFFFF',cta:'#2E7D32','cta-fg':'#FFFFFF',link:'#2E7D32',acc:'#2E7D32',band:'linear-gradient(135deg,#383838 0%,#2E7D32 100%)'}},
 rapidocms:{n:{...RAPIDO_N,pri:'#03A9F5','pri-fg':'#04202E',cta:'#03A9F5','cta-fg':'#04202E',link:'#4FC3F7',acc:'#4FC3F7',band:'linear-gradient(135deg,#383838 0%,#0277BD 100%)'},
            b:{...RAPIDO_B,pri:'#0277BD','pri-fg':'#FFFFFF',cta:'#0277BD','cta-fg':'#FFFFFF',link:'#0277BD',acc:'#0277BD',band:'linear-gradient(135deg,#383838 0%,#0277BD 100%)'}},
 rapidorh:{n:{...RAPIDO_N,pri:'#9575CD','pri-fg':'#160C2A',cta:'#9575CD','cta-fg':'#160C2A',link:'#B39DDB',acc:'#B39DDB',band:'linear-gradient(135deg,#383838 0%,#5E35B1 100%)'},
           b:{...RAPIDO_B,pri:'#5E35B1','pri-fg':'#FFFFFF',cta:'#5E35B1','cta-fg':'#FFFFFF',link:'#5E35B1',acc:'#5E35B1',band:'linear-gradient(135deg,#383838 0%,#5E35B1 100%)'}},
 rapidosoftware:{n:{...RAPIDO_N,pri:'#03A9F5','pri-fg':'#04202E',cta:'#4CAF50','cta-fg':'#0C1F0D',link:'#4FC3F7',acc:'#4FC3F7',band:'linear-gradient(135deg,#2E7D32 0%,#0277BD 50%,#5E35B1 100%)'},
                 b:{...RAPIDO_B,pri:'#383838','pri-fg':'#FFFFFF',cta:'#2E7D32','cta-fg':'#FFFFFF',link:'#0277BD',acc:'#0277BD',band:'linear-gradient(135deg,#2E7D32 0%,#0277BD 50%,#5E35B1 100%)'}},
 planit:{n:{bg:'#1F0D3E',surf:'#2A1556',bord:'#4A2B86',txt:'#FFFFFF',txt2:'#D4C8F2',pri:'#8236F8','pri-fg':'#FFFFFF',cta:'#FE64D5','cta-fg':'#1F0D3E',link:'#C9A6FF',acc:'#FE64D5',band:'linear-gradient(120deg,#4F2DF9 0%,#8236F8 50%,#FE64D5 100%)',font:'"Alte Haas Grotesk","Helvetica Neue",Arial,sans-serif'},
         b:{bg:'#FFFFFF',surf:'#F6F2FF',bord:'#E0D4FB',txt:'#1F0D3E',txt2:'#5A4A7A',pri:'#4F2DF9','pri-fg':'#FFFFFF',cta:'#4F2DF9','cta-fg':'#FFFFFF',link:'#4F2DF9',acc:'#4F2DF9',band:'linear-gradient(120deg,#4F2DF9 0%,#8236F8 50%,#FE64D5 100%)',font:'"Alte Haas Grotesk","Helvetica Neue",Arial,sans-serif'}}};
function appliquerTheme(id){
 const t=THEMES[id][BLANC?'b':'n']; const r=document.documentElement.style;
 for(const[k,v]of Object.entries(t)) r.setProperty('--'+k,v);
 r.setProperty('--ok',BLANC?'#1B6E2A':'#7FD68A'); r.setProperty('--ok-bg',BLANC?'#EAF6EC':'rgba(127,214,138,.10)');
 r.setProperty('--ko',BLANC?'#A33A12':'#FFB38A'); r.setProperty('--ko-bg',BLANC?'#FBEDE6':'rgba(255,179,138,.10)');
 const st=document.createElement('style'); st.textContent=`@page{background:${t.bg}}`; document.head.append(st);
}

const OFFRES={foodeatup:['FoodEatUp','https://site.foodeatup.com','foodeatup'],rapidocrm:['RapidoCRM','https://rapido-crm.com','rapidocrm'],rapidocms:['RapidoCMS','https://rapidocms.com','rapidocms'],rapidorh:['RapidoRH','https://rh.rapidosoftware.com','rapidorh'],planit:["Plan'It",'https://plani-t.fr','planit'],rapidosoftware:['RapidoSoftware','https://rapidosoftware.com/','rapidosoftware']};
const M={plugins:'planit',build:'rapidosoftware',braindcode:'rapidosoftware',coaching:'planit',foodeatup:'foodeatup',crm:'rapidocrm',cms:'rapidocms',rh:'rapidorh',planit:'planit',rapido:'rapidosoftware'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const n=+new URLSearchParams(location.search).get('n');
Promise.all([fetch('formations.json').then(r=>r.json()),fetch('charte.json').then(r=>r.json())]).then(([F,C])=>{
const f=F.find(x=>x.episode===n); const nn=String(n).padStart(2,'0');
const [lg,url,logo]=OFFRES[M[f.offre]];
const prompts=f.etapes.filter(e=>e.prompt);
const enc=encodeURIComponent;
appliquerTheme(logo); const ch=C.CHARTES[logo]; const ecrans=(C.ECRANS[logo]||[]).slice(0,3);
const lgo=n=>C.LOGOS[n]?`<span class="lg"><img src="a${C.LOGOS[n]}"></span>`:'';
const marque=t=>esc(t).replace(/\[[^\]]+\]/g,m=>`<mark>${m}</mark>`);
const chat=t=>`<div class="chat"><div class="chat-h"><span><img src="a/brand/logos/claude.webp">prompt prêt à envoyer</span><span>Copiez-le ou cliquez sur « Ouvrir dans Claude »</span></div><div class="bulle">${marque(t)}</div>${/\[[^\]]+\]/.test(t)?'<div class="astuce">Remplacez les passages surlignés par vos informations avant d\'envoyer.</div>':''}<div class="compo"><span>Répondre à Claude…</span><a class="gpt" href="https://chatgpt.com/?q=${enc(t)}">ChatGPT</a><a href="https://claude.ai/new?q=${enc(t)}">Ouvrir dans Claude ↑</a></div></div>`;
document.getElementById('doc').innerHTML=`
<section class="cover"><div class="band"><span>Formation · ${esc(ch.nom)}</span><span class="logo"><img src="a${ch.logo}"></span></div><img class="ill" src="a/ill/formation-${nn}.jpg"><div class="fade"></div>
<div class="tx"><span class="ep">ÉPISODE ${n}</span><div class="kick">Comment j'ai fait, étape par étape</div><h1>${esc(f.titre)}</h1><p class="pr">${esc(f.promesse)}</p></div>
<div class="me"><img src="a/portrait.jpg"><div><b>Michael Kebail-Ali</b><span>Fondateur de BraindCode, FoodEatUp et RapidoSoftware</span></div></div>
<div class="gr">Formation gratuite</div></section>

<div class="strip"></div><h2><small>En bref</small>Ce que vous allez apprendre</h2>
<div class="bloc"><p>${esc(f.promesse)}</p></div>
${(f.objectifs||[]).length?`<div class="bloc"><div class="lbl">Ce que vous saurez faire</div><ul class="chk">${f.objectifs.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`:''}
${(f.prerequis||[]).length?`<div class="bloc"><div class="lbl">Avant de commencer</div><ul class="chk pre">${f.prerequis.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`:''}
<div class="grid">
 <div class="bloc"><div class="lbl">Pour qui ?</div><p>${esc(f.pour_qui)}</p></div>
 <div class="bloc"><div class="lbl">Au programme</div><p>${f.etapes.length} étapes · ${prompts.length} prompt${prompts.length>1?'s':''} à copier · environ ${Math.max(10,3*f.etapes.length+5)} min</p></div>
</div>
<div class="bloc"><div class="lbl">L'épisode vidéo</div><p>Épisode ${n} de la série « Mon quotidien d'entrepreneur avec l'IA » : <a href="${SITE}/formations/${f.slug}">${SITE.replace('https://','')}/formations/${f.slug}</a></p></div>
<div class="bloc"><div class="lbl">Les outils</div><table>${f.outils.map(o=>`<tr><td>${lgo(o.nom)}${esc(o.nom)}</td><td><a href="${o.url}">${o.url.replace('https://','')}</a></td></tr>`).join('')}</table></div>
<div class="bloc"><div class="lbl">Sommaire</div><ul class="chk">${f.etapes.map((e,i)=>`<li>${i+1}. ${esc(e.titre)}</li>`).join('')}</ul></div>

<h2 style="margin-top:6mm"><small>La méthode</small>Étape par étape</h2>
${f.etapes.map((e,i)=>`<div class="step"><div class="num">${i+1}</div><div style="flex:1"><h3>${esc(e.titre)}</h3><p>${esc(e.explication)}</p>${e.prompt?chat(e.prompt):''}${e.resultat||e.piege?`<div class="rp">${e.resultat?`<div class="ok"><b>Résultat attendu</b>${esc(e.resultat)}</div>`:''}${e.piege?`<div class="ko"><b>Piège à éviter</b>${esc(e.piege)}</div>`:''}</div>`:''}</div></div>`).join('')}

<div class="bloc" style="margin-top:6mm"><div class="lbl">Les garde-fous</div><ul class="chk">${f.garde_fous.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>
<div class="bloc reel"><div class="lbl" style="color:var(--acc)">Ce qui est réellement en place</div><p>${esc(f.etat_reel)}</p></div>


<h2 class="page"><small>Pour aller plus loin</small>Passez à la pratique</h2>
<div class="bloc offre"><span class="badge">Offre réservée aux lecteurs</span>
<div><span class="logo"><img src="a${ch.logo}"></span></div>
<h3 style="font-size:15pt;margin-bottom:2mm">1er mois offert sur ${lg}</h3>
<p>Vous avez suivi la formation : testez ${lg} pendant un mois offert, avec mon aide pour la mise en route.</p>
<p class="small" style="margin-top:2mm">Offre réservée aux personnes ayant suivi une formation. Activation sur demande via le formulaire ; les conditions sont confirmées par écrit avant toute souscription.</p>
<a class="cta" href="${SITE}/rdv?sujet=offre&logiciel=${enc(lg)}&formation=${f.slug}">Activer mon mois offert</a>
<p class="small" style="margin-top:2mm">Découvrir ${lg} : <a href="${url}">${url.replace('https://','')}</a></p></div>
<div class="bloc"><div class="lbl">À quoi ressemble ${esc(ch.nom)}</div>
<div class="ecr">${ecrans.map(e=>`<figure class="${e.vertical?'v':''}"><img src="a${e.src}"><figcaption><b>${esc(e.titre)}</b>${esc(e.legende)}</figcaption></figure>`).join('')}</div>
<p class="small" style="margin-top:2mm">Écrans issus de la bibliothèque officielle de la marque (maquettes et captures), données de démonstration.</p></div>
<div class="bloc"><span class="badge p">Accompagnement one-to-one</span>
<h3 style="font-size:15pt;margin:3mm 0 2mm">Je vous aide à mettre tout ça en place</h3>
<ul class="chk"><li>Configurer votre compte Claude ou ChatGPT (OpenAI) et ses réglages</li><li>Connecter vos logiciels à l'IA avec les MCP, en sécurité</li><li>Comprendre l'IA générative et l'orchestration agentique, simplement</li><li>Lancer votre première mission utile, avec les bons garde-fous</li></ul>
<p style="margin-top:2mm">Heures de formation en visio, à votre rythme. Tarif sur devis, après un premier échange.</p>
<a class="cta b" href="${SITE}/rdv?sujet=coaching&formation=${f.slug}">Demander un devis</a></div>
<div class="bloc"><div class="lbl">Toutes mes formations, vidéos et projets</div><p><a href="${SITE}">${SITE.replace('https://','')}</a> · LinkedIn : <a href="https://www.linkedin.com/in/braindcode">linkedin.com/in/braindcode</a></p></div>
`;
document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r)))).then(()=>document.body.dataset.ok=1);
});
</script></body></html>
