<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Endcard — Écosystème Rapido</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", "Inter", sans-serif; color: #eaf2ff; isolation: isolate; }
        .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 80% at 50% 42%, #1b2440 0%, #121a30 60%, #0d1424 100%); }

        .wrap { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .brand { width: 460px; max-width: 460px; opacity: 0; will-change: transform, opacity; margin-bottom: 8px; }
        .brand img { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 40px rgba(0,0,0,0.4)); }
        .tag { font-family: "Poppins", sans-serif; font-weight: 800; font-size: 58px; letter-spacing: -0.02em; color: #ffffff; margin: 8px 0 40px; opacity: 0; will-change: transform, opacity; }

        .logos { display: flex; gap: 22px; opacity: 0; will-change: transform, opacity; margin-bottom: 48px; }
        .logos .chip { width: 118px; height: 118px; border-radius: 26px; background: #ffffff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        .logos .chip img { width: 92px; height: 92px; object-fit: contain; }

        .cta { display: inline-flex; align-items: center; gap: 18px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(127,191,255,0.4); border-radius: 100px; padding: 22px 40px; opacity: 0; will-change: transform, opacity; }
        .cta .q { font-family: "Inter", sans-serif; font-weight: 600; font-size: 40px; color: #eaf2ff; }
        .cta .q b { color: #7fbfff; }
        .foot { margin-top: 30px; font-family: "Inter", sans-serif; font-weight: 500; font-size: 27px; color: #8a9bbd; opacity: 0; will-change: transform, opacity; }
        .foot b { color: #a9bad6; font-weight: 700; }
      </style>

      <div id="root" data-composition-id="99-endcard" data-width="1920" data-height="1080" data-duration="6.5">
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="6.5" data-track-index="0"></div>
        <div id="scene" class="clip" data-start="0" data-duration="6.5" data-track-index="1" style="position:absolute; inset:0;">
          <div class="wrap">
            <div class="brand" id="brand"><img src="public/rapidosoftware-logo.png" alt="Rapido Software" /></div>
            <div class="tag" id="tag">Un écosystème. Une IA. Votre entreprise.</div>
            <div class="logos" id="logos">
              <div class="chip"><img src="public/rapidocrm-logo.png" alt="RapidoCRM" /></div>
              <div class="chip"><img src="public/rapidocms-logo.png" alt="RapidoCMS" /></div>
              <div class="chip"><img src="public/rapidorh-logo.png" alt="RapidoRH" /></div>
              <div class="chip"><img src="public/foodeatup-logo.png" alt="FoodEatUp" /></div>
            </div>
            <div class="cta" id="cta"><span class="q">Installez le plugin, puis dites : <b>« Prépare ma journée. »</b></span></div>
            <div class="foot" id="foot">Marketplace de plugins Claude Code · par <b>BraindCode</b></div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#brand", { y: 26, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.1);
        tl.fromTo("#tag", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.5);
        tl.fromTo("#logos", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.1);
        tl.fromTo("#cta", { y: 16, scale: 0.97, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.3)" }, 1.7);
        tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 2.4);
        tl.fromTo("#cta", { boxShadow: "0 0 0 rgba(127,191,255,0)" }, { boxShadow: "0 0 40px rgba(127,191,255,0.35)", duration: 1.0, yoyo: true, repeat: 1, ease: "power2.inOut" }, 3.0);
        window.__timelines["99-endcard"] = tl;
      </script>
    </template>
  </body>
</html>
