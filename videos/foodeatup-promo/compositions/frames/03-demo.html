<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>03-demo — Reveal + démo produit</title>
    <!-- head is metadata only; everything the runtime needs lives inside <template> -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-600.woff2") format("woff2");
          font-weight: 600;
          font-display: block;
        }
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-700.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
          font-display: block;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Poppins", "Inter", sans-serif;
        }

        .clip {
          position: absolute;
          inset: 0;
        }

        /* ── Track 0 — off-white field + very light diagonal blue panel ── */
        #f3-bg {
          background: #f7f9fc;
        }
        .f3-panel {
          position: absolute;
          inset: 0;
          background: rgba(30, 155, 240, 0.05);
          clip-path: polygon(64% 0, 100% 0, 100% 100%, 47% 100%);
          opacity: 0;
          will-change: opacity;
        }

        /* ── Logo: outer wrapper = scale-swap move (origin top-left),
               inner img = spring-pop (origin center). Never both on one element. ── */
        .f3-logo-move {
          position: absolute;
          left: 580px;
          top: 330px;
          width: 760px;
          height: 202px;
          transform-origin: 0 0;
          will-change: transform;
          z-index: 4;
        }
        .f3-logo-pop {
          display: block;
          width: 760px;
          height: 202px;
          object-fit: contain;
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }

        /* Scene 1 subline, centered under the hero logo */
        .f3-subline {
          position: absolute;
          left: 0;
          right: 0;
          top: 578px;
          text-align: center;
          font-family: "Inter", sans-serif;
          font-weight: 500;
          font-size: 42px;
          letter-spacing: 0.01em;
          color: #6b6b6b;
          opacity: 0;
          will-change: transform, opacity;
        }

        /* Scene 2+ chrome eyebrow, under the docked top-left logo */
        .f3-eyebrow {
          position: absolute;
          left: 102px;
          top: 172px;
          font-family: "Poppins", sans-serif;
          font-weight: 600;
          font-size: 21px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #1e9bf0;
          opacity: 0;
          will-change: transform, opacity;
        }

        /* ── Team image, right side (60/40 split), white halo melts its white box ── */
        .f3-team {
          position: absolute;
          left: 1310px;
          top: 110px;
          width: 520px;
          height: 780px;
          opacity: 0;
          will-change: transform, opacity;
          z-index: 1;
        }
        .f3-team-halo {
          position: absolute;
          left: -160px;
          top: -140px;
          width: 840px;
          height: 1060px;
          background: radial-gradient(
            ellipse 50% 50% at 50% 50%,
            #ffffff 42%,
            rgba(255, 255, 255, 0) 72%
          );
          pointer-events: none;
        }
        .f3-team-img {
          position: absolute;
          inset: 0;
          width: 520px;
          height: 780px;
          object-fit: contain;
          -webkit-mask-image: radial-gradient(
            ellipse 75% 68% at 50% 50%,
            #000 60%,
            transparent 100%
          );
          mask-image: radial-gradient(ellipse 75% 68% at 50% 50%, #000 60%, transparent 100%);
        }

        /* ── Feature pills, left column region (2-col brick, above keep-out) ── */
        .f3-pills {
          position: absolute;
          left: 120px;
          top: 306px;
          width: 1040px;
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          column-gap: 24px;
          row-gap: 20px;
          z-index: 2;
        }
        .f3-pill {
          display: flex;
          align-items: center;
          gap: 20px;
          height: 96px;
          padding: 0 30px;
          box-sizing: border-box;
          background: #ffffff;
          border: 1.5px solid rgba(30, 155, 240, 0.2);
          border-radius: 100px;
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }
        .f3-pill-ic {
          flex: 0 0 52px;
          width: 52px;
          height: 52px;
          display: grid;
          place-items: center;
          background: rgba(30, 155, 240, 0.08);
          border-radius: 50%;
        }
        .f3-pill-ic svg {
          width: 28px;
          height: 28px;
          fill: none;
          stroke: #1e9bf0;
          stroke-width: 1.8;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .f3-pill-label {
          font-family: "Poppins", sans-serif;
          font-weight: 600;
          font-size: 27px;
          letter-spacing: -0.01em;
          color: #1b2a41;
          white-space: nowrap;
        }

        /* ── Scene 4 accent line under the stack (svg-path-draw) ── */
        .f3-accent {
          position: absolute;
          left: 120px;
          top: 782px;
          width: 420px;
          height: 8px;
          z-index: 2;
        }
        .f3-accent path {
          fill: none;
          stroke: #1e9bf0;
          stroke-width: 6;
          stroke-linecap: round;
          /* single dash = full path length (414px, +margin); offset fully out = invisible */
          stroke-dasharray: 424;
          stroke-dashoffset: 424;
        }
      </style>

      <div
        id="root"
        data-composition-id="03-demo"
        data-width="1920"
        data-height="1080"
        data-duration="14.711"
      >
        <!-- Track 0 — full-duration background -->
        <div id="f3-bg" class="clip" data-start="0" data-duration="14.211" data-track-index="0">
          <div class="f3-panel" id="f3-panel"></div>
        </div>

        <!-- Track 1 — full-duration content; GSAP paces every reveal to the VO -->
        <section
          id="f3-content"
          class="clip"
          data-start="0"
          data-duration="14.211"
          data-track-index="1"
        >
          <!-- Scene 1 (0.0–2.2s): logo spring-pop centered · Scene 2: docks top-left -->
          <div class="f3-logo-move" id="f3-logo-move">
            <img
              class="f3-logo-pop"
              id="f3-logo-pop"
              src="public/foodeatup-logo-mascot.png"
              alt="FoodEatUp"
            />
          </div>
          <p class="f3-subline" id="f3-subline">la plateforme tout-en-un</p>
          <p class="f3-eyebrow" id="f3-eyebrow">La plateforme tout-en-un</p>

          <!-- Scene 2 (2.2–4.6s): team image slides in, right side -->
          <div class="f3-team" id="f3-team">
            <div class="f3-team-halo"></div>
            <img
              class="f3-team-img"
              src="public/equipe-tablette.png"
              alt="Équipe de restaurant autour d'un ordinateur"
            />
          </div>

          <!-- Scene 3 (4.6–11.6s): 7 feature pills, each on its VO cue -->
          <div class="f3-pills">
            <div class="f3-pill" id="f3-p1">
              <span class="f3-pill-ic">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="5" width="18" height="16" rx="2" />
                  <path d="M3 10h18M8 3v4M16 3v4" />
                </svg>
              </span>
              <span class="f3-pill-label">Réservations</span>
            </div>
            <div class="f3-pill" id="f3-p2">
              <span class="f3-pill-ic">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <path d="M12 3v8M3 11h9" />
                  <circle cx="16.5" cy="16.5" r="2.5" />
                </svg>
              </span>
              <span class="f3-pill-label">Plan de salle</span>
            </div>
            <div class="f3-pill" id="f3-p3">
              <span class="f3-pill-ic">
                <svg viewBox="0 0 24 24">
                  <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" />
                  <path d="M3 8l9 5 9-5M12 13v8" />
                </svg>
              </span>
              <span class="f3-pill-label">Stock temps réel</span>
            </div>
            <div class="f3-pill" id="f3-p4">
              <span class="f3-pill-ic">
                <svg viewBox="0 0 24 24">
                  <rect x="7" y="2" width="10" height="20" rx="2" />
                  <path d="M10 7.5h4M10 11h4M11 18h2" />
                </svg>
              </span>
              <span class="f3-pill-label">Carte digitale</span>
            </div>
            <div class="f3-pill" id="f3-p5">
              <span class="f3-pill-ic">
                <svg viewBox="0 0 24 24">
                  <path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z" />
                  <path d="M9.5 7.5h5M9.5 11.5h5" />
                </svg>
              </span>
              <span class="f3-pill-label">Commandes</span>
            </div>
            <div class="f3-pill" id="f3-p6">
              <span class="f3-pill-ic">
                <svg viewBox="0 0 24 24">
                  <circle cx="9" cy="8" r="3.5" />
                  <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
                  <circle cx="17.5" cy="9" r="2.5" />
                  <path d="M17.5 14.5c2.2 0 3.9 1.6 4.3 3.8" />
                </svg>
              </span>
              <span class="f3-pill-label">Planning d&rsquo;équipe</span>
            </div>
            <div class="f3-pill" id="f3-p7">
              <span class="f3-pill-ic">
                <svg viewBox="0 0 24 24">
                  <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z" />
                  <path d="M9 12l2 2 4-4" />
                </svg>
              </span>
              <span class="f3-pill-label">HACCP</span>
            </div>
          </div>

          <!-- Scene 4 (11.6–14.211s): blue accent line draws under the stack -->
          <svg class="f3-accent" viewBox="0 0 420 8" aria-hidden="true">
            <path id="f3-accent-path" d="M3 4H417" />
          </svg>
        </section>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Beat grid — paced to the VO cues (never front-loaded)
        const B = {
          panel: 0.0, // diagonal panel suffuses in
          logo: 0.05, // « Voici FoodEatUp » — hero readable well before 0.5s
          subline: 0.75, // « la plateforme tout-en-un »
          swap: 2.2, // logo docks top-left (scale-swap)
          sublineOut: 2.15, // subline hands off to the eyebrow
          team: 2.55, // « pensée pour les restaurateurs » — image slides in
          eyebrow: 3.05, // chrome label lands under the docked logo
          pills: [4.9, 5.7, 6.8, 8.1, 9.0, 9.9, 10.8], // one pill per VO cue
          line: 11.75, // « tout centralisé » — accent line draws
          pulseUp: 12.55, // « tout simplifié » — ONE subtle group pulse
          pulseDown: 12.77,
          // then hold to 14.211 — no exit (not the final frame)
        };

        // ── Background panel: quiet fade, no drama ──
        tl.fromTo(
          "#f3-panel",
          { opacity: 0 },
          { opacity: 1, duration: 0.9, ease: "power2.out" },
          B.panel,
        );

        // ── Scene 1 — logo spring-pop, centered ~40% width, smooth power3 settle ──
        tl.fromTo(
          "#f3-logo-pop",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          B.logo,
        );
        tl.fromTo(
          "#f3-subline",
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          B.subline,
        );

        // ── Scene 2 — scale-swap: wrapper glides + shrinks to top-left chrome ──
        // (move on the wrapper, origin 0 0 — the pop lives on the inner img only)
        tl.fromTo(
          "#f3-logo-move",
          { x: 0, y: 0, scale: 1 },
          { x: -480, y: -260, scale: 0.395, duration: 0.8, ease: "power3.inOut" },
          B.swap,
        );
        tl.to(
          "#f3-subline",
          { y: -18, opacity: 0, duration: 0.35, ease: "power2.in" },
          B.sublineOut,
        );
        tl.fromTo(
          "#f3-eyebrow",
          { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          B.eyebrow,
        );

        // Team trio slides in from the right and settles — 60/40 asymmetric
        tl.fromTo(
          "#f3-team",
          { x: 240, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.95, ease: "power3.out" },
          B.team,
        );

        // ── Scene 3 — pills spring-pop one by one, EXACTLY on their VO cues ──
        for (let i = 0; i < B.pills.length; i++) {
          tl.fromTo(
            "#f3-p" + (i + 1),
            { scale: 0, opacity: 0, y: 18 },
            { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            B.pills[i],
          );
        }

        // ── Scene 4 — accent line draws (dash = 424, set in CSS; pens don't bounce) ──
        tl.to(
          "#f3-accent-path",
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          B.line,
        );

        // ONE subtle ensemble pulse, then stillness (fromTo both legs = seek-safe)
        tl.fromTo(
          ".f3-pill",
          { scale: 1 },
          { scale: 1.025, duration: 0.22, ease: "power2.out" },
          B.pulseUp,
        );
        tl.fromTo(
          ".f3-pill",
          { scale: 1.025 },
          { scale: 1, duration: 0.45, ease: "power2.inOut" },
          B.pulseDown,
        );
        // Hold to 14.211s — no exit animation.

        window.__timelines["03-demo"] = tl;
      </script>
    </template>
  </body>
</html>
