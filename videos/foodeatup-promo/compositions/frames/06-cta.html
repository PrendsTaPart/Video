<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 06 — CTA final</title>
    <!-- head is metadata only; the runtime clones ONLY the <template> contents -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-600.woff2") format("woff2");
          font-weight: 600;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
          font-display: block;
        }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Poppins", "Inter", sans-serif;
        }

        /* ── Track 0: full-bleed background (own clip, never on #root) ── */
        .bg {
          position: absolute;
          inset: 0;
          background: #f7f9fc;
        }

        /* Concentric closing rings — background atmosphere, right column.
           Centered via left/top math only; GSAP owns scale/opacity. */
        .ring {
          position: absolute;
          border-radius: 50%;
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }
        #ring-1 {
          left: 1030px; /* center (1270, 440), d = 480 */
          top: 200px;
          width: 480px;
          height: 480px;
          border: 2px solid rgba(30, 155, 240, 0.14);
        }
        #ring-2 {
          left: 930px; /* d = 680 */
          top: 100px;
          width: 680px;
          height: 680px;
          border: 2px solid rgba(30, 155, 240, 0.1);
        }
        #ring-3 {
          left: 830px; /* d = 880 — bottom edge y = 880, above the keep-out */
          top: 0px;
          width: 880px;
          height: 880px;
          border: 2px solid rgba(30, 155, 240, 0.07);
        }

        /* Final blue bloom behind the lockup — scene 4 only, opacity ≤ 0.3 */
        .bloom {
          position: absolute;
          left: 720px; /* 1100 × 700 ellipse centered on (1270, 440) */
          top: 90px;
          width: 1100px;
          height: 700px;
          background: radial-gradient(
            ellipse 50% 50% at 50% 50%,
            rgba(30, 155, 240, 0.22) 0%,
            rgba(30, 155, 240, 0.08) 48%,
            rgba(30, 155, 240, 0) 74%
          );
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }

        /* ── Track 1: commerciale, foreground subject, left column ── */
        .subject {
          position: absolute;
          inset: 0;
        }
        .subject img {
          position: absolute;
          left: 90px;
          bottom: 180px; /* bottom edge at y = 900 — anchored above the keep-out */
          width: 567px;
          height: 850px;
          object-fit: contain;
          /* soft radial white fade so the white photo ground melts into #F7F9FC */
          -webkit-mask-image: radial-gradient(
            ellipse 72% 68% at 50% 52%,
            #000 58%,
            rgba(0, 0, 0, 0) 96%
          );
          mask-image: radial-gradient(
            ellipse 72% 68% at 50% 52%,
            #000 58%,
            rgba(0, 0, 0, 0) 96%
          );
          opacity: 0;
          will-change: transform, opacity;
        }

        /* ── Track 2: lockup — logo + tagline + CTA, focal, center-right ── */
        .lockup {
          position: absolute;
          left: 740px;
          top: 0;
          width: 1060px;
          height: 900px; /* the whole stack lives above the keep-out */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .logo {
          width: 600px;
          height: auto;
          object-fit: contain;
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }
        .tagline {
          margin-top: 40px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        }
        .tag-line {
          display: flex;
          gap: 16px;
          white-space: nowrap;
        }
        .word {
          display: inline-block;
          font-family: "Poppins", sans-serif;
          font-weight: 600;
          font-size: 54px;
          line-height: 1.25;
          letter-spacing: -0.02em;
          color: #1b2a41;
          opacity: 0;
          will-change: transform, opacity;
        }
        .cta-button {
          margin-top: 44px;
          padding: 24px 60px;
          background: #1e9bf0; /* the system's ONE solid element */
          color: #f7f9fc;
          border-radius: 100px;
          font-family: "Poppins", sans-serif;
          font-weight: 600;
          font-size: 32px;
          letter-spacing: 0.01em;
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="06-cta"
        data-width="1920"
        data-height="1080"
        data-duration="6.296"
      >
        <!-- Track 0 — background: cream ground + rings + final bloom -->
        <div id="bg" class="clip bg" data-start="0" data-duration="6.296" data-track-index="0">
          <div class="ring" id="ring-1"></div>
          <div class="ring" id="ring-2"></div>
          <div class="ring" id="ring-3"></div>
          <div class="bloom" id="bloom"></div>
        </div>

        <!-- Track 1 — commerciale enters left, anchored above the keep-out -->
        <div
          id="subject"
          class="clip subject"
          data-start="0"
          data-duration="6.296"
          data-track-index="1"
        >
          <img id="saleswoman" src="public/commerciale-chef.png" alt="" />
        </div>

        <!-- Track 2 — the lockup: logo mascot + tagline + CTA pill -->
        <div
          id="lockup"
          class="clip lockup"
          data-start="0"
          data-duration="6.296"
          data-track-index="2"
        >
          <img id="logo" class="logo" src="public/foodeatup-logo-mascot.png" alt="" />
          <div class="tagline">
            <div class="tag-line">
              <span class="word">Votre</span>
              <span class="word">restaurant,</span>
            </div>
            <div class="tag-line">
              <span class="word">enfin</span>
              <span class="word">piloté</span>
              <span class="word">simplement.</span>
            </div>
          </div>
          <div class="cta-button" id="cta">Découvrir FoodEatUp</div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.8s) — "Rejoignez les restaurateurs…"
        // The commerciale slides in from the left and settles (power3.out,
        // no overshoot). Readable well before t = 0.5s.
        tl.fromTo(
          "#saleswoman",
          { x: -260, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
          0.0
        );

        // Faint concentric rings suffuse in behind the (future) lockup —
        // one finite entrance each, then a dead-still hold.
        gsap.utils.toArray(".ring").forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, scale: 0.9 },
            { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" },
            0.25 + i * 0.12
          );
        });

        // ── Scene 2 (1.8–3.6s) — "FoodEatUp"
        // The mascot logo spring-pops center-right: scale 0 → 1 on a smooth
        // long-tail settle (spring-pop-entrance, calm variant — no bounce).
        tl.fromTo(
          "#logo",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          1.8
        );

        // ── Scene 3 (3.6–5.4s) — "votre restaurant, enfin piloté simplement."
        // Tagline reveals word by word (deterministic index stagger,
        // 5 × 0.07s ≤ 0.5s — one arriving beat).
        gsap.utils.toArray(".word").forEach((el, i) => {
          tl.fromTo(
            el,
            { y: 26, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
            3.6 + i * 0.07
          );
        });

        // The one solid element — the CTA pill spring-pops beneath.
        tl.fromTo(
          "#cta",
          { scale: 0, opacity: 0, y: 18 },
          { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          4.45
        );

        // ── Scene 4 (5.4–6.296s) — final hold, last frame of the video.
        // A restrained blue bloom (peak 0.26 ≤ 0.3) swells behind the lockup
        // and lands; everything else is already still. No exit.
        tl.fromTo(
          "#bloom",
          { opacity: 0, scale: 0.92 },
          { opacity: 0.26, scale: 1, duration: 0.75, ease: "power2.out" },
          5.35
        );

        // 6.1s → 6.296s: complete stillness — the settled closing frame.

        window.__timelines["06-cta"] = tl;
      </script>
    </template>
  </body>
</html>
