<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 1 — Le chaos du quotidien</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-600.woff2") format("woff2");
          font-weight: 600;
        }
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-800.woff2") format("woff2");
          font-weight: 800;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #1b2a41;
        }

        /* Track 0 — full-bleed background: off-white + dotted grid + faint center glow */
        .bg {
          position: absolute;
          inset: 0;
          background-color: #f7f9fc;
          background-image:
            radial-gradient(circle at 50% 43.5%, rgba(30, 155, 240, 0.06), transparent 55%),
            radial-gradient(circle, rgba(27, 42, 65, 0.09) 1.6px, transparent 1.6px);
          background-size: 100% 100%, 46px 46px;
        }

        /* Track 1 — chaos scene */
        .scene {
          position: absolute;
          inset: 0;
        }
        .shake {
          position: absolute;
          inset: 0;
        }

        /* Central clock */
        .clockWrap {
          position: absolute;
          left: 800px;
          top: 310px;
          width: 320px;
          height: 320px;
          z-index: 2;
          will-change: transform;
        }
        .hand {
          transform-box: view-box;
          transform-origin: 160px 160px;
        }

        /* Accumulating items */
        .item {
          position: absolute;
          z-index: 3;
          will-change: transform;
        }
        .item.back {
          z-index: 1;
          filter: blur(3px);
        }

        .pill {
          display: flex;
          align-items: center;
          gap: 12px;
          background: #ffffff;
          border: 1.5px solid rgba(30, 155, 240, 0.25);
          border-radius: 100px;
          padding: 14px 28px;
          font-weight: 500;
          font-size: 27px;
          white-space: nowrap;
          color: #1b2a41;
        }
        .pill .dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #1e9bf0;
          flex: none;
        }

        .postit {
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 185px;
          height: 185px;
          padding: 18px;
          box-sizing: border-box;
          background: #ffe9a3;
          border-bottom: 6px solid rgba(27, 42, 65, 0.1);
          border-radius: 4px;
          font-family: "Poppins", sans-serif;
          font-weight: 600;
          font-size: 30px;
          line-height: 1.25;
          color: #1b2a41;
        }
        .postit.small {
          width: 140px;
          height: 140px;
          font-size: 24px;
        }
        .postit.tiny {
          width: 120px;
          height: 120px;
          font-size: 21px;
        }

        .alert {
          display: flex;
          align-items: center;
          gap: 14px;
          background: #dc2626;
          border-radius: 100px;
          padding: 16px 34px;
          font-family: "Poppins", sans-serif;
          font-weight: 600;
          font-size: 28px;
          white-space: nowrap;
          color: #ffffff;
        }
        .alert .bang {
          display: grid;
          place-items: center;
          width: 34px;
          height: 34px;
          border-radius: 50%;
          background: #ffffff;
          color: #dc2626;
          font-weight: 800;
          font-size: 24px;
          flex: none;
        }

        /* Slam finale */
        .wash {
          position: absolute;
          inset: 0;
          z-index: 6;
          background: #f7f9fc;
        }
        .titleWrap {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 940px;
          z-index: 7;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 30px;
        }
        .slamTitle {
          font-family: "Poppins", sans-serif;
          font-weight: 800;
          font-size: 130px;
          letter-spacing: -0.02em;
          line-height: 1.08;
          color: #1b2a41;
          will-change: transform, filter, opacity;
        }
        .accentLine {
          display: block;
          width: 140px;
          height: 8px;
          border-radius: 4px;
          background: #1e9bf0;
          will-change: transform;
        }
      </style>

      <div id="root" data-composition-id="01-chaos" data-width="1920" data-height="1080" data-duration="10.58">
        <!-- Track 0: full-duration background -->
        <div class="clip bg" data-start="0" data-duration="10.58" data-track-index="0"></div>

        <!-- Track 1: chaos scene -->
        <div class="clip scene" data-start="0" data-duration="10.58" data-track-index="1">
          <div class="shake">
            <!-- Central clock (hero, fixed center) -->
            <div class="clockWrap">
              <svg viewBox="0 0 320 320" width="320" height="320" aria-hidden="true">
                <circle cx="160" cy="160" r="150" fill="#ffffff" stroke="rgba(30,155,240,0.25)" stroke-width="3" />
                <g class="ticks"></g>
                <rect class="hand hand-hr" x="153" y="92" width="14" height="78" rx="7" fill="#1b2a41" style="transform: rotate(305deg)" />
                <rect class="hand hand-min" x="155.5" y="54" width="9" height="116" rx="4.5" fill="#1b2a41" style="transform: rotate(65deg)" />
                <rect class="hand hand-sec" x="158" y="42" width="4" height="128" rx="2" fill="#1e9bf0" style="transform: rotate(120deg)" />
                <circle cx="160" cy="160" r="10" fill="#1e9bf0" />
              </svg>
            </div>

            <!-- Accumulating items — deterministic crown positions, DOM order = reveal order -->
            <!-- Wave 1 · "les réservations" (~1.0s) -->
            <div class="item pill" data-t="1.0" data-rot="-2" data-cx="500" data-cy="224" style="left: 360px; top: 196px"><span class="dot"></span>Réservation +3</div>

            <!-- Wave 2 · "les stocks" (~3.2s) -->
            <div class="item pill" data-t="3.2" data-rot="2" data-cx="1490" data-cy="236" style="left: 1330px; top: 208px"><span class="dot"></span>Stock : seuil atteint</div>
            <div class="item pill back" data-t="3.3" data-rot="3" data-cx="760" data-cy="112" style="left: 640px; top: 84px"><span class="dot"></span>Réservation +3</div>
            <div class="item pill" data-t="3.45" data-rot="-1" data-cx="440" data-cy="480" style="left: 296px; top: 452px"><span class="dot"></span>Nouvelle réservation</div>
            <div class="item pill back" data-t="3.55" data-rot="-3" data-cx="1400" data-cy="664" style="left: 1266px; top: 636px"><span class="dot"></span>Stock : seuil atteint</div>

            <!-- Wave 3 · "les plannings" (~4.6s) -->
            <div class="item postit" data-t="4.6" data-rot="-7" data-cx="428" data-cy="708" style="left: 336px; top: 616px"><span>Planning&nbsp;??</span></div>
            <div class="item postit" data-t="4.75" data-rot="5" data-cx="1544" data-cy="604" style="left: 1452px; top: 512px"><span>Service du soir&nbsp;?</span></div>
            <div class="item postit small back" data-t="4.85" data-rot="9" data-cx="866" data-cy="786" style="left: 796px; top: 716px"><span>Planning&nbsp;??</span></div>
            <div class="item pill" data-t="4.95" data-rot="1" data-cx="1290" data-cy="116" style="left: 1146px; top: 88px"><span class="dot"></span>Qui ferme jeudi&nbsp;?</div>

            <!-- Wave 4 · "les contrôles HACCP" (~6.0s) -->
            <div class="item alert" data-t="6.0" data-rot="0" data-cx="956" data-cy="134" style="left: 756px; top: 106px"><span class="bang">!</span>HACCP à valider&nbsp;!</div>
            <div class="item pill back" data-t="6.1" data-rot="-2" data-cx="580" data-cy="354" style="left: 486px; top: 326px"><span class="dot"></span>Traçabilité&nbsp;?</div>
            <div class="item pill" data-t="6.18" data-rot="2" data-cx="1610" data-cy="424" style="left: 1466px; top: 396px"><span class="dot"></span>Relevé T° manquant</div>
            <div class="item postit tiny back" data-t="6.28" data-rot="-9" data-cx="1196" data-cy="786" style="left: 1136px; top: 726px"><span>Planning&nbsp;??</span></div>
          </div>

          <!-- Scene 4: freeze wash + slam title -->
          <div class="wash"></div>
          <div class="titleWrap">
            <div class="slamTitle">Un sport de combat.</div>
            <div class="accentLine"></div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          // Scope every query to THIS composition's root (ids/classes repeat across sibling frames)
          var root = document.querySelector('[data-composition-id="01-chaos"][id="root"]');
          if (!root) root = document.querySelector('[data-composition-id="01-chaos"]');

          // Build the 12 clock ticks synchronously (deterministic, index-derived)
          var ticks = root.querySelector(".ticks");
          var SVGNS = "http://www.w3.org/2000/svg";
          for (var k = 0; k < 12; k++) {
            var a = (k / 12) * Math.PI * 2;
            var major = k % 3 === 0;
            var r1 = major ? 126 : 134;
            var r2 = 142;
            var line = document.createElementNS(SVGNS, "line");
            line.setAttribute("x1", (160 + Math.sin(a) * r1).toFixed(2));
            line.setAttribute("y1", (160 - Math.cos(a) * r1).toFixed(2));
            line.setAttribute("x2", (160 + Math.sin(a) * r2).toFixed(2));
            line.setAttribute("y2", (160 - Math.cos(a) * r2).toFixed(2));
            line.setAttribute("stroke", major ? "rgba(27,42,65,0.5)" : "rgba(27,42,65,0.22)");
            line.setAttribute("stroke-width", major ? "5" : "3");
            line.setAttribute("stroke-linecap", "round");
            ticks.appendChild(line);
          }

          var tl = gsap.timeline({ paused: true });

          var clockWrap = root.querySelector(".clockWrap");
          var shakeEl = root.querySelector(".shake");
          var wash = root.querySelector(".wash");
          var title = root.querySelector(".slamTitle");
          var accentLine = root.querySelector(".accentLine");
          var hHr = root.querySelector(".hand-hr");
          var hMin = root.querySelector(".hand-min");
          var hSec = root.querySelector(".hand-sec");
          var items = Array.prototype.slice.call(root.querySelectorAll(".item"));

          /* Scene 1 (0–1.2s) — the clock settles into center (hero visible well before 0.5s) */
          tl.fromTo(
            clockWrap,
            { opacity: 0, scale: 0.82, y: -46 },
            { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
            0
          );

          /* Clock hands — driven proxy, accelerating rotation, frozen at the 9.0s slam */
          var clk = { p: 0 };
          tl.to(
            clk,
            {
              p: 1,
              duration: 9.0,
              ease: "none",
              onUpdate: function () {
                var p = clk.p;
                var minDeg = 65 + 360 * (0.4 * p + 7.4 * p * p * p);
                var hrDeg = 305 + (minDeg - 65) / 11;
                var secDeg = 120 + 360 * (1.5 * p + 16 * p * p * p);
                hMin.style.transform = "rotate(" + minDeg + "deg)";
                hHr.style.transform = "rotate(" + hrDeg + "deg)";
                hSec.style.transform = "rotate(" + secDeg + "deg)";
              },
            },
            0
          );

          /* Scenes 1–2 — spring-pop entrances (smooth power3.out settle), one wave per VO cue */
          items.forEach(function (el) {
            var t = parseFloat(el.getAttribute("data-t"));
            var rot = parseFloat(el.getAttribute("data-rot")) || 0;
            var back = el.classList.contains("back");
            tl.fromTo(
              el,
              { scale: 0, opacity: 0, y: 26, rotation: rot },
              { scale: 1, opacity: back ? 0.2 : 1, y: 0, rotation: rot, duration: 0.55, ease: "power3.out" },
              t
            );
          });

          /* Scene 3 (6.4–9.0s) — signature move: everything closes in on the clock */
          var CX = 960;
          var CY = 470;
          items.forEach(function (el, i) {
            var cx = parseFloat(el.getAttribute("data-cx"));
            var cy = parseFloat(el.getAttribute("data-cy"));
            var back = el.classList.contains("back");
            var pull = back ? 0.3 : 0.44;
            tl.to(
              el,
              {
                x: (CX - cx) * pull,
                y: (CY - cy) * pull,
                scale: back ? 1 : 1.05,
                duration: 1.5,
                ease: "power2.inOut",
              },
              6.45 + i * 0.06
            );
          });
          /* The clock, cornered, shrinks slightly under pressure */
          tl.to(clockWrap, { scale: 0.94, duration: 1.7, ease: "power2.inOut" }, 6.5);

          /* Micro-shake (6.6–9.0s) — bounded driven proxy, sin(0)=0, envelope settles to 0 at freeze */
          var shk = { t: 0 };
          tl.to(
            shk,
            {
              t: 1,
              duration: 2.4,
              ease: "none",
              onUpdate: function () {
                var tt = shk.t;
                var env = Math.max(0, Math.min(1, tt / 0.18, (1 - tt) / 0.12));
                var ph = tt * 2.4 * Math.PI * 2;
                var x = Math.sin(ph * 3.7) * 2.6 * env;
                var y = Math.sin(ph * 2.9 + 1.3) * 2.0 * env;
                shakeEl.style.transform = "translate(" + x + "px," + y + "px)";
              },
            },
            6.6
          );

          /* Scene 4 (9.0s) — the chaos freezes under a wash, the title slams on "sport de combat" */
          tl.fromTo(wash, { opacity: 0 }, { opacity: 0.55, duration: 0.35, ease: "power2.out" }, 8.95);
          tl.fromTo(
            title,
            { scale: 1.75, opacity: 0, filter: "blur(16px)" },
            { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" },
            9.0
          );
          /* Impact judder on the frozen chaos behind the slam (decays to exactly 0) */
          var burst = { t: 0 };
          tl.to(
            burst,
            {
              t: 1,
              duration: 0.3,
              ease: "none",
              onUpdate: function () {
                var tt = burst.t;
                var env = 1 - tt;
                var x = Math.sin(tt * Math.PI * 8) * 7 * env;
                var y = Math.sin(tt * Math.PI * 6) * 5 * env;
                shakeEl.style.transform = "translate(" + x + "px," + y + "px)";
              },
            },
            9.05
          );
          tl.fromTo(
            accentLine,
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.4, ease: "expo.out" },
            9.35
          );
          /* Tense hold to the cut — no exit animation (harness transition is the exit) */

          window.__timelines["01-chaos"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
