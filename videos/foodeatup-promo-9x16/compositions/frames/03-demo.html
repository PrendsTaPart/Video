<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 3 — Démo produit (portrait)</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: "Poppins", "Inter", sans-serif; isolation: isolate; }
        .bg { position: absolute; inset: 0; background: #f7f9fc; }
        .glow { position: absolute; left: 90px; top: 520px; width: 900px; height: 1000px; background: radial-gradient(ellipse 50% 45% at 50% 40%, rgba(30,155,240,0.12) 0%, rgba(30,155,240,0.04) 50%, rgba(30,155,240,0) 76%); opacity: 0; pointer-events: none; will-change: opacity; }

        .head { position: absolute; left: 0; right: 0; top: 96px; z-index: 3; display: flex; flex-direction: column; align-items: center; }
        .logo { width: 300px; height: auto; object-fit: contain; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
        .subline { margin-top: 20px; font-family: "Inter", sans-serif; font-weight: 500; font-size: 34px; letter-spacing: 0.01em; color: #566472; text-align: center; opacity: 0; will-change: transform, opacity; padding: 0 90px; }

        .pills { position: absolute; left: 100px; top: 528px; width: 880px; z-index: 2; display: flex; flex-direction: column; gap: 18px; }
        .pill { position: relative; box-sizing: border-box; height: 124px; background: #ffffff; border: 1.5px solid rgba(30,155,240,0.2); border-radius: 18px; padding: 0 34px 0 40px; display: flex; align-items: center; gap: 26px; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
        .pill::before { content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 7px; border-radius: 4px; background: #1e9bf0; }
        .pill-ic { flex: none; width: 66px; height: 66px; display: grid; place-items: center; background: rgba(30,155,240,0.08); border-radius: 16px; }
        .pill-ic svg { width: 38px; height: 38px; fill: none; stroke: #1e9bf0; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
        .pill-label { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 42px; letter-spacing: -0.01em; color: #1b2a41; }
        .pill-check { margin-left: auto; flex: none; width: 44px; height: 44px; border-radius: 50%; background: #059669; display: grid; place-items: center; opacity: 0; transform-origin: 50% 50%; will-change: transform, opacity; }
        .pill-check svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      </style>

      <div id="root" data-composition-id="03-demo" data-width="1080" data-height="1920" data-duration="14.711">
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="14.211" data-track-index="0"><div class="glow" id="glow"></div></div>
        <div id="scene" class="clip" data-start="0" data-duration="14.211" data-track-index="1" style="position:absolute; inset:0;">
          <div class="head">
            <img id="logo" class="logo" src="public/foodeatup-logo-mascot.png" alt="FoodEatUp" />
            <p class="subline" id="subline">la plateforme tout-en-un pensée pour les restaurateurs</p>
          </div>
          <div class="pills">
            <div class="pill" id="p1"><span class="pill-ic"><svg viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M3 9h18" /><rect x="3" y="5" width="18" height="16" rx="2" /></svg></span><span class="pill-label">Réservations</span><span class="pill-check"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" /></svg></span></div>
            <div class="pill" id="p2"><span class="pill-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18M9 21V9M15 9v12" /></svg></span><span class="pill-label">Plan de salle</span><span class="pill-check"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" /></svg></span></div>
            <div class="pill" id="p3"><span class="pill-ic"><svg viewBox="0 0 24 24"><path d="M21 8V7l-9-4-9 4v10l9 4 9-4v-1" /><path d="M3 7l9 4 9-4M12 11v10" /></svg></span><span class="pill-label">Stock en temps réel</span><span class="pill-check"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" /></svg></span></div>
            <div class="pill" id="p4"><span class="pill-ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" /><path d="M8 8h8M8 12h8M8 16h5" /></svg></span><span class="pill-label">Carte digitale</span><span class="pill-check"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" /></svg></span></div>
            <div class="pill" id="p5"><span class="pill-ic"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><path d="M3 6h18M16 10a4 4 0 0 1-8 0" /></svg></span><span class="pill-label">Commandes</span><span class="pill-check"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" /></svg></span></div>
            <div class="pill" id="p6"><span class="pill-ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2" /><path d="M8 2v4M16 2v4M3 10h18M7 15h4M13 15h4" /></svg></span><span class="pill-label">Planning d'équipe</span><span class="pill-check"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" /></svg></span></div>
            <div class="pill" id="p7"><span class="pill-ic"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4" /><path d="M12 3l7 4v5c0 4.4-3 8-7 9-4-1-7-4.6-7-9V7z" /></svg></span><span class="pill-label">Conformité HACCP</span><span class="pill-check"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" /></svg></span></div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#logo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.1);
        tl.fromTo("#subline", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.5);
        var cues = [4.0, 4.9, 5.8, 7.0, 8.3, 9.0, 10.5];
        ["#p1", "#p2", "#p3", "#p4", "#p5", "#p6", "#p7"].forEach(function (id, i) {
          tl.fromTo(id, { y: 28, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.44, ease: "power3.out" }, cues[i]);
        });
        // final beat: all checks pop + glow on "tout centralisé, tout simplifié"
        tl.fromTo("#glow", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 12.0);
        tl.fromTo(".pill-check", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.05 }, 12.1);
        window.__timelines["03-demo"] = tl;
      </script>
    </template>
