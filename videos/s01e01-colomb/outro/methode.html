<meta charset="utf-8">
<title>S01E01 — bloc méthode + orchestration</title>
<style>
  :root{
    --fond:#F2F4F7; --bleu:#03A9F5; --violet:#7E57C2; --texte:#383838; --blanc:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--fond)}
  body{font-family:"Liberation Sans",Arial,Helvetica,sans-serif;color:var(--texte);-webkit-font-smoothing:antialiased}
  #scene{position:absolute;inset:0;overflow:hidden}

  /* ---- les diagonales de fond, du haut-droit vers le bas-gauche ---- */
  #diagonales{position:absolute;inset:-40%;transform:rotate(-38deg);transform-origin:center}
  .diag{position:absolute;left:-20%;width:140%;border-radius:999px}

  /* ---- les logos qui se calent en haut ---- */
  #bandeau{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;
    justify-content:center;gap:64px}
  .pastille{display:flex;align-items:center;justify-content:center;background:var(--blanc);
    border-radius:26px;box-shadow:0 10px 26px rgba(20,32,48,.12)}
  #bandeau .pastille img{display:block;object-fit:contain}

  /* ---- les cartes d'étape ---- */
  #cartes{position:absolute;left:0;right:0;top:0;bottom:0}
  .carte{position:absolute;left:90px;width:900px;background:var(--blanc);border-radius:24px;
    box-shadow:0 18px 44px rgba(20,32,48,.13), 0 3px 10px rgba(20,32,48,.06);
    display:flex;align-items:center;gap:44px;padding:56px 60px}
  .chiffre{flex:0 0 auto;font-size:132px;font-weight:700;color:var(--bleu);line-height:1;
    min-width:120px;text-align:center}
  .corps{flex:1 1 auto;min-width:0}
  .titre{font-size:47px;font-weight:700;line-height:1.18;color:var(--texte)}
  .mono{margin-top:18px;font-family:"Liberation Mono","DejaVu Sans Mono",monospace;
    font-size:30px;font-weight:400;color:var(--violet);white-space:nowrap}

  /* ---- l'orchestration ---- */
  #orchestre{position:absolute;inset:0}
  #traits{position:absolute;inset:0}
  .satellite{position:absolute;display:flex;align-items:center;justify-content:center}
  .satellite .pastille{width:100%;height:100%}
  .satellite img{display:block;object-fit:contain;max-width:112px;max-height:88px}
  #centre{position:absolute;display:flex;align-items:center;justify-content:center;z-index:2}
  #centre .pastille{width:100%;height:100%;border-radius:34px;
    box-shadow:0 18px 44px rgba(20,32,48,.16)}
  #centre img{display:block;object-fit:contain;width:216px}
  .reseau{position:absolute;display:flex;align-items:center;justify-content:center;
    border-radius:26px;background:var(--blanc);box-shadow:0 10px 26px rgba(20,32,48,.12)}
  .reseau svg{display:block}

  #voile{position:absolute;inset:0;background:var(--fond);opacity:0;pointer-events:none}
</style>

<div id="scene">
  <div id="diagonales"></div>
  <div id="cartes"></div>
  <div id="orchestre">
    <svg id="traits" viewBox="0 0 1080 1920" preserveAspectRatio="none"></svg>
    <div id="centre"><div class="pastille"><img id="centre-img"></div></div>
  </div>
  <div id="bandeau"></div>
  <div id="voile"></div>
</div>

<script>
const DATA = __DATA__;
const FPS = DATA.fps, DUREE = DATA.frames;
const T0 = DATA.debut_s;                       // 30 s : l'origine du bloc
const px = (v) => v.toFixed(2) + "px";
const t = (f) => T0 + f / FPS;                 // l'instant absolu de l'image f

/* ---------- petites courbes ---------- */
const lin = (x, a, b) => Math.max(0, Math.min(1, (x - a) / (b - a)));
const expoOut = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const backOut = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);

/* ---------- le fond : de grandes diagonales, animées très lentement ---------- */
const DIAGS = [
  { haut: 6,  ep: 210, c: "var(--bleu)",   a: 0.13, v: 26 },
  { haut: 30, ep: 96,  c: "var(--violet)", a: 0.15, v: -18 },
  { haut: 47, ep: 340, c: "var(--bleu)",   a: 0.07, v: 14 },
  { haut: 74, ep: 130, c: "var(--violet)", a: 0.09, v: -22 },
  { haut: 88, ep: 74,  c: "var(--bleu)",   a: 0.16, v: 30 },
];
const diagEls = DIAGS.map((d) => {
  const el = document.createElement("div");
  el.className = "diag";
  el.style.cssText = `top:${d.haut}%;height:${d.ep}px;background:${d.c};opacity:${d.a}`;
  document.getElementById("diagonales").appendChild(el);
  return el;
});

/* ---------- le bandeau : RapidoCMS et ElevenLabs arrivent, puis se rangent en haut ---------- */
const bandeau = document.getElementById("bandeau");
const BANDEAU = ["rapidocms", "elevenlabs"].map((nom) => {
  const pastille = document.createElement("div");
  pastille.className = "pastille";
  const img = document.createElement("img");
  img.src = DATA.logos[nom];
  pastille.appendChild(img);
  bandeau.appendChild(pastille);
  return { pastille, img };
});

/* ---------- les cinq cartes ---------- */
const cartesRoot = document.getElementById("cartes");
const CARTES = DATA.etapes.map((e, i) => {
  const el = document.createElement("div");
  el.className = "carte";
  const corps = `<div class="corps"><div class="titre">${e.titre}</div>` +
    (e.mono ? `<div class="mono">${e.mono}</div>` : "") + `</div>`;
  el.innerHTML = `<div class="chiffre">${e.n}</div>${corps}`;
  cartesRoot.appendChild(el);
  return el;
});
/* Une seule carte à l'écran à la fois : elles ne se chevauchent jamais, et chacune est
   centrée verticalement dans la place laissée par le bandeau. */
CARTES.forEach((el) => { el.style.top = px(960 - el.offsetHeight / 2); });

/* ---------- l'orchestration ---------- */
const CX = 540, CY = 900, RAYON = 330;
const centre = document.getElementById("centre");
document.getElementById("centre-img").src = DATA.logos[DATA.orchestration.centre];
const traits = document.getElementById("traits");
const SATS = DATA.orchestration.orbite.map((nom, i, arr) => {
  const angle = -Math.PI / 2 + (i * 2 * Math.PI) / arr.length;
  const x = CX + RAYON * Math.cos(angle), y = CY + RAYON * Math.sin(angle);
  const el = document.createElement("div");
  el.className = "satellite";
  el.style.cssText = `left:${px(x - 78)};top:${px(y - 78)};width:156px;height:156px`;
  const pastille = document.createElement("div");
  pastille.className = "pastille";
  const img = document.createElement("img");
  img.src = DATA.logos[nom];
  pastille.appendChild(img);
  el.appendChild(pastille);
  document.getElementById("orchestre").appendChild(el);

  const trait = document.createElementNS("http://www.w3.org/2000/svg", "line");
  trait.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue("--bleu").trim());
  trait.setAttribute("stroke-width", "7");
  trait.setAttribute("stroke-linecap", "round");
  trait.setAttribute("x1", CX); trait.setAttribute("y1", CY);
  trait.setAttribute("x2", x);  trait.setAttribute("y2", y);
  const long = Math.hypot(x - CX, y - CY);
  trait.setAttribute("stroke-dasharray", long);
  trait.setAttribute("stroke-dashoffset", long);
  traits.appendChild(trait);
  return { el, trait, long, nom };
});

/* ---------- la ligne des réseaux ---------- */
const RES = DATA.orchestration.reseaux.map((nom, i, arr) => {
  const pas = 186, largeur = 150;
  const x = CX - ((arr.length - 1) * pas) / 2 + i * pas;
  const el = document.createElement("div");
  el.className = "reseau";
  el.style.cssText = `left:${px(x - largeur / 2)};top:${px(CY + 470)};width:${largeur}px;height:${largeur}px`;
  el.innerHTML = DATA.reseaux_svg[nom];
  const svg = el.querySelector("svg");
  svg.setAttribute("width", "88"); svg.setAttribute("height", "88");
  svg.setAttribute("fill", DATA.couleurs_reseaux[nom]);
  document.getElementById("orchestre").appendChild(el);
  return el;
});

/* ================================ l'animation ================================ */
const O = DATA.orchestration;
function seek(f) {
  const T = t(f);

  /* fond : les diagonales glissent, très lentement */
  diagEls.forEach((el, i) => { el.style.transform = `translateX(${px(DIAGS[i].v * (T - T0))})`; });

  /* 30,0 → 31,6 : les deux logos arrivent côte à côte, puis se réduisent et montent
     se caler en haut du cadre, où ils restent jusqu'à la fin. */
  const arrivee = expoOut(lin(T, 30.0, 30.9));
  const rangement = expoOut(lin(T, 31.0, 31.6));
  const hauteur = 168 - 78 * rangement;                  // 168 px au centre → 90 px en haut
  const y = 860 * (1 - rangement) + 64;                  // du centre vers le haut
  bandeau.style.top = px(y);
  bandeau.style.gap = px(64 - 20 * rangement);
  bandeau.style.opacity = String(arrivee);
  bandeau.style.transform = `translateY(${px(12 * (1 - arrivee))})`;
  BANDEAU.forEach(({ pastille, img }) => {
    img.style.height = px(hauteur);
    img.style.maxWidth = px(520 - 200 * rangement);
    pastille.style.padding = px(26 - 10 * rangement);
    pastille.style.borderRadius = px(26 - 8 * rangement);
  });

  /* 31,6 → 40,0 : les cinq cartes, une par créneau de voix off.
     Entrée : glissement de 24 px depuis la droite + fondu sur 180 ms.
     Sortie : fondu sur 120 ms. */
  CARTES.forEach((el, i) => {
    const c = DATA.creneaux[i];
    const dedans = expoOut(lin(T, c.debut_s, c.debut_s + 0.18));
    const dehors = lin(T, c.fin_s - 0.12, c.fin_s);
    const o = dedans * (1 - dehors);
    el.style.opacity = String(o);
    el.style.transform = `translateX(${px(24 * (1 - dedans))})`;
    el.style.visibility = o > 0.001 ? "visible" : "hidden";
  });

  /* 40,0 → 45,0 : l'orchestration */
  const orch = document.getElementById("orchestre");
  orch.style.opacity = String(lin(T, 40.0, 40.25));

  /* le logo central vient au centre et grossit jusqu'à 20 % du cadre (216 px de large) */
  const venue = expoOut(lin(T, 40.0, 40.7));
  const grossit = 0.86 + 0.14 * expoOut(lin(T, 40.7, 41.6));
  const largeurCentre = 296 * grossit;       // 216 px de logo + l'air de la pastille
  const hauteurCentre = 150 * grossit;
  centre.style.left = px(CX - largeurCentre / 2);
  centre.style.top = px(CY - hauteurCentre / 2);
  centre.style.width = px(largeurCentre);
  centre.style.height = px(hauteurCentre);
  centre.style.opacity = String(venue);
  centre.style.transform = `scale(${(0.7 + 0.3 * backOut(Math.max(venue, 0.001))).toFixed(4)})`;
  document.getElementById("centre-img").style.width = px(216 * grossit);

  /* les satellites, un par un, chacun relié au centre par un trait qui se trace */
  SATS.forEach((s, i) => {
    const t0 = 40.9 + i * O.orbite_ecart_s;
    const apparait = expoOut(lin(T, t0, t0 + 0.32));
    s.el.style.opacity = String(apparait);
    s.el.style.transform = `scale(${(0.72 + 0.28 * backOut(Math.max(apparait, 0.001))).toFixed(4)})`;
    const trace = expoOut(lin(T, t0 + 0.1, t0 + 0.1 + O.trait_duree_s));
    s.trait.setAttribute("stroke-dashoffset", String(s.long * (1 - trace)));
    s.trait.setAttribute("opacity", String(0.85 * trace));
  });

  /* 43,0 : les cinq réseaux en cascade de la gauche vers la droite */
  RES.forEach((el, i) => {
    const t0 = O.reseaux_debut_s + i * O.reseaux_ecart_s;
    const a = expoOut(lin(T, t0, t0 + 0.3));
    el.style.opacity = String(a);
    el.style.transform = `translateY(${px(8 * (1 - a))})`;
  });

  /* fin : le lockup immobile 0,8 s, puis fondu au blanc du fond sur 0,3 s */
  const finBloc = DATA.fin_s;
  document.getElementById("voile").style.opacity =
    String(lin(T, finBloc - O.fondu_blanc_s, finBloc));
}
window.seek = seek;
seek(0);
</script>
