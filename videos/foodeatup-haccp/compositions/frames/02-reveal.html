<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 2 — Le reveal du module</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-600.woff2") format("woff2");
          font-weight: 600;
        }
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-700.woff2") format("woff2");
          font-weight: 700;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
        }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Poppins", "Inter", sans-serif;
        }

        .bg {
          position: absolute;
          inset: 0;
          background: #f7f9fc;
        }
        .halo {
          position: absolute;
          left: 560px;
          top: 190px;
          width: 800px;
          height: 560px;
          background: radial-gradient(
            ellipse 50% 50% at 50% 50%,
            rgba(30, 155, 240, 0.16) 0%,
            rgba(30, 155, 240, 0.05) 46%,
            rgba(30, 155, 240, 0) 72%
          );
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }

        .stack {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 900px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0;
        }
        .logo {
          width: 560px;
          height: auto;
          object-fit: contain;
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }
        .subline {
          margin-top: 18px;
          font-family: "Inter", sans-serif;
          font-weight: 500;
          font-size: 38px;
          letter-spacing: 0.01em;
          color: #566472;
          opacity: 0;
          will-change: transform, opacity;
        }
        .badge {
          margin-top: 40px;
          padding: 18px 46px;
          background: #1b2a41;
          border-radius: 100px;
          font-family: "Poppins", sans-serif;
          font-weight: 700;
          font-size: 42px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #ffffff;
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }
        .attrs {
          margin-top: 44px;
          display: flex;
          gap: 44px;
        }
        .attr {
          display: flex;
          align-items: center;
          gap: 14px;
          font-family: "Poppins", sans-serif;
          font-weight: 600;
          font-size: 32px;
          color: #1b2a41;
          opacity: 0;
          will-change: transform, opacity;
        }
        .attr .dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #1e9bf0;
          flex: none;
        }
      </style>

      <div
        id="root"
        data-composition-id="02-reveal"
        data-width="1920"
        data-height="1080"
        data-duration="6.9"
      >
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="6.4" data-track-index="0">
          <div class="halo" id="halo"></div>
        </div>

        <div id="stack" class="clip stack" data-start="0" data-duration="6.4" data-track-index="1">
          <img id="logo" class="logo" src="public/foodeatup-logo-mascot.png" alt="FoodEatUp" />
          <p class="subline" id="subline">votre démarche HACCP, réunie</p>
          <div class="badge" id="badge">Module HACCP</div>
          <div class="attrs">
            <div class="attr" id="attr-1"><span class="dot"></span>Digital</div>
            <div class="attr" id="attr-2"><span class="dot"></span>Guidé</div>
            <div class="attr" id="attr-3"><span class="dot"></span>Toujours à jour</div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 — soft halo breathes in
        tl.fromTo("#halo", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 0.1);

        // Scene 2 — logo spring-pop (calm, no bounce)
        tl.fromTo("#logo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.35);
        tl.fromTo("#subline", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.0);

        // Scene 3 — MODULE HACCP badge locks in on « un seul module »
        tl.fromTo("#badge", { scale: 0.8, opacity: 0, y: 16 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.3);

        // Scene 4 — three attributes stagger in on their cues
        [["#attr-1", 4.1], ["#attr-2", 4.6], ["#attr-3", 5.1]].forEach(function (p) {
          tl.fromTo(p[0], { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, p[1]);
        });
        // Hold to 6.4s — no exit.

        window.__timelines["02-reveal"] = tl;
      </script>
    </template>
  </body>
</html>
