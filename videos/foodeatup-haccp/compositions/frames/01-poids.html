<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 1 — Le poids de la conformité</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-600.woff2") format("woff2");
          font-weight: 600;
        }
        @font-face {
          font-family: "Poppins";
          src: url("assets/fonts/Poppins-800.woff2") format("woff2");
          font-weight: 800;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #1b2a41;
          isolation: isolate;
        }

        /* Track 0 — off-white + dotted grid + faint center glow */
        .bg {
          position: absolute;
          inset: 0;
          background-color: #f7f9fc;
          background-image:
            radial-gradient(circle at 46% 44%, rgba(30, 155, 240, 0.05), transparent 55%),
            radial-gradient(circle, rgba(27, 42, 65, 0.09) 1.6px, transparent 1.6px);
          background-size: 100% 100%, 46px 46px;
        }

        .scene {
          position: absolute;
          inset: 0;
        }
        .shake {
          position: absolute;
          inset: 0;
        }

        /* Chef buried in paperwork — foreground subject, right side */
        .figure {
          position: absolute;
          z-index: 2;
          top: 96px;
          left: 1216px;
          width: 560px;
          height: 800px;
          mix-blend-mode: multiply;
          opacity: 0;
          will-change: transform, opacity;
        }
        .figure img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
        }

        /* Compliance paper cards accumulating on the left */
        .fiche {
          position: absolute;
          z-index: 3;
          width: 340px;
          box-sizing: border-box;
          background: #ffffff;
          border: 1.5px solid rgba(27, 42, 65, 0.1);
          border-radius: 10px;
          padding: 22px 26px;
          display: flex;
          align-items: center;
          gap: 18px;
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }
        .fiche::before {
          content: "";
          position: absolute;
          left: 0;
          top: 14px;
          bottom: 14px;
          width: 6px;
          border-radius: 3px;
          background: #1e9bf0;
        }
        .fiche.back {
          z-index: 1;
          filter: blur(2.5px);
        }
        .fiche-ic {
          flex: 0 0 46px;
          width: 46px;
          height: 46px;
          display: grid;
          place-items: center;
          background: rgba(30, 155, 240, 0.08);
          border-radius: 50%;
        }
        .fiche-ic svg {
          width: 26px;
          height: 26px;
          fill: none;
          stroke: #1e9bf0;
          stroke-width: 1.8;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .fiche-label {
          font-family: "Poppins", sans-serif;
          font-weight: 600;
          font-size: 28px;
          letter-spacing: -0.01em;
          color: #1b2a41;
          line-height: 1.15;
        }
        .fiche-sub {
          display: block;
          font-family: "Inter", sans-serif;
          font-weight: 500;
          font-size: 18px;
          color: #566472;
          margin-top: 2px;
        }

        /* "OBLIGATOIRE" stamp accent */
        .stamp {
          position: absolute;
          z-index: 5;
          left: 250px;
          top: 470px;
          padding: 14px 34px;
          border: 4px solid #1b2a41;
          border-radius: 12px;
          font-family: "Poppins", sans-serif;
          font-weight: 800;
          font-size: 40px;
          letter-spacing: 0.06em;
          color: #1b2a41;
          transform: rotate(-8deg);
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="01-poids"
        data-width="1920"
        data-height="1080"
        data-duration="13.117"
      >
        <!-- Track 0: full-duration background -->
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="12.617" data-track-index="0"></div>

        <!-- Track 1: scene -->
        <div id="scene" class="clip scene" data-start="0" data-duration="12.617" data-track-index="1">
          <div class="shake">
            <!-- Chef buried in paperwork -->
            <div class="figure" id="figure">
              <img src="public/haccp-paperwork.png" alt="Chef débordé par la paperasse HACCP" />
            </div>

            <!-- Five compliance fiches, DOM order = reveal order -->
            <div class="fiche" id="f1" data-cx="330" data-cy="230" style="left: 160px; top: 168px; transform: rotate(-3deg)">
              <span class="fiche-ic">
                <svg viewBox="0 0 24 24"><path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z" /><path d="M12 8v6" /></svg>
              </span>
              <span class="fiche-label">Relevés de T°<span class="fiche-sub">chambres froides</span></span>
            </div>

            <div class="fiche back" id="f2" data-cx="250" data-cy="470" style="left: 92px; top: 408px; transform: rotate(4deg)">
              <span class="fiche-ic">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><path d="M3.3 7 12 12l8.7-5M12 22V12" /></svg>
              </span>
              <span class="fiche-label">Réception<span class="fiche-sub">contrôle livraisons</span></span>
            </div>

            <div class="fiche" id="f3" data-cx="470" data-cy="640" style="left: 300px; top: 578px; transform: rotate(-2deg)">
              <span class="fiche-ic">
                <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5" /><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5" /></svg>
              </span>
              <span class="fiche-label">Traçabilité<span class="fiche-sub">chaque produit</span></span>
            </div>

            <div class="fiche back" id="f4" data-cx="720" data-cy="250" style="left: 560px; top: 196px; transform: rotate(5deg)">
              <span class="fiche-ic">
                <svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10z" /><circle cx="8" cy="8" r="1.6" /></svg>
              </span>
              <span class="fiche-label">Étiquettes DLC<span class="fiche-sub">dates limites</span></span>
            </div>

            <div class="fiche" id="f5" data-cx="560" data-cy="820" style="left: 388px; top: 760px; transform: rotate(3deg)">
              <span class="fiche-ic">
                <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></svg>
              </span>
              <span class="fiche-label">Checklists hygiène<span class="fiche-sub">à valider</span></span>
            </div>

            <!-- OBLIGATOIRE stamp -->
            <div class="stamp" id="stamp">OBLIGATOIRE</div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var root =
            document.querySelector('[data-composition-id="01-poids"][id="root"]') ||
            document.querySelector('[data-composition-id="01-poids"]');
          var tl = gsap.timeline({ paused: true });

          var shakeEl = root.querySelector(".shake");
          var fiches = Array.prototype.slice.call(root.querySelectorAll(".fiche"));

          // Chef enters right, settles (power3.out, no overshoot) — visible well before 0.5s
          tl.fromTo(
            root.querySelector("#figure"),
            { x: 200, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
            0.0
          );

          // Fiches accumulate one per named obligation (spring-pop, keep their tilt)
          var cues = [0.55, 1.5, 2.87, 3.89, 5.15];
          fiches.forEach(function (el, i) {
            var back = el.classList.contains("back");
            var rot = (el.style.transform.match(/rotate\(([-0-9.]+)deg\)/) || [0, 0])[1];
            rot = parseFloat(rot) || 0;
            tl.fromTo(
              el,
              { scale: 0, opacity: 0, y: 24, rotation: rot },
              { scale: 1, opacity: back ? 0.28 : 1, y: 0, rotation: rot, duration: 0.5, ease: "power3.out" },
              cues[i]
            );
          });

          // "OBLIGATOIRE" stamp lands on « c'est essentiel » (~8.5s)
          tl.fromTo(
            root.querySelector("#stamp"),
            { scale: 1.6, opacity: 0, rotation: -8 },
            { scale: 1, opacity: 1, rotation: -8, duration: 0.4, ease: "power4.out" },
            8.5
          );

          // Scene 4 — on « montagne de paperasse » the fiches close in on the chef (surround)
          var CX = 1180;
          var CY = 520;
          fiches.forEach(function (el, i) {
            var cx = parseFloat(el.getAttribute("data-cx"));
            var cy = parseFloat(el.getAttribute("data-cy"));
            var back = el.classList.contains("back");
            var pull = back ? 0.26 : 0.36;
            tl.to(
              el,
              { x: (CX - cx) * pull, y: (CY - cy) * pull, scale: back ? 1 : 1.04, duration: 1.4, ease: "power2.inOut" },
              10.7 + i * 0.06
            );
          });

          // Micro-shake (bounded driven proxy, sin(0)=0, settles to 0)
          var shk = { t: 0 };
          tl.to(
            shk,
            {
              t: 1,
              duration: 1.9,
              ease: "none",
              onUpdate: function () {
                var tt = shk.t;
                var env = Math.max(0, Math.min(1, tt / 0.18, (1 - tt) / 0.14));
                var ph = tt * 1.9 * Math.PI * 2;
                var x = Math.sin(ph * 3.5) * 2.4 * env;
                var y = Math.sin(ph * 2.7 + 1.1) * 1.8 * env;
                shakeEl.style.transform = "translate(" + x + "px," + y + "px)";
              },
            },
            10.7
          );
          // Tense hold to the cut — no exit animation.

          window.__timelines["01-poids"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
