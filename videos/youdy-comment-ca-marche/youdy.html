<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Jost';src:url('file:///home/user/Video/videos/youdy-comment-ca-marche/assets/fonts/jost-600.woff2');font-weight:600;}
@font-face{font-family:'Jost';src:url('file:///home/user/Video/videos/youdy-comment-ca-marche/assets/fonts/jost-700.woff2');font-weight:700;}
@font-face{font-family:'Raleway';src:url('file:///home/user/Video/videos/youdy-comment-ca-marche/assets/fonts/raleway-400.woff2');font-weight:400;}
@font-face{font-family:'Raleway';src:url('file:///home/user/Video/videos/youdy-comment-ca-marche/assets/fonts/raleway-500.woff2');font-weight:500;}
@font-face{font-family:'Yellowtail';src:url('file:///home/user/Video/videos/youdy-comment-ca-marche/assets/fonts/yellowtail.woff2');font-weight:400;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:#146673;}
#stage{position:relative;width:1920px;height:1080px;background:#146673;font-family:'Raleway',sans-serif;color:#f5deac;}
.scene{position:absolute;inset:0;opacity:0;}
.title{font-family:'Jost';font-weight:700;font-size:92px;color:#f5deac;text-align:center;}
.sub{font-family:'Raleway';font-weight:500;font-size:44px;}
.ocre{color:#c97f17;} .creme{color:#f5deac;}
.card{background:#f5deac;border-radius:24px;}
/* figures */
.fig{position:absolute;}
.head{border-radius:50%;background:#f5deac;} .body{border-radius:40px 40px 20px 20px;background:#f5deac;}
#subtitle{position:absolute;left:0;width:1920px;bottom:120px;text-align:center;}
#subtitle .bg{display:inline-block;background:rgba(11,61,68,.72);color:#fff;font-family:'Raleway';font-weight:500;font-size:46px;padding:14px 34px;border-radius:14px;max-width:1500px;line-height:1.3;}
svg{overflow:visible;display:block;}
.blk{position:absolute;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.blk .lbl{font-family:'Jost';font-weight:600;font-size:46px;color:#0f2e33;}
.badge{position:absolute;width:250px;height:250px;border-radius:50%;background:#f5deac;display:flex;align-items:center;justify-content:center;}
.stepnum{font-family:'Jost';font-weight:700;font-size:64px;color:#c97f17;}
</style></head>
<body><div id="stage">

  <!-- S1 -->
  <div class="scene" id="s1">
    <div class="fig" id="s1L" style="left:0;top:0;width:960px;height:1080px;background:#125a66;">
      <svg width="960" height="1080"><g transform="translate(480,470)">
        <circle cx="0" cy="-120" r="70" fill="#f5deac"/><rect x="-95" y="-40" width="190" height="230" rx="40" fill="#f5deac"/>
        <rect x="-70" y="20" width="140" height="150" rx="10" fill="#125a66"/><rect x="-70" y="20" width="140" height="150" rx="10" fill="none" stroke="#125a66" stroke-width="4"/>
      </g>
      <g transform="translate(480,760)"><rect x="-150" y="0" width="300" height="200" rx="16" fill="#f5deac"/><line x1="-110" y1="60" x2="110" y2="60" stroke="#c9b98a" stroke-width="6"/><line x1="-110" y1="110" x2="110" y2="110" stroke="#c9b98a" stroke-width="6"/><line x1="-110" y1="160" x2="110" y2="160" stroke="#c9b98a" stroke-width="6"/></g>
    </div>
    <div class="fig" id="s1R" style="right:0;top:0;width:960px;height:1080px;background:#0f5560;">
      <svg width="960" height="1080"><g transform="translate(480,440)"><circle cx="0" cy="-120" r="70" fill="#f5deac"/><rect x="-95" y="-40" width="190" height="230" rx="40" fill="#f5deac"/></g>
      <g transform="translate(480,720)"><rect x="-160" y="0" width="320" height="240" rx="16" fill="#f5deac"/><text x="0" y="70" font-family="Jost" font-weight="700" font-size="54" fill="#c97f17" text-anchor="middle">€ €</text><line x1="-120" y1="120" x2="120" y2="120" stroke="#c9b98a" stroke-width="5"/><line x1="-120" y1="170" x2="120" y2="170" stroke="#c9b98a" stroke-width="5"/></g></svg>
    </div>
    <div class="title" id="s1T" style="position:absolute;left:0;width:1920px;top:120px">Deux problèmes.</div>
  </div>

  <!-- S2 -->
  <div class="scene" id="s2">
    <div class="title" style="position:absolute;left:0;width:1920px;top:130px">Un seul point commun.</div>
    <div id="s2tag" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)">
      <div class="card" style="width:520px;height:300px;display:flex;align-items:center;justify-content:center;position:relative">
        <span id="s2num" style="font-family:'Jost';font-weight:700;font-size:150px;color:#c97f17">0 €</span>
        <svg id="s2strike" style="position:absolute;inset:0" width="520" height="300"><line id="s2line" x1="40" y1="150" x2="40" y2="150" stroke="#c97f17" stroke-width="14" stroke-linecap="round"/></svg>
      </div>
    </div>
  </div>

  <!-- S3 -->
  <div class="scene" id="s3">
    <div id="s3logo" style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center">
      <div style="font-family:'Yellowtail';font-size:220px;color:#f5deac;line-height:1">Youdy</div>
    </div>
    <div id="s3sig" class="sub" style="position:absolute;left:0;width:1920px;top:66%;text-align:center;font-size:54px;opacity:0">Les apprenants à votre service</div>
  </div>

  <!-- S4 -->
  <div class="scene" id="s4"><div id="s4grid" style="position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:1000px;height:1000px"></div></div>

  <!-- S5 -->
  <div class="scene" id="s5">
    <div class="stepnum" style="position:absolute;left:0;width:1920px;top:110px;text-align:center">1 — Je cherche</div>
    <div id="s5phone" style="position:absolute;left:50%;top:56%;transform:translate(-50%,-50%)">
      <svg width="620" height="760"><rect x="0" y="0" width="620" height="760" rx="52" fill="#f5deac"/><rect x="34" y="70" width="552" height="90" rx="20" fill="#e6cf9a"/>
        <text id="s5svc" x="60" y="128" font-family="Raleway" font-weight="500" font-size="40" fill="#0f2e33"></text>
        <rect x="34" y="180" width="552" height="90" rx="20" fill="#e6cf9a"/><text id="s5city" x="60" y="238" font-family="Raleway" font-weight="500" font-size="40" fill="#0f2e33"></text>
        <rect x="34" y="300" width="552" height="410" rx="20" fill="#0f5560"/>
      </svg>
      <div id="s5pins"></div>
    </div>
  </div>

  <!-- S6 -->
  <div class="scene" id="s6">
    <div class="stepnum" id="s6step" style="position:absolute;left:0;width:1920px;top:100px;text-align:center">2 — Je réserve</div>
    <div id="s6card" style="position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:560px;height:360px;transform-style:preserve-3d">
      <div class="card" id="s6front" style="position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center"><span style="font-family:'Jost';font-weight:600;font-size:52px;color:#0f2e33">Annonce</span></div>
      <div class="card" id="s6back" style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);padding:30px"><div id="s6cal" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"></div></div>
    </div>
    <div id="s6price" style="position:absolute;left:0;width:1920px;top:70%;text-align:center;font-family:'Raleway';font-weight:500;font-size:48px;color:#f5deac"></div>
  </div>

  <!-- S7 -->
  <div class="scene" id="s7">
    <div class="stepnum" style="position:absolute;left:0;width:1920px;top:110px;text-align:center">3 — Je profite</div>
    <div id="s7scene" style="position:absolute;left:50%;top:54%;transform:translate(-50%,-50%)">
      <svg width="900" height="560"><rect x="0" y="360" width="900" height="24" rx="12" fill="#0f5560"/>
        <g transform="translate(300,300)"><circle cx="0" cy="-120" r="60" fill="#f5deac"/><rect x="-80" y="-50" width="160" height="200" rx="34" fill="#f5deac"/></g>
        <g transform="translate(600,300)"><circle cx="0" cy="-120" r="60" fill="#c29785"/><rect x="-80" y="-50" width="160" height="200" rx="34" fill="#c29785"/></g>
      </svg>
      <div id="s7stars" style="text-align:center;margin-top:20px"></div>
    </div>
  </div>

  <!-- S8 -->
  <div class="scene" id="s8"><div id="s8badges" style="position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex;gap:120px"></div>
    <div id="s8labels" style="position:absolute;left:0;width:1920px;top:66%;display:flex;justify-content:center;gap:120px"></div></div>

  <!-- S9 -->
  <div class="scene" id="s9">
    <div id="s9L" class="fig" style="left:calc(50% - 260px);top:50%;transform:translate(-50%,-50%)"><svg width="300" height="440"><g transform="translate(150,180)"><circle cx="0" cy="-100" r="70" fill="#f5deac"/><rect x="-90" y="-20" width="180" height="240" rx="40" fill="#f5deac"/></g></svg></div>
    <div id="s9R" class="fig" style="left:calc(50% + 260px);top:50%;transform:translate(-50%,-50%)"><svg width="300" height="440"><g transform="translate(150,180)"><circle cx="0" cy="-100" r="70" fill="#c29785"/><rect x="-90" y="-20" width="180" height="240" rx="40" fill="#c29785"/></g></svg></div>
    <div id="s9line" style="position:absolute;left:50%;top:26%;width:6px;height:48%;background:#0f2e33;transform:translateX(-50%)"></div>
    <div class="title" style="position:absolute;left:0;width:1920px;top:80%">Ils progressent. Vous économisez.</div>
  </div>

  <!-- S10 -->
  <div class="scene" id="s10">
    <div style="position:absolute;left:0;width:1920px;top:34%;text-align:center;font-family:'Yellowtail';font-size:200px;color:#f5deac">Youdy</div>
    <div id="s10url" style="position:absolute;left:0;width:1920px;top:62%;text-align:center;font-family:'Jost';font-weight:600;font-size:64px;color:#c97f17"></div>
    <div class="sub" style="position:absolute;left:0;width:1920px;top:72%;text-align:center;font-size:44px;color:#f5deac">Trouvez un apprenant près de chez vous</div>
  </div>

  <div id="subtitle"><span class="bg" id="subtxt"></span></div>
</div>
<script>
const clamp=x=>x<0?0:x>1?1:x, ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3);};
const back=x=>{x=clamp(x); const c=1.70158,c3=c+1; return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const $=id=>document.getElementById(id);
const CAT=[['Beauté','#c29785'],['Bien-être','#26c4dc'],['Culinaire','#c97f17'],['Artisanat','#7d8c52']];
// build S4 grid
const grid=$('s4grid'); const ICON=['M -30 20 q 30 -60 60 0','M0 -40 q 40 40 0 80 q -40 -40 0 -80','M-30 -30 l60 60','M-30 30 l60 -60'];
CAT.forEach((c,i)=>{const b=document.createElement('div');b.className='blk';b.id='blk'+i;
  b.style.width='470px';b.style.height='470px';b.style.background=c[1];
  b.style.left=(i%2)*530+'px';b.style.top=Math.floor(i/2)*530+'px';
  b.innerHTML=`<svg width="130" height="130" viewBox="-65 -65 130 130"><path d="${['M -34 24 q 34 -70 68 0','M0 -46 q 46 46 0 92 q -46 -46 0 -92','M-38 34 q 8 -50 38 -50 q 30 0 38 50','M-34 -20 l16 -16 l52 52 l-16 16 z'][i]}" fill="none" stroke="#0f2e33" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="lbl">${c[0]}</div>`;
  grid.appendChild(b);});
// S6 calendar cells
const cal=$('s6cal'); for(let i=0;i<12;i++){const d=document.createElement('div');d.style.height='72px';d.style.borderRadius='12px';d.style.background='#e6cf9a';d.style.display='flex';d.style.alignItems='center';d.style.justifyContent='center';d.style.fontFamily='Raleway';d.style.fontWeight='500';d.style.fontSize='30px';d.style.color='#0f2e33';d.textContent=(i+8);d.id='cal'+i;cal.appendChild(d);}
// S8 badges + labels
const B8=['Formation vérifiée','Assurance contrôlée','Prestation testée par un ambassadeur'];
B8.forEach((t,i)=>{const b=document.createElement('div');b.className='badge';b.id='bdg'+i;
  b.innerHTML='<svg width="120" height="120" viewBox="0 0 24 24" fill="none"><path id="chk'+i+'" d="M5 13l4 4L19 7" stroke="#c97f17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  $('s8badges').appendChild(b);
  const l=document.createElement('div');l.style.width='250px';l.style.textAlign='center';l.style.fontFamily='Raleway';l.style.fontWeight='500';l.style.fontSize='38px';l.style.color='#f5deac';l.textContent=t;l.id='bl'+i;$('s8labels').appendChild(l);});
// S5 pins
for(let i=0;i<4;i++){const p=document.createElement('div');p.id='pin'+i;p.style.position='absolute';p.style.width='34px';p.style.height='34px';p.style.borderRadius='50% 50% 50% 0';p.style.background='#c97f17';p.style.transform='rotate(-45deg)';
  p.style.left=(120+i*120)+'px';p.style.top=(420+((i%2)*80))+'px';p.style.opacity=0;$('s5pins').appendChild(p);}

// scenes frame ranges [start,end,vo_start_sec]
const SC={s1:[0,150],s2:[150,330],s3:[330,480],s4:[480,720],s5:[720,960],s6:[960,1200],s7:[1200,1440],s8:[1440,1740],s9:[1740,1950],s10:[1950,2160]};
const VO={s1:[0,3.47,"D'un côté, des apprentis qui n'ont personne sur qui pratiquer."],
 s2:[5,3.79,"De l'autre, des services devenus trop chers pour beaucoup d'entre nous."],
 s3:[11,1.8,"Youdy fait se rencontrer les deux."],
 s4:[16,6.82,"Massage, coiffure, pâtisserie, artisanat : des apprenants proposent leurs services près de chez vous."],
 s5:[24,4.36,"Première étape : vous cherchez la prestation qui vous intéresse, dans votre ville."],
 s6:[32,5.43,"Vous choisissez votre créneau. Le prix affiché, c'est le prix des produits utilisés. Rien de plus."],
 s7:[40,4.49,"Le jour J, l'apprenant vient réaliser la prestation. Et vous laissez votre avis."],
 s8:[48,8.18,"Chaque apprenant est vérifié : formation, assurance, et une première prestation testée par un ambassadeur Youdy."],
 s9:[58,3.06,"Eux gagnent en expérience. Vous, en pouvoir d'achat."],
 s10:[65,3.89,"Youdy. Les apprentis d'aujourd'hui seront les professionnels de demain."]};
function typewriter(el,txt,p){ el.textContent=txt.slice(0,Math.floor(clamp(p)*txt.length)); }

window.render=function(frame){
  const T=frame/30;
  // scene visibility with 200ms fade
  for(const k in SC){ const [a,b]=SC[k]; let op=0;
    if(frame>=a-6&&frame<b+6){ op=clamp((frame-(a-6))/6)*(1-clamp((frame-(b))/6)); }
    $(k).style.opacity=op; }
  // subtitle (chunked per scene over vo duration)
  let sub='';
  for(const k in VO){ const [vs,vd,txt]=VO[k]; if(T>=vs&&T<vs+vd+0.4){ const words=txt.split(' '); const per=Math.ceil(words.length/Math.ceil(vd/2.6)); const nCh=Math.ceil(words.length/per); const ci=clamp((T-vs)/vd); const idx=Math.min(nCh-1,Math.floor(ci*nCh)); sub=words.slice(idx*per,(idx+1)*per).join(' '); } }
  $('subtxt').textContent=sub; $('subtitle').style.opacity=sub?1:0;

  const lt=(k)=> (frame-SC[k][0])/30;  // local time sec

  // S1
  { const t=lt('s1'); const k=ease(t/0.4);
    $('s1L').style.transform=`translateX(${(1-k)*-960}px)`; $('s1R').style.transform=`translateX(${(1-k)*960}px)`;
    $('s1T').style.opacity=ease((t-0.6)/0.4);
    // book blink once ~1.2s
    const bl=(t>1.2&&t<1.5)?0.3:1; $('s1L').style.filter=''; }
  // S2
  { const t=lt('s2'); const n=Math.round(clamp(t/0.8)*80); $('s2num').textContent=n+' €';
    const sk=clamp((t-1.0)/0.6); const x2=40+sk*440; $('s2line').setAttribute('x2',x2); $('s2line').setAttribute('y1',150-sk*20);$('s2line').setAttribute('y2',150+sk*20); }
  // S3
  { const t=lt('s3'); let s=0.8; if(t<0.5)s=0.8+ (0.25)*ease(t/0.5); else if(t<0.8)s=1.05-0.05*ease((t-0.5)/0.3); else s=1.0;
    $('s3logo').style.transform=`translate(-50%,-50%) scale(${s})`; $('s3sig').style.opacity=ease((t-0.8)/0.4); }
  // S4 cascade
  { const t=lt('s4'); CAT.forEach((c,i)=>{ const st=i*0.12; const k=back((t-st)/0.5); $('blk'+i).style.opacity=clamp((t-st)/0.3); $('blk'+i).style.transform=`scale(${clamp(k)})`; }); }
  // S5 typing + pins
  { const t=lt('s5'); typewriter($('s5svc'),'massage',(t-0.2)/0.6); typewriter($('s5city'),'Lyon',(t-1.0)/0.5);
    for(let i=0;i<4;i++){ const st=1.6+i*0.12; const k=back((t-st)/0.4); $('pin'+i).style.opacity=clamp((t-st)/0.2); $('pin'+i).style.transform=`rotate(-45deg) translateY(${(1-clamp(k))*-30}px)`; } }
  // S6 flip + calendar + price
  { const t=lt('s6'); const ry=clamp((t-0.4)/0.4)*180; $('s6card').style.transform=`translate(-50%,-50%) rotateY(${ry}deg)`;
    const sel=(t>1.2); for(let i=0;i<12;i++){ $('cal'+i).style.background=(sel&&i===6)?'#c97f17':'#e6cf9a'; }
    if(t>1.6){ const lines=['Prix coûtant  25 €','+ service  2 €','= 27 €']; const ci=Math.min(3,Math.floor((t-1.6)/0.4)+1);
      $('s6price').innerHTML=lines.slice(0,ci).map((l,ix)=>`<div style="${ix===2?'font-weight:700;color:#c97f17':''}">${l}</div>`).join(''); } else $('s6price').innerHTML=''; }
  // S7 stars
  { const t=lt('s7'); let s=''; for(let i=0;i<5;i++){ const on=(t-2.2-i*0.12)>0; s+=`<span style="font-size:80px;color:${on?'#c97f17':'#0f5560'}">★</span>`; } $('s7stars').innerHTML=s;
    $('s7scene').style.transform=`translate(calc(-50% + ${Math.sin(t*0.4)*14}px),-50%)`; }
  // S8 badges print + check
  { const t=lt('s8'); for(let i=0;i<3;i++){ const st=i*0.4; const k=clamp((t-st)/0.4); $('bdg'+i).style.opacity=k; $('bdg'+i).style.transform=`rotate(${(1-k)*3}deg)`;
      const chk=$('chk'+i); const len=30; chk.style.strokeDasharray=len; chk.style.strokeDashoffset=len*(1-clamp((t-st-0.2)/0.3));
      $('bl'+i).style.opacity=clamp((t-st-0.1)/0.4); } }
  // S9 merge line erase
  { const t=lt('s9'); const k=ease(t/0.5); $('s9L').style.transform=`translate(calc(-50% + ${(1-k)*-60}px),-50%)`; $('s9R').style.transform=`translate(calc(-50% + ${(1-k)*60}px),-50%)`;
    $('s9line').style.opacity=1-ease((t-0.2)/0.5); }
  // S10 url typewriter
  { const t=lt('s10'); typewriter($('s10url'),'youdy.fr',(t-0.4)/0.6); }
};
window.render(0);
</script></body></html>
