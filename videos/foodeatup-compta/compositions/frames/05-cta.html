<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Frame 5 — Le bénéfice + CTA</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Poppins"; src: url("assets/fonts/Poppins-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2-variations"); font-weight: 100 900; }

        #root { position: absolute; inset: 0; overflow: hidden; font-family: "Poppins", "Inter", sans-serif; }
        .bg { position: absolute; inset: 0; background: #f7f9fc; }
        .ring { position: absolute; border-radius: 50%; opacity: 0; pointer-events: none; will-change: transform, opacity; }
        #ring-1 { left: 1160px; top: 340px; width: 400px; height: 400px; border: 2px solid rgba(30,155,240,0.14); }
        #ring-2 { left: 1060px; top: 240px; width: 600px; height: 600px; border: 2px solid rgba(30,155,240,0.1); }
        #ring-3 { left: 960px; top: 140px; width: 800px; height: 800px; border: 2px solid rgba(30,155,240,0.07); }
        .bloom { position: absolute; left: 1060px; top: 280px; width: 620px; height: 540px; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(30,155,240,0.2) 0%, rgba(30,155,240,0.07) 48%, rgba(30,155,240,0) 74%); opacity: 0; pointer-events: none; will-change: opacity; }

        .photo { position: absolute; z-index: 2; left: 90px; top: 90px; width: 760px; height: 900px; border-radius: 36px; overflow: hidden; border: 1.5px solid rgba(27,42,65,0.08); opacity: 0; will-change: transform, opacity; }
        .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .benefits { position: absolute; left: 940px; top: 0; bottom: 0; width: 900px; z-index: 3; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 34px; padding-left: 40px; will-change: opacity; }
        .benefit { display: flex; align-items: center; gap: 22px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 54px; letter-spacing: -0.01em; color: #1b2a41; opacity: 0; will-change: transform, opacity; }
        .benefit .dot { width: 18px; height: 18px; border-radius: 50%; background: #1e9bf0; flex: none; }

        .lockup { position: absolute; left: 940px; top: 0; bottom: 0; width: 900px; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo { width: 400px; height: auto; object-fit: contain; transform-origin: 50% 50%; opacity: 0; will-change: transform, opacity; }
        .tagline { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .tag-line { display: flex; gap: 16px; white-space: nowrap; }
        .word { display: inline-block; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 52px; line-height: 1.16; letter-spacing: -0.02em; color: #1b2a41; opacity: 0; will-change: transform, opacity; }
        .word.accent { color: #1e9bf0; }
        .cta-button { margin-top: 40px; padding: 24px 56px; background: #1e9bf0; color: #f7f9fc; border-radius: 100px; font-family: "Poppins", sans-serif; font-weight: 600; font-size: 38px; letter-spacing: 0.01em; transform-origin: 50% 50%; opacity: 0; white-space: nowrap; will-change: transform, opacity; }
      </style>

      <div id="root" data-composition-id="05-cta" data-width="1920" data-height="1080" data-duration="7.605">
        <div id="bg-clip" class="clip bg" data-start="0" data-duration="7.105" data-track-index="0">
          <div class="ring" id="ring-1"></div><div class="ring" id="ring-2"></div><div class="ring" id="ring-3"></div><div class="bloom" id="bloom"></div>
        </div>
        <div id="photo-clip" class="clip photo" data-start="0" data-duration="7.105" data-track-index="1">
          <img src="public/chef-desk-calm.png" alt="Gérant serein, compta à jour" />
        </div>
        <div class="clip benefits" id="benefits" data-start="0" data-duration="7.105" data-track-index="2" data-layout-allow-overlap>
          <div class="benefit" id="ben-1"><span class="dot"></span>Zéro ressaisie</div>
          <div class="benefit" id="ben-2"><span class="dot"></span>Marges maîtrisées</div>
          <div class="benefit" id="ben-3"><span class="dot"></span>Compta toujours à jour</div>
        </div>
        <div class="clip lockup" id="lockup" data-start="0" data-duration="7.105" data-track-index="3">
          <img id="logo" class="logo" src="public/foodeatup-logo-mascot.png" alt="FoodEatUp" />
          <div class="tagline">
            <div class="tag-line"><span class="word">Votre rentabilité,</span></div>
            <div class="tag-line"><span class="word accent">sous contrôle.</span></div>
          </div>
          <div class="cta-button" id="cta">Découvrir le module Compta</div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(".photo", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.85, ease: "power3.out" }, 0.0);
        gsap.utils.toArray(".ring").forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0.2 + i * 0.12);
        });
        tl.fromTo("#ben-1", { x: 20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.4);
        tl.fromTo("#ben-2", { x: 20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.3);
        tl.fromTo("#ben-3", { x: 20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.1);
        tl.to("#benefits", { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.4);
        tl.fromTo("#logo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 3.8);
        gsap.utils.toArray(".word").forEach(function (el, i) {
          tl.fromTo(el, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.5 + i * 0.1);
        });
        tl.fromTo("#cta", { scale: 0, opacity: 0, y: 18 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 5.5);
        tl.fromTo("#bloom", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 6.0);
        window.__timelines["05-cta"] = tl;
      </script>
    </template>
  </body>
</html>
