<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/vendor/fonts/SpaceGrotesk-Variable.woff2") format("woff2-variations");
          font-weight: 300 700;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/vendor/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
        }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: radial-gradient(ellipse 1500px 1100px at 50% 40%, #1c1350 0%, #100a34 55%, #08051c 100%);
          font-family: "Inter", sans-serif;
        }

        .scene {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        .app-card {
          position: absolute;
          width: 380px;
          height: 250px;
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.045);
          border: 1.5px solid rgba(255, 255, 255, 0.09);
          box-shadow: 0 20px 60px rgba(5, 2, 20, 0.5);
          opacity: 0;
          padding: 26px 28px;
          box-sizing: border-box;
          will-change: transform, opacity, border-color;
        }
        .card-head {
          display: flex;
          align-items: center;
          gap: 16px;
        }
        .chip {
          width: 56px;
          height: 56px;
          border-radius: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 20px;
          color: #fff;
          filter: grayscale(1) brightness(0.8);
        }
        .app-name {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 26px;
          color: #f2efff;
        }
        .status-row {
          margin-top: 18px;
          height: 118px;
          border-radius: 12px;
          border: 1.5px dashed rgba(255, 255, 255, 0.16);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Inter", sans-serif;
          font-size: 15px;
          color: rgba(233, 228, 255, 0.35);
        }

        .glow-ring {
          position: absolute;
          inset: -1.5px;
          border-radius: 22px;
          border: 2px solid #22c55e;
          opacity: 0;
          pointer-events: none;
        }

        .connected-badge {
          position: absolute;
          top: -18px;
          right: -14px;
          display: flex;
          align-items: center;
          gap: 8px;
          background: linear-gradient(135deg, #22c55e, #16a34a);
          border-radius: 100px;
          padding: 10px 18px;
          box-shadow: 0 8px 24px rgba(22, 163, 74, 0.5);
          opacity: 0;
          transform: scale(0.5);
        }
        .connected-badge span {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 16px;
          color: #ffffff;
          white-space: nowrap;
        }

        .caption-wrap {
          position: absolute;
          top: 960px;
          width: 1920px;
          text-align: center;
        }
        .caption {
          font-family: "Inter", sans-serif;
          font-weight: 500;
          font-size: 34px;
          color: #c9bfef;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="05-connectors" data-width="1920" data-height="1080" data-duration="10.5">
        <div id="scene-connectors" class="scene clip" data-start="0" data-duration="10.5" data-track-index="1">
          <!-- Card 1: FoodEatUp -->
          <div class="app-card" id="mcp-1" style="left:370px;top:215px;">
            <div class="glow-ring" id="glow-1"></div>
            <div class="connected-badge" id="badge-1">
              <span>✓ Connecté</span>
            </div>
            <div class="card-head">
              <div class="chip" id="chip-1" style="background:rgba(255,165,0,0.22);color:#ffb733;">FE</div>
              <div class="app-name">FoodEatUp</div>
            </div>
            <div class="status-row">MCP FoodEatUp</div>
          </div>

          <!-- Card 2: RapidoCRM -->
          <div class="app-card" id="mcp-2" style="left:1170px;top:215px;">
            <div class="glow-ring" id="glow-2"></div>
            <div class="connected-badge" id="badge-2">
              <span>✓ Connecté</span>
            </div>
            <div class="card-head">
              <div class="chip" id="chip-2" style="background:rgba(20,184,166,0.22);color:#2dd4bf;">CRM</div>
              <div class="app-name">RapidoCRM</div>
            </div>
            <div class="status-row">MCP RapidoCRM</div>
          </div>

          <!-- Card 3: RapidoCMS -->
          <div class="app-card" id="mcp-3" style="left:370px;top:615px;">
            <div class="glow-ring" id="glow-3"></div>
            <div class="connected-badge" id="badge-3">
              <span>✓ Connecté</span>
            </div>
            <div class="card-head">
              <div class="chip" id="chip-3" style="background:rgba(236,72,153,0.22);color:#f472b6;">CMS</div>
              <div class="app-name">RapidoCMS</div>
            </div>
            <div class="status-row">MCP RapidoCMS</div>
          </div>

          <!-- Card 4: RapidoRH -->
          <div class="app-card" id="mcp-4" style="left:1170px;top:615px;">
            <div class="glow-ring" id="glow-4"></div>
            <div class="connected-badge" id="badge-4">
              <span>✓ Connecté</span>
            </div>
            <div class="card-head">
              <div class="chip" id="chip-4" style="background:rgba(245,158,11,0.22);color:#fbbf24;">RH</div>
              <div class="app-name">RapidoRH</div>
            </div>
            <div class="status-row">MCP RapidoRH</div>
          </div>

          <div class="caption-wrap"><div class="caption" id="caption">Connecté en temps réel à vos outils</div></div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0-0.5s): all 4 cards fade in, inactive/dim ----
        tl.fromTo(".app-card", { opacity: 0, y: 14 }, { opacity: 0.55, y: 0, duration: 0.5, stagger: 0.06, ease: "power2.out" }, 0);

        // ---- Scene 2 (0.6-6.2s): cards activate one by one ----
        const items = [
          { card: "#mcp-1", chip: "#chip-1", glow: "#glow-1", badge: "#badge-1", at: 0.6 },
          { card: "#mcp-2", chip: "#chip-2", glow: "#glow-2", badge: "#badge-2", at: 2.2 },
          { card: "#mcp-3", chip: "#chip-3", glow: "#glow-3", badge: "#badge-3", at: 3.8 },
          { card: "#mcp-4", chip: "#chip-4", glow: "#glow-4", badge: "#badge-4", at: 5.4 },
        ];

        items.forEach((it) => {
          tl.to(it.card, { opacity: 1, borderColor: "rgba(34,197,94,0.55)", duration: 0.4, ease: "power2.out" }, it.at);
          tl.to(it.chip, { filter: "grayscale(0) brightness(1)", duration: 0.4 }, it.at);
          tl.fromTo(it.glow, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.06, duration: 0.7, ease: "power2.out" }, it.at);
          tl.fromTo(it.badge, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, it.at + 0.15);
        });

        // ---- Scene 3 (6.6-7.4s): unison pulse across all 4 + caption ----
        tl.to(".glow-ring", { opacity: 0.8, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 6.6);
        tl.fromTo("#caption", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.9);

        window.__timelines["05-connectors"] = tl;
      </script>
    </template>
  </body>
</html>
