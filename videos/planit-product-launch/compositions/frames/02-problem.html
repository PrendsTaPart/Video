<!doctype html>

  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/vendor/fonts/SpaceGrotesk-Variable.woff2") format("woff2-variations");
          font-weight: 300 700;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/vendor/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
        }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: radial-gradient(ellipse 1500px 1100px at 50% 40%, #1c1350 0%, #100a34 55%, #08051c 100%);
          font-family: "Inter", sans-serif;
        }

        .scene {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        .app-card {
          position: absolute;
          width: 380px;
          height: 250px;
          border-radius: 22px;
          background: rgba(255, 255, 255, 0.045);
          border: 1.5px solid rgba(255, 255, 255, 0.09);
          box-shadow: 0 20px 60px rgba(5, 2, 20, 0.5);
          opacity: 0;
          padding: 26px 28px;
          box-sizing: border-box;
          will-change: transform, opacity;
        }
        .card-head {
          display: flex;
          align-items: center;
          gap: 16px;
        }
        .chip {
          width: 56px;
          height: 56px;
          border-radius: 16px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 20px;
          letter-spacing: -0.01em;
          color: #fff;
        }
        .app-name {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 26px;
          color: #f2efff;
        }
        /* PLACEHOLDER SLOT: drop a real app screenshot or UI capture here later, replacing the
           dashed box below with an image or video element covering the same area. */
        .shot-placeholder {
          margin-top: 18px;
          height: 118px;
          border-radius: 12px;
          border: 1.5px dashed rgba(255, 255, 255, 0.22);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Inter", sans-serif;
          font-size: 15px;
          color: rgba(233, 228, 255, 0.4);
          text-align: center;
          padding: 0 12px;
        }

        .headline-wrap {
          position: absolute;
          top: 902px;
          width: 1920px;
          text-align: center;
        }
        .headline {
          display: inline-block;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 50px;
          letter-spacing: -0.01em;
          color: #ffffff;
        }
        .headline .word {
          display: inline-block;
          opacity: 0;
          transform: translateY(16px);
          will-change: transform, opacity;
        }
        .headline .word + .word {
          margin-left: 0.28em;
        }
      </style>

      <div id="root" data-composition-id="02-problem" data-width="1920" data-height="1080" data-duration="10.5">
        <div id="scene-problem" class="scene clip" data-start="0" data-duration="10.5" data-track-index="1">
          <!-- Card 1: FoodEatUp -->
          <div class="app-card" id="card-1" style="left:790px;top:340px;">
            <div class="card-head">
              <div class="chip" style="background:rgba(255,165,0,0.22);color:#ffb733;">FE</div>
              <div class="app-name">FoodEatUp</div>
            </div>
            <!-- PLACEHOLDER: FoodEatUp UI screenshot goes here -->
            <div class="shot-placeholder">Capture d'écran — FoodEatUp</div>
          </div>

          <!-- Card 2: RapidoCRM -->
          <div class="app-card" id="card-2" style="left:790px;top:340px;">
            <div class="card-head">
              <div class="chip" style="background:rgba(20,184,166,0.22);color:#2dd4bf;">CRM</div>
              <div class="app-name">RapidoCRM</div>
            </div>
            <!-- PLACEHOLDER: RapidoCRM UI screenshot goes here -->
            <div class="shot-placeholder">Capture d'écran — RapidoCRM</div>
          </div>

          <!-- Card 3: RapidoCMS -->
          <div class="app-card" id="card-3" style="left:790px;top:340px;">
            <div class="card-head">
              <div class="chip" style="background:rgba(236,72,153,0.22);color:#f472b6;">CMS</div>
              <div class="app-name">RapidoCMS</div>
            </div>
            <!-- PLACEHOLDER: RapidoCMS UI screenshot goes here -->
            <div class="shot-placeholder">Capture d'écran — RapidoCMS</div>
          </div>

          <!-- Card 4: RapidoRH -->
          <div class="app-card" id="card-4" style="left:790px;top:340px;">
            <div class="card-head">
              <div class="chip" style="background:rgba(245,158,11,0.22);color:#fbbf24;">RH</div>
              <div class="app-name">RapidoRH</div>
            </div>
            <!-- PLACEHOLDER: RapidoRH UI screenshot goes here -->
            <div class="shot-placeholder">Capture d'écran — RapidoRH</div>
          </div>

          <div class="headline-wrap">
            <div class="headline" id="headline">
              <span class="word">Gérer</span>
              <span class="word">4</span>
              <span class="word">logiciels</span>
              <span class="word">séparément,</span>
              <span class="word">c'est</span>
              <span class="word">lent</span>
              <span class="word">et</span>
              <span class="word">fragmenté.</span>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const cards = [
          { sel: "#card-1", finalLeft: 370, finalTop: 215, pileRot: -6, finalRot: -1.6 },
          { sel: "#card-2", finalLeft: 1170, finalTop: 215, pileRot: 4, finalRot: 1.4 },
          { sel: "#card-3", finalLeft: 370, finalTop: 615, pileRot: -3, finalRot: 1.1 },
          { sel: "#card-4", finalLeft: 1170, finalTop: 615, pileRot: 7, finalRot: -1.3 },
        ];

        // ---- Scene 1 (0.0-0.6s): cards fade in as one messy stacked pile ----
        cards.forEach((c, i) => {
          gsap.set(c.sel, { rotation: c.pileRot, scale: 0.88 });
          tl.to(c.sel, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.05 + i * 0.08);
        });

        // ---- Scene 2 (0.6-1.8s): cards spring apart into 4 quadrants ----
        cards.forEach((c, i) => {
          tl.to(
            c.sel,
            {
              left: c.finalLeft,
              top: c.finalTop,
              rotation: c.finalRot,
              scale: 1,
              duration: 1.0,
              ease: "back.out(1.5)",
            },
            0.6 + i * 0.05,
          );
        });

        // ---- Scene 3 (2.8-4.4s): headline reveals word by word ----
        const words = document.querySelectorAll("#headline .word");
        words.forEach((w, i) => {
          tl.fromTo(w, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.8 + i * 0.18);
        });

        // ---- hold (4.4-10.5s): gentle independent idle float per card ----
        cards.forEach((c, i) => {
          tl.to(
            c.sel,
            {
              y: "+=10",
              duration: 1.8 + i * 0.2,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 2,
            },
            4.6 + i * 0.15,
          );
        });

        window.__timelines["02-problem"] = tl;
      </script>
    </template>
  </body>
