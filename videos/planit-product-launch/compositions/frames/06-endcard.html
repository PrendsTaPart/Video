<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/vendor/fonts/SpaceGrotesk-Variable.woff2") format("woff2-variations");
          font-weight: 300 700;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/vendor/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
        }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: radial-gradient(ellipse 1400px 1000px at 50% 45%, #2c1a80 0%, #150c3d 55%, #0a0620 100%);
          font-family: "Inter", sans-serif;
        }

        .scene {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        .halo {
          position: absolute;
          left: 50%;
          top: 42%;
          width: 1600px;
          height: 1600px;
          transform: translate(-50%, -50%);
          background: conic-gradient(from 90deg, #4526d6 0deg, transparent 60deg, transparent 300deg, #241470 360deg);
          opacity: 0.3;
          filter: blur(60px);
        }

        .particle {
          position: absolute;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(197, 178, 255, 0.9) 0%, rgba(197, 178, 255, 0) 70%);
          opacity: 0;
        }

        .mark {
          position: absolute;
          left: 886px;
          top: 180px;
          width: 148px;
          height: 148px;
          opacity: 0;
          transform: scale(0.4);
        }

        .wordmark {
          position: absolute;
          top: 358px;
          width: 1920px;
          text-align: center;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 96px;
          letter-spacing: -0.03em;
          background: linear-gradient(135deg, #ffffff 0%, #d6cbff 55%, #a48bff 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          opacity: 0;
          transform: translateY(20px);
        }

        .tagline-wrap {
          position: absolute;
          top: 500px;
          width: 1920px;
          text-align: center;
        }
        .tagline {
          display: inline-block;
          font-family: "Inter", sans-serif;
          font-weight: 500;
          font-size: 48px;
          letter-spacing: -0.005em;
          color: #e9e4ff;
        }
        .tagline .word {
          display: inline-block;
          opacity: 0;
          transform: translateY(14px);
        }
        .tagline .word + .word {
          margin-left: 0.28em;
        }

        .cta-wrap {
          position: absolute;
          top: 640px;
          width: 1920px;
          text-align: center;
        }
        .cta {
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 24px 52px;
          border-radius: 100px;
          background: linear-gradient(135deg, #6a3ff0, #4526d6);
          box-shadow: 0 16px 50px rgba(69, 38, 214, 0.55);
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 30px;
          color: #ffffff;
          opacity: 0;
          transform: scale(0.6);
        }
        .cta svg {
          width: 26px;
          height: 26px;
        }

        .byline {
          position: absolute;
          top: 990px;
          width: 1920px;
          text-align: center;
          font-family: "Inter", sans-serif;
          font-weight: 600;
          font-size: 24px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #9c8fd6;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="06-endcard" data-width="1920" data-height="1080" data-duration="10">
        <div class="halo clip" id="end-halo" data-start="0" data-duration="10" data-track-index="0" data-layout-allow-overflow="true"></div>

        <div id="scene-endcard" class="scene clip" data-start="0" data-duration="10" data-track-index="1">
          <div class="particle" id="end-p1" style="left:280px;top:230px;width:10px;height:10px;"></div>
          <div class="particle" id="end-p2" style="left:1600px;top:200px;width:13px;height:13px;"></div>
          <div class="particle" id="end-p3" style="left:1700px;top:560px;width:8px;height:8px;"></div>
          <div class="particle" id="end-p4" style="left:190px;top:650px;width:12px;height:12px;"></div>
          <div class="particle" id="end-p5" style="left:960px;top:880px;width:9px;height:9px;"></div>
          <div class="particle" id="end-p6" style="left:1460px;top:860px;width:11px;height:11px;"></div>
          <div class="particle" id="end-p7" style="left:420px;top:900px;width:13px;height:13px;"></div>

          <svg class="mark" id="end-mark" viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="60" r="46" stroke="url(#end-g1)" stroke-width="3" opacity="0.55" />
            <circle cx="60" cy="60" r="16" fill="url(#end-g2)" />
            <circle cx="60" cy="14" r="7" fill="#c5b2ff" />
            <circle cx="98" cy="80" r="7" fill="#8f6dff" />
            <circle cx="22" cy="80" r="7" fill="#8f6dff" />
            <defs>
              <linearGradient id="end-g1" x1="0" y1="0" x2="120" y2="120">
                <stop offset="0" stop-color="#a48bff" />
                <stop offset="1" stop-color="#4526d6" />
              </linearGradient>
              <radialGradient id="end-g2" cx="0.35" cy="0.35" r="0.8">
                <stop offset="0" stop-color="#efe9ff" />
                <stop offset="1" stop-color="#7c5cff" />
              </radialGradient>
            </defs>
          </svg>

          <div class="wordmark" id="end-wordmark">Plan'It</div>

          <div class="tagline-wrap">
            <div class="tagline" id="end-tagline">
              <span class="word">Plus</span>
              <span class="word">vous</span>
              <span class="word">planifiez,</span>
              <span class="word">plus</span>
              <span class="word">votre</span>
              <span class="word">entreprise</span>
              <span class="word">tourne</span>
              <span class="word">seule.</span>
            </div>
          </div>

          <div class="cta-wrap">
            <div class="cta" id="cta">
              <span>Découvrir Plan'It</span>
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
          </div>

          <div class="byline" id="end-byline">par BraindCode</div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- ambient bg (0.0-10.0s) ----
        tl.to("#end-halo", { rotation: -26, duration: 10, ease: "none" }, 0);
        const particles = ["#end-p1", "#end-p2", "#end-p3", "#end-p4", "#end-p5", "#end-p6", "#end-p7"];
        particles.forEach((sel, i) => {
          tl.to(sel, { opacity: 0.75, duration: 1.0, ease: "power1.out" }, 0.1 + i * 0.07);
          tl.to(sel, { y: -16, duration: 6.0, ease: "sine.inOut" }, 0.1 + i * 0.07);
        });

        // ---- Scene 1 (0.2-1.5s): mark + wordmark land ----
        tl.fromTo("#end-mark", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2.2)" }, 0.2);
        tl.fromTo("#end-wordmark", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.7);

        // ---- Scene 2 (1.5-3.0s): tagline reveals word by word ----
        const words = document.querySelectorAll("#end-tagline .word");
        words.forEach((w, i) => {
          tl.fromTo(w, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.5 + i * 0.15);
        });

        // ---- Scene 3 (3.0-3.8s): CTA button spring-pops in ----
        tl.fromTo("#cta", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(2.4)" }, 3.0);
        tl.fromTo("#end-byline", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.5);

        // ---- hold (3.8-10.0s): CTA breathing glow, mark subtle jitter ----
        tl.to("#cta", { scale: 1.035, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 4 }, 3.8);
        tl.to("#end-mark", { scale: 1.05, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.0);

        window.__timelines["06-endcard"] = tl;
      </script>
    </template>
  </body>
</html>
