<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/vendor/fonts/SpaceGrotesk-Variable.woff2") format("woff2-variations");
          font-weight: 300 700;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/vendor/fonts/Inter-Variable.woff2") format("woff2-variations");
          font-weight: 100 900;
        }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: radial-gradient(ellipse 1500px 1100px at 50% 50%, #1c1350 0%, #100a34 55%, #08051c 100%);
          font-family: "Inter", sans-serif;
        }

        .scene {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        .kicker-wrap {
          position: absolute;
          top: 96px;
          width: 1920px;
          text-align: center;
        }
        .kicker {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 34px;
          letter-spacing: 0.02em;
          color: #b6a9ec;
          opacity: 0;
        }

        .lines {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 1;
        }

        .step-card {
          position: absolute;
          top: 300px;
          width: 480px;
          height: 460px;
          border-radius: 26px;
          background: rgba(255, 255, 255, 0.045);
          border: 1.5px solid rgba(255, 255, 255, 0.09);
          box-shadow: 0 24px 70px rgba(5, 2, 20, 0.5);
          opacity: 0;
          padding: 40px 36px;
          box-sizing: border-box;
          will-change: transform, opacity;
        }
        .badge {
          position: absolute;
          top: -28px;
          left: -28px;
          width: 68px;
          height: 68px;
          border-radius: 50%;
          background: linear-gradient(135deg, #6a3ff0, #4526d6);
          box-shadow: 0 8px 28px rgba(69, 38, 214, 0.6);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 30px;
          color: #fff;
        }
        .icon-area {
          height: 130px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .step-title {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 32px;
          letter-spacing: -0.01em;
          line-height: 1.28;
          color: #f2efff;
          text-align: center;
        }

        /* Step 1 — voice bars */
        .bars {
          display: flex;
          align-items: flex-end;
          gap: 10px;
          height: 84px;
        }
        .bar {
          width: 14px;
          border-radius: 7px;
          background: linear-gradient(180deg, #c5b2ff, #7c5cff);
          transform-origin: bottom center;
        }

        /* Step 2 — counter */
        .counter-block {
          margin-top: 22px;
          text-align: center;
        }
        .counter-num {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 64px;
          color: #ffffff;
          line-height: 1;
        }
        .counter-label {
          margin-top: 6px;
          font-family: "Inter", sans-serif;
          font-size: 18px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #9c8fd6;
        }

        /* Step 3 — avatar */
        .avatar-wrap {
          position: relative;
          width: 100px;
          height: 100px;
        }
        .avatar-ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px solid rgba(197, 178, 255, 0.5);
          opacity: 0;
        }
        .avatar-core {
          position: absolute;
          left: 20px;
          top: 20px;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          background: radial-gradient(circle at 38% 32%, #efe9ff 0%, #a48bff 45%, #6a3ff0 100%);
          box-shadow: 0 0 40px rgba(124, 92, 255, 0.6);
        }
      </style>

      <div id="root" data-composition-id="04-how-it-works" data-width="1920" data-height="1080" data-duration="17.5">
        <div id="scene-how-it-works" class="scene clip" data-start="0" data-duration="17.5" data-track-index="1">
          <div class="kicker-wrap"><div class="kicker" id="kicker">Comment ça marche</div></div>

          <svg class="lines" viewBox="0 0 1920 1080">
            <path id="arrow-1" d="M 660 460 L 810 460" stroke="rgba(164,139,255,0.6)" stroke-width="3" stroke-linecap="round" fill="none" />
            <polygon id="arrow-1-head" points="810,460 792,451 792,469" fill="rgba(164,139,255,0.6)" opacity="0" />
            <path id="arrow-2" d="M 1240 460 L 1390 460" stroke="rgba(164,139,255,0.6)" stroke-width="3" stroke-linecap="round" fill="none" />
            <polygon id="arrow-2-head" points="1390,460 1372,451 1372,469" fill="rgba(164,139,255,0.6)" opacity="0" />
          </svg>

          <!-- Step 1 -->
          <div class="step-card" id="step-1" style="left:120px;">
            <div class="badge">1</div>
            <div class="icon-area">
              <div class="bars">
                <div class="bar" id="bar-1" style="height:24px;"></div>
                <div class="bar" id="bar-2" style="height:52px;"></div>
                <div class="bar" id="bar-3" style="height:76px;"></div>
                <div class="bar" id="bar-4" style="height:40px;"></div>
              </div>
            </div>
            <div class="step-title">Vous parlez</div>
          </div>

          <!-- Step 2 -->
          <div class="step-card" id="step-2" style="left:720px;">
            <div class="badge">2</div>
            <div class="icon-area">
              <svg width="90" height="90" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="3" stroke="#c5b2ff" stroke-width="1.5" />
                <path
                  d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"
                  stroke="#c5b2ff"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="step-title">L'orchestrateur choisit les bons outils</div>
            <div class="counter-block">
              <div class="counter-num" id="counter-num">0</div>
              <div class="counter-label">outils disponibles</div>
            </div>
          </div>

          <!-- Step 3 -->
          <div class="step-card" id="step-3" style="left:1320px;">
            <div class="badge">3</div>
            <div class="icon-area">
              <div class="avatar-wrap">
                <div class="avatar-ring" id="avatar-ring-1" style="transform:scale(1);"></div>
                <div class="avatar-ring" id="avatar-ring-2" style="transform:scale(1);"></div>
                <div class="avatar-core"></div>
              </div>
            </div>
            <div class="step-title">L'action est exécutée, l'avatar 3D répond</div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#kicker", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5 }, 0);

        // ---- Step 1 (0.0-4.6s): slides in, mic bars pulse ----
        tl.fromTo("#step-1", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.1);
        ["#bar-1", "#bar-2", "#bar-3", "#bar-4"].forEach((sel, i) => {
          tl.to(sel, { scaleY: 1.3, duration: 0.28, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0.7 + i * 0.08);
        });

        // ---- Transition 1 (4.6-5.1s): arrow draws, step 1 dims to a completed state ----
        tl.to("#step-1", { opacity: 0.42, scale: 0.94, duration: 0.5, ease: "power2.out" }, 4.6);
        tl.fromTo(
          "#arrow-1",
          { strokeDasharray: 150, strokeDashoffset: 150 },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          4.6,
        );
        tl.to("#arrow-1-head", { opacity: 1, duration: 0.15 }, 4.9);

        // ---- Step 2 (5.1-11.0s): slides in, hub spins gently, counter counts up ----
        tl.fromTo("#step-2", { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 5.1);
        tl.to("#step-2 svg", { rotation: 45, duration: 11.9, ease: "none", transformOrigin: "50% 50%" }, 5.6);

        const counter = { val: 0 };
        const counterEl = document.getElementById("counter-num");
        tl.to(
          counter,
          {
            val: 300,
            duration: 2.6,
            ease: "power1.out",
            onUpdate: () => {
              counterEl.textContent = Math.round(counter.val);
            },
          },
          6.4,
        );

        // ---- Transition 2 (11.0-11.5s): arrow draws, step 2 dims ----
        tl.to("#step-2", { opacity: 0.42, scale: 0.94, duration: 0.5, ease: "power2.out" }, 11.0);
        tl.fromTo(
          "#arrow-2",
          { strokeDasharray: 150, strokeDashoffset: 150 },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          11.0,
        );
        tl.to("#arrow-2-head", { opacity: 1, duration: 0.15 }, 11.3);

        // ---- Step 3 (11.5-17.5s): slides in, avatar response rings pulse ----
        tl.fromTo("#step-3", { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 11.5);
        tl.fromTo(".avatar-core", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 12.0);
        ["#avatar-ring-1", "#avatar-ring-2"].forEach((sel, i) => {
          tl.fromTo(
            sel,
            { scale: 1, opacity: 0.7 },
            { scale: 1.9, opacity: 0, duration: 1.6, ease: "power1.out", repeat: 3 },
            12.3 + i * 0.6,
          );
        });

        window.__timelines["04-how-it-works"] = tl;
      </script>
    </template>
  </body>
</html>
