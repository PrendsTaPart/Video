<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"

      data-width="1080"
      data-height="1920"
    >

        id="el-01-mcp"

        data-composition-id="01-mcp"

        data-duration="11.878"
        data-track-index="0"
      ></div>
      <audio

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-mcp", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11.378);
        tl.fromTo("#el-02-prompt", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11.378);
        tl.to("#el-02-prompt", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17.694);
        tl.fromTo("#el-03-cas", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17.694);
        tl.to({}, { duration: 26.378 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
