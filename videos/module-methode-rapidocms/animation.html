<meta charset="utf-8">
<title>Queue animée — transition, méthode, hook de fin</title>
<style>
  :root{ --fond:#F2F4F7; --bleu:#03A9F5; --violet:#7E57C2; --texte:#383838; --blanc:#fff; --ardoise:#161C22; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--fond)}
  body{font-family:"Liberation Sans",Arial,Helvetica,sans-serif;color:var(--texte);-webkit-font-smoothing:antialiased}
  #scene{position:absolute;inset:0;overflow:hidden}

  /* ── fond commun : diagonales du haut-droit vers le bas-gauche ── */
  #diagonales{position:absolute;inset:-40%;transform:rotate(-38deg);transform-origin:center}
  .diag{position:absolute;left:-20%;width:140%;border-radius:999px}

  /* ── bloc 1 : la transition « COUPEZ » ── */
  #transition{position:absolute;inset:0;background:#000}
  #clap{position:absolute;left:50%;width:760px;margin-left:-380px}
  #clap .stick{position:absolute;left:0;right:0;top:0;height:104px;background:var(--ardoise);
    border-radius:10px;transform-origin:14px 100%;display:flex;align-items:center;overflow:hidden}
  #clap .stick i{display:block;width:96px;height:100%;background:var(--blanc);transform:skewX(-20deg)}
  #clap .stick i:nth-child(even){background:var(--ardoise)}
  #clap .corps{position:absolute;left:0;right:0;top:116px;height:392px;background:var(--ardoise);
    border-radius:14px;padding:44px 52px;display:flex;flex-direction:column;justify-content:center;gap:26px}
  #clap .ligne{display:flex;align-items:baseline;gap:26px;border-bottom:3px solid rgba(255,255,255,.16);padding-bottom:16px}
  #clap .cle{font-size:34px;font-weight:400;letter-spacing:4px;color:rgba(255,255,255,.45)}
  #clap .val{font-size:62px;font-weight:700;color:var(--blanc)}
  #coupez{position:absolute;left:0;right:0;text-align:center;font-size:184px;font-weight:700;
    letter-spacing:-4px;color:var(--blanc)}

  /* ── bloc 2 : la méthode ── */
  #bandeau{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;gap:64px}
  .pastille{display:flex;align-items:center;justify-content:center;background:var(--blanc);
    border-radius:26px;box-shadow:0 10px 26px rgba(20,32,48,.12)}
  #bandeau .pastille img{display:block;object-fit:contain}

  #cartes{position:absolute;inset:0}
  .carte{position:absolute;left:90px;width:900px;background:var(--blanc);border-radius:24px;
    box-shadow:0 18px 44px rgba(20,32,48,.13), 0 3px 10px rgba(20,32,48,.06);
    display:flex;align-items:center;gap:44px;padding:56px 60px}
  .chiffre{flex:0 0 auto;font-size:132px;font-weight:700;color:var(--bleu);line-height:1;min-width:120px;text-align:center}
  .corps{flex:1 1 auto;min-width:0}
  .titre{font-size:47px;font-weight:700;line-height:1.18;color:var(--texte)}
  .mono{margin-top:18px;font-family:"Liberation Mono","DejaVu Sans Mono",monospace;
    font-size:30px;font-weight:400;color:var(--violet);white-space:nowrap}

  /* la barre d'avancement : on sait toujours où on en est dans les cinq étapes */
  #jauge{position:absolute;left:90px;width:900px;display:flex;gap:16px;align-items:center}
  #jauge .pas{flex:1 1 0;height:12px;border-radius:999px;background:rgba(20,32,48,.12);overflow:hidden}
  #jauge .pas b{display:block;height:100%;width:0;background:var(--bleu);border-radius:999px}
  #jaugetxt{position:absolute;left:90px;width:900px;text-align:right;font-size:30px;
    font-weight:600;color:rgba(20,32,48,.45);letter-spacing:2px}

  /* ── bloc 2b : l'orchestration ── */
  #orchestre{position:absolute;inset:0}
  #traits{position:absolute;inset:0}
  .satellite{position:absolute;display:flex;align-items:center;justify-content:center}
  .satellite .pastille{width:100%;height:100%}
  .satellite img{display:block;object-fit:contain;max-width:112px;max-height:88px}
  #halo{position:absolute;border-radius:999px;background:radial-gradient(circle,rgba(3,169,245,.34),rgba(3,169,245,0) 70%)}
  #centre{position:absolute;display:flex;align-items:center;justify-content:center;z-index:2}
  #centre .pastille{width:100%;height:100%;border-radius:34px;box-shadow:0 18px 44px rgba(20,32,48,.16)}
  #centre img{display:block;object-fit:contain}
  .reseau{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:26px;
    background:var(--blanc);box-shadow:0 10px 26px rgba(20,32,48,.12)}
  .reseau svg{display:block}

  /* ── bloc 3 : le hook de fin ── */
  #hook{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  #punch{position:absolute;left:80px;right:80px;text-align:center}
  #punch .l{font-size:76px;font-weight:700;line-height:1.2;color:var(--texte)}
  #punch .l.fort{color:var(--bleu)}
  #hooklogo{position:absolute;left:50%;display:flex;align-items:center;justify-content:center}
  #hooklogo img{display:block;object-fit:contain}
  #cta{position:absolute;left:0;right:0;text-align:center;font-size:40px;font-weight:600;
    letter-spacing:3px;color:rgba(20,32,48,.5)}

  #voile{position:absolute;inset:0;background:var(--fond);opacity:0}
</style>

<div id="scene">
  <div id="diagonales"></div>
  <div id="cartes"></div>
  <div id="jauge"></div>
  <div id="jaugetxt"></div>
  <div id="orchestre">
    <svg id="traits" viewBox="0 0 1080 1920" preserveAspectRatio="none"></svg>
    <div id="halo"></div>
    <div id="centre"><div class="pastille"><img id="centre-img"></div></div>
  </div>
  <div id="bandeau"></div>
  <div id="hook">
    <div id="punch"></div>
    <div id="hooklogo"><img id="hooklogo-img"></div>
    <div id="cta"></div>
  </div>
  <div id="transition">
    <div id="clap">
      <div class="stick"></div>
      <div class="corps"></div>
    </div>
    <div id="coupez">COUPEZ</div>
  </div>
  <div id="voile"></div>
</div>

<script>
const DATA = __DATA__;
const FPS = DATA.fps;
const px = (v) => v.toFixed(2) + "px";
const t = (f) => f / FPS;                       // temps local au module : 0 → 30 s

const lin = (x, a, b) => Math.max(0, Math.min(1, (x - a) / (b - a)));
const expoOut = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const backOut = (x) => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const T = DATA.blocs;

/* ─────────────────────────── le fond ─────────────────────────── */
const DIAGS = [
  { haut: 4,  ep: 250, c: "var(--bleu)",   a: 0.16, v: 30 },
  { haut: 27, ep: 110, c: "var(--violet)", a: 0.18, v: -22 },
  { haut: 45, ep: 380, c: "var(--bleu)",   a: 0.09, v: 16 },
  { haut: 71, ep: 150, c: "var(--violet)", a: 0.11, v: -26 },
  { haut: 87, ep: 88,  c: "var(--bleu)",   a: 0.19, v: 34 },
];
const diagEls = DIAGS.map((d) => {
  const el = document.createElement("div");
  el.className = "diag";
  el.style.cssText = `top:${d.haut}%;height:${d.ep}px;background:${d.c};opacity:${d.a}`;
  document.getElementById("diagonales").appendChild(el);
  return el;
});

/* ─────────────────── bloc 1 : l'ardoise et « COUPEZ » ─────────────────── */
const stick = document.querySelector("#clap .stick");
for (let i = 0; i < 8; i++) stick.appendChild(document.createElement("i"));
document.querySelector("#clap .corps").innerHTML = [
  ["SCÈNE", DATA.sequence],
  ["PRISE", "1"],
  ["", DATA.titre_episode],
].map(([k, v]) => `<div class="ligne"><span class="cle">${k}</span><span class="val">${v}</span></div>`).join("");

/* ─────────────────── bloc 2 : bandeau, cartes, jauge ─────────────────── */
const bandeau = document.getElementById("bandeau");
const BANDEAU = ["rapidocms", "elevenlabs"].map((nom) => {
  const pastille = document.createElement("div");
  pastille.className = "pastille";
  const img = document.createElement("img");
  img.src = DATA.logos[nom];
  pastille.appendChild(img);
  bandeau.appendChild(pastille);
  return { pastille, img };
});

const CARTES = DATA.etapes.map((e) => {
  const el = document.createElement("div");
  el.className = "carte";
  el.innerHTML = `<div class="chiffre">${e.n}</div><div class="corps">` +
    `<div class="titre">${e.titre}</div>` + (e.mono ? `<div class="mono">${e.mono}</div>` : "") + `</div>`;
  document.getElementById("cartes").appendChild(el);
  return el;
});
CARTES.forEach((el) => { el.style.top = px(930 - el.offsetHeight / 2); });

const jauge = document.getElementById("jauge");
jauge.style.top = "1290px";
const PAS = DATA.etapes.map(() => {
  const p = document.createElement("div");
  p.className = "pas";
  const b = document.createElement("b");
  p.appendChild(b);
  jauge.appendChild(p);
  return b;
});
const jaugetxt = document.getElementById("jaugetxt");
jaugetxt.style.top = "1330px";

/* ─────────────────── bloc 2b : l'orchestration ─────────────────── */
const CX = 540, CY = 900, RAYON = 330;
const centre = document.getElementById("centre");
const centreImg = document.getElementById("centre-img");
centreImg.src = DATA.logos[DATA.orchestration.centre];
const halo = document.getElementById("halo");
const traits = document.getElementById("traits");
const SATS = DATA.orchestration.orbite.map((nom, i, arr) => {
  const angle = -Math.PI / 2 + (i * 2 * Math.PI) / arr.length;
  const x = CX + RAYON * Math.cos(angle), y = CY + RAYON * Math.sin(angle);
  const el = document.createElement("div");
  el.className = "satellite";
  el.style.cssText = `left:${px(x - 78)};top:${px(y - 78)};width:156px;height:156px`;
  const pastille = document.createElement("div");
  pastille.className = "pastille";
  const img = document.createElement("img");
  img.src = DATA.logos[nom];
  pastille.appendChild(img);
  el.appendChild(pastille);
  document.getElementById("orchestre").appendChild(el);

  const trait = document.createElementNS("http://www.w3.org/2000/svg", "line");
  trait.setAttribute("stroke", "#03A9F5");
  trait.setAttribute("stroke-width", "7");
  trait.setAttribute("stroke-linecap", "round");
  trait.setAttribute("x1", CX); trait.setAttribute("y1", CY);
  trait.setAttribute("x2", x);  trait.setAttribute("y2", y);
  const long = Math.hypot(x - CX, y - CY);
  trait.setAttribute("stroke-dasharray", long);
  trait.setAttribute("stroke-dashoffset", long);
  traits.appendChild(trait);
  return { el, pastille, trait, long };
});

const RES = DATA.orchestration.reseaux.map((nom, i, arr) => {
  const pas = 186, largeur = 150;
  const x = CX - ((arr.length - 1) * pas) / 2 + i * pas;
  const el = document.createElement("div");
  el.className = "reseau";
  el.style.cssText = `left:${px(x - largeur / 2)};top:${px(CY + 470)};width:${largeur}px;height:${largeur}px`;
  el.innerHTML = DATA.reseaux_svg[nom];
  const svg = el.querySelector("svg");
  svg.setAttribute("width", "88"); svg.setAttribute("height", "88");
  svg.setAttribute("fill", DATA.couleurs_reseaux[nom]);
  document.getElementById("orchestre").appendChild(el);
  return el;
});

/* ─────────────────── bloc 3 : le hook de fin ─────────────────── */
const punch = document.getElementById("punch");
punch.innerHTML = DATA.hook.punchline
  .map((l, i) => `<div class="l${i === DATA.hook.punchline.length - 1 ? " fort" : ""}">${l}</div>`).join("");
const PUNCH = [...punch.querySelectorAll(".l")];
const hooklogo = document.getElementById("hooklogo");
const hooklogoImg = document.getElementById("hooklogo-img");
hooklogoImg.src = DATA.logos.rapidocms;
document.getElementById("cta").textContent = DATA.hook.cta || "";

/* ════════════════════════════ l'animation ════════════════════════════ */
const O = DATA.orchestration;
function seek(f) {
  const x = t(f);

  diagEls.forEach((el, i) => { el.style.transform = `translateX(${px(DIAGS[i].v * x)})`; });

  /* ── 0 → 3 s : l'ardoise monte, le clap claque, COUPEZ ── */
  const tr = document.getElementById("transition");
  const sortieTr = lin(x, T.transition[1] - 0.55, T.transition[1]);
  tr.style.opacity = String(1 - sortieTr);
  tr.style.display = x < T.transition[1] ? "block" : "none";
  if (x < T.transition[1]) {
    const monte = expoOut(lin(x, 0.10, 0.80));
    const clap = document.getElementById("clap");
    clap.style.top = px(1920 - monte * 1200);
    clap.style.transform = `scale(${(0.94 + 0.06 * monte).toFixed(4)})`;
    /* le bâton claque à 1,0 s : ouvert avant, fermé après, avec un petit rebond */
    const snap = lin(x, 0.86, 1.00);
    const rebond = x > 1.00 ? 5 * (1 - lin(x, 1.00, 1.16)) : 0;
    const angle = -32 * (1 - expoOut(snap)) - rebond;
    stick.style.transform = `rotate(${angle.toFixed(2)}deg)`;

    const cz = document.getElementById("coupez");
    const czIn = lin(x, 1.02, 1.20), czOut = lin(x, 2.30, 2.60);
    cz.style.top = px(1300);
    cz.style.opacity = String(czIn * (1 - czOut));
    cz.style.transform = `scale(${(0.72 + 0.28 * backOut(Math.max(czIn, 0.001))).toFixed(3)})`;
    /* la secousse du claquement, deux images seulement — déterministe, pour que deux
       rendus du même épisode donnent exactement le même fichier */
    const secousse = x >= 1.00 && x < 1.07 ? (f % 2 ? 7 : -7) : 0;
    document.getElementById("scene").style.transform = `translate(${secousse.toFixed(1)}px,0)`;
  } else {
    document.getElementById("scene").style.transform = "none";
  }

  /* ── 3 → 5 s : les deux logos arrivent, puis se rangent en haut ── */
  const [m0, m1] = T.methode;
  const arrivee = expoOut(lin(x, DATA.ouverture.debut_s, DATA.ouverture.debut_s + 0.9));
  const rangement = expoOut(lin(x, DATA.ouverture.fin_s - 0.6, DATA.ouverture.fin_s));
  const hauteur = 168 - 78 * rangement;
  bandeau.style.top = px(860 * (1 - rangement) + 64);
  bandeau.style.gap = px(64 - 20 * rangement);
  bandeau.style.opacity = String(arrivee * (1 - lin(x, T.hook[0] - 0.4, T.hook[0])));
  bandeau.style.transform = `translateY(${px(12 * (1 - arrivee))})`;
  BANDEAU.forEach(({ pastille, img }) => {
    img.style.height = px(hauteur);
    img.style.maxWidth = px(520 - 200 * rangement);
    pastille.style.padding = px(26 - 10 * rangement);
    pastille.style.borderRadius = px(26 - 8 * rangement);
  });

  /* ── 5 → 18 s : les cinq cartes, une par créneau de voix off ── */
  let active = -1;
  CARTES.forEach((el, i) => {
    const c = DATA.creneaux[i];
    const dedans = expoOut(lin(x, c.debut_s, c.debut_s + 0.18));
    const dehors = lin(x, c.fin_s - 0.12, c.fin_s);
    const o = dedans * (1 - dehors);
    el.style.opacity = String(o);
    el.style.transform = `translateX(${px(24 * (1 - dedans))})`;
    el.style.visibility = o > 0.001 ? "visible" : "hidden";
    if (x >= c.debut_s && x < c.fin_s) active = i;
  });
  const jaugeVisible = lin(x, DATA.creneaux[0].debut_s - 0.2, DATA.creneaux[0].debut_s + 0.2) *
                       (1 - lin(x, DATA.creneaux[4].fin_s - 0.25, DATA.creneaux[4].fin_s));
  jauge.style.opacity = String(jaugeVisible);
  jaugetxt.style.opacity = String(jaugeVisible);
  PAS.forEach((b, i) => {
    const c = DATA.creneaux[i];
    b.style.width = (100 * lin(x, c.debut_s, c.fin_s)).toFixed(1) + "%";
  });
  jaugetxt.textContent = active >= 0 ? `${active + 1} / ${DATA.etapes.length}` : "";

  /* ── 18 → 23 s : l'orchestration ── */
  const [o0, o1] = [O.debut_s, T.methode[1]];
  const orch = document.getElementById("orchestre");
  orch.style.opacity = String(lin(x, o0, o0 + 0.25) * (1 - lin(x, T.hook[0], T.hook[0] + 0.45)));

  const venue = expoOut(lin(x, o0, o0 + 0.7));
  const grossit = 0.86 + 0.14 * expoOut(lin(x, o0 + 0.7, o0 + 1.6));
  const largeurCentre = 296 * grossit, hauteurCentre = 150 * grossit;
  centre.style.left = px(CX - largeurCentre / 2);
  centre.style.top = px(CY - hauteurCentre / 2);
  centre.style.width = px(largeurCentre);
  centre.style.height = px(hauteurCentre);
  centre.style.opacity = String(venue);
  centre.style.transform = `scale(${(0.7 + 0.3 * backOut(Math.max(venue, 0.001))).toFixed(4)})`;
  centreImg.style.width = px(216 * grossit);

  /* chaque satellite tire son trait, et le centre pulse quand le trait arrive */
  let pulse = 0;
  SATS.forEach((s, i) => {
    const t0 = o0 + 0.9 + i * O.orbite_ecart_s;
    const apparait = expoOut(lin(x, t0, t0 + 0.32));
    s.el.style.opacity = String(apparait);
    s.el.style.transform = `scale(${(0.72 + 0.28 * backOut(Math.max(apparait, 0.001))).toFixed(4)})`;
    const trace = expoOut(lin(x, t0 + 0.1, t0 + 0.1 + O.trait_duree_s));
    s.trait.setAttribute("stroke-dashoffset", String(s.long * (1 - trace)));
    s.trait.setAttribute("opacity", String(0.85 * trace));
    const branche = t0 + 0.1 + O.trait_duree_s;
    if (x >= branche && x < branche + 0.35) pulse = Math.max(pulse, 1 - lin(x, branche, branche + 0.35));
  });
  const halot = 340 * (1 + 0.5 * pulse) * (venue > 0.01 ? 1 : 0);
  halo.style.width = px(halot); halo.style.height = px(halot);
  halo.style.left = px(CX - halot / 2); halo.style.top = px(CY - halot / 2);
  halo.style.opacity = String((0.35 + 0.5 * pulse) * venue * (1 - lin(x, T.hook[0], T.hook[0] + 0.45)));

  RES.forEach((el, i) => {
    const t0 = O.reseaux_debut_s + i * O.reseaux_ecart_s;
    const a = expoOut(lin(x, t0, t0 + 0.3));
    el.style.opacity = String(a);
    el.style.transform = `translateY(${px(8 * (1 - a))})`;
  });

  /* ── 23 → 30 s : le hook de fin ── */
  const [h0, h1] = T.hook;
  const hook = document.getElementById("hook");
  hook.style.opacity = String(lin(x, h0 + 0.25, h0 + 0.7));
  PUNCH.forEach((el, i) => {
    const t0 = h0 + 0.6 + i * 1.25;
    const a = expoOut(lin(x, t0, t0 + 0.42));
    el.style.opacity = String(a);
    el.style.transform = `translateY(${px(38 * (1 - a))})`;
  });
  punch.style.top = px(790);
  const lg = expoOut(lin(x, h0 + 3.3, h0 + 4.1));
  const lgL = 420 * (0.88 + 0.12 * lg);
  hooklogo.style.width = px(lgL);
  hooklogo.style.marginLeft = px(-lgL / 2);
  hooklogo.style.top = px(1160);
  hooklogo.style.opacity = String(lg);
  hooklogoImg.style.width = "100%";
  const cta = document.getElementById("cta");
  cta.style.top = px(1352);
  cta.style.opacity = String(expoOut(lin(x, h0 + 4.0, h0 + 4.6)));

  /* fondu final au fond clair */
  document.getElementById("voile").style.opacity = String(lin(x, h1 - O.fondu_blanc_s, h1));
}
window.seek = seek;
seek(0);
</script>
