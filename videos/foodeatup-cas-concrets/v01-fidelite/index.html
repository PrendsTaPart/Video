<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }

      .full {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }

      /* Fond du segment SOLUTION — élément MINUTÉ à part entière (data-start/duration),
         jamais un wrapper non minuté : un wrapper sans timing est peint sur toute la durée
         de la composition (bug constaté : il recouvrait HOOK et PROBLÈME). */
      #solution-bg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        background: radial-gradient(120% 70% at 50% 0%, #ffffff 0%, #fcf9e6 55%, #f4efd2 100%);
      }
      /* Logiciel affiché en pleine largeur, intégralement, sans recadrage ni coupe
         (demande explicite : "ne le coupe pas"), centré verticalement à l'écran. */
      #solution-video {
        position: absolute;
        top: 727.1px;
        left: 0;
        width: 1080px;
        height: 465.75px;
        box-shadow: 0 18px 40px rgba(15, 26, 35, 0.18);
      }
      /* Logo FoodEatUp en haut de l'écran — respire en continu pour garder de la vie. */
      #solution-logo {
        position: absolute;
        left: 50%;
        top: 110px;
        width: 420px;
        height: auto;
        filter: drop-shadow(0 6px 18px rgba(15, 26, 35, 0.12));
      }
      /* Trait d'accent sous le logiciel. */
      #solution-accent {
        position: absolute;
        left: 50%;
        top: 1233px;
        width: 96px;
        height: 6px;
        background: #ffa500;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="v01-fidelite"
      data-start="0"
      data-duration="36.3"
      data-width="1080"
      data-height="1920"
    >
      <!-- HOOK 0-3s -->
      <video
        id="seg-hook"
        class="clip full"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        src="assets/hook/hook-intro.mp4"
        muted
        playsinline
      ></video>

      <!-- PROBLÈME (Higgsfield) 3-11s -->
      <video
        id="seg-probleme"
        class="clip full"
        data-start="3"
        data-duration="8"
        data-track-index="0"
        data-media-start="0"
        src="assets/higgsfield/probleme.mp4"
        muted
        playsinline
      ></video>
      <audio
        id="seg-probleme-audio"
        src="assets/higgsfield/probleme.mp4"
        data-start="3"
        data-duration="8"
        data-media-start="0"
        data-track-index="10"
        data-volume="0.6"
      ></audio>

      <!-- SOLUTION (capture écran) 11-25s : fenêtre 14-28s de la source, pleine largeur,
           aucun recadrage. Silencieuse (capture d'écran ~ -91dB, pas de son exploitable).
           Fond + logiciel + accents sont 3 clips minutés SIBLINGS (pas de wrapper non
           minuté) pour ne jamais déborder de leur fenêtre 11-25s. -->
      <div id="solution-bg" class="clip" data-start="11" data-duration="14" data-track-index="0"></div>
      <video
        id="solution-video"
        class="clip"
        data-start="11"
        data-duration="14"
        data-track-index="1"
        data-media-start="14"
        src="assets/solution/programme-fidelite.mp4"
        muted
        playsinline
      ></video>
      <div id="solution-accent" class="clip" data-start="11" data-duration="14" data-track-index="2"></div>
      <img
        id="solution-logo"
        class="clip"
        data-start="11"
        data-duration="14"
        data-track-index="3"
        src="assets/brand/foodeatup-logo-mascot.png"
        alt="FoodEatUp"
      />

      <!-- RÉSULTAT (HeyGen) 25-32.298s -->
      <video
        id="seg-resultat"
        class="clip full"
        data-start="25"
        data-duration="7.298"
        data-track-index="0"
        data-media-start="0"
        src="assets/heygen/resultat.mp4"
        muted
        playsinline
      ></video>
      <audio
        id="seg-resultat-audio"
        src="assets/heygen/resultat.mp4"
        data-start="25"
        data-duration="7.298"
        data-media-start="0"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- PUNCHLINE 32.3-36.3s -->
      <video
        id="seg-punchline"
        class="clip full"
        data-start="32.3"
        data-duration="4"
        data-track-index="0"
        src="assets/punchline/punchline-outro.mp4"
        muted
        playsinline
      ></video>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Capture écran affichée en pleine largeur (1080px = largeur source complète, échelle
      // 0.5625), intégralement, sans recadrage : rien n'est coupé. Centrée verticalement.
      gsap.set("#solution-video", { opacity: 0, y: -12 });
      gsap.set("#solution-accent", { xPercent: -50, scaleX: 0, transformOrigin: "50% 50%" });
      gsap.set("#solution-logo", { xPercent: -50, scale: 0, rotate: -6, transformOrigin: "50% 50%" });

      // Le timeline racine couvre les 36.3s de la vidéo entière : ces tweens sont donc
      // positionnés au temps ABSOLU où le segment SOLUTION est actif (data-start="11").
      const SOLUTION_START = 11;
      const tl = gsap.timeline({ paused: true });
      // le logo FoodEatUp claque en haut en premier
      tl.to(
        "#solution-logo",
        { xPercent: -50, scale: 1, rotate: 0, duration: 0.6, ease: "back.out(2.2)" },
        SOLUTION_START
      );
      tl.to(
        "#solution-video",
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        SOLUTION_START + 0.3
      );
      tl.to(
        "#solution-accent",
        { xPercent: -50, scaleX: 1, duration: 0.4, ease: "power2.out" },
        SOLUTION_START + 0.8
      );
      // respiration continue du logo pendant tout le hold, pour garder de la vie en haut
      tl.to(
        "#solution-logo",
        { xPercent: -50, scale: 1.06, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 6 },
        SOLUTION_START + 1.4
      );

      window.__timelines["v01-fidelite"] = tl;
    </script>
  </body>
</html>
