<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }

      .full {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }

      /* Segment SOLUTION+RÉSULTAT fusionné : avatar HeyGen en haut qui présente,
         logiciel en bas. Chaque élément est un clip MINUTÉ à part entière (data-start/
         duration), jamais un wrapper non minuté (bug déjà rencontré : un wrapper sans
         timing est peint sur toute la durée de la composition). */
      #solution-bg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        background: radial-gradient(120% 70% at 50% 0%, #ffffff 0%, #fcf9e6 55%, #f4efd2 100%);
      }
      /* Avatar en haut : recadré (object-fit: cover) sur sa propre boîte, buste + visage,
         pas de déformation. */
      #solution-avatar {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1250px;
        object-fit: cover;
        object-position: 50% 12%;
      }
      /* Trait d'accent entre l'avatar et le logiciel. */
      #solution-accent {
        position: absolute;
        left: 50%;
        top: 1290px;
        width: 96px;
        height: 6px;
        background: #ffa500;
        border-radius: 6px;
      }
      /* Logiciel en bas, pleine largeur, intégralement, sans recadrage ni coupe
         (demande explicite : "ne le coupe pas"). */
      #solution-video {
        position: absolute;
        top: 1350px;
        left: 0;
        width: 1080px;
        height: 465.75px;
        box-shadow: 0 18px 40px rgba(15, 26, 35, 0.18);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="v01-fidelite"
      data-start="0"
      data-duration="29"
      data-width="1080"
      data-height="1920"
    >
      <!-- HOOK 0-3s -->
      <video
        id="seg-hook"
        class="clip full"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        src="assets/hook/hook-intro.mp4"
        muted
        playsinline
      ></video>

      <!-- PROBLÈME (Higgsfield) 3-11s -->
      <video
        id="seg-probleme"
        class="clip full"
        data-start="3"
        data-duration="8"
        data-track-index="0"
        data-media-start="0"
        src="assets/higgsfield/probleme.mp4"
        muted
        playsinline
      ></video>
      <audio
        id="seg-probleme-audio"
        src="assets/higgsfield/probleme.mp4"
        data-start="3"
        data-duration="8"
        data-media-start="0"
        data-track-index="10"
        data-volume="0.6"
      ></audio>

      <!-- SOLUTION + RÉSULTAT fusionnés, 11-25s (14s) : le logiciel est visible tout le
           segment, l'avatar HeyGen apparaît par-dessus (en haut) et le présente à la voix,
           depuis 11.3s pour sa durée réelle (7.298s), avant de laisser le logiciel seul
           pour les dernières secondes. -->
      <div id="solution-bg" class="clip" data-start="11" data-duration="14" data-track-index="0"></div>
      <video
        id="solution-video"
        class="clip"
        data-start="11"
        data-duration="14"
        data-track-index="1"
        data-media-start="14"
        src="assets/solution/programme-fidelite.mp4"
        muted
        playsinline
      ></video>
      <div id="solution-accent" class="clip" data-start="11" data-duration="14" data-track-index="2"></div>
      <video
        id="solution-avatar"
        class="clip"
        data-start="11.3"
        data-duration="7.298"
        data-track-index="3"
        data-media-start="0"
        src="assets/heygen/resultat.mp4"
        muted
        playsinline
      ></video>
      <audio
        id="solution-avatar-audio"
        src="assets/heygen/resultat.mp4"
        data-start="11.3"
        data-duration="7.298"
        data-media-start="0"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- PUNCHLINE 25-29s -->
      <video
        id="seg-punchline"
        class="clip full"
        data-start="25"
        data-duration="4"
        data-track-index="0"
        src="assets/punchline/punchline-outro.mp4"
        muted
        playsinline
      ></video>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      gsap.set("#solution-video", { opacity: 0, y: -12 });
      gsap.set("#solution-accent", { xPercent: -50, scaleX: 0, transformOrigin: "50% 50%" });
      gsap.set("#solution-avatar", { opacity: 0, scale: 1.04, transformOrigin: "50% 0%" });

      // Le timeline racine couvre toute la composition (29s) : ces tweens sont donc
      // positionnés au temps ABSOLU où le segment est actif (data-start="11").
      const SOLUTION_START = 11;
      const tl = gsap.timeline({ paused: true });
      // le logiciel s'installe en premier, discrètement, en fond
      tl.to(
        "#solution-video",
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        SOLUTION_START
      );
      tl.to(
        "#solution-accent",
        { xPercent: -50, scaleX: 1, duration: 0.4, ease: "power2.out" },
        SOLUTION_START + 0.4
      );
      // l'avatar arrive juste avant de commencer à parler (11.3s)
      tl.to(
        "#solution-avatar",
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
        SOLUTION_START + 0.3
      );
      // et disparaît en douceur une fois sa réplique terminée (11.3 + 7.298 = 18.598s),
      // pour laisser le logiciel seul le temps restant
      tl.to(
        "#solution-avatar",
        { opacity: 0, duration: 0.5, ease: "power2.in" },
        SOLUTION_START + 7.4
      );

      window.__timelines["v01-fidelite"] = tl;
    </script>
  </body>
</html>
