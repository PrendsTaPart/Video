<!doctype html>
<html
  lang="fr"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"num1","type":"string","label":"Ligne 1 — chiffre","default":"250"},
    {"id":"rest1","type":"string","label":"Ligne 1 — texte","default":"couverts aujourd’hui."},
    {"id":"num2","type":"string","label":"Ligne 2 — chiffre","default":"10"},
    {"id":"rest2","type":"string","label":"Ligne 2 — texte","default":"clients fidèles."}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fredoka";
        src: url("assets/vendor/fonts/fredoka-400.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Fredoka";
        src: url("assets/vendor/fonts/fredoka-700.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: #0b1620;
      }
      body { font-family: "Fredoka", sans-serif; }

      #bg {
        position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 50% 30%, #1b2a41 0%, #0f1a23 55%, #0b1620 100%);
      }
      #vignette {
        position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 50% 100%, rgba(0,0,0,.55) 0%, transparent 60%);
      }

      #hook-stack {
        position: absolute; left: 0; right: 0; top: 46%;
        transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center;
        gap: 28px; padding: 0 72px; text-align: center;
      }
      .hook-line {
        display: flex; flex-wrap: wrap; justify-content: center;
        align-items: baseline; gap: 0 22px; line-height: 1.05;
      }
      .hook-num {
        font-weight: 700; font-size: 168px; color: #ffa500;
        text-shadow: 0 6px 0 rgba(0,0,0,.25);
        transform-origin: 50% 60%; opacity: 0;
      }
      .hook-rest {
        font-weight: 700; font-size: 82px; color: #fcf9e6;
        letter-spacing: -.5px; opacity: 0;
      }
      /* un hook peut n'avoir qu'une des deux parties sur une ligne */
      .hook-num:empty, .hook-rest:empty { display: none; }

      #eight-mark {
        position: absolute; left: 50%; bottom: 150px;
        width: 96px; height: auto; opacity: 0;
        filter: drop-shadow(0 0 24px rgba(0,123,255,.45));
      }
      #brandline {
        position: absolute; left: 0; right: 0; bottom: 88px;
        text-align: center; color: #7f8ea3; font-weight: 700;
        font-size: 30px; letter-spacing: 4px; text-transform: uppercase; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hook-card"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>

      <div id="hook-stack" class="clip" data-start="0" data-duration="3" data-track-index="2">
        <div class="hook-line">
          <span id="num1" class="hook-num" data-var-text="num1">250</span>
          <span id="rest1" class="hook-rest" data-var-text="rest1">couverts aujourd’hui.</span>
        </div>
        <div class="hook-line">
          <span id="num2" class="hook-num" data-var-text="num2">10</span>
          <span id="rest2" class="hook-rest" data-var-text="rest2">clients fidèles.</span>
        </div>
      </div>

      <img
        id="eight-mark" class="clip" data-start="0" data-duration="3" data-track-index="3"
        src="assets/brand/foodeatup-mark-eight.png" alt=""
      />
      <div id="brandline" class="clip" data-start="0" data-duration="3" data-track-index="4">FoodEatUp</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      gsap.set(["#num1", "#num2"], { scale: 0, rotate: -8, opacity: 0 });
      gsap.set(["#rest1", "#rest2"], { opacity: 0, y: 18 });
      gsap.set("#eight-mark", { xPercent: -50, scale: 0, opacity: 0 });
      gsap.set("#brandline", { opacity: 0, y: 10 });

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      tl.to("#num1", { scale: 1, rotate: 0, opacity: 1, duration: 0.55, ease: "back.out(2.4)" }, 0.08);
      tl.to("#rest1", { opacity: 1, y: 0, duration: 0.35 }, 0.3);
      tl.to("#num2", { scale: 1, rotate: 0, opacity: 1, duration: 0.55, ease: "back.out(2.4)" }, 0.5);
      tl.to("#rest2", { opacity: 1, y: 0, duration: 0.35 }, 0.72);
      tl.to("#eight-mark", { xPercent: -50, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.95);
      tl.to("#brandline", { opacity: 1, y: 0, duration: 0.4 }, 1.05);
      tl.to("#eight-mark", { xPercent: -50, scale: 1.06, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.6);

      window.__timelines["hook-card"] = tl;
    </script>
  </body>
</html>
