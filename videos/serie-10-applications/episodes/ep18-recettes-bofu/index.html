<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Série 10 applications FoodEatUp</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0F1A23;--surf:#16242F;--bleu:#007BFF;--orange:#FFA500;--creme:#FCF9E6;--gris:#AEB8C2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--nuit);font-family:Poppins,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1200px 900px at 50% 38%,#163049 0%,#0F1A23 62%)}
#wm{position:absolute;inset:-200px;background-image:url(../../img/toque.png);background-size:180px;opacity:.035;transform:rotate(-12deg)}
#top{position:absolute;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:20}
.pill{background:#fff;border-radius:60px;padding:16px 30px;display:flex;align-items:center;gap:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pill img{height:56px}.pill b{font-size:30px;color:var(--nuit);font-weight:800;white-space:nowrap}
#etiq{background:var(--orange);color:#000;font-weight:800;font-size:28px;border-radius:40px;padding:14px 26px;white-space:nowrap}
#note{position:absolute;top:268px;left:0;right:0;text-align:center;z-index:20}
#note span{display:inline-block;background:rgba(255,255,255,.12);color:var(--creme);font-weight:600;font-size:28px;border-radius:30px;padding:8px 22px;border:2px solid rgba(255,255,255,.25)}
.sc{position:absolute;inset:0;display:none}
.big{position:absolute;left:60px;right:60px;top:640px;text-align:center;color:#fff;font-weight:900;font-size:132px;line-height:1.08;letter-spacing:-2px}
.big i{font-style:normal;background:var(--orange);color:#000;padding:0 22px;border-radius:22px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lab{position:absolute;left:0;right:0;top:330px;text-align:center}
.lab span{display:inline-block;background:var(--bleu);color:#fff;font-weight:800;font-size:58px;border-radius:26px;padding:12px 40px;box-shadow:0 12px 0 rgba(0,0,0,.35)}
.dev{position:absolute;left:50%;background:#05080b;box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 3px #2a3a48;overflow:hidden}
.dev img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.dev.ph{border-radius:70px;padding:18px}.dev.ph img{border-radius:54px}
.dev.tb{border-radius:44px;padding:22px}.dev.tb img{border-radius:24px}
.cta{position:absolute;left:0;right:0;top:470px;text-align:center}
.cta .logo{display:inline-block;background:#fff;border-radius:50px;padding:34px 60px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cta .logo img{height:120px;display:block}
.cta h2{color:#fff;font-size:62px;font-weight:800;margin-top:44px}
.cta .k{display:inline-block;margin-top:34px;background:var(--orange);color:#000;font-weight:900;font-size:150px;line-height:1;border-radius:40px;padding:34px 60px;box-shadow:0 18px 0 #000}
.cta small{display:block;color:#000;font-size:36px;font-weight:800;margin-bottom:12px}
.cta .site{color:var(--creme);font-size:40px;font-weight:600;margin-top:60px}
.cta .ep{display:inline-block;margin-top:36px;color:var(--gris);font-size:32px;font-weight:700;border:3px solid #2a3a48;border-radius:30px;padding:10px 28px}
#cap{position:absolute;left:60px;right:60px;top:1590px;text-align:center;font-weight:800;font-size:66px;line-height:1.2;color:#fff;text-shadow:0 5px 0 #000,0 0 18px rgba(0,0,0,.8);z-index:30}
#cap .on{color:var(--orange)}
#bar{position:absolute;left:0;bottom:0;height:12px;background:var(--bleu);z-index:40}
</style></head><body><div id="stage"><div id="wm"></div>
<div id="top"><div class="pill"><img src="../../img/foodeatup.png"><b id="appn"></b></div><div id="etiq"></div></div>
<div id="note"></div><div id="scenes"></div><div id="cap"></div><div id="bar"></div></div>
<script src="cfg.js"></script>
<script>
const C=window.CFG, E=C.ep;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), eo=x=>1-Math.pow(1-cl(x),3);
const ebk=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
document.getElementById('appn').textContent=E.nom;
document.getElementById('etiq').textContent=E.etiq;
if(E.note)document.getElementById('note').innerHTML='<span>'+E.note+'</span>';
const hl=s=>s.replace(/\*(.+?)\*/g,'<i>$1</i>');
const box=document.getElementById('scenes'),SC=[];
C.scenes.forEach((s,k)=>{const d=document.createElement('div');d.className='sc';const v=s.v,typ=v[0],body=v.slice(2);
 let items=[];
 if(typ==='B'){d.innerHTML='<div class="big">'+hl(body)+'</div>';}
 else if(typ==='P'||typ==='D'){const [imgs,lab]=body.split('|');const L=imgs.split(',');
  d.innerHTML='<div class="lab"><span>'+lab+'</span></div>'+L.map((f,i)=>'<div class="dev" data-i="'+i+'"><img src="../../ecrans/'+f+'"></div>').join('');}
 else if(typ==='C'){d.innerHTML='<div class="cta"><div class="logo"><img src="../../img/foodeatup.png"></div><h2>'+E.nom+'</h2><div class="k"><small>Écris en commentaire</small>'+body+'</div><div class="site">'+E.site+'</div><div><span class="ep">Épisode '+E.n+'/30 · Les 10 applis FoodEatUp</span></div></div>';}
 box.appendChild(d);SC.push({d,typ,t0:s.t0,t1:s.t1});});
// mise en page des écrans une fois les images chargées
function layout(){SC.forEach(s=>{const devs=[...s.d.querySelectorAll('.dev')];if(!devs.length)return;
 const ims=devs.map(d=>d.querySelector('img'));const land=ims.map(im=>im.naturalWidth>im.naturalHeight*1.05);
 devs.forEach((d,i)=>{let w,h,top,x;const r=ims[i].naturalHeight/ims[i].naturalWidth||2;
  if(devs.length===1){if(land[i]){w=980;h=Math.round((w-44)*r+44);top=Math.max(460,930-h/2);}else{w=640;h=Math.min(1100,Math.round((w-36)*r+36));top=460;}x=-w/2;}
  else if(land[0]!==land[1]){const tr=ims[land[0]?0:1].naturalHeight/ims[land[0]?0:1].naturalWidth;const th=Math.round(856*tr+44);if(land[i]){w=900;h=th;top=450;x=-490;}else{w=400;h=Math.min(860,Math.round(364*r+36));top=450+th-140;x=60;}}
  else{if(land[0]&&land[1]){w=900;h=Math.round((w-44)*r+44);top=i?480+h+40:460;x=-w/2+(i?40:-40);}else{w=470;h=Math.min(1000,Math.round((w-36)*r+36));top=i?540:470;x=i?20:-490;}}
  d.className='dev '+(land[i]?'tb':'ph');Object.assign(d.style,{width:w+'px',height:h+'px',top:top+'px',marginLeft:x+'px'});d.dataset.rot=devs.length>1&&!land[0]&&!land[1]?(i?3:-3):0;});});}
let GR=null;function groups(){GR=[];let g=[];C.words.forEach((w,k)=>{g.push(k);const nx=C.words[k+1];if(g.length>=4||/[.,:;?!…]$/.test(w[0])||(nx&&nx[2]!==w[2])){GR.push(g);g=[];}});if(g.length)GR.push(g);}
function render(t){if(!GR){layout();groups();}
 SC.forEach((s,k)=>{const on=t>=s.t0&&t<s.t1;s.d.style.display=on?'block':'none';if(!on)return;const u=t-s.t0;
  if(s.typ==='B'){const b=s.d.querySelector('.big');const p=ebk(u/0.35);b.style.transform=`scale(${1.35-0.35*p})`;b.style.opacity=cl(u/0.15);}
  if(s.typ==='P'||s.typ==='D'){const lab=s.d.querySelector('.lab');lab.style.transform=`translateY(${(1-ebk(u/0.4))*-80}px)`;lab.style.opacity=cl(u/0.2);
   s.d.querySelectorAll('.dev').forEach((d,i)=>{const p=eo((u-i*0.15)/0.5);const z=1+0.04*cl(u/(s.t1-s.t0));d.style.opacity=cl((u-i*0.15)/0.2);d.style.transform=`translateY(${(1-p)*300}px) rotate(${d.dataset.rot}deg) scale(${z})`;});}
  if(s.typ==='C'){const k2=s.d.querySelector('.k');const p=ebk(u/0.45);k2.style.transform=`scale(${(0.5+0.5*p)*(1+0.03*Math.sin(u*6))})`;s.d.querySelector('.logo').style.transform=`translateY(${(1-eo(u/0.4))*-200}px)`;}
 });
 const cap=document.getElementById('cap');const last=SC[SC.length-1];
 if(t>=last.t0&&last.typ==='C'){cap.innerHTML='';}else{let gi=-1;GR.forEach((g,i)=>{if(C.words[g[0]][1]<=t+0.05)gi=i;});
  cap.innerHTML=gi<0?'':GR[gi].map(k=>'<span class="'+(C.words[k][1]<=t+0.02&&(k===GR[gi][GR[gi].length-1]||C.words[k+1][1]>t)?'on':'')+'">'+C.words[k][0]+'</span>').join(' ');}
 document.getElementById('bar').style.width=(100*t/C.dur)+'%';}
window.thumb=()=>{render(C.thumbT);const cp=document.getElementById('cap');cp.style.top='1300px';cp.innerHTML='<span style="font-size:92px;line-height:1.1;display:block;background:var(--orange);color:#000;text-shadow:none;border-radius:30px;padding:24px 20px">'+E.titreCourt+'</span>';};
</script></body></html>
