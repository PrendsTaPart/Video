<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f7-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f7-brokenline { position: absolute; left: 200px; right: 200px; top: 300px; height: 2px; }
        .f7-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.45; transform-origin: 0% 50%; }

        .f7-lines { position: absolute; left: 0; right: 0; top: 420px; text-align: center; }
        .f7-l1 { font-size: 62px; font-weight: 700; line-height: 1.3; }
        .f7-l2 { font-size: 62px; font-weight: 700; line-height: 1.3; margin-top: 8px; }
        .f7-l2 .em { font-weight: 700; }
        .f7-l3 { font-size: 34px; font-weight: 500; color: rgba(58,63,69,0.85); margin-top: 34px; }
        .f7-calendar { position: absolute; left: 0; right: 0; top: 700px; text-align: center; }
        .f7-calendar img { width: 300px; height: auto; opacity: 0; filter: grayscale(1) contrast(1.05); }
      </style>

      <div id="root" data-composition-id="07-vrai-chiffre" data-width="1920" data-height="1080">
        <div class="f7-bg clip" id="f7-bgclip" data-start="0" data-duration="10.919" data-track-index="1"></div>

        <div class="f7-brokenline" id="f7-brokenline">
          <span style="left:4%; width:16%;"></span>
          <span style="left:26%; width:20%; top:-3px;"></span>
          <span style="left:52%; width:14%; top:2px;"></span>
          <span style="left:72%; width:22%;"></span>
        </div>

        <div class="f7-lines">
          <div class="f7-l1" id="f7-l1">Le vrai chiffre du mois ?</div>
          <div class="f7-l2" id="f7-l2">Je ne le saurai que dans <span class="em">six semaines</span>.</div>
          <div class="f7-l3" id="f7-l3">le temps que quelqu'un, quelque part, recopie tout ça à la main.</div>
        </div>
        <div class="f7-calendar"><img id="f7-calendar-img" src="public/generated/08-calendrier.jpg" alt="" /></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f7-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#f7-l1", { opacity: 0, y: 14 });
        gsap.set("#f7-l2", { opacity: 0, y: 14 });
        gsap.set("#f7-l3", { opacity: 0, y: 10 });
        gsap.set("#f7-calendar-img", { opacity: 0, y: 10 });

        // Scene 1 (0.0-1.53s): broken line draws itself on segment by segment (a pen dragging
        // and lifting between disconnected strokes — one last, more visible pass of the motif);
        // "Le vrai chiffre du mois ?" slides up
        tl.to("#f7-brokenline span", { opacity: 0.45, duration: 0.01 }, 0.1);
        tl.to("#f7-brokenline span", { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.07 }, 0.1);
        tl.to("#f7-l1", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.35);

        // Scene 2 (1.53-3.74s): "Je ne le saurai que dans six semaines." — second line reveals
        tl.to("#f7-l2", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.7);

        // Scene 3 (3.74-7.42s): "Le temps que quelqu'un, quelque part, recopie tout ça à la main." — third, smaller line
        tl.to("#f7-l3", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.9);
        tl.to("#f7-calendar-img", { opacity: 0.8, y: 0, duration: 0.5, ease: "power3.out" }, 4.5);

        // Scene 4 (7.42-10.919s): hold, ~3.5s — subtle jitter on the broken line only
        const f7phase = { p: 0 };
        tl.to(f7phase, {
          p: Math.PI * 2 * 1.1, duration: 3.2, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f7phase.p);
            gsap.set("#f7-brokenline", { y: s * 1.5 });
          }
        }, 7.55);

        window.__timelines["07-vrai-chiffre"] = tl;
      </script>
    </template>
  </body>
</html>
