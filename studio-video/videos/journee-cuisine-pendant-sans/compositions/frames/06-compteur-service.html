<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .c6-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .c6-brokenline { position: absolute; left: 140px; right: 140px; top: 940px; height: 2px; }
        .c6-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.5; transform-origin: 0% 50%; }

        .c6-stats { position: absolute; left: 260px; top: 150px; width: 1400px; }
        .c6-row { display: flex; align-items: baseline; gap: 34px; margin-bottom: 20px; }
        .c6-row .num { font-size: 130px; font-weight: 800; color: #D64545; font-variant-numeric: tabular-nums; min-width: 220px; text-align: right; }
        .c6-row .label { font-size: 36px; font-weight: 600; color: rgba(58,63,69,0.85); }
        .c6-rowwrap { margin-bottom: 30px; }
        .c6-barrail { position: relative; height: 6px; width: 860px; margin: 12px 0 0 254px; background: rgba(58,63,69,0.08); }
        .c6-barfill { position: absolute; inset: 0; background: #D64545; opacity: 0.55; transform-origin: 0% 50%; transform: scaleX(0); }

        .c6-chip {
          position: absolute; left: 640px; top: 760px; width: 660px; height: 130px;
          border: 2px solid #D64545; border-radius: 14px;
          display: flex; align-items: center; justify-content: center; gap: 20px;
          opacity: 0;
        }
        .c6-chip .dot { width: 18px; height: 18px; border-radius: 50%; background: #D64545; }
        .c6-chip .msg { font-size: 40px; font-weight: 700; color: #D64545; text-transform: uppercase; letter-spacing: 0.04em; }
      </style>

      <div id="root" data-composition-id="06-compteur-service" data-width="1920" data-height="1080" data-duration="12.0">
        <div class="c6-bg clip" id="c6-bgclip" data-start="0" data-duration="12.0" data-track-index="1"></div>

        <div class="c6-brokenline" id="c6-brokenline">
          <span style="left:2%; width:14%;"></span>
          <span style="left:22%; width:18%; top:-3px;"></span>
          <span style="left:46%; width:12%; top:2px;"></span>
          <span style="left:64%; width:20%;"></span>
          <span style="left:88%; width:10%; top:-2px;"></span>
        </div>

        <div class="c6-stats">
          <div class="c6-rowwrap">
            <div class="c6-row" id="c6-row1"><div class="num" id="c6-n1">0</div><div class="label">tickets perdus</div></div>
            <div class="c6-barrail"><div class="c6-barfill" id="c6-bar1"></div></div>
          </div>
          <div class="c6-rowwrap">
            <div class="c6-row" id="c6-row2"><div class="num" id="c6-n2">0</div><div class="label">plats renvoyés</div></div>
            <div class="c6-barrail"><div class="c6-barfill" id="c6-bar2"></div></div>
          </div>
        </div>

        <div class="c6-chip" id="c6-chip">
          <div class="dot" id="c6-dot"></div>
          <div class="msg">le service n'est pas fini</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set(["#c6-row1", "#c6-row2"], { opacity: 0, y: 16 });
        gsap.set("#c6-chip", { opacity: 0, scale: 0.92 });
        gsap.set("#c6-brokenline span", { opacity: 0, scaleX: 0 });

        // broken line draws itself on, segment by segment
        tl.to("#c6-brokenline span", { opacity: 0.5, duration: 0.01 }, 0);
        tl.to("#c6-brokenline span", { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 0.05);

        function countUp(id, barId, target, max, dur, at) {
          const el = document.getElementById(id);
          const state = { v: 0 };
          tl.to(state, {
            v: target, duration: dur, ease: "power2.out",
            onUpdate: () => { el.textContent = Math.round(state.v); }
          }, at);
          if (barId) {
            tl.fromTo(`#${barId}`, { scaleX: 0 }, { scaleX: Math.min(1, target / max), duration: dur, ease: "power2.out" }, at);
          }
        }

        // Scene 1 (0.0-1.9s, cue "Quatre tickets perdus."): row 1, count 0->4 + bar
        tl.to("#c6-row1", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
        countUp("c6-n1", "c6-bar1", 4, 6, 1.2, 0.3);

        // Scene 2 (1.9-3.9s, cue "Deux plats renvoyés."): row 2, count 0->2 + bar
        tl.to("#c6-row2", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.0);
        countUp("c6-n2", "c6-bar2", 2, 6, 1.1, 2.1);

        // Scene 3 (3.9-6.3s, cue "Et le service n'est pas fini."): stats compress up slightly,
        // the alert chip lands — a pulsing dot rather than a resolved checkmark, because
        // nothing here is actually resolved.
        tl.to("#c6-stats", { y: -14, duration: 0.5, ease: "power3.out" }, 4.0);
        tl.to("#c6-chip", { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 4.4);

        // continuous pulsing dot for the rest of the frame — the counter is still running
        const c6dot = { p: 0 };
        tl.to(c6dot, {
          p: Math.PI * 2 * 4.2, duration: 7.0, ease: "none",
          onUpdate: () => {
            const s = (Math.sin(c6dot.p) + 1) / 2;
            gsap.set("#c6-dot", { opacity: 0.4 + s * 0.6, scale: 0.85 + s * 0.25 });
          }
        }, 4.6);

        // Scene 4 (6.3-11.5s): hold — subtle jitter on the chip only
        const c6phase = { p: 0 };
        tl.to(c6phase, {
          p: Math.PI * 2 * 1.5, duration: 3.5, ease: "none",
          onUpdate: () => {
            const s = Math.sin(c6phase.p);
            gsap.set("#c6-chip", { y: s * 1.4 });
          }
        }, 8.0);

        window.__timelines["06-compteur-service"] = tl;
      </script>
    </template>
  </body>
</html>
