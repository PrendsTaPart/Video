<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .c3-bg { position: absolute; inset: 0; background: #EDEEF0; overflow: hidden; }
        .c3-stage { position: absolute; inset: 0; }

        .c3-brokenline { position: absolute; left: 140px; right: 140px; top: 130px; height: 2px; }
        .c3-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.55; transform-origin: 0% 50%; }

        .c3-photo {
          position: absolute; right: 150px; top: 200px; width: 760px; height: 560px;
          border: 1px solid #8A9099; overflow: hidden;
          box-shadow: 0 24px 54px rgba(20,22,25,0.14);
          opacity: 0;
        }
        .c3-photo img {
          width: 100%; height: 100%; object-fit: cover;
          filter: grayscale(0.75) contrast(1.08) brightness(1.0);
          display: block;
        }

        .c3-ticket {
          position: absolute; left: 260px; top: 210px; width: 220px; height: 130px;
          background: #EDEEF0; border: 1px solid #8A9099;
          box-shadow: 0 14px 28px rgba(20,22,25,0.12);
          opacity: 0;
        }
        .c3-cross {
          position: absolute; left: 300px; top: 250px; width: 140px; height: 140px;
          opacity: 0;
        }
        .c3-cross span {
          position: absolute; left: 50%; top: 50%; width: 150px; height: 5px;
          background: #D64545; transform-origin: 50% 50%;
        }
        .c3-cross span.a { transform: translate(-50%,-50%) rotate(45deg); }
        .c3-cross span.b { transform: translate(-50%,-50%) rotate(-45deg); }

        .c3-lines { position: absolute; left: 140px; top: 460px; width: 760px; }
        .c3-l1 { font-size: 50px; font-weight: 600; line-height: 1.35; opacity: 0; }
        .c3-l2 { font-size: 50px; font-weight: 700; line-height: 1.35; margin-top: 10px; opacity: 0; color: #D64545; }
      </style>

      <div id="root" data-composition-id="03-bon-froisse" data-width="1920" data-height="1080" data-duration="10.0">
        <div class="c3-bg clip" id="c3-bgclip" data-start="0" data-duration="10.0" data-track-index="1"></div>

        <div class="c3-stage">
          <div class="c3-brokenline" id="c3-brokenline">
            <span style="left:4%; width:16%;"></span>
            <span style="left:26%; width:20%; top:-3px;"></span>
            <span style="left:52%; width:14%; top:2px;"></span>
            <span style="left:72%; width:22%;"></span>
          </div>

          <div class="c3-photo" id="c3-photo">
            <img src="public/generated/b3-bon-froisse.jpg" alt="" />
          </div>

          <div class="c3-ticket" id="c3-ticket"></div>
          <div class="c3-cross" id="c3-cross"><span class="a"></span><span class="b"></span></div>

          <div class="c3-lines">
            <div class="c3-l1" id="c3-l1">Un bon tombe, se froisse sous une plaque chaude.</div>
            <div class="c3-l2" id="c3-l2">Retrouvé trop tard.</div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#c3-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#c3-photo", { opacity: 0, x: 30 });
        gsap.set("#c3-ticket", { opacity: 0, y: -160, rotate: -8 });
        gsap.set("#c3-cross", { opacity: 0, scale: 0.6 });
        gsap.set(["#c3-l1", "#c3-l2"], { opacity: 0, y: 14 });

        // Scene 1 (0.0-1.0s): broken line draws itself on — the film's time-passing motif
        tl.to("#c3-brokenline span", { opacity: 0.55, duration: 0.01 }, 0.15);
        tl.to("#c3-brokenline span", { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.09 }, 0.15);

        // Scene 2 (0.6-1.6s): the photo settles in on the right
        tl.to("#c3-photo", { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.6);

        // Scene 3 (1.6-3.4s, cue "Un bon tombe, se froisse sous une plaque chaude."): the ticket
        // drops and lands askew — a real fall, not a fade.
        tl.to("#c3-l1", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.65);
        tl.to("#c3-ticket", { opacity: 1, y: 0, rotate: -14, duration: 0.6, ease: "power2.in" }, 2.0);
        tl.to("#c3-ticket", { rotate: -10, duration: 0.15, ease: "power1.out" }, 2.6);

        // Scene 4 (3.4-5.5s, cue "Je le retrouve trop tard."): the red cross stamps the ticket —
        // the film's friction mark, used sparingly and only for a real loss.
        tl.to("#c3-l2", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.5);
        tl.fromTo("#c3-cross", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 3.75);

        // Scene 5 (5.5-9.0s): hold — the moment lingers; low-amplitude cinematic drift only.
        const c3phase = { p: 0 };
        tl.to(c3phase, {
          p: Math.PI * 2 * 1.6, duration: 3.5, ease: "none",
          onUpdate: () => {
            const s = Math.sin(c3phase.p);
            gsap.set("#c3-photo", { y: s * 2 });
          }
        }, 5.6);

        window.__timelines["03-bon-froisse"] = tl;
      </script>
    </template>
  </body>
</html>
