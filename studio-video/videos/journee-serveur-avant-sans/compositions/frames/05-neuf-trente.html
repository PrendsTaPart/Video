<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f5n-bg { position: absolute; inset: 0; background: #EDEEF0; overflow: hidden; }
        .f5n-bg img {
          position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
          filter: grayscale(1) contrast(1.05) brightness(0.9);
        }
        .f5n-stage { position: absolute; inset: 0; }

        .f5n-brokenline { position: absolute; left: 140px; right: 140px; top: 862px; height: 2px; }
        .f5n-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.55; transform-origin: 0% 50%; }

        .f5n-clock { position: absolute; left: 140px; top: 220px; font-size: 170px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.05; opacity: 0; }
        .f5n-sublabel { position: absolute; left: 142px; top: 460px; font-size: 40px; font-weight: 600; color: #3A3F45; opacity: 0; }

        .f5n-closing {
          position: absolute; left: 140px; right: 140px; top: 600px;
          font-size: 34px; font-weight: 500; color: rgba(58,63,69,0.85); line-height: 1.5;
          opacity: 0;
        }
        .f5n-closing .em { color: #D64545; font-weight: 700; }
      </style>

      <div id="root" data-composition-id="05-neuf-trente" data-width="1920" data-height="1080" data-duration="18">
        <div class="f5n-bg clip" id="f5n-bgclip" data-start="0" data-duration="18" data-track-index="1">
          <img id="f5n-bg-photo" src="public/photos/paper-reservation-book.jpg" alt="" />
        </div>

        <div class="f5n-stage">
          <div class="f5n-brokenline" id="f5n-brokenline">
            <span style="left:0%; width:16%;"></span>
            <span style="left:20%; width:22%; top:-3px;"></span>
            <span style="left:46%; width:14%; top:2px;"></span>
            <span style="left:64%; width:20%;"></span>
            <span style="left:88%; width:12%; top:-2px;"></span>
          </div>

          <div class="f5n-clock" id="f5n-clock">9h30</div>
          <div class="f5n-sublabel" id="f5n-sublabel">La salle est prête.</div>

          <div class="f5n-closing" id="f5n-closing">Le carnet de réservations, lui, <span class="em">ne l'est jamais tout à fait.</span></div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f5n-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set(["#f5n-clock", "#f5n-sublabel"], { opacity: 0 });
        gsap.set("#f5n-closing", { opacity: 0, y: 14 });
        gsap.set("#f5n-bg-photo", { opacity: 0.5 });

        // Scene 1 (0.0-1.0s): broken line draws itself on
        tl.to("#f5n-brokenline span", { opacity: 0.55, duration: 0.01 }, 0.15);
        tl.to("#f5n-brokenline span", { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 0.15);

        // continuous low-amplitude drift, the film's last held breath
        const f5ndrift = { p: 0 };
        const f5nstage = document.querySelector(".f5n-stage");
        tl.to(f5ndrift, {
          p: Math.PI * 2 * 4.2, duration: 17.4, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f5ndrift.p);
            f5nstage.style.transform = `translate(${s * 3}px, ${Math.sin(f5ndrift.p * 0.6) * 2}px) scale(${1 + s * 0.0022})`;
          }
        }, 0.3);

        // Scene 2 (0.4-1.7s, cue "Neuf heures trente."): big numeral settles.
        tl.fromTo("#f5n-clock", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.5);

        // the cold-open background photo recedes once the numeral has landed
        tl.to("#f5n-bg-photo", { opacity: 0, duration: 0.7, ease: "power2.in" }, 1.1);

        // Scene 3 (1.9-2.7s, cue "La salle est prête."): sublabel
        tl.to("#f5n-sublabel", { opacity: 1, duration: 0.45, ease: "power3.out" }, 2.0);

        // Scene 4 (3.4-4.5s, cue "Le carnet de réservations, lui, ne l'est jamais tout à fait."):
        // the closing line, with the red key clause — the film's last word.
        tl.to("#f5n-closing", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.5);

        // Scene 5 (4.5-18s): hold — subtle jitter on the broken line only
        const f5nphase = { p: 0 };
        tl.to(f5nphase, {
          p: Math.PI * 2 * 2.6, duration: 3.0, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f5nphase.p);
            document.getElementById("f5n-brokenline").style.transform = `translateY(${s * 1.5}px)`;
          }
        }, 4.6);

        window.__timelines["05-neuf-trente"] = tl;
      </script>
    </template>
  </body>
</html>
