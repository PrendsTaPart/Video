<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .fa-bg { position: absolute; inset: 0; background: #EDEEF0; }
        .fa-stage { position: absolute; inset: 0; }

        .fa-context { position: absolute; left: 180px; top: 88px; font-size: 26px; font-weight: 500; color: rgba(58,63,69,0.85); letter-spacing: 0.02em; }

        .fa-row { position: absolute; left: 180px; top: 210px; width: 1560px; height: 620px; display: flex; gap: 60px; }
        .fa-tablet {
          position: relative; width: 480px; height: 100%;
          border: 1px solid #8A9099; background: #EDEEF0;
          box-sizing: border-box; padding: 22px;
          opacity: 0;
        }
        .fa-tablet .head {
          display: flex; align-items: center; justify-content: space-between;
          border-bottom: 1px solid #8A9099; padding-bottom: 16px; margin-bottom: 20px;
        }
        .fa-tablet .head .label { font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(58,63,69,0.85); }
        .fa-tablet .head .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #8A9099; }

        .fa-tablet .line { height: 34px; border: 1px solid #8A9099; background: rgba(58,63,69,0.045); margin-bottom: 14px; }
        .fa-tablet .line.short { width: 60%; }
        .fa-tablet .line.med { width: 80%; }

        .fa-tablet .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; height: 300px; margin-top: 6px; }
        .fa-tablet .grid3 .cell { border: 1px solid #8A9099; background: rgba(58,63,69,0.04); }
        .fa-tablet .grid3 .cell.occ { background: rgba(58,63,69,0.14); }

        .fa-tablet.emph { border-color: #3A3F45; }

        .fa-brokenline { position: absolute; left: 180px; right: 180px; top: 892px; height: 2px; }
        .fa-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.5; transform-origin: 0% 50%; }

        .fa-footnote { position: absolute; left: 0; right: 0; top: 946px; text-align: center; font-size: 30px; font-weight: 600; color: rgba(58,63,69,0.85); opacity: 0; }
      </style>

      <div id="root" data-composition-id="01-trois-tablettes" data-width="1920" data-height="1080" data-duration="13.0">
        <div class="fa-bg clip" id="fa-bgclip" data-start="0" data-duration="13.0" data-track-index="1"></div>

        <div class="fa-stage" id="fa-stage">
          <div class="fa-context" id="fa-context">12h45 — plein coup de feu</div>

          <div class="fa-row">
            <div class="fa-tablet" id="fa-t1">
              <div class="head"><span class="label">livraison</span><span class="dot"></span></div>
              <div class="line short"></div>
              <div class="line med"></div>
              <div class="line"></div>
              <div class="line short"></div>
            </div>
            <div class="fa-tablet" id="fa-t2">
              <div class="head"><span class="label">caisse</span><span class="dot"></span></div>
              <div class="line med"></div>
              <div class="line"></div>
              <div class="line short"></div>
              <div class="line"></div>
            </div>
            <div class="fa-tablet" id="fa-t3">
              <div class="head"><span class="label">salle</span><span class="dot"></span></div>
              <div class="grid3">
                <div class="cell occ"></div><div class="cell"></div><div class="cell occ"></div>
                <div class="cell"></div><div class="cell occ"></div><div class="cell"></div>
                <div class="cell occ"></div><div class="cell occ"></div><div class="cell"></div>
              </div>
            </div>
          </div>

          <div class="fa-brokenline" id="fa-brokenline">
            <span style="left:2%; width:18%;"></span>
            <span style="left:26%; width:22%; top:-3px;"></span>
            <span style="left:54%; width:16%; top:2px;"></span>
            <span style="left:76%; width:22%;"></span>
          </div>

          <div class="fa-footnote" id="fa-footnote">Trois écrans. Aucun lien entre eux.</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#fa-context", { opacity: 0 });
        gsap.set(["#fa-t1", "#fa-t2", "#fa-t3"], { opacity: 0, y: 16 });
        gsap.set("#fa-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#fa-footnote", { opacity: 0, y: 10 });

        // Scene 1 (0.0-1.0s): context label, broken line draws on
        tl.to("#fa-context", { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.25);
        tl.to("#fa-brokenline span", { opacity: 0.5, duration: 0.01 }, 0.35);
        tl.to("#fa-brokenline span", { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 0.35);

        // Scene 2 (1.0-3.0s, cue "Trois tablettes, côte à côte, derrière le comptoir."):
        // the three tablets settle in, one after another.
        tl.to("#fa-t1", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.0);
        tl.to("#fa-t2", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.25);
        tl.to("#fa-t3", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.5);

        // Scene 3 (3.0-4.5s, cue "Une appli sur celle-ci."): tablet 1 emphasized, others recede
        tl.to("#fa-t1", { opacity: 1, scale: 1.02, borderColor: "#3A3F45", duration: 0.35, ease: "power2.out" }, 3.0);
        tl.to(["#fa-t2", "#fa-t3"], { opacity: 0.5, duration: 0.35, ease: "power2.out" }, 3.0);

        // Scene 4 (4.5-6.0s, cue "Une autre sur celle-là."): tablet 2 emphasized
        tl.to("#fa-t1", { opacity: 0.5, scale: 1, borderColor: "#8A9099", duration: 0.35, ease: "power2.out" }, 4.5);
        tl.to("#fa-t2", { opacity: 1, scale: 1.02, borderColor: "#3A3F45", duration: 0.35, ease: "power2.out" }, 4.5);
        tl.to("#fa-t3", { opacity: 0.5, duration: 0.35, ease: "power2.out" }, 4.5);

        // Scene 5 (6.0-7.84s, cue "La salle sur la troisième."): tablet 3 emphasized
        tl.to("#fa-t2", { opacity: 0.5, scale: 1, borderColor: "#8A9099", duration: 0.35, ease: "power2.out" }, 6.0);
        tl.to("#fa-t3", { opacity: 1, scale: 1.02, borderColor: "#3A3F45", duration: 0.35, ease: "power2.out" }, 6.0);

        // Scene 6 (7.84-9.0s): all three settle back to equal, unresolved standing
        tl.to(["#fa-t1", "#fa-t2", "#fa-t3"], { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 7.9);

        // Scene 7 (9.0-13.0s): footnote lands, hold with low-amplitude drift
        tl.to("#fa-footnote", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.3);

        const faStage = document.getElementById("fa-stage");
        const faDrift = { p: 0 };
        tl.to(faDrift, {
          p: Math.PI * 2 * 3.5, duration: 12.4, ease: "none",
          onUpdate: () => {
            const s = Math.sin(faDrift.p);
            const s2 = Math.sin(faDrift.p * 1.3);
            faStage.style.transform = `translate(${s * 2.2}px, ${s2 * 1.6}px) scale(${1 + s * 0.002})`;
          }
        }, 0.2);

        window.__timelines["01-trois-tablettes"] = tl;
      </script>
    </template>
  </body>
</html>
