<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f3-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f3-lead { position: absolute; left: 0; right: 0; top: 220px; text-align: center; font-size: 38px; font-weight: 600; color: rgba(58,63,69,0.85); }
        .f3-numeral { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 340px; font-weight: 800; color: #D64545; line-height: 1; font-variant-numeric: tabular-nums; }
        .f3-numeral .unit { font-size: 90px; font-weight: 800; margin-left: 18px; }
        .f3-sub { position: absolute; left: 0; right: 0; top: 800px; text-align: center; font-size: 38px; font-weight: 600; color: rgba(58,63,69,0.85); }
      </style>

      <div id="root" data-composition-id="03-refrain" data-width="1920" data-height="1080" data-duration="7.497">
        <div class="f3-bg clip" id="f3-bgclip" data-start="0" data-duration="7.497" data-track-index="0"></div>

        <div class="f3-lead" id="f3-lead">la nouvelle recrue</div>
        <div class="f3-numeral" id="f3-numeral">3<span class="unit">H</span></div>
        <div class="f3-sub" id="f3-sub">de formation</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f3-lead", { opacity: 0 });
        gsap.set("#f3-numeral", { opacity: 0, scale: 0 });
        gsap.set("#f3-sub", { opacity: 0 });

        // Scene 1 (0.0-0.6s): "La nouvelle" — quiet lead-in label, aparté that cuts the montage
        tl.to("#f3-lead", { opacity: 1, duration: 0.35, ease: "power3.out" }, 0.12);

        // Scene 2 (0.6-2.2s): "a été formée trois heures." — giant "3H" spring-pops, sub settles
        tl.fromTo("#f3-numeral", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.7);
        tl.to("#f3-sub", { opacity: 1, duration: 0.35, ease: "power3.out" }, 1.3);

        // Scene 3 (2.2-4.0s): "Elle est partie au bout de six semaines." — hard-cut 3H -> 6 SEM. (the signature move)
        tl.call(() => {
          document.getElementById("f3-numeral").innerHTML = '6<span class="unit">SEM.</span>';
          document.getElementById("f3-sub").textContent = "avant de partir";
        }, [], 2.25);

        // Scene 4 (4.0-7.497s): hold — barely-perceptible jitter
        const f3phase = { p: 0 };
        tl.to(f3phase, {
          p: Math.PI * 2 * 1.0, duration: 3.0, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f3phase.p);
            gsap.set("#f3-numeral", { scale: 1 + s * 0.004 });
          }
        }, 4.1);

        window.__timelines["03-refrain"] = tl;
      </script>
    </template>
  </body>
</html>
