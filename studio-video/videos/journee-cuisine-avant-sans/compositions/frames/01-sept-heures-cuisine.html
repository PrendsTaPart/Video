<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f1-bg { position: absolute; inset: 0; background: #EDEEF0; }
        .f1-stage { position: absolute; inset: 0; }

        /* broken line motif — segments that never meet */
        .f1-brokenline { position: absolute; left: 140px; right: 140px; top: 862px; height: 2px; }
        .f1-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.55; transform-origin: 0% 50%; }

        .f1-clock { position: absolute; left: 140px; top: 130px; font-size: 96px; font-weight: 700; letter-spacing: -0.01em; }
        .f1-clock .unit { font-size: 44px; font-weight: 500; color: rgba(58,63,69,0.85); margin-left: 10px; }
        .f1-sublabel { position: absolute; left: 142px; top: 244px; font-size: 30px; font-weight: 500; color: rgba(58,63,69,0.85); }

        .f1-photo {
          position: absolute; right: 200px; top: 150px; width: 620px; height: 620px;
          border: 1px solid #8A9099; box-shadow: 0 20px 50px rgba(20,22,25,0.14);
          overflow: hidden;
        }
        .f1-photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.85) contrast(1.05) brightness(1.02); display: block; }
        .f1-photolabel { position: absolute; right: 200px; top: 796px; width: 620px; font-size: 30px; font-weight: 600; text-align: right; }
      </style>

      <div id="root" data-composition-id="01-sept-heures-cuisine" data-width="1920" data-height="1080" data-duration="7.993">
        <div class="f1-bg clip" id="f1-bgclip" data-start="0" data-duration="7.993" data-track-index="1"></div>

        <div class="f1-stage" id="f1-stage">
          <div class="f1-brokenline" id="f1-brokenline">
            <span style="left:0%; width:16%;"></span>
            <span style="left:20%; width:22%; top:-3px;"></span>
            <span style="left:46%; width:14%; top:2px;"></span>
            <span style="left:64%; width:20%;"></span>
            <span style="left:88%; width:12%; top:-2px;"></span>
          </div>

          <div class="f1-clock" id="f1-clock">7<span class="unit">H</span></div>
          <div class="f1-sublabel" id="f1-sublabel">la cuisine est vide</div>

          <div class="f1-photo" id="f1-photo">
            <img src="public/generated/haccp-binder.jpg" alt="" />
          </div>
          <div class="f1-photolabel" id="f1-photolabel">le classeur, lui, est plein</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f1-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set(["#f1-clock", "#f1-sublabel"], { opacity: 0 });
        gsap.set("#f1-photo", { opacity: 0, x: 40, scale: 0.96 });
        gsap.set("#f1-photolabel", { opacity: 0 });

        // Scene 1 (0.0-1.0s): broken line draws itself on, segment by segment
        tl.to("#f1-brokenline span", { opacity: 0.55, duration: 0.01 }, 0.15);
        tl.to("#f1-brokenline span", { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.09 }, 0.15);

        // continuous low-amplitude cinematic drift on the whole stage
        const f1drift = { p: 0 };
        const f1stage = document.getElementById("f1-stage");
        tl.to(f1drift, {
          p: Math.PI * 2 * 2.1, duration: 7.4, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f1drift.p);
            f1stage.style.transform = `translate(${s * 3}px, ${Math.sin(f1drift.p * 0.6) * 2}px) scale(${1 + s * 0.0025})`;
          }
        }, 0.2);

        // Scene 2 (1.0-2.3s): "Sept heures. La cuisine est vide."
        tl.fromTo("#f1-clock", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.0);
        tl.fromTo("#f1-sublabel", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.6);

        // Scene 3 (3.0-4.9s): "Le classeur, lui, est plein." — the binder photo settles in
        tl.to("#f1-photo", { opacity: 1, x: 0, scale: 1, duration: 0.65, ease: "power3.out" }, 3.1);
        tl.to("#f1-photolabel", { opacity: 1, duration: 0.4, ease: "power3.out" }, 3.7);

        // Scene 4 (5.0-7.993s): hold — subtle jitter on the broken line only
        const f1phase = { p: 0 };
        tl.to(f1phase, {
          p: Math.PI * 2 * 1.0, duration: 2.7, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f1phase.p);
            gsap.set("#f1-brokenline", { y: s * 1.5 });
          }
        }, 5.1);

        window.__timelines["01-sept-heures-cuisine"] = tl;
      </script>
    </template>
  </body>
</html>
