<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f8-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f8-brokenline { position: absolute; left: 200px; right: 200px; top: 300px; height: 2px; }
        .f8-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.45; transform-origin: 0% 50%; }

        .f8-lines { position: absolute; left: 0; right: 0; top: 420px; text-align: center; }
        .f8-l1 { font-size: 62px; font-weight: 700; line-height: 1.3; opacity: 0; }
        .f8-l2 { font-size: 62px; font-weight: 700; line-height: 1.3; margin-top: 8px; opacity: 0; }
        .f8-l3 { font-size: 46px; font-weight: 600; margin-top: 34px; opacity: 0; }
        .f8-l3 .em { color: #D64545; }
      </style>

      <div id="root" data-composition-id="08-onze-heures-trente" data-width="1920" data-height="1080" data-duration="8.490">
        <div class="f8-bg clip" id="f8-bgclip" data-start="0" data-duration="8.490" data-track-index="1"></div>

        <div class="f8-brokenline" id="f8-brokenline">
          <span style="left:4%; width:16%;"></span>
          <span style="left:26%; width:20%; top:-3px;"></span>
          <span style="left:52%; width:14%; top:2px;"></span>
          <span style="left:72%; width:22%;"></span>
        </div>

        <div class="f8-lines">
          <div class="f8-l1" id="f8-l1">Onze heures trente.</div>
          <div class="f8-l2" id="f8-l2">Ma matinée est faite.</div>
          <div class="f8-l3" id="f8-l3">Elle n'est <span class="em">nulle part</span>.</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f8-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#f8-l1", { opacity: 0, y: 14 });
        gsap.set("#f8-l2", { opacity: 0, y: 14 });
        gsap.set("#f8-l3", { opacity: 0, y: 10 });

        // Scene 1 (0.0-1.5s): broken line draws itself on segment by segment — the closing pass
        // of the series' signature motif; "Onze heures trente." slides up
        tl.to("#f8-brokenline span", { opacity: 0.45, duration: 0.01 }, 0.1);
        tl.to("#f8-brokenline span", { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.07 }, 0.1);
        tl.to("#f8-l1", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.35);

        // Scene 2 (1.6-3.4s): "Ma matinée est faite."
        tl.to("#f8-l2", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.7);

        // Scene 3 (3.4-5.5s): "Elle n'est nulle part." — the closing line, its one red word
        tl.to("#f8-l3", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.5);

        // Scene 4 (5.5-8.490s): hold — subtle jitter on the broken line only, the frame goes
        // still right up to the hard cut into the brand card
        const f8phase = { p: 0 };
        tl.to(f8phase, {
          p: Math.PI * 2 * 1.0, duration: 2.9, ease: "none",
          onUpdate: () => { gsap.set("#f8-brokenline", { y: Math.sin(f8phase.p) * 1.5 }); }
        }, 5.6);

        window.__timelines["08-onze-heures-trente"] = tl;
      </script>
    </template>
  </body>
</html>
