    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (hand-authored, mirroring the pilot's grammar: crossfade for topic
      //    pivots, push-slide-left for same-montage continuations, hard cut for punchlines and
      //    the refrain aparté) ──
      (function () { var tl = window.__timelines["main"];

        // 00-titre -> 00b-contexte: crossfade (reused pair, identical to the pilot)
        tl.to("#el-00-titre", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-00b-contexte", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.5);

        // 00b-contexte -> 01: crossfade into the body
        tl.to("#el-00b-contexte", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26.282);
        tl.fromTo("#el-01-sept-heures-cuisine", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26.282);

        // 01 -> 02: push-slide left (same morning montage continues)
        tl.to("#el-01-sept-heures-cuisine", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 33.775);
        tl.fromTo("#el-02-temperatures-tableau", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 33.775);

        // 02 -> 03 (refrain): hard cut — the aparté breaks the montage's rhythm on purpose
        // 03 -> 04: hard cut back out of the aparté, straight into the flow

        // 04 -> 05: push-slide left
        tl.to("#el-04-livraison-dlc", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 62.263);
        tl.fromTo("#el-05-facture-beurre", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 62.263);

        // 05 -> 06: push-slide left
        tl.to("#el-05-facture-beurre", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 73.257);
        tl.fromTo("#el-06-fiches-techniques", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 73.257);

        // 06 -> 07: crossfade
        tl.to("#el-06-fiches-techniques", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 82.762);
        tl.fromTo("#el-07-etiquettes-allergenes", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 82.762);

        // 07 -> 08: crossfade into the closing beat
        tl.to("#el-07-etiquettes-allergenes", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 92.763);
        tl.fromTo("#el-08-onze-heures-trente", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 92.763);

        // 08 -> 09 (carte-marque): hard cut — the callback impact, same move the pilot uses
        // 09 -> 10 (cta): no cut — same marine ground, one continuous ending (reused pair)

        tl.to({}, { duration: 111.253 }, 0); // full-span anchor — main.duration() == composition total
      })();
    </script>
