<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f4-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f4-l1 {
          position: absolute; left: 0; right: 0; top: 150px; text-align: center;
          font-size: 52px; font-weight: 600; line-height: 1.3; opacity: 0;
        }
        .f4-l1 .num { font-weight: 800; color: #D64545; }

        .f4-row { position: absolute; left: 50%; top: 400px; width: 1540px; margin-left: -770px; display: flex; gap: 30px; }
        .f4-card {
          width: 190px; height: 240px; border: 1px solid #8A9099; background: rgba(58,63,69,0.045);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          position: relative; opacity: 0;
        }
        .f4-card .mark {
          width: 64px; height: 64px; border-radius: 50%; border: 1px solid #8A9099;
          display: flex; align-items: center; justify-content: center;
          font-size: 30px; font-weight: 700; color: rgba(58,63,69,0.7); margin-bottom: 18px;
        }
        .f4-card .tag { font-size: 18px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(58,63,69,0.6); }
        .f4-card.active { border-color: #3A3F45; }
        .f4-card.active .mark { border-color: #3A3F45; color: #3A3F45; }
        .f4-card.active .tag { color: #3A3F45; font-weight: 700; }
        .f4-card.active .tag::after { content: " — utilisé"; }
        .f4-card.dim { opacity: 0.4; }
        .f4-card .cross {
          position: absolute; top: 14px; right: 14px; width: 26px; height: 26px;
          color: #D64545; font-size: 26px; font-weight: 800; line-height: 1; opacity: 0;
        }

        .f4-l2 {
          position: absolute; left: 0; right: 0; top: 760px; text-align: center;
          font-size: 34px; font-weight: 500; color: rgba(58,63,69,0.85); opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="04-sept-abonnements" data-width="1920" data-height="1080" data-duration="10.0">
        <div class="f4-bg clip" id="f4-bgclip" data-start="0" data-duration="10.0" data-track-index="1"></div>

        <div class="f4-l1" id="f4-l1">Je paie <span class="num">sept</span> abonnements.</div>

        <div class="f4-row" id="f4-row">
          <div class="f4-card active" id="f4-c1"><div class="mark">01</div><div class="tag">outil</div></div>
          <div class="f4-card active" id="f4-c2"><div class="mark">02</div><div class="tag">outil</div></div>
          <div class="f4-card dim" id="f4-c3"><div class="mark">03</div><div class="tag">outil</div><div class="cross" id="f4-x3">&times;</div></div>
          <div class="f4-card dim" id="f4-c4"><div class="mark">04</div><div class="tag">outil</div><div class="cross" id="f4-x4">&times;</div></div>
          <div class="f4-card dim" id="f4-c5"><div class="mark">05</div><div class="tag">outil</div><div class="cross" id="f4-x5">&times;</div></div>
          <div class="f4-card dim" id="f4-c6"><div class="mark">06</div><div class="tag">outil</div><div class="cross" id="f4-x6">&times;</div></div>
          <div class="f4-card dim" id="f4-c7"><div class="mark">07</div><div class="tag">outil</div><div class="cross" id="f4-x7">&times;</div></div>
        </div>

        <div class="f4-l2" id="f4-l2">Mon équipe en utilise deux.</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f4-l1", { opacity: 0, y: 14 });
        gsap.set(["#f4-c1", "#f4-c2", "#f4-c3", "#f4-c4", "#f4-c5", "#f4-c6", "#f4-c7"], { opacity: 0, y: 14, scale: 0.94 });
        gsap.set(["#f4-x3", "#f4-x4", "#f4-x5", "#f4-x6", "#f4-x7"], { opacity: 0 });
        gsap.set("#f4-l2", { opacity: 0, y: 10 });

        // Scene 1 (0.0-0.85s, cue "Je paie sept abonnements."): the headline settles
        tl.to("#f4-l1", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3);

        // Scene 2 (0.9-1.85s): all seven cards rise in together, left to right, a quick stagger
        tl.to(["#f4-c1", "#f4-c2", "#f4-c3", "#f4-c4", "#f4-c5", "#f4-c6", "#f4-c7"],
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 0.95);

        // Scene 3 (1.9-2.6s, cue "Mon équipe en utilise deux."): five friction crosses land on
        // the unused tools, the two active cards stay clean.
        tl.to(["#f4-x3", "#f4-x4", "#f4-x5", "#f4-x6", "#f4-x7"],
          { opacity: 0.85, duration: 0.3, ease: "power2.out", stagger: 0.05 }, 2.0);
        tl.to("#f4-l2", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.1);

        // Scene 4 (2.6-10.0s): long hold — a very slow, barely visible breathing on the row
        const f4phase = { p: 0 };
        tl.to(f4phase, {
          p: Math.PI * 2 * 2.4, duration: 7.4, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f4phase.p);
            gsap.set("#f4-row", { y: s * 1.6 });
          }
        }, 2.7);

        window.__timelines["04-sept-abonnements"] = tl;
      </script>
    </template>
  </body>
</html>
