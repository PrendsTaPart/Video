<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f3-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f3-ring {
          position: absolute; left: 50%; top: 540px; width: 620px; height: 620px;
          margin-left: -310px; margin-top: -310px; border-radius: 50%;
          border: 1px dashed #8A9099; opacity: 0;
        }

        .f3-l1 {
          position: absolute; left: 0; right: 0; top: 180px; text-align: center;
          font-size: 56px; font-weight: 600; line-height: 1.3; opacity: 0;
        }

        .f3-qmark {
          position: absolute; left: 50%; top: 540px; width: 0; height: 0;
          margin-left: 0; margin-top: 0;
        }
        .f3-qmark .glyph {
          position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.6);
          font-size: 340px; font-weight: 800; color: #D64545; opacity: 0; line-height: 1;
        }

        .f3-l2 {
          position: absolute; left: 0; right: 0; top: 860px; text-align: center;
          font-size: 34px; font-weight: 500; color: rgba(58,63,69,0.85); opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="03-quel-plat" data-width="1920" data-height="1080" data-duration="10.0">
        <div class="f3-bg clip" id="f3-bgclip" data-start="0" data-duration="10.0" data-track-index="0"></div>

        <div class="f3-ring" id="f3-ring"></div>

        <div class="f3-l1" id="f3-l1">Quel plat me fait perdre de l'argent&nbsp;?</div>

        <div class="f3-qmark" id="f3-qmark-pos">
          <span class="glyph" id="f3-glyph">?</span>
        </div>

        <div class="f3-l2" id="f3-l2">Personne ne peut vraiment répondre.</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f3-ring", { opacity: 0, scale: 0.85 });
        gsap.set("#f3-l1", { opacity: 0, y: 14 });
        gsap.set("#f3-glyph", { opacity: 0, scale: 0.6 });
        gsap.set("#f3-l2", { opacity: 0, y: 10 });

        // Scene 1 (0.0-0.85s, cue "Quel plat me fait perdre de l'argent ?"): the question
        // settles first, a faint dashed compass ring blooms behind where the mark will land.
        tl.to("#f3-ring", { opacity: 0.35, scale: 1, duration: 0.6, ease: "power2.out" }, 0.15);
        tl.to("#f3-l1", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.3);

        // Scene 2 (1.4-2.1s): the big red "?" — the one place the alert color owns the frame —
        // pops into the ring the question just opened up.
        tl.fromTo("#f3-glyph", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 1.5);

        // Scene 3 (2.5-3.15s, cue "Personne ne peut vraiment répondre."): the answer, or lack
        // of one, settles beneath.
        tl.to("#f3-l2", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.6);

        // Scene 4 (3.15-10.0s): long hold — the red mark breathes, barely, the ring drifts
        const f3phase = { p: 0 };
        tl.to(f3phase, {
          p: Math.PI * 2 * 2.0, duration: 6.6, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f3phase.p);
            gsap.set("#f3-glyph", { scale: 1 + s * 0.015 });
            gsap.set("#f3-ring", { scale: 1 + s * 0.01 });
          }
        }, 3.3);

        window.__timelines["03-quel-plat"] = tl;
      </script>
    </template>
  </body>
</html>
