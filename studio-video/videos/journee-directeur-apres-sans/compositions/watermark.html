<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
        }
        .wm { position: absolute; top: 56px; right: 64px; opacity: 0; }
        .wm img {
          width: 220px;
          height: auto;
          display: block;
          filter: grayscale(1) contrast(0.9) brightness(1.05);
          opacity: 0.42;
        }
      </style>

      <div id="root" data-composition-id="watermark" data-width="1920" data-height="1080">
        <div class="wm" id="wm-mark">
          <img src="public/foodeatup-logo.png" alt="FoodEatUp" />
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Discreet presence throughout the "sans" body — desaturated like the rest of
        // this world, low-opacity, corner-parked so it never competes with captions or
        // the frame content. It fades out just before the final card, where the real
        // (saturated, full-size) logo takes over as the payoff.
        tl.to("#wm-mark", { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.3);
        tl.to("#wm-mark", { opacity: 0, duration: 0.4, ease: "power2.in" }, 64.6);

        window.__timelines["watermark"] = tl;
      </script>
    </template>
  </body>
</html>
