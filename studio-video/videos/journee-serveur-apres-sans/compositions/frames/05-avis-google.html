<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f5b-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f5b-brokenline { position: absolute; left: 140px; right: 140px; top: 130px; height: 2px; }
        .f5b-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.5; transform-origin: 0% 50%; }

        .f5b-label {
          position: absolute; left: 0; right: 0; top: 190px; text-align: center;
          font-size: 34px; font-weight: 600; letter-spacing: 0.03em; color: rgba(58,63,69,0.85); opacity: 0;
        }

        .f5b-stars { position: absolute; left: 0; right: 0; top: 260px; text-align: center; opacity: 0; }
        .f5b-stars span {
          display: inline-block; margin: 0 8px; width: 42px; height: 42px;
          border: 2px solid #8A9099; transform: rotate(45deg);
        }

        .f5b-num {
          position: absolute; left: 0; right: 0; top: 380px; text-align: center;
          font-size: 340px; font-weight: 800; color: #D64545; line-height: 1;
          font-variant-numeric: tabular-nums; opacity: 0;
        }

        .f5b-unit {
          position: absolute; left: 0; right: 0; top: 800px; text-align: center;
          font-size: 40px; font-weight: 600; color: rgba(58,63,69,0.85); opacity: 0;
        }

        .f5b-check {
          position: absolute; left: 50%; top: 900px; margin-left: -28px;
          width: 56px; height: 56px; border: 1px solid #8A9099; opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="05-avis-google" data-width="1920" data-height="1080" data-duration="8.5">
        <div class="f5b-bg clip" id="f5b-bgclip" data-start="0" data-duration="8.5" data-track-index="1"></div>

        <div class="f5b-brokenline" id="f5b-brokenline">
          <span style="left:2%; width:14%;"></span>
          <span style="left:22%; width:18%; top:-3px;"></span>
          <span style="left:46%; width:12%; top:2px;"></span>
          <span style="left:64%; width:20%;"></span>
          <span style="left:88%; width:10%; top:-2px;"></span>
        </div>

        <div class="f5b-label" id="f5b-label">avis Google — cette semaine</div>

        <div class="f5b-stars" id="f5b-stars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="f5b-num" id="f5b-num">0</div>

        <div class="f5b-unit" id="f5b-unit">jours sans réponse</div>

        <div class="f5b-check" id="f5b-check"></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f5b-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#f5b-label", { opacity: 0, y: 10 });
        gsap.set("#f5b-stars", { opacity: 0, y: 8 });
        gsap.set("#f5b-num", { opacity: 0 });
        gsap.set("#f5b-unit", { opacity: 0, y: 10 });
        gsap.set("#f5b-check", { opacity: 0, scale: 0.7 });

        // Scene 1 (0.0-0.5s): broken line draws
        tl.to("#f5b-brokenline span", { opacity: 0.5, duration: 0.01 }, 0.1);
        tl.to("#f5b-brokenline span", { scaleX: 1, duration: 0.35, ease: "power2.out", stagger: 0.06 }, 0.1);

        // Scene 2 (0.3-0.9s, cue "Les avis Google"): the eyebrow label settles — "avis Google" is
        // named only as plain generic text, never a reconstructed interface.
        tl.to("#f5b-label", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.35);

        // Scene 3 (0.9-1.5s, cue "de la semaine ?"): five plain outline diamonds stand in for a
        // rating row — deliberately not a real Google star glyph or color.
        tl.to("#f5b-stars", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.95);

        // Scene 4 (1.8-3.3s, cue "Onze jours"): the count climbs to 11 in the one red accent —
        // the loss-counter pattern this series reuses for every unresolved number.
        const f5bnum = document.getElementById("f5b-num");
        tl.to("#f5b-num", { opacity: 1, duration: 0.01 }, 1.8);
        const f5bstate = { v: 0 };
        tl.to(f5bstate, {
          v: 11, duration: 1.3, ease: "power2.out",
          onUpdate: () => { f5bnum.textContent = Math.round(f5bstate.v); }
        }, 1.85);

        // Scene 5 (3.3-3.9s, cue "sans réponse."): the unit label lands beneath
        tl.to("#f5b-unit", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.35);

        // Scene 6 (3.9-4.4s): the empty box — the friction mark, never a green check
        tl.to("#f5b-check", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 3.95);

        // Scene 7 (4.4-8.5s): hold — the number sits, a barely-perceptible breathe on the digit only
        const f5bphase = { p: 0 };
        tl.to(f5bphase, {
          p: Math.PI * 2 * 1.5, duration: 3.4, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f5bphase.p);
            gsap.set("#f5b-num", { scale: 1 + s * 0.006 });
          }
        }, 4.5);

        window.__timelines["05-avis-google"] = tl;
      </script>
    </template>
  </body>
</html>
