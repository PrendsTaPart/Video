<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f1-bg { position: absolute; inset: 0; background: #EDEEF0; }
        .f1-stage { position: absolute; inset: 0; }

        .f1-brokenline { position: absolute; left: 140px; right: 140px; top: 130px; height: 2px; }
        .f1-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.5; transform-origin: 0% 50%; }

        .f1-context { position: absolute; left: 140px; top: 170px; font-size: 30px; font-weight: 500; color: rgba(58,63,69,0.85); opacity: 0; }

        .f1-center { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
        .f1-label { font-size: 32px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(58,63,69,0.85); opacity: 0; }

        .f1-numwrap { position: relative; margin-top: 30px; display: inline-block; }
        .f1-num {
          font-size: 176px; font-weight: 800; color: #D64545; font-variant-numeric: tabular-nums;
          line-height: 1; opacity: 0;
        }
        .f1-q {
          position: absolute; right: -100px; top: 10px; font-size: 100px; font-weight: 800;
          color: rgba(58,63,69,0.65); opacity: 0;
        }

        .f1-close { position: absolute; left: 0; right: 0; top: 720px; text-align: center; font-size: 46px; font-weight: 700; opacity: 0; }
      </style>

      <div id="root" data-composition-id="01-caisse-fermee" data-width="1920" data-height="1080" data-duration="10.5">
        <div class="f1-bg clip" id="f1-bgclip" data-start="0" data-duration="10.5" data-track-index="0"></div>

        <div class="f1-stage" id="f1-stage">
        <div class="f1-brokenline" id="f1-brokenline">
          <span style="left:3%; width:16%;"></span>
          <span style="left:24%; width:20%; top:-3px;"></span>
          <span style="left:50%; width:14%; top:2px;"></span>
          <span style="left:70%; width:22%;"></span>
        </div>

        <div class="f1-context" id="f1-context">22h47 — caisse fermée</div>

        <div class="f1-center">
          <div class="f1-label" id="f1-label">L'écart</div>
          <div class="f1-numwrap">
            <div class="f1-num" id="f1-num">0,00&nbsp;€</div>
            <div class="f1-q" id="f1-q">?</div>
          </div>
        </div>

        <div class="f1-close" id="f1-close">On saura demain.</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f1-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#f1-context", { opacity: 0, y: 10 });
        gsap.set("#f1-label", { opacity: 0, y: 10 });
        gsap.set("#f1-num", { opacity: 0, y: 10 });
        gsap.set("#f1-q", { opacity: 0, scale: 0.6 });
        gsap.set("#f1-close", { opacity: 0, y: 12 });

        // Scene 1 (0.0-0.7s): broken line draws itself on — the film's first frame after the
        // context card opens on the series signature.
        tl.to("#f1-brokenline span", { opacity: 0.5, duration: 0.01 }, 0.1);
        tl.to("#f1-brokenline span", { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 0.1);

        // Scene 2 (0.3-1.6s, cue "La caisse est fermée. Compter. Recompter."): context label settles
        tl.to("#f1-context", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
        tl.to("#f1-label", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.3);

        // Scene 3 (1.9-4.3s, cue "L'écart, c'est trois euros quarante."): count up 0 -> 3,40 €
        const f1num = document.getElementById("f1-num");
        tl.to("#f1-num", { opacity: 1, duration: 0.01 }, 1.9);
        const f1s1 = { v: 0 };
        tl.to(f1s1, {
          v: 3.40, duration: 1.5, ease: "power2.out",
          onUpdate: () => { f1num.innerHTML = f1s1.v.toFixed(2).replace(".", ",") + "&nbsp;€"; }
        }, 2.0);

        // Scene 4 (4.3-4.7s): a quick flicker — the mind re-checking a figure it doesn't trust
        tl.to("#f1-num", { opacity: 0.25, duration: 0.07, ease: "none", yoyo: true, repeat: 3 }, 4.35);

        // Scene 5 (4.7-6.4s, cue "Ou trente-quatre."): the figure resolves into the OTHER reading —
        // same digits, decimal point moved, ten times the size. Hard swap, not a smooth count (this
        // is a misread, not a total).
        tl.call(() => { f1num.innerHTML = "34,00&nbsp;€"; }, [], 5.35);
        tl.fromTo("#f1-num", { scale: 0.92 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 5.35);

        // Scene 6 (6.4-6.9s): the number gives up being certain — dims, a taupe "?" lands beside it
        // (the series' friction mark; never a green check, never a resolved total).
        tl.to("#f1-num", { opacity: 0.5, duration: 0.4, ease: "power2.out" }, 6.5);
        tl.fromTo("#f1-q", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 6.7);

        // Scene 7 (6.9-7.7s, cue "On saura demain."): the close line lands
        tl.to("#f1-close", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 7.0);

        // Scene 8 (7.7-10.5s): hold — the "?" breathes faintly, broken line drifts a hair (multi-phase
        // hold, matches the series' resting-frame convention)
        const f1phase = { p: 0 };
        tl.to(f1phase, {
          p: Math.PI * 2 * 1.4, duration: 2.5, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f1phase.p);
            gsap.set("#f1-q", { scale: 1 + s * 0.02 });
            gsap.set("#f1-brokenline", { y: s * 1.2 });
          }
        }, 7.8);

        window.__timelines["01-caisse-fermee"] = tl;
      </script>
    </template>
  </body>
</html>
