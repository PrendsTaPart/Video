<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f3v-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f3v-brokenline { position: absolute; left: 140px; right: 140px; top: 130px; height: 2px; }
        .f3v-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.5; transform-origin: 0% 50%; }

        .f3v-context { position: absolute; left: 140px; top: 170px; font-size: 30px; font-weight: 500; color: rgba(58,63,69,0.85); opacity: 0; }

        .f3v-ring {
          position: absolute; left: 50%; top: 300px; width: 420px; height: 420px; margin-left: -210px;
          border-radius: 50%; border: 1px solid #8A9099; opacity: 0;
        }
        .f3v-ring::before {
          content: ""; position: absolute; inset: 26px; border-radius: 50%;
          border: 1px dashed #8A9099; opacity: 0.6;
        }
        .f3v-ringnum {
          position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .f3v-ringnum .n { font-size: 150px; font-weight: 800; color: #3A3F45; font-variant-numeric: tabular-nums; line-height: 1; }
        .f3v-ringnum .u { margin-top: 8px; font-size: 26px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(58,63,69,0.85); opacity: 0; }

        .f3v-check {
          position: absolute; left: 50%; top: 760px; margin-left: -28px;
          width: 56px; height: 56px; border: 1px solid #8A9099; opacity: 0;
        }

        .f3v-cap {
          position: absolute; left: 460px; right: 460px; top: 850px; text-align: center;
          font-size: 34px; font-weight: 600; line-height: 1.4; color: rgba(58,63,69,0.85); opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="03-vingt-minutes" data-width="1920" data-height="1080" data-duration="7.5">
        <div class="f3v-bg clip" id="f3v-bgclip" data-start="0" data-duration="7.5" data-track-index="0"></div>

        <div class="f3v-brokenline" id="f3v-brokenline">
          <span style="left:4%; width:16%;"></span>
          <span style="left:26%; width:20%; top:-3px;"></span>
          <span style="left:52%; width:14%; top:2px;"></span>
          <span style="left:72%; width:22%;"></span>
        </div>

        <div class="f3v-context" id="f3v-context">chaque soir</div>

        <div class="f3v-ring" id="f3v-ring">
          <div class="f3v-ringnum">
            <div class="n" id="f3v-n">0</div>
            <div class="u" id="f3v-u">minutes</div>
          </div>
        </div>

        <div class="f3v-check" id="f3v-check"></div>

        <div class="f3v-cap" id="f3v-cap">Pour vérifier un chiffre que personne ne vérifiera vraiment.</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f3v-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#f3v-context", { opacity: 0, y: 10 });
        gsap.set("#f3v-ring", { opacity: 0, scale: 0.85 });
        gsap.set("#f3v-u", { opacity: 0 });
        gsap.set("#f3v-check", { opacity: 0, scale: 0.7 });
        gsap.set("#f3v-cap", { opacity: 0, y: 14 });

        // Scene 1 (0.0-0.5s): broken line draws
        tl.to("#f3v-brokenline span", { opacity: 0.5, duration: 0.01 }, 0.1);
        tl.to("#f3v-brokenline span", { scaleX: 1, duration: 0.35, ease: "power2.out", stagger: 0.06 }, 0.1);

        // Scene 2 (0.3-0.9s): context label
        tl.to("#f3v-context", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.35);

        // Scene 3 (0.8-1.3s): the ring appears — a stopwatch face with nothing timed on it
        tl.to("#f3v-ring", { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.85);

        // Scene 4 (1.3-2.3s, cue "Vingt minutes,"): count 0 -> 20
        const f3vn = document.getElementById("f3v-n");
        const f3vstate = { v: 0 };
        tl.to(f3vstate, {
          v: 20, duration: 1.0, ease: "power2.out",
          onUpdate: () => { f3vn.textContent = Math.round(f3vstate.v); }
        }, 1.35);
        tl.to("#f3v-u", { opacity: 1, duration: 0.3 }, 2.2);

        // Scene 5 (2.6-3.1s): the empty box lands — the friction mark this series uses instead of
        // a green check. Nothing here ever resolves into a checkmark.
        tl.to("#f3v-check", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 2.65);

        // Scene 6 (2.9-4.6s, cue "pour vérifier un chiffre que personne ne vérifiera vraiment."):
        // the caption lands, explaining what those twenty minutes buy.
        tl.to("#f3v-cap", { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.0);

        // Scene 7 (4.6-7.5s): hold — the ring breathes very slightly, nothing else moves. The
        // stillness IS the point (a timer nobody is racing).
        const f3vphase = { p: 0 };
        tl.to(f3vphase, {
          p: Math.PI * 2 * 1.1, duration: 2.6, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f3vphase.p);
            gsap.set("#f3v-ring", { scale: 1 + s * 0.008 });
          }
        }, 4.7);

        window.__timelines["03-vingt-minutes"] = tl;
      </script>
    </template>
  </body>
</html>
