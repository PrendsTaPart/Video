    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        // 00-titre -> 00b-contexte: crossfade (reused pilot beat, unchanged)
        tl.to("#el-00-titre", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-00b-contexte", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.5);

        // 00b-contexte -> 01 (caisse fermée): crossfade — the film settles from the shared
        // premise into tonight's specific close.
        tl.to("#el-00b-contexte", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26.282);
        tl.fromTo("#el-01-caisse-fermee", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26.282);

        // 01 -> 02 (ticket/tableur/TVA): push-slide — the busiest, most procedural beat of the
        // film gets the one push transition, a small jolt of motion before the long hold frames.
        tl.to("#el-01-caisse-fermee", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 36.782);
        tl.fromTo("#el-02-ticket-tableur-tva", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 36.782);

        // 02 -> 03 (vingt minutes): crossfade
        tl.to("#el-02-ticket-tableur-tva", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 53.282);
        tl.fromTo("#el-03-vingt-minutes", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 53.282);

        // 03 -> 04 (refrain): hard cut — the refrain always lands flat, no easing, per the
        // series signature ("Plus personne ne l'ouvre." hits without a soft entrance).

        // 04 -> 05 (avis Google / onze jours): crossfade
        tl.to("#el-04-refrain", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 65.782);
        tl.fromTo("#el-05-avis-google", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 65.782);

        // 05 -> 06 (23h, salle vide): crossfade
        tl.to("#el-05-avis-google", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 74.282);
        tl.fromTo("#el-06-vingt-trois-heures", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 74.282);

        // 06 -> 08-carte-marque: hard cut into full-bleed marine — the palette break IS the
        // impact (matches 08's own in-file comment; the pilot uses the same device).

        tl.to({}, { duration: 96.282 }, 0); // full-span anchor — main.duration() == composition total
      })();
    </script>
