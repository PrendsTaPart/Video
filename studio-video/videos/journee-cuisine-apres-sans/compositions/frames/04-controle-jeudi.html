<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .g4-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .g4-brokenline { position: absolute; left: 200px; right: 200px; top: 280px; height: 2px; }
        .g4-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.45; transform-origin: 0% 50%; }

        .g4-lines { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
        .g4-l1 { font-size: 62px; font-weight: 700; line-height: 1.3; opacity: 0; }
        .g4-l2 { font-size: 62px; font-weight: 700; line-height: 1.3; margin-top: 8px; opacity: 0; }

        .g4-chips {
          position: absolute; left: 50%; top: 700px; transform: translateX(-50%);
          display: flex; align-items: center; gap: 30px;
        }
        .g4-chip {
          position: relative; padding: 22px 40px; border: 1px solid #8A9099;
          font-size: 30px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
          color: rgba(58,63,69,0.85); opacity: 0;
        }
        .g4-chip.jeudi { }
        .g4-chip.mercredi { border-color: #3A3F45; color: #3A3F45; }
        .g4-cross { position: absolute; inset: 0; opacity: 0; }
        .g4-cross::before, .g4-cross::after {
          content: ""; position: absolute; left: 50%; top: 50%; width: 90%; height: 3px;
          background: #D64545; transform-origin: center;
        }
        .g4-cross::before { transform: translate(-50%,-50%) rotate(18deg); }
        .g4-cross::after { transform: translate(-50%,-50%) rotate(-18deg); }
        .g4-connector { width: 70px; height: 2px; border-top: 2px dashed #8A9099; opacity: 0; }
      </style>

      <div id="root" data-composition-id="04-controle-jeudi" data-width="1920" data-height="1080" data-duration="8.0">
        <div class="g4-bg clip" id="g4-bgclip" data-start="0" data-duration="8.0" data-track-index="1"></div>

        <div class="g4-brokenline" id="g4-brokenline">
          <span style="left:4%; width:16%;"></span>
          <span style="left:26%; width:20%; top:-3px;"></span>
          <span style="left:52%; width:14%; top:2px;"></span>
          <span style="left:72%; width:22%;"></span>
        </div>

        <div class="g4-lines">
          <div class="g4-l1" id="g4-l1">Le contrôle, c'est jeudi.</div>
          <div class="g4-l2" id="g4-l2">Je remplirai mercredi soir.</div>
        </div>

        <div class="g4-chips">
          <div class="g4-chip jeudi" id="g4-chip-jeudi">Jeudi<div class="g4-cross" id="g4-cross"></div></div>
          <div class="g4-connector" id="g4-connector"></div>
          <div class="g4-chip mercredi" id="g4-chip-mercredi">Mercredi soir</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#g4-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#g4-l1", { opacity: 0, y: 14 });
        gsap.set("#g4-l2", { opacity: 0, y: 14 });
        gsap.set("#g4-chip-jeudi", { opacity: 0, y: 10 });
        gsap.set("#g4-chip-mercredi", { opacity: 0, y: 10 });
        gsap.set("#g4-cross", { opacity: 0, scale: 0.7 });
        gsap.set("#g4-connector", { opacity: 0, scaleX: 0 });

        // Scene 1 (0.0-0.5s): broken line draws itself on
        tl.to("#g4-brokenline span", { opacity: 0.45, duration: 0.01 }, 0.1);
        tl.to("#g4-brokenline span", { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.07 }, 0.1);

        // Scene 2 (0.3-0.9s, cue "Le contrôle, c'est jeudi."): first line, "jeudi" chip + cross
        tl.to("#g4-l1", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.35);
        tl.to("#g4-chip-jeudi", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.75);
        tl.fromTo("#g4-cross", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 1.05);

        // Scene 3 (1.5-2.6s, cue "Je remplirai mercredi soir."): second line, connector + mercredi chip
        tl.to("#g4-l2", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.55);
        tl.to("#g4-connector", { opacity: 0.7, scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.95);
        tl.to("#g4-chip-mercredi", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.15);

        // Scene 4 (2.6-8.0s): hold — subtle jitter on the mercredi chip, the one that actually happens
        const g4phase = { p: 0 };
        tl.to(g4phase, {
          p: Math.PI * 2 * 1.1, duration: 3.6, ease: "none",
          onUpdate: () => {
            const s = Math.sin(g4phase.p);
            gsap.set("#g4-chip-mercredi", { y: s * 1.5 });
          }
        }, 2.7);

        window.__timelines["04-controle-jeudi"] = tl;
      </script>
    </template>
  </body>
</html>
