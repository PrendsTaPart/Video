<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .g2-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .g2-lead {
          position: absolute; left: 0; right: 0; top: 170px; text-align: center;
          font-size: 38px; font-weight: 600; color: rgba(58,63,69,0.85); opacity: 0;
        }
        .g2-numeral {
          position: absolute; left: 0; right: 0; top: 350px; text-align: center;
          font-size: 380px; font-weight: 800; color: #D64545; line-height: 1;
          font-variant-numeric: tabular-nums; opacity: 0;
        }
        .g2-sub {
          position: absolute; left: 0; right: 0; top: 800px; text-align: center;
          font-size: 40px; font-weight: 600; color: rgba(58,63,69,0.85); opacity: 0;
        }
        .g2-cross {
          position: absolute; left: 50%; top: 900px; margin-left: -34px;
          width: 68px; height: 68px; opacity: 0;
        }
        .g2-cross::before, .g2-cross::after {
          content: ""; position: absolute; left: 32px; top: 4px; width: 4px; height: 60px;
          background: #D64545;
        }
        .g2-cross::before { transform: rotate(45deg); }
        .g2-cross::after { transform: rotate(-45deg); }
      </style>

      <div id="root" data-composition-id="02-refrain" data-width="1920" data-height="1080" data-duration="9.0">
        <div class="g2-bg clip" id="g2-bgclip" data-start="0" data-duration="9.0" data-track-index="1"></div>

        <div class="g2-lead" id="g2-lead">la nouvelle recrue</div>
        <div class="g2-numeral" id="g2-numeral">3</div>
        <div class="g2-sub" id="g2-sub">heures de formation</div>
        <div class="g2-cross" id="g2-cross"></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#g2-lead", { opacity: 0 });
        gsap.set("#g2-numeral", { opacity: 0, scale: 0 });
        gsap.set("#g2-sub", { opacity: 0 });
        gsap.set("#g2-cross", { opacity: 0, scale: 0.6 });

        // Scene 1 (0.0-0.7s): "la nouvelle recrue" — quiet lead-in label
        tl.to("#g2-lead", { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15);

        // Scene 2 (0.7-2.2s, cue "La nouvelle a été formée trois heures."): giant "3" spring-pops
        tl.fromTo("#g2-numeral", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.8);
        tl.to("#g2-sub", { opacity: 1, duration: 0.35, ease: "power3.out" }, 1.4);

        // Scene 3 (2.2-3.1s, cue "Elle est partie au bout de"): brief hold before the turn
        // Scene 4 (3.1-4.2s, cue "six semaines."): hard-cut 3 -> 6, the signature refrain move
        tl.call(() => {
          document.getElementById("g2-numeral").textContent = "6";
          document.getElementById("g2-sub").textContent = "semaines. elle est partie.";
        }, [], 3.15);

        // Scene 5 (4.2-5.0s): a red cross lands beneath — the friction mark for the departure
        tl.fromTo("#g2-cross", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 4.3);

        // Scene 6 (5.0-9.0s): hold — dead still but for a barely-perceptible jitter on the numeral
        const g2phase = { p: 0 };
        tl.to(g2phase, {
          p: Math.PI * 2 * 1.3, duration: 4.0, ease: "none",
          onUpdate: () => {
            const s = Math.sin(g2phase.p);
            gsap.set("#g2-numeral", { scale: 1 + s * 0.004 });
          }
        }, 5.0);

        window.__timelines["02-refrain"] = tl;
      </script>
    </template>
  </body>
</html>
