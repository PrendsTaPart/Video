<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .g3-bg { position: absolute; inset: 0; background: #EDEEF0; }
        .g3-stage { position: absolute; inset: 0; }

        .g3-context { position: absolute; left: 140px; top: 90px; font-size: 26px; font-weight: 500; color: rgba(58,63,69,0.85); opacity: 0; }

        .g3-brokenline { position: absolute; left: 140px; right: 140px; top: 950px; height: 2px; }
        .g3-brokenline span { position: absolute; top: 0; height: 2px; background: #8A9099; opacity: 0.5; transform-origin: 0% 50%; }

        .g3-label { position: absolute; left: 140px; top: 168px; font-size: 40px; font-weight: 700; opacity: 0; }

        .g3-counterrow { position: absolute; left: 140px; top: 250px; display: flex; align-items: baseline; gap: 30px; opacity: 0; }
        .g3-counterrow .num { font-size: 230px; font-weight: 800; color: #D64545; line-height: 1; font-variant-numeric: tabular-nums; }
        .g3-counterrow .label { font-size: 34px; font-weight: 600; color: rgba(58,63,69,0.85); max-width: 320px; line-height: 1.3; }

        .g3-sub { position: absolute; left: 140px; top: 540px; width: 780px; font-size: 30px; font-weight: 500; color: rgba(58,63,69,0.85); line-height: 1.4; opacity: 0; }

        .g3-tally { position: absolute; left: 140px; top: 660px; display: flex; gap: 26px; }
        .g3-box {
          width: 130px; height: 130px; border: 1px solid #8A9099; background: rgba(58,63,69,0.045);
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 8px;
        }
        .g3-box .day { font-size: 20px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(58,63,69,0.85); }
        .g3-box .mark { font-size: 44px; font-weight: 800; color: #D64545; opacity: 0; }

        .g3-panel {
          position: absolute; right: 140px; top: 170px; width: 760px; height: 560px;
          border: 1px solid #8A9099; box-shadow: 0 20px 50px rgba(20,22,25,0.14);
          overflow: hidden; opacity: 0;
        }
        .g3-panel img {
          width: 100%; height: 100%; object-fit: cover;
          filter: grayscale(0.85) contrast(1.05) brightness(1.02);
          display: block;
        }
      </style>

      <div id="root" data-composition-id="03-classeur-haccp" data-width="1920" data-height="1080" data-duration="14.5">
        <div class="g3-bg clip" id="g3-bgclip" data-start="0" data-duration="14.5" data-track-index="1"></div>

        <div class="g3-stage" id="g3-stage">
          <div class="g3-context" id="g3-context">chaque fin de service</div>

          <div class="g3-brokenline" id="g3-brokenline">
            <span style="left:2%; width:14%;"></span>
            <span style="left:22%; width:18%; top:-3px;"></span>
            <span style="left:46%; width:12%; top:2px;"></span>
            <span style="left:64%; width:20%;"></span>
            <span style="left:88%; width:10%; top:-2px;"></span>
          </div>

          <div class="g3-label" id="g3-label">le classeur HACCP attend</div>

          <div class="g3-counterrow" id="g3-counterrow">
            <div class="num" id="g3-num">0</div>
            <div class="label">jours de relevés</div>
          </div>

          <div class="g3-sub" id="g3-sub">à remplir de mémoire, d'un coup.</div>

          <div class="g3-tally">
            <div class="g3-box"><span class="day">J-3</span><span class="mark" id="g3-m1">?</span></div>
            <div class="g3-box"><span class="day">J-2</span><span class="mark" id="g3-m2">?</span></div>
            <div class="g3-box"><span class="day">J-1</span><span class="mark" id="g3-m3">?</span></div>
          </div>

          <div class="g3-panel" id="g3-panel">
            <img src="public/generated/haccp-binder.jpg" alt="" />
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#g3-context", { opacity: 0 });
        gsap.set("#g3-brokenline span", { opacity: 0, scaleX: 0 });
        gsap.set("#g3-label", { opacity: 0, y: 12 });
        gsap.set("#g3-counterrow", { opacity: 0, y: 14 });
        gsap.set("#g3-sub", { opacity: 0, y: 10 });
        gsap.set(["#g3-m1", "#g3-m2", "#g3-m3"], { opacity: 0, scale: 0.5 });
        gsap.set("#g3-panel", { opacity: 0, x: 40 });

        // Scene 1 (0.0-0.6s): broken line draws itself on; context label fades
        tl.to("#g3-brokenline span", { opacity: 0.5, duration: 0.01 }, 0.1);
        tl.to("#g3-brokenline span", { scaleX: 1, duration: 0.4, ease: "power2.out", stagger: 0.07 }, 0.1);
        tl.to("#g3-context", { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.2);

        // Scene 2 (0.6-1.7s, cue "Le classeur HACCP attend"): label + real binder photo settle in
        tl.to("#g3-label", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.65);
        tl.to("#g3-panel", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.85);

        // Scene 3 (1.7-3.1s, cue "trois jours de relevés"): the counter counts 0 -> 3
        tl.to("#g3-counterrow", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.75);
        const g3count = { v: 0 };
        const g3el = document.getElementById("g3-num");
        tl.to(g3count, {
          v: 3, duration: 0.9, ease: "power2.out",
          onUpdate: () => { g3el.textContent = Math.round(g3count.v); }
        }, 1.85);

        // Scene 4 (3.1-4.5s, cue "à remplir de mémoire,"): sub-line settles
        tl.to("#g3-sub", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.15);

        // Scene 5 (4.5-5.6s, cue "d'un coup."): the three day boxes fill fast, back to back —
        // the friction mark ("?") lands on each in a hurried stagger, never a green check.
        tl.fromTo("#g3-m1", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, 4.55);
        tl.fromTo("#g3-m2", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, 4.78);
        tl.fromTo("#g3-m3", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, 5.01);

        // Scene 6 (5.6-14.5s): hold — continuous low-amplitude drift on the whole stage; a later,
        // second beat re-pulses the counter around mid-hold so the frame stays alive.
        const g3stage = document.getElementById("g3-stage");
        const g3drift = { p: 0 };
        tl.to(g3drift, {
          p: Math.PI * 2 * 2.6, duration: 8.9, ease: "none",
          onUpdate: () => {
            const s = Math.sin(g3drift.p);
            g3stage.style.transform = `translate(${s * 2.5}px, ${Math.sin(g3drift.p * 0.6) * 1.8}px) scale(${1 + s * 0.002})`;
          }
        }, 5.6);
        tl.to("#g3-counterrow .num", { scale: 1.05, duration: 0.5, ease: "power2.out" }, 9.0);
        tl.to("#g3-counterrow .num", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 9.5);

        window.__timelines["03-classeur-haccp"] = tl;
      </script>
    </template>
  </body>
</html>
