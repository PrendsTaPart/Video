    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions: simultaneous crossfades/slides at each exact boundary
      //    timestamp (no time-shifted overlap) — see BRIEF.md for the reasoning ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-00-titre", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-00b-contexte", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.5);

        tl.to("#el-00b-contexte", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26.282);
        tl.fromTo("#el-01-quarante-cinq-minutes", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26.282);

        tl.to("#el-01-quarante-cinq-minutes", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 34.282);
        tl.fromTo("#el-02-refrain", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 34.282);

        tl.to("#el-02-refrain", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 43.282);
        tl.fromTo("#el-03-classeur-haccp", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 43.282);

        tl.to("#el-03-classeur-haccp", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 57.782);
        tl.fromTo("#el-04-controle-jeudi", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 57.782);

        tl.to("#el-04-controle-jeudi", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 65.782);
        tl.fromTo("#el-05-plan-nettoyage", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 65.782);

        tl.to("#el-05-plan-nettoyage", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 79.782);
        tl.fromTo("#el-06-minuit-moins-le-quart", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 79.782);

        tl.to("#el-06-minuit-moins-le-quart", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 86.282);
        tl.fromTo("#el-08-carte-marque", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 86.282);

        tl.to({}, { duration: 96.282 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
