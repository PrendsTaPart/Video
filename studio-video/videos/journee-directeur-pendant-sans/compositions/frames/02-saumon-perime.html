<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f2-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f2-photo {
          position: absolute; left: 190px; top: 300px; width: 640px; height: 480px;
          border: 1px solid #8A9099; overflow: hidden;
        }
        .f2-photo img {
          width: 100%; height: 100%; object-fit: cover;
          filter: grayscale(0.75) contrast(1.05);
          display: block;
        }
        .f2-photolabel { position: absolute; left: 190px; top: 800px; width: 640px; font-size: 26px; font-weight: 500; color: rgba(58,63,69,0.85); }

        .f2-strip { position: absolute; right: 190px; top: 340px; width: 900px; }
        .f2-striplabel { font-size: 22px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: rgba(58,63,69,0.85); margin-bottom: 22px; }
        .f2-days { display: flex; gap: 6px; }
        .f2-day {
          flex: 1; height: 96px; border: 1px solid #8A9099; display: flex; align-items: center; justify-content: center;
          font-size: 24px; font-weight: 600; color: rgba(58,63,69,0.85);
        }
        .f2-day.jeu { border-color: #D64545; border-width: 2px; color: #D64545; font-weight: 800; }

        .f2-qmark {
          position: absolute; width: 60px; height: 60px; border: 2px solid #D64545; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 38px; font-weight: 800; color: #D64545;
          opacity: 0;
        }

        .f2-caption1 { position: absolute; right: 190px; top: 470px; width: 900px; font-size: 30px; font-weight: 500; color: rgba(58,63,69,0.85); opacity: 0; }
        .f2-caption2 { position: absolute; right: 190px; top: 560px; width: 900px; font-size: 36px; font-weight: 700; color: #3A3F45; opacity: 0; }
        .f2-caption2 .accent { color: #D64545; }
      </style>

      <div id="root" data-composition-id="02-saumon-perime" data-width="1920" data-height="1080" data-duration="8.990">
        <div class="f2-bg clip" id="f2-bgclip" data-start="0" data-duration="8.990" data-track-index="1"></div>

        <div class="f2-photo" id="f2-photo">
          <img src="public/generated/salmon-crate.jpg" alt="" />
        </div>
        <div class="f2-photolabel" id="f2-photolabel">chambre froide — stock saumon</div>

        <div class="f2-strip">
          <div class="f2-striplabel">cette semaine</div>
          <div class="f2-days" id="f2-days">
            <div class="f2-day">LUN</div>
            <div class="f2-day">MAR</div>
            <div class="f2-day">MER</div>
            <div class="f2-day jeu" id="f2-jeu">JEU</div>
            <div class="f2-day">VEN</div>
            <div class="f2-day">SAM</div>
            <div class="f2-day">DIM</div>
          </div>
          <div class="f2-qmark" id="f2-qmark" style="left: 546px; top: -34px;">?</div>
        </div>

        <div class="f2-caption1" id="f2-caption1">Le stock de saumon périme <span style="color:#D64545; font-weight:700;">jeudi</span>.</div>
        <div class="f2-caption2" id="f2-caption2">Je l'apprendrai <span class="accent">jeudi</span>.</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f2-photo", { opacity: 0, y: 16 });
        gsap.set("#f2-photolabel", { opacity: 0 });
        gsap.set("#f2-days", { opacity: 0, y: 10 });
        gsap.set("#f2-caption1", { opacity: 0, y: 10 });
        gsap.set("#f2-caption2", { opacity: 0, y: 10 });
        gsap.set("#f2-qmark", { opacity: 0, scale: 0 });

        // Scene 1 (0.0-1.0s): the photo settles in first, cold and desaturated.
        tl.to("#f2-photo", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.to("#f2-photolabel", { opacity: 1, duration: 0.35, ease: "power3.out" }, 0.5);

        // Scene 2 (1.0-1.87s, cue "Le stock de saumon périme jeudi."): the week strip reveals,
        // JEU already flagged red — the expiry date, fixed and known in advance.
        tl.to("#f2-days", { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.0);
        tl.to("#f2-caption1", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.3);

        // Scene 3 (1.87-3.11s, cue "Je l'apprendrai jeudi."): a red "?" lands directly on JEU —
        // the discovery and the deadline are the same day, no lead time between them.
        tl.fromTo("#f2-qmark", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 2.0);
        tl.to("#f2-caption2", { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.2);

        // Scene 4 (3.11-8.99s): long silent hold — the week just sits there, waiting for
        // Thursday. Barely-perceptible jitter on the "?" only.
        const f2phase = { p: 0 };
        tl.to(f2phase, {
          p: Math.PI * 2 * 2.1, duration: 5.5, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f2phase.p);
            gsap.set("#f2-qmark", { y: -34 + s * 2 });
          }
        }, 3.3);

        window.__timelines["02-saumon-perime"] = tl;
      </script>
    </template>
  </body>
</html>
