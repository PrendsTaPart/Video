<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-800.woff2") format("woff2"); font-weight: 800; font-style: normal; font-display: block; }

        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          color: #3A3F45;
        }
        .f4-bg { position: absolute; inset: 0; background: #EDEEF0; }

        .f4-lead {
          position: absolute; left: 0; right: 0; top: 170px; text-align: center;
          font-size: 38px; font-weight: 600; color: rgba(58,63,69,0.85);
        }
        .f4-numeral {
          position: absolute; left: 0; right: 0; top: 370px; text-align: center;
          font-size: 380px; font-weight: 800; color: #D64545; line-height: 1;
          font-variant-numeric: tabular-nums;
        }
        .f4-sub {
          position: absolute; left: 0; right: 0; top: 825px; text-align: center;
          font-size: 38px; font-weight: 600; color: rgba(58,63,69,0.85);
        }

        .f4-chips { position: absolute; left: 0; right: 0; top: 918px; display: flex; justify-content: center; gap: 16px; }
        .f4-chip {
          width: 56px; height: 56px; border: 2px solid #8A9099; border-radius: 8px;
          display: flex; align-items: center; justify-content: center; opacity: 0;
          font-size: 26px; font-weight: 800; color: rgba(58,63,69,0.5);
        }
        .f4-chip.used { border-color: #3A3F45; color: #3A3F45; }
        .f4-chip.cut { border-color: #D64545; color: #D64545; opacity: 0.5; }
      </style>

      <div id="root" data-composition-id="04-refrain" data-width="1920" data-height="1080" data-duration="7.501">
        <div class="f4-bg clip" id="f4-bgclip" data-start="0" data-duration="7.501" data-track-index="1"></div>

        <div class="f4-lead" id="f4-lead">le pire ?</div>
        <div class="f4-numeral" id="f4-numeral">7</div>
        <div class="f4-sub" id="f4-sub">abonnements payés</div>
        <div class="f4-chips" id="f4-chips">
          <div class="f4-chip" id="f4-c1">1</div>
          <div class="f4-chip" id="f4-c2">2</div>
          <div class="f4-chip" id="f4-c3">3</div>
          <div class="f4-chip" id="f4-c4">4</div>
          <div class="f4-chip" id="f4-c5">5</div>
          <div class="f4-chip" id="f4-c6">6</div>
          <div class="f4-chip" id="f4-c7">7</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#f4-lead", { opacity: 0 });
        gsap.set("#f4-numeral", { opacity: 0, scale: 0 });
        gsap.set("#f4-sub", { opacity: 0 });
        gsap.set(".f4-chip", { opacity: 0, y: 8 });

        // Scene 1 (0.0-0.65s): "Le pire ?" — quiet lead-in label
        tl.to("#f4-lead", { opacity: 1, duration: 0.35, ease: "power3.out" }, 0.12);

        // Scene 2 (0.65-1.45s, cue "Je paie sept abonnements."): giant "7" spring-pops, sub-label
        // settles, seven chips reveal in a row (all still "paid").
        tl.fromTo("#f4-numeral", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.7);
        tl.to("#f4-sub", { opacity: 1, duration: 0.35, ease: "power3.out" }, 1.3);
        gsap.utils.toArray(".f4-chip").forEach((el, i) => {
          tl.to(el, { opacity: 0.85, y: 0, duration: 0.3, ease: "power3.out" }, 1.4 + i * 0.05);
        });

        // Scene 3 (1.45-3.0s, cue "Mon équipe en utilise deux."): hard-cut 7 -> 2 (instant, the
        // signature move) — five chips get crossed out, two stay lit.
        tl.call(() => {
          document.getElementById("f4-numeral").textContent = "2";
          document.getElementById("f4-sub").textContent = "réellement utilisés";
          ["f4-c3", "f4-c4", "f4-c5", "f4-c6", "f4-c7"].forEach((id) => {
            const el = document.getElementById(id);
            el.classList.add("cut");
            el.textContent = "✕";
          });
          ["f4-c1", "f4-c2"].forEach((id) => document.getElementById(id).classList.add("used"));
        }, [], 1.5);

        // Scene 4 (3.0-7.001s): hold — dead still, the longest hold of the frame. Only a
        // barely-perceptible jitter, well below the default range.
        const f4phase = { p: 0 };
        tl.to(f4phase, {
          p: Math.PI * 2 * 1.1, duration: 3.3, ease: "none",
          onUpdate: () => {
            const s = Math.sin(f4phase.p);
            gsap.set("#f4-numeral", { scale: 1 + s * 0.004 });
          }
        }, 3.1);

        window.__timelines["04-refrain"] = tl;
      </script>
    </template>
  </body>
</html>
