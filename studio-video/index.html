<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Goodly";
        /* TEMP: Fredoka (Google Fonts) as stand-in for the real Goodly brand font.
           Swap this file for the real Goodly .woff2/.ttf as soon as Michael provides it. */
        src: url("assets/vendor/fonts/Fredoka-Variable.woff2") format("woff2-variations");
        font-weight: 400 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--foodeatup-bg);
      }
      body {
        font-family: "Goodly", sans-serif;
        --foodeatup-bg: #fcf9e6; /* crème */
        --foodeatup-ink: #0f1a23; /* marine foncé (texte) */
        --foodeatup-blue: #007bff; /* accent primaire */
        --foodeatup-orange: #ffa500; /* accent secondaire / CTA */
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
      .subtitle {
        font-family: "Goodly", sans-serif;
        font-weight: 700;
        color: #ffffff;
        -webkit-text-stroke: 6px #000000;
        paint-order: stroke fill;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >



      <!--
        Add your clips here. Example:
        <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1"
             style="font-size: 64px; color: var(--foodeatup-ink); padding: 40px">
          Hello World
        </div>
      -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Example: tl.from("#title", { opacity: 0, y: -50, duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
