<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fredoka";
          src: url("assets/vendor/fonts/Fredoka-Variable.woff2") format("woff2-variations");
          font-weight: 300 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          background: #fcf9e6;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }
        .bubble {
          position: absolute;
          left: 200px;
          top: 110px;
          width: 1080px;
          background: #ffffff;
          border: 3px solid #0f1a23;
          border-radius: 28px;
          padding: 48px 56px;
          transform: scale(0.85);
          opacity: 0;
        }
        .bubble-label {
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 26px;
          color: #007bff;
          margin-bottom: 16px;
        }
        .bubble-text {
          font-family: "Fredoka", sans-serif;
          font-weight: 700;
          font-size: 58px;
          color: #0f1a23;
          line-height: 1.25;
        }
        .mascot {
          position: absolute;
          left: 120px;
          bottom: -30px;
          width: 220px;
          height: auto;
          transform: scale(0);
          transform-origin: bottom center;
        }
        .ingredient-card {
          position: absolute;
          right: 180px;
          top: 560px;
          width: 420px;
          background: #ffffff;
          border: 3px solid #0f1a23;
          border-radius: 24px;
          overflow: hidden;
          opacity: 0;
          transform: translateY(24px) scale(0.9);
        }
        .ingredient-photo {
          width: 100%;
          height: 300px;
          object-fit: cover;
        }
        .ingredient-text {
          padding: 18px 24px 22px;
        }
        .ingredient-name {
          font-family: "Fredoka", sans-serif;
          font-weight: 700;
          font-size: 30px;
          color: #0f1a23;
        }
        .ingredient-price {
          margin-top: 6px;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 24px;
          color: #007bff;
        }
      </style>

      <div
        id="root"
        data-composition-id="b01-scene2-question"
        data-width="1920"
        data-height="1080"
        data-duration="6.12"
      >
        <img class="mascot" id="mascot" src="assets/brand/mascots/agent-laptop-homme.png" alt="" />
        <div class="bubble" id="bubble">
          <div class="bubble-label">À Jarvis</div>
          <div class="bubble-text">« Ajoute le poulet fermier à douze&nbsp;euros&nbsp;quatre-vingts le kilo, chez Metro. »</div>
        </div>
        <div class="ingredient-card" id="ingredient-card">
          <img class="ingredient-photo" src="assets/brand/dishes/poulet-fermier.jpg" alt="Poulet fermier" />
          <div class="ingredient-text">
            <div class="ingredient-name">Poulet fermier</div>
            <div class="ingredient-price">12,80 €/kg · Metro</div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#mascot", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.05);
        tl.fromTo("#bubble", { scale: 0.85, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" }, 0.3);
        tl.fromTo("#ingredient-card", { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 2.6);
        tl.to("#mascot", { y: -8, duration: 0.9, ease: "sine.inOut", repeat: 2, yoyo: true }, 1.0);

        window.__timelines["b01-scene2-question"] = tl;
      </script>
    </template>
  </body>
</html>
