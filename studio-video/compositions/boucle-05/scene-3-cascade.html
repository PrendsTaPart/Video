<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fredoka";
          src: url("assets/vendor/fonts/Fredoka-Variable.woff2") format("woff2-variations");
          font-weight: 300 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          background: #fcf9e6;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }
        .eyebrow {
          position: absolute;
          top: 56px;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 34px;
          letter-spacing: 0.02em;
          color: #0f1a23;
          opacity: 0;
        }
        #node-layer {
          position: absolute;
          inset: 0;
        }
        .node {
          position: absolute;
          width: 380px;
          height: 130px;
          border-radius: 20px;
          background: #ffffff;
          border: 3px solid #0f1a23;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 0 20px;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 27px;
          color: #0f1a23;
          transform: scale(0);
        }
        .screens-panel {
          position: absolute;
          left: 260px;
          top: 790px;
          width: 1400px;
          opacity: 0;
          transform: translateY(24px);
          display: flex;
          justify-content: space-between;
        }
        .screen {
          width: 420px;
          background: #ffffff;
          border: 3px solid #0f1a23;
          border-radius: 20px;
          overflow: hidden;
        }
        .screen-photo {
          width: 100%;
          height: 130px;
          object-fit: cover;
        }
        .screen-label {
          padding: 12px 18px;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 22px;
          color: #0f1a23;
          opacity: 0.7;
        }
      </style>

      <div
        id="root"
        data-composition-id="b05-scene3-cascade"
        data-width="1920"
        data-height="1080"
        data-duration="19.50"
      >
        <div class="eyebrow" id="eyebrow">CE QUI SE MET À JOUR PARTOUT</div>

        <svg id="path-svg" width="1920" height="1080" style="position:absolute; inset:0;">
          <polyline
            id="chain-path"
            points="300,280 740,280 1180,280 1620,280 1620,610 1180,610 740,610"
            fill="none"
            stroke="#0f1a23"
            stroke-opacity="0.18"
            stroke-width="4"
            stroke-dasharray="1560"
            stroke-dashoffset="1560"
          />
          <circle id="dot" cx="300" cy="280" r="13" fill="#007bff" opacity="0" />
          <circle id="dot-halo" cx="300" cy="280" r="22" fill="#007bff" opacity="0" fill-opacity="0.18" />
        </svg>

        <div id="node-layer">
          <div class="node" id="node-1" style="left:110px; top:215px;">Carte en ligne</div>
          <div class="node" id="node-2" style="left:550px; top:215px;">Visite (QR, site, réseaux)</div>
          <div class="node" id="node-3" style="left:990px; top:215px;">Panier ou réservation</div>
          <div class="node" id="node-4" style="left:1430px; top:215px;">Commande</div>
          <div class="node" id="node-5" style="left:1430px; top:545px;">Service</div>
          <div class="node" id="node-6" style="left:990px; top:545px;">Avis</div>
          <div class="node" id="node-7" style="left:550px; top:545px;">Ajustement de la carte</div>
        </div>

        <div class="screens-panel" id="screens-panel">
          <div class="screen">
            <img class="screen-photo" src="assets/brand/dishes/plat-du-jour.jpg" alt="" />
            <div class="screen-label">Site</div>
          </div>
          <div class="screen">
            <img class="screen-photo" src="assets/brand/dishes/plat-du-jour.jpg" alt="" />
            <div class="screen-label">QR de table</div>
          </div>
          <div class="screen">
            <img class="screen-photo" src="assets/brand/dishes/plat-du-jour.jpg" alt="" />
            <div class="screen-label">Commande en ligne</div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const pts = [
          [300, 280], [740, 280], [1180, 280], [1620, 280],
          [1620, 610], [1180, 610], [740, 610]
        ];
        const NODE_START = 1.3;
        const NODE_STEP = 1.7;
        const BLUE = "#007bff";
        const CREAM = "#fcf9e6";

        tl.fromTo("#eyebrow", { opacity: 0, y: -14 }, { opacity: 0.55, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
        tl.to("#chain-path", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.25);
        tl.fromTo(".node", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)", stagger: 0.05 }, 0.9);

        for (let i = 0; i < pts.length; i++) {
          const t = NODE_START + i * NODE_STEP;
          tl.to(`#node-${i + 1}`, { backgroundColor: BLUE, borderColor: BLUE, color: CREAM, duration: 0.35, ease: "power2.out" }, t);
          tl.to(`#node-${i + 1}`, { scale: 1.06, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, t);

          if (i < pts.length - 1) {
            const [x0, y0] = pts[i];
            const [x1, y1] = pts[i + 1];
            tl.set("#dot, #dot-halo", { attr: { cx: x0, cy: y0 }, opacity: 1 }, t + 0.12);
            tl.to("#dot, #dot-halo", { attr: { cx: x1, cy: y1 }, duration: NODE_STEP - 0.3, ease: "power1.inOut" }, t + 0.12);
          } else {
            tl.to("#dot, #dot-halo", { opacity: 0, duration: 0.3 }, t + 0.25);
          }
        }

        const screensAt = NODE_START + pts.length * NODE_STEP + 0.4;
        tl.to("#screens-panel", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, screensAt);

        window.__timelines["b05-scene3-cascade"] = tl;
      </script>
    </template>
  </body>
</html>
