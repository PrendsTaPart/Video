<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fredoka";
          src: url("assets/vendor/fonts/Fredoka-Variable.woff2") format("woff2-variations");
          font-weight: 300 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          background: #fcf9e6;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }
        .eyebrow {
          position: absolute;
          top: 70px;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 34px;
          color: #0f1a23;
          opacity: 0;
        }
        .loop-node {
          position: absolute;
          width: 210px;
          height: 92px;
          margin-left: -105px;
          margin-top: -46px;
          border-radius: 46px;
          background: #fcf9e6;
          border: 3px solid #0f1a23;
          opacity: 0.35;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 24px;
          color: #0f1a23;
          transform: scale(0);
        }
      </style>

      <div
        id="root"
        data-composition-id="b03-scene5-boucles"
        data-width="1920"
        data-height="1080"
        data-duration="7.26"
      >
        <div class="eyebrow" id="eyebrow">CETTE BOUCLE EN ALIMENTE QUATRE AUTRES</div>

        <svg width="1920" height="1080" style="position:absolute; inset:0;">
          <circle id="loop-left" cx="650" cy="540" r="260" fill="none" stroke="#0f1a23" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="1634" stroke-dashoffset="1634" />
          <circle id="loop-right" cx="1270" cy="540" r="260" fill="none" stroke="#0f1a23" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="1634" stroke-dashoffset="1634" />
          <circle id="glow-haccp" cx="717" cy="289" r="60" fill="#147aff" opacity="0" />
          <circle id="glow-ecom" cx="1337" cy="791" r="60" fill="#147aff" opacity="0" />
          <circle id="glow-comm" cx="1521" cy="607" r="60" fill="#147aff" opacity="0" />
          <circle id="glow-compta" cx="1203" cy="289" r="60" fill="#147aff" opacity="0" />
        </svg>

        <div class="loop-node" id="n-config" style="left:583px; top:791px;">Configuration</div>
        <div class="loop-node" id="n-equipe" style="left:399px; top:607px;">Équipe</div>
        <div class="loop-node" id="n-stock" style="left:466px; top:356px;">StockVisionAI</div>
        <div class="loop-node" id="n-haccp" style="left:717px; top:289px;">HACCP</div>
        <div class="loop-node" id="n-ecom" style="left:1337px; top:791px;">E-commerce</div>
        <div class="loop-node" id="n-comm" style="left:1521px; top:607px;">Communication</div>
        <div class="loop-node" id="n-fidelite" style="left:1454px; top:356px;">Fidélité</div>
        <div class="loop-node" id="n-compta" style="left:1203px; top:289px;">Comptabilité</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#eyebrow", { opacity: 0, y: -14 }, { opacity: 0.55, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
        tl.to("#loop-left", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.25);
        tl.to("#loop-right", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.45);

        const nodes = ["#n-config", "#n-equipe", "#n-stock", "#n-haccp", "#n-ecom", "#n-comm", "#n-fidelite", "#n-compta"];
        tl.fromTo(nodes, { scale: 0 }, { scale: 1, duration: 0.32, ease: "back.out(2)", stagger: 0.05 }, 0.9);

        // The four StockVisionAI-fed loops light up one after another.
        const lit = [
          { node: "#n-haccp", glow: "#glow-haccp" },
          { node: "#n-ecom", glow: "#glow-ecom" },
          { node: "#n-comm", glow: "#glow-comm" },
          { node: "#n-compta", glow: "#glow-compta" },
        ];
        const LIT_START = 2.1;
        const LIT_STEP = 0.85;
        lit.forEach((entry, i) => {
          const t = LIT_START + i * LIT_STEP;
          tl.to(entry.node, { backgroundColor: "#147aff", borderColor: "#147aff", color: "#fcf9e6", opacity: 1, scale: 1.08, duration: 0.35, ease: "power2.out" }, t);
          tl.to(entry.node, { scale: 1, duration: 0.22, ease: "power2.out" }, t + 0.35);
          tl.to(entry.glow, { opacity: 0.4, duration: 0.4, ease: "sine.out" }, t);
        });

        window.__timelines["b03-scene5-boucles"] = tl;
      </script>
    </template>
  </body>
</html>
