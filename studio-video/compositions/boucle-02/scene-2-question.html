<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fredoka";
          src: url("assets/vendor/fonts/Fredoka-Variable.woff2") format("woff2-variations");
          font-weight: 300 700;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          background: #fcf9e6;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }
        .bubble {
          position: absolute;
          left: 260px;
          top: 380px;
          width: 1180px;
          background: #ffffff;
          border: 3px solid #0f1a23;
          border-radius: 28px;
          padding: 56px 64px;
          transform: scale(0.85);
          opacity: 0;
        }
        .bubble-label {
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 26px;
          color: #007bff;
          margin-bottom: 18px;
        }
        .bubble-text {
          font-family: "Fredoka", sans-serif;
          font-weight: 700;
          font-size: 78px;
          color: #0f1a23;
          line-height: 1.15;
        }
        .mascot {
          position: absolute;
          right: 210px;
          bottom: -40px;
          width: 420px;
          height: auto;
          transform: scale(0);
          transform-origin: bottom center;
        }
      </style>

      <div
        id="root"
        data-composition-id="b02-scene2-question"
        data-width="1920"
        data-height="1080"
        data-duration="2.64"
      >
        <img class="mascot" id="mascot" src="assets/brand/mascots/agent-rh.png" alt="" />
        <div class="bubble" id="bubble">
          <div class="bubble-label">À PrédiBot</div>
          <div class="bubble-text">« Qui bosse samedi&nbsp;soir&nbsp;? »</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "#mascot",
          { scale: 0 },
          { scale: 1, duration: 0.55, ease: "back.out(1.8)" },
          0.05
        );
        tl.fromTo(
          "#bubble",
          { scale: 0.85, opacity: 0, y: 20 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.7)" },
          0.35
        );
        tl.to("#mascot", { y: -10, duration: 0.9, ease: "sine.inOut", repeat: 1, yoyo: true }, 0.9);

        window.__timelines["b02-scene2-question"] = tl;
      </script>
    </template>
  </body>
</html>
