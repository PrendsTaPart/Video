s complete. At 6 seconds he finds one with nine stamps out of ten, holds it up hopefully, then reads the expiry date and lowers it. Final 2 seconds: he puts them all back and pays normally. Audio: café ambience, espresso machine, cards shuffling and flicking, a hopeful \"Ah !\", a disappointed \"Ah.\", a card slipping back into a wallet. No music.", "rendu": false}, {"id": "EP080", "n": 80, "s": 3, "t": "Le tiroir vide", "mod": "Configuration", "ch": "2 - Choisir votre abonnement", "sur": true, "url": "https://drive.google.com/drive/folders/1VpbJkqpt9ckLSWXPbLyS6miIHYwU29d3", "hook": "Ouverture. Fond de caisse : ?", "punch": "Fond déclaré, opérateur identifié, service ouvert.", "heygen": "Tu vois ton plan, tes options actives et ce que tu consommes. Aucune ligne surprise en fin de mois.", "hf": "Vertical 9:16, 10 seconds, photorealistic, bar counter before opening, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A manager pulls open a cash drawer at the start of service. It is completely empty. He closes it, opens it again as if that might help, then blows into it the way one blows into an old game cartridge. At 5 seconds he checks under the counter, behind the till, and inside an empty mug. Final 2 seconds: he stands holding the empty drawer, looking off toward the front door where a first customer is arriving. Audio: cash drawer mechanism sliding twice, a hollow blow into plastic, hands patting under a counter, a ceramic mug lifted and set down, a shop door bell. No music.", "rendu": false}, {"id": "EP081", "n": 81, "s": 3, "t": "Huit calculatrices", "mod": "Comptabilité", "ch": "5- Créer une facture", "sur": true, "url": "https://drive.google.com/drive/folders/1026gmGm615P9PAOfk4CUGaxRava0Nm6k", "hook": "On peut séparer ?", "punch": "Oui. Par personne, par article, par montant.", "heygen": "Chaque commande produit sa facture, numérotée et conforme. Tu ne la ressaisis nulle part.", "hf": "Vertical 9:16, 10 seconds, photorealistic, restaurant table, evening, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Eight friends around a finished dinner table, each holding a phone calculator, all talking at once and pointing at different items on a single shared bill. One person has a pen and is drawing a diagram on the receipt. At 6 seconds someone puts a twenty-euro note down and everyone stops to look at it. Final 2 seconds: the waiter stands beside the table, terminal in hand, waiting with infinite patience. Audio: overlapping animated French chatter, phone keypad taps, a pen on paper, a banknote laid on wood, then a sudden collective silence. No music.", "rendu": false}, {"id": "EP082", "n": 82, "s": 3, "t": "Le centime", "mod": "Comptabilité", "ch": "3- Créer un devis", "sur": true, "url": "https://drive.google.com/drive/folders/1vEqEBl6EYPfsXAsDkHKMKjMCFs845eQH", "hook": "Il manque un centime.", "punch": "Le Z calcule l'écart. Toi, tu rentres chez toi.", "heygen": "Un devis pour un groupe se crée en deux minutes et se transforme en commande quand il est accepté.", "hf": "Vertical 9:16, 10 seconds, photorealistic, night, closed restaurant, single overhead lamp, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Two in the morning. A manager recounts a small pile of coins for what is clearly the fifth time, lips moving. He checks the till, lifts the drawer insert, looks underneath, shakes it. At 6 seconds he finds nothing and writes a figure on a pad. Final 2 seconds: he stares at the pad, then holds up a single one-cent coin between two fingers, defeated by it. Audio: empty restaurant reverb, coins being counted, a drawer insert lifted and dropped, a chair creak, one long breath, a single coin set on wood. No music.", "rendu": false}, {"id": "EP083", "n": 83, "s": 3, "t": "Le cri dans le vide", "mod": "Comptabilité", "ch": "6- Statuts d'une facture", "sur": true, "url": "https://drive.google.com/drive/folders/1qWdK1lFjjCML6JADIDzpU1C2Z9-c6KTa", "hook": "J'AI DIT DEUX BURGERS !", "punch": "Chaque poste voit ses plats. Sans crier.", "heygen": "Tu vois ce qui est facturé, encaissé, et ce qui traîne. Les relances arrêtent d'être un jeu de mémoire.", "hf": "Vertical 9:16, 10 seconds, photorealistic, busy professional kitchen, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A head chef at the pass shouts an order across the kitchen. Nobody reacts — the extraction hood is roaring, a mixer is running, two cooks have their backs turned. He shouts again, louder, cupping his hands. Still nothing. At 6 seconds he simply walks the plate over himself. Final 2 seconds: the moment he leaves the pass, three cooks all turn around at once and look at the empty spot where he was. Audio: overwhelming kitchen noise, extractor roar, a mixer, two muffled shouted orders swallowed by the noise, footsteps, then the noise continuing. No music.", "rendu": false}, {"id": "EP084", "n": 84, "s": 3, "t": "Le QR code scotché", "mod": "Comptabilité", "ch": "8- Archivage des dépenses", "sur": true, "url": "https://drive.google.com/drive/folders/1LKE7TtSjPJRnWVF_4-Tt89KmnudV-dcY", "hook": "Commander à table.", "punch": "Un plan de salle, un QR par table. Ça marche.", "heygen": "Tu photographies la facture fournisseur, elle rentre dans tes dépenses avec ses lignes et son montant.", "hf": "Vertical 9:16, 10 seconds, photorealistic, restaurant table close-up, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A customer holds a phone over a QR code taped to a restaurant table. The code is torn across one corner and covered in three overlapping layers of yellowed sticky tape. He moves the phone closer, then further, then tilts it, then tilts the whole table slightly. At 6 seconds he gives up and looks around for a waiter. Final 2 seconds: the phone camera finally focuses — on a reflection of the ceiling light. Audio: restaurant ambience, a phone scan failure buzz repeated three times, tape crinkling, a table leg scraping, an impatient tap on the screen. No music.", "rendu": false}, {"id": "EP085", "n": 85, "s": 3, "t": "Le ballon qui se dégonfle", "mod": "Comptabilité", "ch": "9- E-reporting et archivage des factures", "sur": true, "url": "https://drive.google.com/drive/folders/1uGc7EccEyaH6I157DL4UxrbQK90IiC3Y", "hook": "Table de 8. 20 h 30. Personne.", "punch": "No-show marqué, table libérée, soirée sauvée.", "heygen": "Chiffre d'affaires, dépenses, impayés, marge : la synthèse du mois tient sur un écran.", "hf": "Vertical 9:16, 10 seconds, photorealistic, restaurant interior, warm evening light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A table set for eight, immaculate, with a small \"Réservé\" card and a helium balloon tied to a chair. Nobody is there. The camera holds, then pushes in very slowly. At 6 seconds the balloon, losing helium, sinks gently until it rests on the tablecloth. Final 2 seconds: a waiter enters frame at the far side of the room, looks at the table, and turns off one of the lights above it. Audio: quiet restaurant ambience, distant chatter from other tables, a faint balloon string rubbing on fabric, a light switch click, then quiet. No music.", "rendu": false}, {"id": "EP086", "n": 86, "s": 3, "t": "Le téléphone que personne ne prend", "mod": "Comptabilité", "ch": "9- E-reporting et archivage des factures", "sur": true, "url": "https://drive.google.com/drive/folders/1uGc7EccEyaH6I157DL4UxrbQK90IiC3Y", "hook": "Trois appels manqués pendant le coup de feu.", "punch": "Caroline décroche. Et elle prend la réservation.", "heygen": "Tu envoies à ton comptable un export propre. Le dimanche soir redevient un dimanche soir.", "hf": "Vertical 9:16, 10 seconds, photorealistic, kitchen and pass during full service, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A wall phone rings in a restaurant at peak service. One by one, every person in frame looks at it and then looks away: a cook with both hands in a pan, a waiter with a full tray, a dishwasher with wet arms up to the elbows. At 6 seconds the ringing stops on its own. Final 2 seconds: everyone relaxes visibly — and it starts ringing again. Audio: busy service noise, an insistent landline ring cutting through it, sizzling, plates, the ring stopping, one collective exhale, then the ring restarting. No music.", "rendu": false}, {"id": "EP087", "n": 87, "s": 3, "t": "Les trois tablettes", "mod": "Mon Site", "ch": "1 - ACTIVER L'ÉDITEUR WEB", "sur": true, "url": "https://drive.google.com/drive/folders/1kM8I-Lgo65v3teUnjLRb1WuJm2O5JUhC", "hook": "Trois plateformes. Trois écrans.", "punch": "Une seule cuisine. Un seul flux.", "heygen": "Tu actives l'éditeur, tu choisis ton template, ton site est en ligne le jour même, aux couleurs de ta maison.", "hf": "Vertical 9:16, 10 seconds, photorealistic, takeaway counter, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Three different delivery-platform tablets sit propped side by side on a counter. They all start chiming at once, each with a different tone, each screen flashing a different colour. A single employee reaches for all three at the same time with two hands. At 6 seconds a fourth device — a phone — starts ringing beside them. Final 2 seconds: he stands with one tablet in each hand and the third one held against his chest with his chin. Audio: three distinct order-notification chimes overlapping and repeating, a phone ringtone joining, plastic tablets clacking, one desperate inhale. No music.", "rendu": false}, {"id": "EP088", "n": 88, "s": 3, "t": "Une étoile", "mod": "Mon Site", "ch": "4 - GÉRER TES PAGES", "sur": true, "url": "https://drive.google.com/drive/folders/1QbHNfWD_5KMcl5Nro4mVPlWcih71u5ri", "hook": "Un avis. Publié il y a six jours.", "punch": "Vu, répondu, traité. Le jour même.", "heygen": "Tu ajoutes tes pages : carte, avis, allergènes, recrutement. Elles se publient quand tu le décides.", "hf": "Vertical 9:16, 10 seconds, photorealistic, tight portrait, restaurant back office, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Close-up on a restaurant owner's face lit by his phone screen, smiling as he scrolls. The smile holds, then falters, then collapses entirely into a flat stare. He scrolls back up and reads the same thing again. At 6 seconds he lowers the phone slowly to the desk, screen down. Final 2 seconds: he picks it up and reads it a third time. Audio: quiet office, a finger swiping glass, a small amused hum that stops abruptly, a long silence, a phone set face-down on wood, then picked up again. No music.", "rendu": false}, {"id": "EP089", "n": 89, "s": 3, "t": "Le bocal presque vide", "mod": "Mon Site", "ch": "8 - CONNECTER TON DOMAINE", "sur": true, "url": "https://drive.google.com/drive/folders/1aAdfanPg2pUrFl3JVMYL-5RWXagOciv7", "hook": "Ton jeu concours.", "punch": "QR code, roue cadeaux, gagnants tracés.", "heygen": "Tu branches ton nom de domaine. Tes clients arrivent chez toi, pas sur une plateforme.", "hf": "Vertical 9:16, 10 seconds, photorealistic, restaurant entrance counter, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A large glass jar sits on a counter beside a handwritten sign, intended for a prize draw. Inside there is exactly one folded slip of paper. The camera pushes in slowly on the single slip. At 6 seconds a hand reaches in, takes the slip out, unfolds it, and reads it. Final 2 seconds: the same hand refolds it and puts it back in the empty jar. Audio: entrance ambience, a door opening in the background, glass resonance as a hand reaches in, paper unfolding, a beat of silence, paper dropped back into glass. No music.", "rendu": false}, {"id": "EP090", "n": 90, "s": 3, "t": "Le marc de café", "mod": "Mon Site", "ch": "Leads du site", "sur": false, "url": "https://drive.google.com/drive/folders/1ykcHl2BaY22WlCsBA3DuwXaEMvQZUtMF", "hook": "Ta prévision pour samedi.", "punch": "PrediBot lit tes données. Pas ton café.", "heygen": "Chaque demande de privatisation ou de contact devient un lead dans ton fichier client.", "hf": "Vertical 9:16, 10 seconds, photorealistic, dim restaurant office, single warm lamp, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurant manager sits alone at a desk, tilting an empty espresso cup and studying the coffee grounds inside with intense concentration, as if reading a forecast. He rotates the cup slowly, tilts his head, then nods once at something only he can see. At 6 seconds he writes a single number on a sheet of paper and underlines it twice. Final 2 seconds: he looks up at the camera with total conviction. Audio: quiet office, a clock ticking, ceramic rotating on a wooden desk, a pen underlining twice, one confident \"Voilà.\" No music.", "rendu": false}, {"id": "EP091", "n": 91, "s": 4, "t": "Le pétard dans le tiramisu", "mod": "Réservation", "ch": "2 - AJOUTER UNE RÉSERVATION", "sur": true, "url": "https://drive.google.com/drive/folders/1FCKxILOc1EB5X51xFCrWZgXTQ27IXLeE", "hook": "Anniversaire de table 12.", "punch": "Les surprises, c'est bien. Les imprévus, non.", "heygen": "L'anniversaire est noté à la réservation, avec le nombre de couverts et la demande spéciale. La cuisine et la salle le savent avant que le client arrive.", "hf": "Vertical 9:16, 10 seconds, photorealistic, cinematic handheld camera, shallow depth of field, warm restaurant lighting, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A waiter carries a birthday tiramisu with a single sparkler candle across a dining room toward a table of guests already clapping. At 5 seconds the sparkler erupts into a full firework fountain, throwing bright sparks up to the ceiling; the guests recoil backwards in unison, one man's paper party hat tilts over his eyes. Final 2 seconds: the waiter stands perfectly still, dessert held level, face completely neutral, sparks still falling around him. Audio: restaurant ambience, scattered applause and a few voices humming happy birthday, a sudden loud fizzing roar of the firework, chairs scraping back, a surprised collective \"Oh !\", then only fizzing. No music.", "rendu": false}, {"id": "EP092", "n": 92, "s": 4, "t": "Le super-héros qui a réservé", "mod": "Réservation", "ch": "3 - GÉRER & NO-SHOWS", "sur": true, "url": "https://drive.google.com/drive/folders/11I5195HrUUPsZVqectjWhfM9f-EEo1y5", "hook": "Lui, il avait réservé.", "punch": "Ses quatre-vingts fans, non.", "heygen": "Quatre-vingts personnes d'un coup, ça se voit venir. Tu ouvres ou tu fermes tes créneaux en direct, et la liste d'attente prend le relais.", "hf": "Vertical 9:16, 10 seconds, photorealistic, cinematic handheld camera, sunny terrace, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. IMPORTANT: an entirely generic, invented masked superhero — plain matte green and silver bodysuit, simple blank eye-mask, no emblem, no cape logo, no resemblance to any existing character. He arrives politely at the host stand of a busy restaurant terrace and points at a reservation notebook. At 5 seconds a crowd of thirty excited fans floods in behind him from off-frame, phones raised, filling the entire terrace within two seconds; a single young waiter is swallowed by the crowd, one arm holding a tray above his head like a periscope. Final 2 seconds: the superhero sits alone at a small table in the middle of the chaos, hands folded, waiting patiently. Audio: terrace ambience, a sudden roar of running footsteps and excited shouting, camera shutters, a tray wobbling, a lone waiter's voice saying \"Attendez—\", then the crowd noise settling into a hum. No music.", "rendu": false}, {"id": "EP093", "n": 93, "s": 4, "t": "Le chef part à la pêche", "mod": "StockVision", "ch": "3- Ma carte - Prédictions des commandes", "sur": true, "url": "https://drive.google.com/drive/folders/107h7JIXDFCD5cjyF90tiOZT2LSkFSjFj", "hook": "Rupture de stock, 20 h 15.", "punch": "Anticiper, c'est moins sportif.", "heygen": "FoodEatUp prévoit tes ventes de poisson à partir de ton historique. Tu commandes la bonne quantité le mardi, pas la canne à pêche le samedi.", "hf": "Vertical 9:16, 10 seconds, photorealistic, cinematic, professional kitchen then window, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef opens the fish fridge: it is completely empty except for one sad lemon. He looks at a ticket in his hand, then at the empty fridge, then at the open kitchen window. At 5 seconds he is leaning out of that window in full chef whites and toque, casting a fishing rod into an ornamental carp pond in the courtyard, elbow resting on the sill. Final 2 seconds: the line goes taut, he braces, expression suddenly hopeful and completely serious. Audio: fridge fan hum, a paper ticket rustle, a long resigned exhale, a window latch, the whir of a fishing reel casting, a plop in water, then birdsong and a single reel click. No music.", "rendu": false}, {"id": "EP094", "n": 94, "s": 4, "t": "Le robot livreur qui double le scooter", "mod": "HubRise", "ch": "4 - CENTRALISER LES COMMANDES", "sur": true, "url": "https://drive.google.com/drive/folders/1Qt_omsrE2w9UqlhhlfkhwJaCjeL_ddow", "hook": "2026, la livraison change de main.", "punch": "Autant que tes commandes arrivent au bon endroit.", "heygen": "Peu importe qui livre. Tes commandes arrivent dans la même file, avec la bonne adresse et le bon statut, jusqu'à la remise au client.", "hf": "Vertical 9:16, 10 seconds, photorealistic, low-angle street tracking shot, late afternoon light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A delivery rider on a scooter with an insulated backpack is stuck in slow traffic on a French city street, foot down, visor up, sighing. At 5 seconds a small autonomous six-wheeled delivery robot the size of a suitcase glides smoothly past him in the bike lane, indicator light blinking politely. Final 2 seconds: the rider watches it disappear ahead; the robot stops at a pedestrian crossing and waits, perfectly law-abiding, while he is still stuck. Audio: idling engines, car horns, a resigned human sigh through a helmet, a quiet electric motor whirr and a soft robotic indicator beep, then traffic ambience. No music.", "rendu": false}, {"id": "EP095", "n": 95, "s": 4, "t": "L'éclipse de 13 h 12", "mod": "KDS", "ch": "3 - GÉRER LE KDS EN DIRECT", "sur": true, "url": "https://drive.google.com/drive/folders/1RnmeyK_4aYgVpGKKNdPOrClzmpHw9Ljg", "hook": "Le service s'est arrêté deux minutes.", "punch": "Le reste du temps, il ne devrait jamais s'arrêter.", "heygen": "Sur le KDS, chaque plat a son chrono. Tu vois ce qui traîne au moment où ça traîne, et tu relances le bon poste.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide then slow push-in, bright midday exterior with unusual dimming light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A packed restaurant terrace at lunch. Every single guest at every table suddenly stops eating, puts on cardboard eclipse glasses and tilts their head straight up in unison, forks frozen mid-air. The light dims to an eerie silver. At 5 seconds a waiter arrives with three hot plates and stands in the middle of the terrace, holding them, looking at forty upturned faces, then up at the sky himself. Final 2 seconds: he lowers the plates onto an empty table, sits down on a spare chair and looks up too. Audio: terrace chatter falling to complete silence, cutlery set down, cardboard glasses rustling, birds going quiet, one child's \"waouh\", plates clinking softly on a table. No music.", "rendu": false}, {"id": "EP096", "n": 96, "s": 4, "t": "Canicule : le beurre fugueur", "mod": "HACCP", "ch": "3-Enregistrer une température", "sur": true, "url": "https://drive.google.com/drive/folders/1ohzkWaC6hB6wEa2ow1gOtoLWz_zjd5_O", "hook": "39° en cuisine.", "punch": "Une alerte température, et tu sauves la marchandise.", "heygen": "Trente-neuf degrés en cuisine, ton frigo souffre. Le relevé hors seuil te prévient tout de suite. Tu sauves la marchandise.", "hf": "Vertical 9:16, 10 seconds, photorealistic macro then medium, harsh summer light through a kitchen window, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Close macro on a large block of butter sitting on a stainless pass, a small fan oscillating uselessly beside it. The butter is visibly slumping, then sliding, leaving a glossy trail across the metal. At 5 seconds it slides right off the edge and lands with a wet slap on the tiles; the camera widens to reveal a cook standing in the heat with a wet cloth on his neck, watching it happen without moving. Final 2 seconds: he looks at the fan, then at the camera, sweat on his forehead, completely defeated. Audio: fan motor droning, distant cicadas, a fridge compressor struggling, a slow greasy slide on metal, a wet slap, one long exhale. No music.", "rendu": false}, {"id": "EP097", "n": 97, "s": 4, "t": "Le mur de tablettes", "mod": "HubRise", "ch": "2 - RELIER UBER EATS & DELIVEROO", "sur": true, "url": "https://drive.google.com/drive/folders/109Fn97h2rydpDX7zeHt_EFzKtZIbFa-k", "hook": "Six plateformes. Six alertes.", "punch": "Une seule commande, un seul écran.", "heygen": "Tes plateformes envoient tout dans FoodEatUp. Six alertes deviennent une file de commandes. La tablette murale, tu peux la ranger.", "hf": "Vertical 9:16, 10 seconds, photorealistic, static wide then slow push-in, busy kitchen pass, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Six different tablets and order terminals are mounted side by side on a shelf above a restaurant pass, each with a different generic interface colour, no readable text, no brand. They start chiming one after another, then all together, faster and faster. A manager stands in front of them holding a spatula, and at 5 seconds begins conducting them like an orchestra, sweeping the spatula in time with the chimes, deadly serious. Final 2 seconds: he stops conducting; every screen falls silent at once; he lowers the spatula slowly. Audio: kitchen ambience, six distinct notification chimes overlapping into a chaotic rhythm, escalating, then an abrupt collective silence and a single drip from a tap. No music.", "rendu": false}, {"id": "EP098", "n": 98, "s": 4, "t": "Le robot serveur qui bugge et danse", "mod": "Service", "ch": "1 - COMMANDES MULTI-CANAUX", "sur": true, "url": "https://drive.google.com/drive/folders/1V0xXbnYuqBsDUiD2Q_itQLIk4Ps1rw4l", "hook": "Ton nouveau serveur, en période d'essai.", "punch": "L'IA, c'est utile quand elle sert à quelque chose.", "heygen": "L'intelligence utile, c'est celle qui range tes commandes, pas celle qui danse. Ici, chaque canal alimente le même service.", "hf": "Vertical 9:16, 10 seconds, photorealistic, medium tracking shot in a modern dining room, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A wheeled humanoid service robot with a tray of drinks rolls smoothly between tables, guests watching, impressed. At 5 seconds it hits a small rug edge, freezes, its head twitches, and it begins performing a jerky, off-beat dance routine with the tray still perfectly level, glasses untouched. Final 2 seconds: it stops mid-pose, one arm up, and its status light turns from blue to red while a waiter walks calmly into frame and takes the tray off it. Audio: restaurant ambience, a smooth servo whirr, a sharp electronic glitch stutter, rhythmic servo clicking like a broken beat, guests laughing, a soft error chime, glass clinking as the tray is lifted. No music.", "rendu": false}, {"id": "EP099", "n": 99, "s": 4, "t": "Le répondeur préhistorique", "mod": "Caroline", "ch": "1 - CONFIGURER CAROLINE VOIX & PROMPTS", "sur": true, "url": "https://drive.google.com/drive/folders/1GqODoJqsP5RS8ePzb-CAwfjfSIfQ0F0n", "hook": "Quarante appels pendant le rush.", "punch": "Quelqu'un devrait répondre. Ce ne sera pas toi.", "heygen": "Caroline répond au téléphone pendant ton rush. Elle prend la réservation, la note, et te la remonte. Aucun appel ne tombe dans le vide.", "hf": "Vertical 9:16, 10 seconds, photorealistic, tight macro on a cluttered back-office desk, warm lamp light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A 1990s cassette answering machine sits on a restaurant back-office desk next to a corded phone, its red light blinking furiously. The phone rings; the machine clicks and starts recording. At 5 seconds the little cassette door bursts open and a huge tangle of magnetic tape spills out and keeps unspooling across the desk and onto the floor, while the phone keeps ringing. Final 2 seconds: a hand enters frame, gently closes the office door on the whole mess, leaving the tape still unspooling. Audio: an old phone ringing, a plastic click and cassette whirr, muffled voices leaving messages layered on top of each other, tape unspooling with a papery hiss, a door closing softly, ringing continuing behind it. No music.", "rendu": false}, {"id": "EP100", "n": 100, "s": 4, "t": "L'influenceur au ring light", "mod": "Marketing", "ch": "1 - DÉBLOQUER LES AVIS", "sur": true, "url": "https://drive.google.com/drive/folders/1qKR-8QOFNaR5OIbNYKodlUB1Qmgr1CLW", "hook": "Il a mis vingt minutes à filmer.", "punch": "Et deux minutes à te mettre deux étoiles.", "heygen": "Tes avis remontent au même endroit, site et Google. Tu réponds à celui qui t'a mis deux étoiles avant qu'il devienne ta vitrine.", "hf": "Vertical 9:16, 10 seconds, photorealistic, over-the-shoulder then reverse, restaurant table, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A young man has set up a ring light, a tripod and a small reflector around a single plate of pasta on a restaurant table, and is filming it from twelve different angles, moving the plate, adjusting a basil leaf with tweezers. Steam stops rising from the dish. At 5 seconds he finally takes one bite — and grimaces, because it is stone cold. Final 2 seconds: he pushes the plate away and starts typing on his phone with one finger, expression sour, ring light still glowing on his face. Audio: restaurant ambience, tripod clicks, a phone shutter repeating, a chair adjusting, a small disappointed \"mmh\", then rapid soft phone typing. No music.", "rendu": false}, {"id": "EP101", "n": 101, "s": 4, "t": "POV : thriller comptable", "mod": "Caisse POS", "ch": "6 - CLÔTURER SA CAISSE LE Z", "sur": true, "url": "https://drive.google.com/drive/folders/1ht1CI-2jBkP6DdhvMdT3xVCPbzrwUU3m", "hook": "Rapprochement des caisses. Vendredi soir.", "punch": "Ça devrait être une ligne, pas une enquête.", "heygen": "La clôture, c'est un bouton. Le détail par moyen de paiement, la TVA, l'écart : tout est là, sans calculatrice ni suspense.", "hf": "Vertical 9:16, 10 seconds, photorealistic, extreme close-ups with dramatic thriller lighting and slow dolly moves, night back office, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Shot like a psychological thriller: an extreme close-up of a trembling hand pushing a stack of paper invoices; a macro of a calculator key being pressed with enormous tension; a slow tilt up a restaurant owner's face lit from below by a laptop screen, jaw clenched, a bead of sweat. At 5 seconds he presses the equals key, stares at the result, and his shoulders drop three centimetres. Final 2 seconds: he closes the laptop very slowly and sits in the dark, perfectly still. Audio: deep ominous room tone, a clock ticking, paper sliding, one loud calculator click, a heartbeat rising then stopping dead, a laptop lid closing, silence. No music beyond the tension drone.", "rendu": false}, {"id": "EP102", "n": 102, "s": 4, "t": "L'inspecteur surprise", "mod": "HACCP", "ch": "22-Créer une check-list hygiène", "sur": true, "url": "https://drive.google.com/drive/folders/15CwOKunwpcys81_j-rwf0W2bLfghvsXv", "hook": "Contrôle surprise. Ou pas.", "punch": "Le jour où c'est le vrai, tu ne bouges pas.", "heygen": "Ta checklist est validée chaque jour par ton équipe. Le jour du vrai contrôle, tu ouvres l'historique et tu ne bouges pas.", "hf": "Vertical 9:16, 10 seconds, photorealistic, fast handheld, professional kitchen, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A person in a plain grey jacket carrying a clipboard walks slowly toward a kitchen's swinging door from the dining room. Cut inside: the entire brigade explodes into hyper-speed motion — containers stacked, a floor mopped, a thermometer plunged into a fridge, a hairnet yanked on, all in three seconds of frantic activity, then everyone freezes in perfect professional poses. At 5 seconds the door opens: it is only a delivery driver asking for a signature. Final 2 seconds: the entire brigade stays frozen in their poses, mop in the air, staring at him. Audio: calm dining room ambience, then an explosion of clattering, running footsteps, fridge doors, a mop slapping tiles, an abrupt total silence, a door creak, a casual \"Bonjour, signature ?\". No music.", "rendu": false}, {"id": "EP103", "n": 103, "s": 4, "t": "Le car de 40 sans réservation", "mod": "Réservation", "ch": "1 - RÉSERVATIONS DU JOUR", "sur": true, "url": "https://drive.google.com/drive/folders/1L_ewdqi9eYPYPMdzLIL-Rj3JwvEzTJQm", "hook": "Quarante couverts. Sans prévenir.", "punch": "Prévenu, tu aurais dit oui.", "heygen": "Un groupe qui arrive, tu vérifies la disponibilité réelle en trois secondes : tables libres, horaires, capacité. Tu dis oui en connaissance de cause.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide exterior then interior reverse, small village restaurant, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A quiet restaurant with two occupied tables. Through the window, a large coach pulls up and stops with a hiss. At 5 seconds its doors open and forty tourists in matching caps stream out and walk in single file toward the entrance, one of them waving cheerfully. Final 2 seconds: interior shot of a lone waiter behind the bar, holding a single menu, watching the line come through the door, not moving a muscle. Audio: quiet restaurant ambience, a coach air-brake hiss, doors opening, a rising tide of cheerful chatter and footsteps, a bell above the door ringing repeatedly, then one very small \"bonjour\". No music.", "rendu": false}, {"id": "EP104", "n": 104, "s": 4, "t": "Le no-show western", "mod": "Réservation", "ch": "3 - GÉRER & NO-SHOWS", "sur": true, "url": "https://drive.google.com/drive/folders/11I5195HrUUPsZVqectjWhfM9f-EEo1y5", "hook": "Table de huit. 20 h 30.", "punch": "Un no-show, ça se prévient.", "heygen": "Tu marques le no-show, la table se libère immédiatement et repart à la vente. Le client, lui, garde son historique.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide static shot, elegant empty dining room, evening light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A long table beautifully set for eight — folded napkins, polished glasses, a flower arrangement — completely empty in a silent restaurant. The camera holds. At 5 seconds a dry tumbleweed rolls slowly across the floor in front of the table, from one side of the frame to the other, as if in a western. Final 2 seconds: it comes to rest against a chair leg; a single candle flickers. Audio: deep empty-room reverb, a clock ticking, a faint whistling wind that should not exist indoors, dry rustling as the tumbleweed rolls, then a candle-flame flicker. No music.", "rendu": false}, {"id": "EP105", "n": 105, "s": 4, "t": "Le duel de la dernière table", "mod": "Mon Site", "ch": "6 - RÉSERVATIONS & HORAIRES", "sur": true, "url": "https://drive.google.com/drive/folders/148lKdynNnugQ6WDGFYTM03Es8i-L_lVt", "hook": "Dernière table du samedi.", "punch": "Le plus rapide gagne. Rends-la réservable en ligne.", "heygen": "Tes créneaux sont réservables en ligne, en direct, avec tes vraies disponibilités. Le premier qui réserve a la table.", "hf": "Vertical 9:16, 10 seconds, photorealistic, western-style low-angle close-ups, sunlit terrace, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Shot like a spaghetti-western standoff: two couples face each other across a restaurant terrace, one single free table between them. Extreme close-ups of narrowed eyes, a hand hovering near a jacket pocket, a bead of sweat, a napkin fluttering like a tumbleweed. At 5 seconds both men draw — their phones — and stab at a booking screen with one thumb, faster and faster. Final 2 seconds: one of them raises his phone in triumph; the other lowers his head; the winner's partner is already sitting down. Audio: terrace ambience, wind, a single suspended note of tension, exaggerated boot-scrape and leather creak, two rapid phone taps, a soft confirmation chime, a chair scraping. No music beyond the tension note.", "rendu": false}, {"id": "EP106", "n": 106, "s": 4, "t": "L'addition en quatorze parts", "mod": "Caisse POS", "ch": "5 - SÉPARER UNE ADDITION", "sur": true, "url": "https://drive.google.com/drive/folders/1SeLJel_btaKEnvS8W3s6u8C0-ZnjaB4t", "hook": "On peut payer chacun ?", "punch": "Oui. En trois secondes, pas en trente minutes.", "heygen": "Quatorze parts, quatorze cartes : tu découpes l'addition depuis l'écran, chacun paie ce qu'il doit, le reste dû s'affiche en direct.", "hf": "Vertical 9:16, 10 seconds, photorealistic, over-the-shoulder then reverse, long dinner table, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A waiter arrives at a long table of fourteen friends with the bill folder. Instantly fourteen hands shoot up holding fourteen bank cards, plus one person waving a handful of coins and another holding out a restaurant voucher. At 5 seconds the waiter is holding the card machine in one hand and a fan of fourteen cards in the other, like a poker hand, blinking. Final 2 seconds: he stares at the camera over the fan of cards, absolutely still, while a fifteenth hand enters frame with another card. Audio: cheerful table chatter, chairs, plastic cards tapping, coins jingling, a terminal beep, a rising confused murmur, then a single beep. No music.", "rendu": false}, {"id": "EP107", "n": 107, "s": 4, "t": "Le magicien de l'addition", "mod": "Caisse POS", "ch": "3 - ENCAISSER UNE COMMANDE", "sur": true, "url": "https://drive.google.com/drive/folders/1FfRiDgDtAi_ERE7oTv9yfgbkjPQRwK-T", "hook": "Tout le monde a un tour.", "punch": "Ta caisse, elle, ne perd jamais une addition.", "heygen": "L'addition est rattachée à la table dès la commande. Elle ne se perd pas, elle ne s'oublie pas, elle ne disparaît pas.", "hf": "Vertical 9:16, 10 seconds, photorealistic, medium shot, warm bistro lighting, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A guest in a slightly theatrical velvet jacket receives the bill folder, smiles, and makes an elaborate flourish over it with both hands, a napkin draped across the top like a magician. At 5 seconds he whips the napkin away — the folder is completely empty, and a white dove flaps up out of it toward the ceiling. Final 2 seconds: the waiter, unimpressed, calmly places a second identical bill folder on the table and walks away. Audio: bistro ambience, a theatrical fabric whoosh, wing flapping, one impressed gasp from a neighbouring table, then a flat cardboard tap as the second folder lands. No music.", "rendu": false}, {"id": "EP108", "n": 108, "s": 4, "t": "Le poulpe du pass", "mod": "KDS", "ch": "2 - VUE KDS PAR POSTE", "sur": true, "url": "https://drive.google.com/drive/folders/1L83RmygIEnYQwa2ELdR7viJODqI764wD", "hook": "Il te faudrait six bras.", "punch": "Ou un seul outil qui fait le reste.", "heygen": "Chaque poste voit ce qui le concerne, et seulement ça. Tu n'as pas besoin de six bras, tu as besoin de six écrans qui parlent entre eux.", "hf": "Vertical 9:16, 10 seconds, photorealistic, medium shot at a stainless pass, moody kitchen lighting, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A large live octopus sits calmly on the stainless steel pass of a professional kitchen wearing a tiny white chef's toque. Each of its arms holds a different tool — tongs, a squeeze bottle, a whisk, a ticket, a plate, a spoon — and all of them are moving competently at once. At 5 seconds a human chef steps into frame beside it holding two tools, looks at the octopus, then at his own two hands. Final 2 seconds: he sets his tools down and leans on the pass, watching it work, defeated but admiring. Audio: kitchen extractor hum, sizzling, rapid metallic tool clicking layered on itself, a wet suction sound, a spoon set down slowly, one human sigh. No music.", "rendu": false}, {"id": "EP109", "n": 109, "s": 4, "t": "Le kombucha qui explose", "mod": "HACCP", "ch": "8-Traçabilité complète", "sur": true, "url": "https://drive.google.com/drive/folders/1KjJgNDZmrf1NR_6aihWwN9Q77UaHp2Yk", "hook": "Ta cave à ferments.", "punch": "Suivie et datée, elle ne t'explose pas à la figure.", "heygen": "Chaque production est datée, tracée, rattachée à son lot. Ce qui fermente en cave n'est plus une surprise.", "hf": "Vertical 9:16, 10 seconds, photorealistic, macro then medium, shelf of fermentation jars in a cellar, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A shelf of large glass fermentation jars filled with cloudy kombucha and pickles, lids straining. Macro on one lid trembling and bulging. A cook leans in slowly to inspect it, nose close to the glass. At 5 seconds that jar erupts, blasting foam straight up onto the ceiling and across his face and apron. Final 2 seconds: he stands dripping, eyes closed, while on the shelf behind him a second lid starts trembling. Audio: cellar room tone, a gas hiss building inside glass, a wet explosive pop, splattering and dripping, a startled inhale, then a second faint hiss beginning. No music.", "rendu": false}, {"id": "EP110", "n": 110, "s": 4, "t": "Le menu 100 % matcha", "mod": "StockVision", "ch": "18- Statistiques par module", "sur": true, "url": "https://drive.google.com/drive/folders/1e7LZCLhyA2ANmednWevCt7-AreosC4Yw", "hook": "Tu suis toutes les tendances.", "punch": "Regarde surtout lesquelles se vendent.", "heygen": "La tendance, tu la testes. Tu regardes ce que ce plat rapporte vraiment, et tu décides de le garder ou pas sur des chiffres.", "hf": "Vertical 9:16, 10 seconds, photorealistic, top-down then eye-level, bright modern café, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A waiter places a plate in front of a guest: everything on it is vivid green — green latte, green bread, green sauce, a green steak, a green boiled egg. The guest looks at it, looks up at the waiter, looks back down. At 5 seconds he lifts a forkful, sniffs it, and eats it anyway. Final 2 seconds: he gives a small, genuinely surprised nod of approval, and the waiter immediately places a second identical green plate beside the first. Audio: café ambience, an espresso machine, ceramic on wood, a fork clink, a thoughtful chewing pause, a small \"hm !\", then another plate landing. No music.", "rendu": false}, {"id": "EP111", "n": 111, "s": 4, "t": "L'imprimante 3D qui déraille", "mod": "StockVision", "ch": "12- Production - Valider une production", "sur": true, "url": "https://drive.google.com/drive/folders/1JCRKsZ3Hk50JI9_Cn_WVknci92yTuwEb", "hook": "La cuisine du futur.", "punch": "Le futur utile, c'est celui qui te fait gagner du temps.", "heygen": "La production planifiée sort ses ingrédients du stock, sa quantité est validée, sa traçabilité écrite. Le gain de temps est là, pas dans le gadget.", "hf": "Vertical 9:16, 10 seconds, photorealistic macro, clean modern kitchen laboratory, cool light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A food 3D printer extrudes a neat layer of purée onto a plate with clinical precision, watched by a chef with folded arms. At 5 seconds the nozzle begins moving erratically, extruding an ever-growing chaotic spaghetti tangle that rises off the plate and spills onto the counter, still perfectly smooth and glossy. Final 2 seconds: the chef reaches out and, with total calm, presses a single button; the machine stops, leaving a large edible sculpture of nothing at all. Audio: quiet lab hum, a precise servo whirr, a soft wet extrusion sound, the servo tempo becoming erratic, a rising mechanical whine, a button click, silence. No music.", "rendu": false}, {"id": "EP112", "n": 112, "s": 4, "t": "Le casque de réalité augmentée", "mod": "Mon Site", "ch": "2 - CHOISIR TON TEMPLATE", "sur": true, "url": "https://drive.google.com/drive/folders/1X5m9uQ-73PZS_-_3eJ43ofizr1W3APVB", "hook": "La carte du futur.", "punch": "Ou juste une carte en ligne qui marche.", "heygen": "Ta carte en ligne, propre, à jour, consultable par QR à table. Pas de casque, pas d'appli à installer.", "hf": "Vertical 9:16, 10 seconds, photorealistic, medium shot, elegant restaurant, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A guest wearing a sleek generic augmented-reality headset (no brand, no logo) sits at a beautifully set table, reaching out with a fork toward something only he can see. His fork repeatedly stabs the tablecloth thirty centimetres to the left of his actual plate. At 5 seconds he brings the empty fork to his mouth with great satisfaction and chews on nothing. Final 2 seconds: a waiter quietly slides the real plate under his hovering fork; the guest's next stab hits food and he freezes, delighted. Audio: refined restaurant ambience, cutlery clicking on cloth and wood, a faint headset electronic hum, contented chewing, a plate sliding on linen, a soft \"ah !\". No music.", "rendu": false}, {"id": "EP113", "n": 113, "s": 4, "t": "Le drone qui se trompe de balcon", "mod": "HubRise", "ch": "4 - CENTRALISER LES COMMANDES", "sur": true, "url": "https://drive.google.com/drive/folders/1Qt_omsrE2w9UqlhhlfkhwJaCjeL_ddow", "hook": "Livraison réussie. Presque.", "punch": "Un suivi de commande, et personne ne mange ta pizza.", "heygen": "Le suivi de commande affiche l'état en direct, de la prise à la remise. Tu sais toujours où est la commande et chez qui.", "hf": "Vertical 9:16, 10 seconds, photorealistic, exterior apartment building facade, late afternoon, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A delivery drone carrying a pizza box in a harness descends ady almost entirely covered. He climbs onto a milk crate to reach higher, then onto a chair on top of the crate. At 5 seconds he reaches the ceiling, still writing, chalk dust falling on his shoulders. Final 2 seconds: he looks down at the chef below him, who silently holds up a tablet-sized rectangle of blank white board. Audio: kitchen ambience, chalk squeaking on a wall, a crate scraping, wood creaking under weight, chalk dust settling, one calm cough from below. No music.", "rendu": false}, {"id": "EP117", "n": 117, "s": 4, "t": "Le plat étoilé en dix minutes", "mod": "StockVision", "ch": "1- Ma carte - Création et modifications de la carte du restaurant", "sur": true, "url": "https://drive.google.com/drive/folders/1bGMZ8R1udBoMF4XrJJqEnpYKkVrwBxx7", "hook": "Le défi à dix minutes.", "punch": "Une fiche technique, et c'est dix minutes tous les jours.", "heygen": "La fiche technique fixe les quantités, les étapes et le coût. Le plat sort en dix minutes, tous les jours, par n'importe qui de ta brigade.", "hf": "Vertical 9:16, 10 seconds, photorealistic, fast handheld with quick whip-pans, professional kitchen, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A large kitchen timer is slammed onto the counter and a chef explodes into action: pans flying, sauce whisked, tweezers placing garnish, a blowtorch flaring, all in rapid succession, sweat flying. At 5 seconds the timer rings; he slides a stunning, immaculate gourmet plate into frame with both hands. Final 2 seconds: the camera pulls back to reveal the entire kitchen behind him utterly destroyed — every pan used, flour everywhere, a cupboard door hanging open — while he holds the perfect plate. Audio: a mechanical timer ticking loudly, frantic metallic clattering, a blowtorch hiss, plates scraping, an alarm bell ringing, then heavy breathing and one distant pan falling. No music.", "rendu": false}, {"id": "EP118", "n": 118, "s": 4, "t": "La file du brunch", "mod": "Mon Site", "ch": "5 - CRÉER UN SITE kwardly. A strong gust hits: the flyers explode out of their wing in a white cloud and the costume's huge tail acts like a sail, dragging the mascot backwards down the pavement in small hops, arms flailing. At 5 seconds it collides softly with a lamppost and wraps around it. Final 2 seconds: the mascot clings to the lamppost, motionless, as the last flyers drift past its beak. Audio: strong wind gusts, paper flapping and scattering, foam costume squeaking, small running steps, a soft padded thud on metal, one muffled human groan from inside the head. No music.", "rendu": false}, {"id": "EP120", "n": 120, "s": 4, "t": "La réunion des dix logiciels", "mod": "PrediBot", "ch": "1 - LIRE SES PRÉVISIONS", "sur": true, "url": "https://drive.google.com/drive/folders/19KbPaohx3zwWwsG4Ud3KfJU9WlqeqIoE", "hook": "Réunion de tes dix logiciels.", "punch": "Ils ne se parlent toujours pas. FoodEatUp, si.", "heygen": "Une base, un écran, une équipe. Ta caisse, ta cuisine, ton stock et ton marketing lisent les mêmes données. Ils finissent enfin par se parler.", "hf": "Vertical 9:16, 10 seconds, photorealistic, slow dolly along a long table, empty dining room, dramatic evening light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurant owner sits at the head of a long dining table set for a formal meeting. In each of the ten guest chairs sits an open laptop or tablet instead of a person, each screen showing a different abstract coloured interface with no readable text. He looks around at them expectantly and opens his hands as if to say \"so?\". At 5 seconds every screen simultaneously plays a different notification chime and then goes to a blank screensaver, one after another, ignoring him completely. Final 2 seconds: he lowers his hands, alone at the head of a table of dark screens, and pours himself a glass of water. Audio: empty room reverb, a chair creak, ten mismatched notification chimes overlapping, fans spinning down one by one, water pouring into a glass, rk, NO logo. A confident regular-looking man leans on the counter, taps it twice and gestures broadly as if to say \"the usual\". The owner behind the bar smiles warmly, nods — and behind the smile his eyes flick left, then right, in visible panic, because he has never seen this man in his life. At 5 seconds he seizes a random plate from the pass and sets it down with enormous confidence. Final 2 seconds: the customer looks at the plate, then up at him, deeply moved, and puts a hand on his heart. Audio: bar ambience, two knuckle taps on wood, a glass clinking, a slightly too-loud \"Mais bien sûr !\", a plate landing firmly, then a small emotional sniff. No music.", "rendu": false}, {"id": "EP123", "n": 123, "s": 5, "t": "Le végétarien du dessert", "mod": "StockVision", "ch": "1- Ma carte - Création et modifications de la carte du restaurant", "sur": true, "url": "https://drive.google.com/drive/folders/1bGMZ8R1udBoMF4XrJJqEnpYKkVrwBxx7", "hook": "Il annonce ça au dessert.", "punch": "Les régimes et les allergènes, ça se note à la réservation.", "heygen": "Les allergènes et les régimes sont portés par ta carte et par la réservation. L'info arrive en cuisine avant l'entrée, pas au dessert.", "hf": "Vertical 9:16, 10 seconds, photorealistic, medium shot at a bistro table, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A guest finishes an enormous rare steak, scraping the plate clean, visibly delighted. The waiter arrives to clear it and offers the dessert menu. At 5 seconds the guest raises a polite hand and points to something on the menu while gesturing \"no\" over his own empty steak plate, explaining seriously that he is vegetarian. Final 2 seconds: the waiter looks down at the bare steak bone on the plate, then back at the guest, then at the camera. Audio: bistro ambience, cutlery on porcelain, a satisfied exhale, a plate being lifted, a calm explanatory French voice, then a single fork clink and silence. No music.", "rendu": false}, {"id": "EP124", "n": 124, "s": 5, "t": "La table qui ne part jamais", "mod": "Caisse POS", "ch": "6 - CLÔTURER SA CAISSE LE Z", "sur": true, "url": "https://drive.google.com/drive/folders/1ht1CI-2jBkP6DdhvMdT3xVCPbzrwUU3m", "hook": "Il est minuit dix.", "punch": "Le service a une fin. Ton logiciel devrait le savoir.", "heygen": "Le service a une fin : tu clôtures, tu comptes, tu archives. L'écran te dit quand la journée est vraiment finie.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide static shot of a dining room at closing time, dim light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Every chair in the restaurant is upside down on its table, the floor is being mopped, one waiter counts the till, another stacks the last crates — except for one single table in the middle where two friends sit chatting animatedly, entirely unaware. At 5 seconds a vacuum cleaner is switched on and passes directly around their feet; they lift their legs without interrupting the conversation. Final 2 seconds: one of them turns and raises two fingers, ordering two more coffees. Audio: empty room reverb, chairs scraping onto tables, a mop, a till drawer, a vacuum roaring to life, two voices talking straight through it all, then a cheerful \"deux cafés !\". No music.", "rendu": false}, {"id": "EP125", "n": 125, "s": 5, "t": "Le client qui refait le plan de salle", "mod": "Caroline", "ch": "3 - DESSINER SON PLAN DE SALLE", "sur": true, "url": "https://drive.google.com/drive/folders/1Y_TFKokdQ6-x54EmTehizW9rApt_jn75", "hook": "Je serais mieux là, non ?", "punch": "Ton plan de salle, c'est toi qui le décides.", "heygen": "Ton plan de salle est le tien : zones, tables, capacités, blocages. Tu places, tu bloques, tu libères en un geste.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide shot of a sunny terrace, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A guest arrives, tests a chair, shakes his head, and begins moving his table — a metre to the left, then out from under the awning, then further, dragging it steadily while a waiter follows behind him holding two menus and saying nothing. At 5 seconds the guest is dragging the table off the terrace and onto the pavement, past the planters. Final 2 seconds: the table now stands in the middle of the street; he sits down, perfectly content, and the waiter calmly places the menu in front of him as a bus indicator blinks behind. Audio: terrace ambience, metal table legs scraping on stone then asphalt, a chair being tested, the waiter's footsteps, distant traffic, a bus air-brake hiss, then a menu landing on metal. No music.", "rendu": false}, {"id": "EP126", "n": 126, "s": 5, "t": "Six fourchettes, une salade", "mod": "Caisse POS", "ch": "5 - SÉPARER UNE ADDITION", "sur": true, "url": "https://drive.google.com/drive/folders/1SeLJel_btaKEnvS8W3s6u8C0-ZnjaB4t", "hook": "On partage, c'est plus convivial.", "punch": "Partage l'assiette. Pas l'addition, elle se divise toute seule.", "heygen": "Tu partages l'addition par article ou par personne. Ce qui reste dû s'affiche en direct. Personne ne recompte à la main.", "hf": "Vertical 9:16, 10 seconds, photorealistic, top-down then eye-level, restaurant table, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Top-down shot of one single modest salad placed in the centre of a table set for six. A beat of stillness. At 5 seconds six forks strike the bowl simultaneously from six directions, colliding, retreating, striking again in a fencing flurry. Final 2 seconds: the bowl is empty and spotless; six hands rest politely on the table as if nothing happened. Audio: restaurant ambience, a plate set down, one second of total silence, then a rapid storm of metal-on-ceramic clattering like a swordfight, a last scrape, then calm chatter resuming. No music.", "rendu": false}, {"id": "EP127", "n": 127, "s": 5, "t": "Réveillon, 23 h 58", "mod": "Réservation", "ch": "1 - RÉSERVATIONS DU JOUR", "sur": true, "url": "https://drive.google.com/drive/folders/1L_ewdqi9eYPYPMdzLIL-Rj3JwvEzTJQm", "hook": "Bonne année à tout le monde.", "punch": "Sauf à celui qui gère les deux cents couverts.", "heygen": "Deux cents couverts un 31 décembre, ça se pilote : arrivées échelonnées, tables assignées, cuisine prévenue. La soirée reste une fête.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide shot of a packed festive dining room, warm golden light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A full New Year's Eve dining room, paper hats, streamers, everyone standing and counting down with raised glasses toward a clock. Behind them, a single waiter moves through the crowd carrying a tray with fourteen glasses, weaving with impossible precision. At 5 seconds confetti cannons fire; the entire room erupts, arms up, kisses, chaos — and the waiter is buried in falling confetti, tray still perfectly level above his head. Final 2 seconds: the room celebrates around him; he stands motionless in the middle, covered in confetti, tray untouched, eyes closed. Audio: a crowd counting down in French, a huge cheer, confetti cannon pops, party horns, glasses clinking, then the cheering settling behind one long exhale. No music.", "rendu": false}, {"id": "EP128", "n": 128, "s": 5, "t": "Saint-Valentin surbookée", "mod": "Réservation", "ch": "4 - PLACER UN CLIENT À TABLE", "sur": true, "url": "https://drive.google.com/drive/folders/1OPt9xLWcJHMHt-LCOM4gAfWP-I0MeaC8", "hook": "Trente couverts en plus, ça rentre.", "punch": "Ça rentre. La question, c'est si ça revient.", "heygen": "Tu places tes clients selon la vraie capacité de ta salle. Serrer, ça se décide — ça ne se subit pas un soir de Saint-Valentin.", "hf": "Vertical 9:16, 10 seconds, photorealistic, medium shot, romantic candlelit restaurant, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Tables for two crammed so close together that they touch. A couple gaze into each other's eyes over a candle — and fifteen centimetres away, another couple does exactly the same, sharing the same candle. At 5 seconds a man reaches for his partner's hand and takes the hand of the woman at the next table instead; both couples freeze. Final 2 seconds: he releases it, all four look straight ahead, and the two women simultaneously sip their wine without a word. Audio: intimate restaurant ambience, murmured conversations layered too close together, cutlery, a small startled inhale, four seconds of dense awkward silence, two glasses being set down. No music.", "rendu": false}, {"id": "EP129", "n": 129, "s": 5, "t": "Premier jour de terrasse, 4 degrés", "mod": "Caroline", "ch": "4 - GÉRER SES TABLES", "sur": true, "url": "https://drive.google.com/drive/folders/1OweOYbfTDAi0nPosQOg8_VY-VBxg6khF", "hook": "Premier rayon de soleil de l'année.", "punch": "Ta terrasse ouvre. Ton service doit suivre.", "heygen": "Tu ouvres ta terrasse dans le logiciel : tables ajoutées, capacité mise à jour, réservations ouvertes dessus. Le premier rayon de soleil est rentable.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide exterior, pale early-spring sunlight, visible breath in the air, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurant terrace on the first sunny day of March. Every single outdoor table is full — of people in thick winter coats, scarves, woolly hats and gloves, holding cutlery with gloved hands, faces tilted toward the weak sun with beatific expressions. Inside, through the window, the empty warm dining room is visible. At 5 seconds a waiter comes out and offers a blanket to a guest, who waves it away without opening his eyes. Final 2 seconds: the waiter drapes it on him anyway and goes back in; the guest smiles, still sunbathing at four degrees. Audio: street ambience, wind, the clink of cutlery muffled by gloves, chattering teeth, a blanket unfolding, a contented sigh. No music.", "rendu": false}, {"id": "EP130", "n": 130, "s": 5, "t": "Fête de la musique", "mod": "Marketing", "ch": "7 - TON AGENDA MARKETING", "sur": true, "url": "https://drive.google.com/drive/folders/19FSkQgF_ZaAskaAmxFfTIuXJ7ezCVLns", "hook": "21 juin. Devant ta porte.", "punch": "Autant que les gens sachent que tu es ouvert.", "heygen": "Ton agenda marketing connaît les temps forts de ton quartier. Tu prépares l'événement avant qu'il soit devant ta porte.", "hf": "Vertical 9:16, 10 seconds, photorealistic, handheld exterior evening, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A drummer has set up a full drum kit directly in front of a restaurant's entrance door, blocking it completely, and plays with enormous enthusiasm. Diners inside press their faces to the window. At 5 seconds a waiter tries to get out with two plates, waits for a gap, and finally climbs carefully over the bass drum, plates held high. Final 2 seconds: he lands on the other side, serves an outdoor table with total dignity, and the drummer gives him an approving nod without stopping. Audio: enthusiastic live drumming, street crowd noise, a door pushing against a cymbal stand, a plate wobble, a cymbal crash as he climbs over, then the drumming continuing. No music beyond the drums.", "rendu": false}, {"id": "EP131", "n": 131, "s": 5, "t": "Rentrée : tout le monde est encore en vacances", "mod": "Équipe & Planning", "ch": "16-Planning et tâches de l'employé", "sur": true, "url": "https://drive.google.com/drive/folders/1IRoEhrDK6gE4PqPwSDmhXOP7XjjFi6xq", "hook": "1er septembre. Deux absents.", "punch": "Un planning, ça se prépare avant la rentrée.", "heygen": "Tu construis la semaine de rentrée en amont : shifts posés, congés validés, coût affiché. Le premier septembre, tu n'es pas seul en cuisine.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide shot of a large professional kitchen, harsh morning light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A huge kitchen built for a brigade of eight, completely empty except for one chef standing alone at the pass. He looks left at four empty stations, right at three more. At 5 seconds a printer spits out a long ribbon of tickets; he looks at it, rolls up both sleeves, and moves to the first station. Final 2 seconds: a fast series of micro-cuts of him at four different stations in four different postures, ending back at the pass, plating. Audio: extractor hood hum, footsteps echoing in an empty kitchen, a printer chattering, sleeves rolling, then a rapid rhythmic burst of pans, tap, knife and plate sounds. No music.", "rendu": false}, {"id": "EP132", "n": 132, "s": 5, "t": "Le 15 août, seul ouvert", "mod": "Mon Site", "ch": "6 - RÉSERVATIONS & HORAIRES", "sur": true, "url": "https://drive.google.com/drive/folders/148lKdynNnugQ6WDGFYTM03Es8i-L_lVt", "hook": "Tout le quartier est fermé.", "punch": "Sauf toi. Encore faut-il qu'on te trouve en ligne.", "heygen": "Tes horaires d'ouverture sont à jour partout : site, réservation, Google. Quand tout le quartier ferme, on te trouve.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide street shot, hot empty city, midday sun, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A deserted French city street in August: every shop shutter closed, heat haze rising from the asphalt, not a single person. The camera pans slowly. At 5 seconds it reaches one single open restaurant — and a queue of eighty people snaking down the pavement and around the corner, fans, hats, patience. Final 2 seconds: the owner steps into the doorway, looks at the queue, and slowly rolls up his sleeves. Audio: cicadas, distant traffic, absolute street emptiness, then a rising wall of crowd murmur as the camera reaches the queue, a door chime, fabric of sleeves rolling. No music.", "rendu": false}, {"id": "EP133", "n": 133, "s": 5, "t": "Le but à la 90e", "mod": "Caisse POS", "ch": "3 - ENCAISSER UNE COMMANDE", "sur": true, "url": "https://drive.google.com/drive/folders/1FfRiDgDtAi_ERE7oTv9yfgbkjPQRwK-T", "hook": "Une minute pour encaisser trois tournées.", "punch": "Ta caisse doit tenir le rythme.", "heygen": "Trois tournées en une minute : tu encaisses au comptoir ou à table, TPE relié, ticket envoyé. Ta caisse tient le rythme du match.", "hf": "Vertical 9:16, 10 seconds, photorealistic, medium wide shot of a packed sports bar, screen glow, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A crowded bar watching a football match on a large screen (screen shows only abstract green blur, no readable broadcast). A waiter crosses the room with a tray of eight full beers. At 5 seconds the entire room explodes upward in a goal celebration, arms flying; the waiter is lifted off his feet by the surge, the tray launched vertically, beers suspended in slow motion. Final 2 seconds: he lands back on his feet, catches the empty tray, and every glass has landed upright on a nearby table in a perfect row. Audio: tense crowd murmur, a sudden roaring cheer, chairs falling, a slow-motion whoosh, glass bases landing on wood one after another, then a single collective gasp. No music.", "rendu": false}, {"id": "EP134", "n": 134, "s": 5, "t": "POV : la friteuse", "mod": "HACCP", "ch": "3-Enregistrer une température", "sur": true, "url": "https://drive.google.com/drive/folders/1ohzkWaC6hB6wEa2ow1gOtoLWz_zjd5_O", "hook": "Sept heures de service. Vue d'en bas.", "punch": "Elle aussi a une température à respecter.", "heygen": "L'huile et les frigos ont leurs seuils. Le relevé se fait en dix secondes, il est daté et gardé. Ta friteuse aussi a une conformité.", "hf": "Vertical 9:16, 10 seconds, photorealistic, extreme low-angle POV from inside a deep fryer basket looking up, heat shimmer, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. The camera is inside a fryer looking up at the ceiling of a kitchen. A hand lowers a basket of fries directly toward the lens; bubbles erupt and fill the frame; the basket rises, drains, disappears. This repeats faster and faster — three times, four, five — hands and baskets flashing past. At 5 seconds a wristwatch on one of the arms shows the movement blurring. Final 2 seconds: the surface goes perfectly still, oil calm, a single bubble rising, the kitchen light steady above. Audio: a deep sustained roar of boiling oil, violent bubbling on each immersion, metal basket clanging on the rim, muffled kitchen shouting above, then a slow calming simmer and one last bubble. No music.", "rendu": false}, {"id": "EP135", "n": 135, "s": 5, "t": "POV : le carnet de réservations", "mod": "Réservation", "ch": "1 - RÉSERVATIONS DU JOUR", "sur": true, "url": "https://drive.google.com/drive/folders/1L_ewdqi9eYPYPMdzLIL-Rj3JwvEzTJQm", "hook": "Toutes tes réservations du soir.", "punch": "Sur du papier. Vraiment ?", "heygen": "Tes réservations du soir sont ici, pas sur un carnet taché de café : contact, couverts, table, historique. Rien ne s'efface.", "hf": "Vertical 9:16, 10 seconds, photorealistic, top-down macro POV of an open paper reservation book on a host stand, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. The camera looks straight down at an open paper booking book covered in handwriting rendered as illegible ink marks, crossings-out and arrows only — absolutely no readable words. Hands enter and leave: writing, crossing out, writing again, a coffee cup lands and leaves a brown ring, a page is torn slightly, a pen leaks. At 5 seconds a hand knocks the coffee over completely and a wave of liquid floods the page. Final 2 seconds: a hand blots it with a napkin; the ink is gone, only a brown smear remains where the evening's bookings were. Audio: host stand ambience, pen scratching, pages turning, a phone ringing repeatedly in the background, a ceramic cup landing, liquid spilling, paper absorbing, one very quiet \"non\". No music.", "rendu": false}, {"id": "EP136", "n": 136, "s": 5, "t": "POV : le lave-verres", "mod": "Service", "ch": "1 - COMMANDES MULTI-CANAUX", "sur": true, "url": "https://drive.google.com/drive/folders/1V0xXbnYuqBsDUiD2Q_itQLIk4Ps1rw4l", "hook": "Deux minutes par cycle. Quatre-vingts cycles.", "punch": "Le service, c'est ça aussi.", "heygen": "Le service, c'est cent gestes invisibles. FoodEatUp en enregistre la trace pour que tu saches où part vraiment ton temps.", "hf": "Vertical 9:16, 10 seconds, photorealistic POV from inside a commercial glasswasher looking out through the racks, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. The camera sits among upturned glasses inside a professional glasswasher. A hand slides in one more rack, then the door drops and everything goes dark blue. At 5 seconds the cycle starts: jets of water hit the lens from every direction, steam floods the frame, the whole world becomes a hurricane. Final 2 seconds: sudden stop, total calm, steam clearing, the door lifts and a hand reaches straight in and takes one glass. Audio: glass racks rattling, a heavy door dropping, a pump priming, violent spraying water and steam roar filling everything, an abrupt mechanical stop, dripping, a door mechanism, one glass squeaking. No music.", "rendu": false}, {"id": "EP137", "n": 137, "s": 5, "t": "POV : la machine à café", "mod": "Caisse POS", "ch": "3 - ENCAISSER UNE COMMANDE", "sur": true, "url": "https://drive.google.com/drive/folders/1FfRiDgDtAi_ERE7oTv9yfgbkjPQRwK-T", "hook": "Deux cent quarante cafés. Aujourd'hui.", "punch": "Combien encaissés ? Tu es sûr ?", "heygen": "Deux cent quarante cafés, deux cent quarante lignes encaissées. Tu compares le vendu et l'encaissé, à l'unité près.", "hf": "Vertical 9:16, 10 seconds, photorealistic macro POV from behind the group head of an espresso machine, looking out at the bar, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. The camera looks out from inside the machine as a portafilter is locked in with a twist, a cup slides underneath, dark espresso streams past the lens. The cup leaves, another arrives, a hand wipes the lens area with a cloth. This accelerates: cup, cup, cup, faster and faster, hands blurring. At 5 seconds a hand slams the portafilter in slightly too hard and the whole frame shakes. Final 2 seconds: everything stops; one lone cup sits under the spout, and a hand appears and slowly turns the machine's switch off. Audio: a portafilter twist-lock, pump whirr, espresso pouring, cups clinking on saucers, steam wand shrieking, the tempo rising into chaos, a metallic slam, then a click and a long fading hiss. No music.", "rendu": false}, {"id": "EP138", "n": 138, "s": 5, "t": "POV : l'assiette, du pass à la table", "mod": "KDS", "ch": "3 - GÉRER LE KDS EN DIRECT", "sur": true, "url": "https://drive.google.com/drive/folders/1RnmeyK_4aYgVpGKKNdPOrClzmpHw9Ljg", "hook": "Quarante-cinq secondes de vie.", "punch": "Chaque assiette compte. Compte-les.", "heygen": "De l'envoi au pass, chaque plat a son statut et son chrono. Tu comptes tes assiettes, tu ne les devines pas.", "hf": "Vertical 9:16, 10 seconds, photorealistic first-person POV of a plate being carried through a restaurant, smooth gimbal motion, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. The camera IS the plate: it is lifted from the pass under a heat lamp, tilts, and travels fast through a kitchen — past a chef shouting, past flames, through swinging doors, through a crowded dining room, ducking under one arm, past a child's face that lights up. At 5 seconds the journey nearly ends in a collision with another waiter; both spin and continue. Final 2 seconds: the plate lands gently on a table and a guest leans into frame from above, delighted, fork already in hand. Audio: kitchen roar and shouting, a heat lamp buzz, swinging doors, ambient chatter swelling as it enters the dining room, a near-miss gasp, cloth brushing, then a plate settling on wood and one \"ah, merci !\". No music.", "rendu": false}, {"id": "EP139", "n": 139, "s": 5, "t": "Le rush, film de guerre", "mod": "KDS", "ch": "2 - VUE KDS PAR POSTE", "sur": true, "url": "https://drive.google.com/drive/folders/1L83RmygIEnYQwa2ELdR7viJODqI764wD", "hook": "20 h 30. Le coup de feu.", "punch": "Sois équipé, pas héroïque.", "heygen": "Pendant le coup de feu, tu vois la charge de chaque poste. Tu envoies où il y a de la place. Être équipé, c'est ça.", "hf": "Vertical 9:16, 10 seconds, photorealistic, shot like an epic war film: slow motion, heavy smoke, dramatic backlight, low heroic angles, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A professional kitchen at full rush filmed as a battlefield: steam rolling like battle smoke, sparks from a flambé, cooks moving in slow motion with grim determined faces, one carrying a stack of plates like ammunition, another wiping his brow with a forearm. The head chef stands at the pass surveying it all like a general, jaw set. At 5 seconds he raises one hand and everything freezes — every cook mid-motion. Final 2 seconds: he lowers his hand and points at the pass; the freeze breaks and all of them move at once. Audio: a low cinematic rumble, slowed-down clattering and shouting, a heartbeat, a whoosh of flame, total silence on the freeze, then a single sharp \"Service !\" and the noise returning at full volume. No music beyond the rumble.", "rendu": false}, {"id": "EP140", "n": 140, "s": 5, "t": "Le braquage du frigo", "mod": "StockVision", "ch": "16- Stock - Mouvements de stock", "sur": true, "url": "https://drive.google.com/drive/folders/1DvhP8VJ6MFa2Zokkwgkdx_BUm7WUbIMp", "hook": "Ton inventaire, la nuit.", "punch": "Ce qui disparaît finit toujours par se voir.", "heygen": "L'inventaire est daté, signé, comparé au théorique. Ce qui disparaît la nuit finit toujours par apparaître dans l'écart.", "hf": "Vertical 9:16, 10 seconds, photorealistic, shot like a heist movie: darkness, tight close-ups, tense framing, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Night in a closed restaurant kitchen. Three cooks in black, faces lit from below, execute a heist: one picks the walk-in fridge lock, one watches the door with a mirror, one crawls under an imaginary laser grid rendered as thin red light beams from a security sensor. At 5 seconds the crawler reaches the prize and lifts it with two hands, reverent and slow: a single small pot of crème dessert. Final 2 seconds: all three stare at it in silence; one of them slowly starts clapping. Audio: deep tense silence, a lock picking click, breathing held, a fridge seal cracking open, a soft electronic sensor beep, a plastic pot lifting, then three slow claps. No music beyond a low tension pulse.", "rendu": false}, {"id": "EP141", "n": 141, "s": 5, "t": "Cuisine, cockpit spatial", "mod": "PrediBot", "ch": "3 - PARLER À PREDIBOT", "sur": true, "url": "https://drive.google.com/drive/folders/10__yAAWsF5AzYJFvViRjWlSYTzIlIyBQ", "hook": "Table 6 depuis 22 minutes.", "punch": "Un pilote automatique, ça existe aussi en cuisine.", "heygen": "Tu demandes, PrediBot répond avec tes vraies données : la table en attente, la production à lancer, l'alerte à traiter. Le pilote automatique existe.", "hf": "Vertical 9:16, 10 seconds, photorealistic, shot like a sci-fi spacecraft cockpit: red emergency lighting, tight framing, steam venting, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A professional kitchen lit entirely by pulsing red emergency light, steam venting from a pan like a hull breach. Two cooks work at their stations like astronauts under alarm, one gripping an overhead rail, the other counting down on his fingers with fierce concentration. At 5 seconds he slams his palm onto the pass — and a perfectly plated dish slides forward into the light, mission accomplished. Final 2 seconds: the red light snaps back to normal warm kitchen light; both exhale; one gives a small thumbs up. Audio: a pulsing alarm klaxon, hissing steam vents, tense breathing, a countdown in French \"trois, deux, un\", a palm slam, a plate sliding on steel, then the alarm cutting out and normal kitchen ambience returning. No music.", "rendu": false}, {"id": "EP142", "n": 142, "s": 5, "t": "Duel à la spatule", "mod": "Équipe & Planning", "ch": "2-Configuration des employés", "sur": true, "url": "https://drive.google.com/drive/folders/1GYwVOPg4veg-cFhZh_rxhvWmwOFy_4mB", "hook": "Qui envoie le plat du jour.", "punch": "Répartis les postes avant le service, pas pendant.", "heygen": "Les postes sont répartis avant le service, pas pendant. Chacun sait ce qu'il envoie, personne ne dégaine sa spatule pour le savoir.", "hf": "Vertical 9:16, 10 seconds, photorealistic, western duel framing, golden hour light streaming through a kitchen door, long shadows, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Two cooks face each other down the length of a kitchen aisle, backlit by the setting sun through an open door, aprons flapping slightly like dusters. Extreme close-ups: narrowed eyes, a hand hovering over an apron pocket, a bead of sweat, a bay leaf tumbling across the floor like a tumbleweed. At 5 seconds both draw — spatulas — and freeze, pointed at each other. Final 2 seconds: they hold the standoff for one long beat, then both turn in unison and use the spatulas to plate two dishes side by side, perfectly synchronised. Audio: a single sustained tension note, wind, boots on tiles, a dry leaf skittering, two sharp fabric draws, a beat of silence, then two spatulas scraping pans in perfect time. No music beyond the tension note.", "rendu": false}, {"id": "EP143", "n": 143, "s": 5, "t": "La commande de 200 pièces", "mod": "Comptabilité", "ch": "3- Créer un devis", "sur": true, "url": "https://drive.google.com/drive/folders/1vEqEBl6EYPfsXAsDkHKMKjMCFs845eQH", "hook": "Une seule commande.", "punch": "Deux cents parts. Anticipe-les.", "heygen": "Deux cents parts, ça commence par un devis : quantités, prix, marge. Il se transforme en commande, puis en facture, sans ressaisie.", "hf": "Vertical 9:16, 10 seconds, photorealistic, disaster-movie framing: slow push-in, dust in the light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A calm kitchen. A ticket printer begins to print. It does not stop. The ribbon of paper grows past the pass, along the counter, across the floor, out through the swinging doors, and keeps going. Two cooks follow the paper with their eyes, then start walking beside it as it travels. At 5 seconds one of them picks up the end of the ribbon and holds it up: it stretches the entire length of the kitchen behind him. Final 2 seconds: the printer is still going; a third cook silently removes his apron and hangs it on a hook. Audio: quiet kitchen, a printer starting, chattering relentlessly and growing louder, footsteps following it, paper dragging on tiles, a printer that will not stop, then an apron string untying. No music.", "rendu": false}, {"id": "EP144", "n": 144, "s": 5, "t": "Le procès du steak trop cuit", "mod": "Marketing", "ch": "3 - RÉPONDRE AUX AVIS", "sur": true, "url": "https://drive.google.com/drive/folders/1ZXZeT7GyPTkQT95XNGu8svx6OI1aUgNA", "hook": "Un avis une étoile.", "punch": "Réponds-y avant qu'il fasse jurisprudence.", "heygen": "Un avis une étoile, tu le vois tout de suite et tu réponds depuis l'outil. Une réponse rapide vaut mieux qu'un long procès.", "hf": "Vertical 9:16, 10 seconds, photorealistic, shot like a courtroom drama: solemn wooden interior, dramatic overhead light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A solemn courtroom. In the witness stand, elevated and alone under a single spotlight, sits a plate with one very overcooked steak on it. A serious man in a robe points at it accusingly; the jury of twelve leans forward as one. At 5 seconds a chef in whites stands in the defendant's box and lowers his head. Final 2 seconds: an overhead shot of the plate alone in the spotlight, absolute silence in the room. Audio: courtroom reverb, a low murmur, footsteps on wood, an accusing French voice saying one word \"Cuit.\", a collective gasp from the jury, a gavel strike, then silence. No music.", "rendu": false}, {"id": "EP145", "n": 145, "s": 5, "t": "Documentaire animalier : le gérant", "mod": "Pr
