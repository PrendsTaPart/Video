<title>FoodEatUp — console de production des 150 épisodes</title>
<style>
:root{
  --ground:#F7F3E4; --surface:#FFFDF7; --raised:#FBF7EA;
  --ink:#14202B; --ink-2:#3E5060; --muted:#6B7C89;
  --line:#E2DAC2; --line-2:#EFE8D4;
  --accent:#0A5FD0; --accent-soft:#E4EDFB;
  --flag:#B45905; --flag-soft:#FBEEDC;
  --ok:#1F7A4C; --ok-soft:#E3F1E9;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px -16px rgba(20,32,43,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1820; --surface:#16222C; --raised:#1B2933;
    --ink:#E9EEF2; --ink-2:#B3C1CC; --muted:#8296A4;
    --line:#26363F; --line-2:#1F2E37;
    --accent:#5AA2FF; --accent-soft:#12304F;
    --flag:#F0A24A; --flag-soft:#3A2A15;
    --ok:#5FCB93; --ok-soft:#14332A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1820; --surface:#16222C; --raised:#1B2933;
  --ink:#E9EEF2; --ink-2:#B3C1CC; --muted:#8296A4;
  --line:#26363F; --line-2:#1F2E37;
  --accent:#5AA2FF; --accent-soft:#12304F;
  --flag:#F0A24A; --flag-soft:#3A2A15;
  --ok:#5FCB93; --ok-soft:#14332A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 96px}
header{margin-bottom:26px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance;font-weight:650}
.sub{color:var(--muted);font-size:14px;margin:0;max-width:64ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:640}

.controls{position:sticky;top:0;z-index:5;background:var(--ground);
  padding:12px 0;margin-bottom:14px;border-bottom:1px solid var(--line);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:2px;background:var(--raised);border:1px solid var(--line);
  border-radius:9px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);
  font:inherit;font-size:13px;padding:6px 13px;border-radius:6px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.seg button:focus-visible,input:focus-visible,.copy:focus-visible,
.drive:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type="search"]{flex:1;min-width:200px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px}
input[type="search"]::placeholder{color:var(--muted)}

.list{display:flex;flex-direction:column;gap:12px}
.ep{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;box-shadow:var(--shadow);border-left:3px solid transparent;
  transition:border-color .18s,background .18s}
.ep.done{border-left-color:var(--ok);background:var(--ok-soft)}
.ep.done .ttl{color:var(--ok)}
.ep.done .script,.ep.done pre{background:var(--surface)}
.tick{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  font-weight:640;white-space:nowrap}
.tick input{appearance:none;width:19px;height:19px;margin:0;flex:none;cursor:pointer;
  border:1.5px solid var(--line);border-radius:5px;background:var(--raised);
  display:grid;place-content:center}
.tick input:checked{background:var(--ok);border-color:var(--ok)}
.tick input:checked::after{content:"";width:5px;height:9px;border:solid #fff;
  border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ep.done .tick{color:var(--ok)}
.bar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;
  margin-top:12px;max-width:420px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;
  transition:width .3s}
.ep-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.num{font-variant-numeric:tabular-nums;font-weight:680;font-size:13px;color:var(--accent);
  background:var(--accent-soft);border-radius:6px;padding:3px 8px;letter-spacing:.01em}
.ttl{font-size:17px;font-weight:620;letter-spacing:-.01em;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.chip.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.flag{color:var(--flag);border-color:var(--flag);background:var(--flag-soft);text-transform:none}

.path{font-size:13px;color:var(--muted);margin:2px 0 14px}
.path b{color:var(--ink-2);font-weight:560}

.block{margin-top:12px}
.lab{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lab span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:640}
.copy{margin-left:auto;appearance:none;font:inherit;font-size:12px;cursor:pointer;
  background:var(--raised);color:var(--ink-2);border:1px solid var(--line);
  border-radius:7px;padding:4px 11px}
.copy:hover{color:var(--ink);border-color:var(--accent)}
.copy[data-done="1"]{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.script{background:var(--raised);border:1px solid var(--line-2);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:12px 15px;font-size:15px;line-height:1.6}
.mini{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.mini div{min-width:180px;flex:1}
.mini p{margin:0;font-size:14px;color:var(--ink-2)}
.drive{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  background:var(--accent);color:#fff;font-size:13.5px;font-weight:560;
  border-radius:8px;padding:8px 14px;margin-top:4px}
.drive:hover{filter:brightness(1.08)}
.drive.pale{background:var(--flag-soft);color:var(--flag);border:1px solid var(--flag)}
details{margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px}
summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none;
  display:flex;align-items:center;gap:7px}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";display:inline-block;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary:hover{color:var(--ink-2)}
pre{margin:10px 0 0;background:var(--raised);border:1px solid var(--line-2);border-radius:8px;
  padding:13px 15px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--muted);padding:64px 0;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){
  .wrap{padding:22px 14px 72px} h1{font-size:22px}
  .chips{margin-left:0;width:100%} .ep{padding:15px 16px}
}
</style>

e}, {"id": "EP008", "n": 8, "s": 1, "t": "La pile de tickets", "mod": "Comptabilité", "ch": "5- Créer une facture", "sur": true, "url": "https://drive.google.com/drive/folders/1026gmGm615P9PAOfk4CUGaxRava0Nm6k", "hook": "Fin de mois. Encore.", "punch": "Et si la compta se faisait toute seule ?", "heygen": "Chaque commande génère sa facture. Tu retrouves le facturé, l'encaissé et les impayés dans le même écran. La fin de mois devient une lecture, pas une reconstitution.", "hf": "Vertical 9:16, 10 seconds, photorealistic, slow push-in, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurant manager sits at a cluttered back-office desk. A thermal receipt printer beside him keeps printing without stopping; the paper roll has already coiled into a huge pile on the floor. He watches it, resigned, then slowly lowers his forehead onto the desk. Final 2 seconds: the printer is still going, the paper now reaching his chair. Audio: relentless thermal printer chattering that never stops, a fluorescent light hum, a long defeated human sigh. No music.", "rendu": false}, {"id": "EP009", "n": 9, "s": 1, "t": "Le pigeon voleur", "mod": "Caisse POS", "ch": "7 - SUIVRE LES ÉCARTS CAISSE", "sur": true, "url": "https://drive.google.com/drive/folders/1XpLa01_iscSfjrfA8GkM2uEuHdDZIw4d", "hook": "Il y a toujours quelqu'un qui prend ta marge.", "punch": "Ton abonnement logiciel, par exemple.", "heygen": "À chaque clôture, l'écart entre le théorique et le compté s'affiche. Tu vois quel service dérape et de combien. Ce qui se mesure s'arrête.", "hf": "Vertical 9:16, 10 seconds, photorealistic, handheld street-level, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A paper cone of fries sits on a café terrace table in the sun. A pigeon lands on the edge of the table and edges sideways toward it with absurd confidence. At 5 seconds it grabs a single fry and takes off. Final 2 seconds: the empty spot on the table, one feather drifting down in slow motion. Audio: terrace ambience, pigeon wing flaps, an exaggerated theft-movie sting as it grabs the fry, then a soft feather-drop silence. No music.", "rendu": true}, {"id": "EP010", "n": 10, "s": 1, "t": "Le flambage raté", "mod": "PrediBot", "ch": "1 - LIRE SES PRÉVISIONS", "sur": true, "url": "https://drive.google.com/drive/folders/19KbPaohx3zwWwsG4Ud3KfJU9WlqeqIoE", "hook": "Toi, devant ta facture logicielle.", "punch": "Mille euros par mois. Pour dix outils qui ne se parlent pas.", "heygen": "Un écran, le matin : ton chiffre d'affaires prévu, ta fréquentation, tes points de tension. C'est ton point du jour, sans ouvrir dix onglets.", "hf": "Vertical 9:16, 10 seconds, photorealistic, cinematic kitchen lighting, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef flambés a pan of prawns; the flame erupts far higher than expected, filling the top of the frame. He recoils. Final 2 seconds: he turns to camera with slightly singed eyebrows and a completely blank expression, a wisp of smoke rising from his hat. Audio: gas burner, a loud whoosh of igniting alcohol, a startled French \"Oh !\", then only the quiet crackle of the pan. No music.", "rendu": true}, {"id": "EP011", "n": 11, "s": 1, "t": "Le livreur et le dos d'âne", "mod": "HubRise", "ch": "1 - CONNECTER SON HUBRISE", "sur": true, "url": "https://drive.google.com/drive/folders/1kqu2sTxvzVvBFx-Y4WgFdF6qOz4wh0o9", "hook": "Ta livraison sans intégration.", "punch": "Avec, tout arrive à bon port.", "heygen": "Tu connectes HubRise une fois. Tes plateformes de livraison envoient leurs commandes directement dans FoodEatUp. Plus de tablette à surveiller dans un coin.", "hf": "Vertical 9:16, 10 seconds, photorealistic, low-angle tracking, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A delivery rider on a scooter with a large insulated backpack rides down a suburban street. At 5 seconds he hits a speed bump he clearly did not see; the backpack lid flips open and three wrapped burgers launch into the air in slow moti . It buzzes once, then faster and faster until it vibrates itself across the metal surface. At 5 seconds it buzzes so hard it walks off the edge. Final 2 seconds: it lies face-down on the floor, still buzzing, a cook's shoe stepping carefully around it. Audio: escalating phone vibration on metal, layered notification chimes stacking into chaos, a clatter as it falls, then muffled buzzing from the floor. No music.", "rendu": true}, {"id": "EP014", "n": 14, "s": 1, "t": "Le raton laveur", "mod": "StockVision", "ch": "16- Stock - Mouvements de stock", "sur": true, "url": "https://drive.google.com/drive/folders/1DvhP8VJ6MFa2Zokkwgkdx_BUm7WUbIMp", "hook": "Ton gaspillage alimentaire.", "punch": "Lui au moins, il sait ce qu'il y a en stock.", "heygen": "Chaque entrée, chaque sortie, chaque perte est enregistrée. Tu vois ce qui part sans être vendu. Le gaspillage devient une ligne, donc un problème réglable.", "hf": "Vertical 9:16, 10 seconds, photorealistic, night, security-camera framing then cinematic, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Night, behind a restaurant. A raccoon carefully lifts the lid of a large bin, climbs half inside, and emerges holding an entire untouched baguette. It freezes when a light clicks on. Final 2 seconds: it stares directly into the camera, baguette in both paws, absolutely unashamed. Audio: night ambience, crickets, a metallic bin lid clang, plastic rustling, a small raccoon chitter, a light switch click. No music.", "rendu": true}, {"id": "EP015", "n": 15, "s": 1, "t": "La tour d'assiettes", "mod": "Configuration", "ch": "7 - Vos catégories", "sur": true, "url": "https://drive.google.com/drive/folders/1l4i6EF6MJikoXuL4vKDglHiwunFS0WT9", "hook": "Ta gestion actuelle.", "punch": "Une pièce bouge, tout s'écroule.", "heygen": "Tes catégories, ta TVA, tes zones, tes équipements : tout est posé une fois, proprement. Quand une pièce bouge, le reste ne s'écroule pas.", "hf": "Vertical 9:16, 10 seconds, photorealistic, static wide then slow zoom, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A dishwasher in a commercial kitchen stacks clean plates into a tower far too tall, adding one more with great care. The tower sways. At 5 seconds he removes a single plate from near the bottom and the entire stack collapses in slow motion. Final 2 seconds: he stands amid the wreckage holding the one plate he took, intact. Audio: kitchen ambience, ceramic clinking, a rising creak as the tower sways, a massive ceramic crash, then total silence except a dripping tap. No music.", "rendu": true}, {"id": "EP016", "n": 16, "s": 1, "t": "Le geyser à café", "mod": "Comptabilité", "ch": "8- Archivage des dépenses", "sur": true, "url": "https://drive.google.com/drive/folders/1LKE7TtSjPJRnWVF_4-Tt89KmnudV-dcY", "hook": "Tes coûts, ce trimestre.", "punch": "On va refermer le robinet.", "heygen": "Tu enregistres tes achats fournisseurs avec le détail des lignes. Tes dépenses du mois s'additionnent toutes seules, en face de ton chiffre d'affaires.", "hf": "Vertical 9:16, 10 seconds, photorealistic, close-up then wide, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A professional espresso machine begins to hiss abnormally. The barista taps it once. At 5 seconds a jet of steam and coffee erupts vertically from the group head, hitting the ceiling. Final 2 seconds: the barista stands completely still, drenched, holding an empty cup at arm's length under the spray. Audio: espresso machine hiss building into a pressurised roar, splattering liquid, dripping ceiling, then a single calm cup-on-saucer clink. No music.", "rendu": true}, {"id": "EP017", "n": 17, "s": 1, "t": "Le ninja de la frite", "mod": "StockVision", "ch": "19- Statistiques - Création d'un rapport", "sur": true, "url": "https://drive.google.com/drive/folders/1yvp9ZXQST0g2t8Y6_DFMGeU_W2VtTwUa", "hook": "Personne ne touche à ta dernière frite.", "punch": "Ni à ta marge.", "heygen": "Tu génères ton rapport par module en un clic : ventes drive/folders/107h7JIXDFCD5cjyF90tiOZT2LSkFSjFj", "hook": "Ton chiffre d'affaires, sans outil.", "punch": "Ça rebondit rarement tout seul.", "heygen": "FoodEatUp regarde tes ventes passées et te dit quoi produire demain. Ton chiffre d'affaires ne dépend plus de ton intuition du lundi matin.", "hf": "Vertical 9:16, 10 seconds, photorealistic, extreme slow motion macro, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A double cheeseburger falls in extreme slow motion toward a kitchen floor. Sesame seeds detach and float. It hits, compresses, and improbably bounces once, layers separating mid-air. Final 2 seconds: it lands fully deconstructed, each ingredient in a neat row, as if plated on purpose. Audio: a low slow-motion whoosh, a soft wet impact, a comedic boing on the bounce, then a delicate settling sound. No music.", "rendu": true}, {"id": "EP020", "n": 20, "s": 1, "t": "Le chien qui a réservé", "mod": "Réservation", "ch": "2 - AJOUTER UNE RÉSERVATION", "sur": true, "url": "https://drive.google.com/drive/folders/1FCKxILOc1EB5X51xFCrWZgXTQ27IXLeE", "hook": "Lui, il a réservé.", "punch": "Tes vrais clients aussi devraient pouvoir.", "heygen": "Tu ajoutes une réservation en dix secondes, la table libre est proposée automatiquement. Et tes clients peuvent le faire eux-mêmes, depuis ton site.", "hf": "Vertical 9:16, 10 seconds, photorealistic, warm restaurant lighting, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A large dog sits upright on a chair at a set restaurant table, a napkin tucked into its collar, front paws resting on the tablecloth, waiting with immense dignity. A waiter approaches with a menu and offers it. Final 2 seconds: the dog looks at the menu, then straight at the camera, and lets out one small impatient huff. Audio: cosy restaurant ambience, gentle chatter, cutlery, a paper menu rustle, one deep dog huff. No music.", "rendu": true}, {"id": "EP021", "n": 21, "s": 1, "t": "Chef contre imprimante", "mod": "KDS", "ch": "1 - CRÉER TES POSTES KDS", "sur": true, "url": "https://drive.google.com/drive/folders/1NU0o445gOk4pdMf4uimNPOts3XIcR7LO", "hook": "Le vrai ennemi du service.", "punch": "Un KDS, et le combat s'arrête.", "heygen": "Tu crées tes postes : chaud, froid, dessert. Chaque plat part au bon écran. Plus d'imprimante à secouer au milieu du service.", "hf": "Vertical 9:16, 10 seconds, photorealistic, handheld kitchen, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef at the pass fights with a jammed ticket printer, pulling a crumpled strip of paper that keeps tearing. He shakes it, opens the lid, closes it, hits it once with the flat of his hand. At 5 seconds it prints an enormous unbroken ribbon of tickets straight onto the floor. Final 2 seconds: he stands holding the ribbon with both hands, expressionless. Audio: busy kitchen, printer grinding and jamming, plastic lid snapping, a frustrated French \"Allez !\", then continuous printing. No music.", "rendu": true}, {"id": "EP022", "n": 22, "s": 1, "t": "La facture qui fait pleurer", "mod": "PrediBot", "ch": "2 - MARKETPLACE DE PROMPTS", "sur": true, "url": "https://drive.google.com/drive/folders/1RYZ8XwLFAfblkQTaotx4OBWbeGn9FHzR", "hook": "Mille euros par mois.", "punch": "Pour dix logiciels qui ne se parlent même pas.", "heygen": "Tout est déjà là : caisse, stock, planning, marketing, HACCP. Un seul abonnement, une seule base de données. Tes outils arrêtent de s'ignorer.", "hf": "Vertical 9:16, 10 seconds, photorealistic, moody desk lamp lighting, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurant owner sits alone at night in the empty dining room with a laptop and a thick stack of invoices. He flips through them faster and faster, expression collapsing. At 5 seconds he stops, stares at one page, and slowly slides down until only his eyes are above the table edge. Final 2 seconds: just his eyes, the invoice held up beside them. Audio: empty room reverb, paper flipping accelerating, a chair creak, a long shaky exhale, a clock ticking. No music.", "rendu": true}, {"id": "EP023", "n": 23, "s": 1, "t": "L'aspirateur robot", "mod": "Marketing", "ch": "24 - CALENDRIER IA AVEC IRIS", "sur": true, "url": "https://drive.google.com/drive/folders/1xBOpXD3_d349XcOQbXjWZI2ejA316C_0", "hook": "Ton automatisation actuelle.", "punch": "Automatiser, oui. Mais bien.", "heygen": "Iris regarde ton exploitation et te propose quoi publier, et pourquoi. Tu valides ou tu refuses. L'automatisation te sert, elle ne t'échappe pas.", "hf": "Vertical 9:16, 10 seconds, photorealistic, low floor-level camera, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A robot vacuum glides across a restaurant floor and catches the corner of a long tablecloth. It keeps going with total determination, dragging the cloth and everything on the table behind it in slow motion — glasses, cutlery, a vase. Final 2 seconds: the robot arrives at its dock, tablecloth and all, and its status light turns green. Audio: soft robot motor hum, fabric dragging, escalating glass and cutlery clatter, then a cheerful electronic docking chime. No music.", "rendu": true}, {"id": "EP024", "n": 24, "s": 1, "t": "La mouette braqueuse", "mod": "Mon Site", "ch": "5 - CRÉER UN SITE PAR IA", "sur": true, "url": "https://drive.google.com/drive/folders/1WZsVdrBvcL2OQiYcRdnBCgzUx6u9J6p9", "hook": "Encore une commission en moins.", "punch": "Récupère tes commandes en direct.", "heygen": "Ton site de commande est créé par l'IA depuis ta carte. Tes clients commandent en direct, chez toi. Zéro commission sur ces commandes-là.", "hf": "Vertical 9:16, 10 seconds, photorealistic, seaside daylight, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A seaside restaurant terrace. A tray of fried fish and lemon sits on a table by the railing. A seagull swoops in from off-frame in a single confident dive, grabs the whole fish and pulls up. Final 2 seconds: the seagull perched on the railing with the fish, staring at the diners, wind ruffling its feathers. Audio: waves and sea wind, terrace chatter, a loud seagull cry, wing beats, a startled human gasp. No music.", "rendu": true}, {"id": "EP025", "n": 25, "s": 1, "t": "Le mixeur sans couvercle", "mod": "Marketing", "ch": "6 - CAMPAGNE 100% IA", "sur": true, "url": "https://drive.google.com/drive/folders/14eSl0L3tVXmecDdmsaTReOkXcE-DGM3d", "hook": "Quand tu lances une promo sans données.", "punch": "Ça éclabousse. Et rarement toi.", "heygen": "Tu ne lances plus une promo au hasard. FoodEatUp te propose la campagne depuis tes vraies données clients : qui cibler, avec quelle offre, quel jour.", "hf": "Vertical 9:16, 10 seconds, photorealistic, kitchen close-up, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A cook pours bright orange soup into a professional blender and, without noticing the missing lid, presses the highest setting. At 5 seconds soup erupts upward and outward, coating the wall, the ceiling and the cook. Final 2 seconds: he switches it off, wipes one eye clear with a finger, and looks at the camera. Audio: blender motor screaming to full speed, wet splattering, dripping, an abrupt switch-off click, then a single drip. No music.", "rendu": true}, {"id": "EP026", "n": 26, "s": 1, "t": "Le ballon qui explose", "mod": "StockVision", "ch": "5- Liste des courses - Commander au fournisseur", "sur": true, "url": "https://drive.google.com/drive/folders/18dlgcwepziokEkkpTQFu1-ifGJ5ajOYB", "hook": "Ton stock avant le week-end.", "punch": "Prévois, au lieu de subir.", "heygen": "Ta liste de courses se construit depuis ta production prévue. Tu l'envoies au fournisseur depuis l'écran. Le week-end se prépare le mercredi.", "hf": "Vertical 9:16, 10 seconds, photorealistic macro, studio lighting on a stainless kitchen counter, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A red balloon is being inflated far past its limit next to a neat pyramid of fresh vegetables. The rubber stretches thin and translucent, trembling. Extreme slow motion at 5 seconds as it bursts, fragments peeling outward. Final 2 seconds: the vegetable pyramid stands untouched, a shred of red rubber draped over the top tomato. Audio: rubber stretching creak rising in pitch, a sharp burst, then quiet room tone. No music.", "rendu": true}, {"id": "EP027", "n": 27, "s": 1, "t": "Le chat et le verre", "mod": "Caisse POS", "ch": "6 - CLÔTURER SA CAISSE LE Z", "sur": true, "url": "https://drive.google.com/drive/folders/1ht1CI-2jBkP6DdhvMdT3xVCPbzrwUU3m", "hook": "Ta trésorerie, chaque lundi.", "punch": "Il suffit d'un truc mal placé.", "heygen": "Ton Z de caisse en un bouton : le compté, le théorique, l'écart, les moyens de paiement. Tu sais où tu en es tous les lundis matin.", "hf": "Vertical 9:16, 10 seconds, photorealistic, locked-off close-up, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A black cat sits on a bar counter beside a full wine glass. It makes prolonged eye contact with the camera, then extends one paw and pushes the glass millimetre by millimetre toward the edge. At 6 seconds the glass tips over the edge. Final 2 seconds: the cat looks down at the floor, then back at the camera, entirely satisfied. Audio: quiet bar ambience, faint glass sliding on wood, a glass shattering off-frame, then one soft meow. No music.", "rendu": true}, {"id": "EP028", "n": 28, "s": 1, "t": "Le tapis à sushis fou", "mod": "HubRise", "ch": "4 - CENTRALISER LES COMMANDES", "sur": true, "url": "https://drive.google.com/drive/folders/1Qt_omsrE2w9UqlhhlfkhwJaCjeL_ddow", "hook": "Tes commandes en ligne, un vendredi.", "punch": "Tout arrive. Nulle part.", "heygen": "Uber Eats, Deliveroo, ton site, le comptoir : tout tombe dans la même file. Un vendredi soir, tu regardes un écran, pas quatre.", "hf": "Vertical 9:16, 10 seconds, photorealistic, side tracking shot along the belt, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A conveyor-belt sushi restaurant. The belt slowly accelerates beyond normal speed; plates begin to blur past seated diners who turn their heads to follow. At 6 seconds plates start flying off the end of the belt one after another. Final 2 seconds: a diner calmly catches one out of the air with chopsticks without looking. Audio: mechanical belt hum rising in pitch, ceramic rattling, plates clattering off the end, a single clean chopstick click on the catch. No music.", "rendu": true}, {"id": "EP029", "n": 29, "s": 1, "t": "Les douze assiettes", "mod": "PrediBot", "ch": "1 - LIRE SES PRÉVISIONS", "sur": true, "url": "https://drive.google.com/drive/folders/19KbPaohx3zwWwsG4Ud3KfJU9WlqeqIoE", "hook": "Toi, gérant, en 2026.", "punch": "Personne ne devrait travailler comme ça.", "heygen": "Le brief du jour te dit ce qui compte avant que ça te tombe dessus : les réservations, les productions, les alertes. Tu diriges au lieu de courir.", "hf": "Vertical 9:16, 10 seconds, photorealistic, slow orbit around the subject, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurant manager stands in a dining room with plates balanced everywhere — both forearms, one on his head, one in each hand, one wedged under his chin — while a phone rings in his apron pocket. He looks at the pocket, then at the camera, unable to move at all. Final 2 seconds: the phone keeps ringing; he closes his eyes. Audio: restaurant ambience, faint ceramic wobble, a phone ringing insistently from inside fabric, one long resigned breath. No music.", "rendu": true}, {"id": "EP030", "n": 30, "s": 1, "t": "Le pingouin en cuisine", "mod": "Configuration", "ch": "Academy", "sur": false, "url": "https://drive.google.com/drive/folders/19xTrrkXtWO3yfJqtC3SIlDgpBjSEc4N9", "hook": "Le nouveau, jour 1.", "punch": "Forme-le en un clic avec l'Académy.", "heygen": "Le nouveau se forme tout seul : chaque module a ses vidéos, dans l'ordre. Tu ne réexpliques plus la caisse à chaque embauche.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wide kitchen shot, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A penguin waddles into a professional restaurant kitchen wearing a tiny white apron. It steps onto a freshly mopped tile floor, immediately loses traction and slides the entire length of the kitchen on its belly, passing surprised cooks. Final 2 seconds: it stops against the base of a fridge, stands up, and shakes itself off with dignity. Audio: kitchen ambience, a wet tile squeak, a long comedic slide whoosh, a soft thud against the fridge, one penguin squawk. No music.", "rendu": true}, {"id": "EP031", "n": 31, "s": 2, "t": "L'avalanche de tupperware", "mod": "HACCP", "ch": "15-Créer les étiquettes de production", "sur": true, "url": "https://drive.google.com/drive/folders/1LP5M_d-WFsTZCb1ddBTNlTGfUQhEzO76", "hook": "C'est quoi, ça ?", "punch": "Sans DLC tracées, personne ne sait.", "heygen": "Tu crées ton étiquette DLC en trois secondes, avec le produit, la date et l'agent. Plus personne n'ouvre un bac en se demandant ce que c'est.", "hf": "Vertical 9:16, 10 seconds, photorealistic, cinematic handheld camera, shallow depth of field, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A cook opens the door of a tall stainless-steel restaurant fridge. For a beat nothing happens. At 5 seconds an avalanche of unlabelled plastic containers pours out onto the floor in slow motion, lids separating mid-air. Final 2 seconds: he stands ankle-deep in containers, holding the fridge door handle, staring at the camera. Audio: fridge seal sucking open, compressor hum, escalating plastic clattering, a lid spinning to a stop on the tiles, then silence. No music.", "rendu": true}, {"id": "EP032", "n": 32, "s": 2, "t": "La sauce trop forte", "mod": "StockVision", "ch": "1- Ma carte - Création et modifications de la carte du restaurant", "sur": true, "url": "https://drive.google.com/drive/folders/1bGMZ8R1udBoMF4XrJJqEnpYKkVrwBxx7", "hook": "Ta recette « au feeling ».", "punch": "Une fiche technique, et c'est pareil tous les jours.", "heygen": "Ta recette est enregistrée : ingrédients, quantités, étapes. Le plat sort pareil que ce soit toi ou ton commis. Et son coût est calculé.", "hf": "Vertical 9:16, 10 seconds, photorealistic, tight close-up, warm kitchen light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef tastes his own sauce from a wooden spoon with total confidence. His expression holds for two seconds, then cracks: eyes watering, face reddening, breathing through the mouth. At 5 seconds he grabs a jug of water and drinks straight from it. Final 2 seconds: he lowers the jug, gives a thumbs up to the camera, eyes still streaming. Audio: kitchen ambience, a spoon tap, sharp inhaling through teeth, gulping, a strangled French \"Ça va, ça va\", then a small cough. No music.", "rendu": true}, {"id": "EP033", "n": 33, "s": 2, "t": "Le rôti disparu", "mod": "StockVision", "ch": "16- Stock - Mouvements de stock", "sur": true, "url": "https://drive.google.com/drive/folders/1DvhP8VJ6MFa2Zokkwgkdx_BUm7WUbIMp", "hook": "Tu as tout préparé. Presque.", "punch": "Ce qui n'est pas suivi finit par disparaître.", "heygen": "Ce qui n'est pas suivi disparaît. Ici chaque produit a son niveau, son seuil et son historique. Tu vois le trou avant le service, pas après.", "hf": "Vertical 9:16, 10 seconds, photorealistic, warm dining room, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A long banquet table, beautifully set, a whole roast on a platter at the centre. Everyone has turned away to look off-frame. A large dog rises silently from under the table, takes the entire roast off the platter and disappears back down. At 5 seconds the guests turn back to an empty platter. Final 2 seconds: a slow tilt down to the dog under the table, roast between its paws, mid-bite. Audio: banquet chatter and cutlery, a soft platter scrape, chatter stopping abruptly, then contented chewing from below. No music.", "rendu": true}, {"id": "EP034", "n": 34, "s": 2, "t": "Le bouchon rebelle", "mod": "Configuration", "ch": "process", "sur": false, "url": "https://drive.google.com/drive/folders/19xTrrkXtWO3yfJqtC3SIlDgpBjSEc4N9", "hook": "Chaque service, une improvisation.", "punch": "Ça marche. Jusqu'au jour où ça ne marche plus.", "heygen": "Tes procédures sont dans l'outil, pas dans ta tête. Le service ne dépend plus de qui est là ce soir.", "hf": "Vertical 9:16, 10 seconds, photorealistic, cinematic medium shot, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A waiter presents a bottle of wine tableside and works the corkscrew with growing effort, bracing the bottle against his hip. At 5 seconds the cork releases explosively and rockets upward out of frame; he keeps the polite smile. Final 2 seconds: a distant clink off-screen, the cork drops back down and lands in a guest's empty glass. The waiter nods once as if it was intentional. Audio: restaurant ambience, corkscrew creaking, a loud pop, a whoosh upward, a small ceiling tap, a glass clink, one guest laugh. No music.", "rendu": false}, {"id": "EP035", "n": 35, "s": 2, "t": "Le parasol fugitif", "mod": "PrediBot", "ch": "1 - LIRE SES PRÉVISIONS", "sur": true, "url": "https://drive.google.com/drive/folders/19KbPaohx3zwWwsG4Ud3KfJU9WlqeqIoE", "hook": "Ta terrasse, un jour de vent.", "punch": "Certaines choses se prévoient.", "heygen": "Prévisions de fréquentation, météo, événements du quartier : PrediBot te dit à quoi ressemble ton service avant qu'il commence.", "hf": "Vertical 9:16, 10 seconds, photorealistic, windy daylight, handheld chase, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A gust of wind lifts a large terrace parasol out of its base. A restaurant owner in an apron sprints after it down the pavement as it rolls and bounces ahead of him, always just out of reach. At 5 seconds he dives for it and misses. Final 2 seconds: he lies on the pavement, watching the parasol wedge itself politely into a bike rack twenty metres away. Audio: strong wind, fabric snapping, running footsteps, a scrape of metal on concrete, heavy breathing, a metallic clang on landing. No music.", "rendu": false}, {"id": "EP036", "n": 36, "s": 2, "t": "L'addition", "mod": "PrediBot", "ch": "2 - MARKETPLACE DE PROMPTS", "sur": true, "url": "https://drive.google.com/drive/folders/1RYZ8XwLFAfblkQTaotx4OBWbeGn9FHzR", "hook": "Toi, devant tes abonnements.", "punch": "Additionne-les. Vraiment.", "heygen": "Additionne tes abonnements actuels. Ici, la caisse, le stock, le planning, la compta et le marketing sont dans le même outil, sur la même base.", "hf": "Vertical 9:16, 10 seconds, photorealistic, moody restaurant lighting, slow push-in, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A man opens a leather bill folder at a restaurant table. He reads. He blinks. He removes his glasses, cleans them slowly on his napkin, puts them back on and reads again. Final 2 seconds: he closes the folder very gently, as if it were fragile, and stares into the middle distance. Audio: quiet restaurant ambience, leather creaking, a napkin rustle, one long slow exhale, distant glassware. No music.", "rendu": false}, {"id": "EP037", "n": 37, "s": 2, "t": "Le dormeur debout", "mod": "Équipe & Planning", "ch": "6-Planning par employé ou par poste", "sur": true, "url": "https://drive.google.com/drive/folders/1sLZB_zcuk_uL3BpFvj63LdU2W_7oKU-X", "hook": "Fermeture. Troisième soir d'affilée.", "punch": "Un planning bien fait, ça se voit sur les visages.", "heygen": "Tu construis le planning de la semaine par glisser-déposer, avec le coût qui s'affiche en direct. Tes équipes savent, et toi aussi.", "hf": "Vertical 9:16, 10 seconds, photorealistic, static wide, late-night restaurant, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Closing time in an empty dining room, chairs on tables. A young employee stands leaning on a broom handle, completely asleep upright, swaying very slightly. At 5 seconds the broom slips a few centimetres; he jolts awake, sweeps three energetic strokes, then goes still again. Final ot in slow motion and lands squarely in a bowl of soup, sending an orange splash upward across the table. Final 2 seconds: total stillness, soup dripping off the edge of the table, everyone frozen mid-gesture, one child's face appearing at the terrace railing. Audio: terrace ambience, a distant kick, a whooshing arc, a wet heavy splash, dripping, then complete silence. No music.", "rendu": false}, {"id": "EP040", "n": 40, "s": 2, "t": "La chèvre au potager", "mod": "StockVision", "ch": "17- Stock - Ajouter et modifier un mouvement", "sur": true, "url": "https://drive.google.com/drive/folders/1TEPT2xy-s0P_l3ghbupKLWuPa4J6DVra", "hook": "Ton stock de basilic.", "punch": "Ce qui n'est pas compté disparaît toujours.", "heygen": "Tu comptes une fois, l'outil compte ensuite. Chaque sortie d'ingrédient est déduite de ton stock, plat par plat.", "hf": "Vertical 9:16, 10 seconds, photorealistic, golden hour, garden setting, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A small restaurant herb garden in neat labelled rows. A goat wanders calmly into frame and begins eating an entire row of basil with great efficiency. At 5 seconds a chef appears at the back door and freezes. Final 2 seconds: the goat looks up, a wooden plant label sticking out of its mouth, chewing without breaking eye contact. Audio: birdsong, gentle chewing, a wooden door creak, a sharp human intake of breath, one goat bleat. No music.", "rendu": false}, {"id": "EP041", "n": 41, "s": 2, "t": "Le poulet fugueur", "mod": "StockVision", "ch": "15- Production - Sortie des ingrédients", "sur": true, "url": "https://drive.google.com/drive/folders/1R39Whn8WiAr8zxH7Yb1Ive7L2FMxYvvx", "hook": "Ton contrôle des portions.", "punch": "Ce qui part au sol, tu le paies quand même.", "heygen": "La production sort exactement les quantités prévues de ton stock. Ce qui tombe au sol, tu le vois dans l'écart. Et ce qui se voit se corrige.", "hf": "Vertical 9:16, 10 seconds, photorealistic, kitchen close-up on a carving board, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef carves a glistening roast chicken with a long knife. On the third stroke the whole bird slides off the board in slow motion, skates across the stainless counter and drops off the far edge. Final 2 seconds: the chef is still holding the knife exactly where the chicken used to be, not yet looking down. Audio: knife on bone, a greasy slide across metal, a soft floor thud, kitchen extractor hum, one beat of silence. No music.", "rendu": false}, {"id": "EP042", "n": 42, "s": 2, "t": "La nappe et le vent", "mod": "Marketing", "ch": "21 - MCP RAPIDOCMS + IRIS", "sur": true, "url": "https://drive.google.com/drive/folders/151n4TXZAZrkPpDC_FBJrSw-6eto3l8al", "hook": "Tout faire seul.", "punch": "À un moment, il faut être aidé.", "heygen": "Tu n'as pas à tout faire seul. Iris prépare tes contenus, PrediBot surveille tes chiffres, tu gardes la validation.", "hf": "Vertical 9:16, 10 seconds, photorealistic, windy outdoor terrace, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A waiter tries to fold a huge white tablecloth alone in the wind. Each time he brings two corners together, a gust inflates the cloth like a sail and wraps it around him. At 5 seconds he disappears completely inside the fabric. Final 2 seconds: a person-shaped white ghost stands motionless on the terrace, one hand emerging to give a thumbs up. Audio: wind gusts, fabric snapping loudly, muffled human grunting from inside the cloth, a chair scraping. No music.", "rendu": false}, {"id": "EP043", "n": 43, "s": 2, "t": "L'écureuil et le croissant", "mod": "Caisse POS", "ch": "4 - APPLIQUER UNE REMISE ET AVOIRS", "sur": true, "url": "https://drive.google.com/drive/folders/18GcdgyGAX_u3kEzXatVqew0t9VvTFqAQ", "hook": "Petit vol. Tous les jours.", "punch": "Mis bout à bout, ça fait ta marge.", "heygen": "Chaque remise et chaque avoir est tracé, avec qui l'a fait et pourquoi. Les petits gestes ne mangent plus ta marge en silence.", "hf": "Vertical 9:16, 10 seconds, photorealistic, morning park-side café, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A croissant sits on a small saucer beside a coffee on an outdoor café table. A squirrel climbs the table leg, assesses the croissant, and takes it with both paws — it is almost as big as the squirrel. At 5 seconds it drags the croissant off the table and struggles up a nearby tree trunk with it. Final 2 seconds: the squirrel on a branch, croissant held triumphantly, flakes raining down. Audio: morning birdsong, a ceramic saucer tick, tiny claws on wood and bark, a bakery-flake rustle, a distant espresso machine. No music.", "rendu": false}, {"id": "EP044", "n": 44, "s": 2, "t": "Les six stylos", "mod": "Réservation", "ch": "5 - COMMANDER PAR QR CODE", "sur": true, "url": "https://drive.google.com/drive/folders/1z8q4btyT2yAqNIenhuvwtssyCvK2Qk9S", "hook": "Prendre la commande en 2026.", "punch": "La commande devrait partir en cuisine toute seule.", "heygen": "Le client scanne, commande, la cuisine reçoit. Ton serveur passe son temps en salle, pas à recopier des lignes sur un carnet.", "hf": "Vertical 9:16, 10 seconds, photorealistic, over-the-shoulder at a dining table, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A waiter stands at a table with a notepad, ready to take an order. His pen does not write. He shakes it, scribbles, tries another from his apron, then another, then another, scribbling harder each time on the corner of the pad. At 5 seconds he has five dead pens lined up on the table. Final 2 seconds: he pulls out a sixth, it works, and the guests have already put their menus down and are looking at him. Audio: restaurant ambience, pen scribbling on paper, plastic pens clicking and tapping the table, one polite guest cough. No music.", "rendu": false}, {"id": "EP045", "n": 45, "s": 2, "t": "La chambre froide", "mod": "StockVision", "ch": "18- Statistiques par module", "sur": true, "url": "https://drive.google.com/drive/folders/1e7LZCLhyA2ANmednWevCt7-AreosC4Yw", "hook": "Personne ne sait où tu es.", "punch": "Ton restaurant non plus ne devrait pas être une boîte noire.", "heygen": "Ton restaurant arrête d'être une boîte noire : ventes, marges, fréquentation, stock, module par module, sur la période que tu choisis.", "hf": "Vertical 9:16, 10 seconds, photorealistic, cold blue interior light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Interior of a walk-in cold room. A cook is checking shelves when the heavy insulated door swings slowly shut behind him. He turns, pushes the handle, nothing. At 5 seconds he knocks politely, then harder, breath visible in the cold air. Final 2 seconds: he sits down on an upturned crate, resigned, and starts eating a cherry tomato from the shelf. Audio: refrigeration unit droning, a heavy door thud and latch click, knuckles on metal, breathing in cold air, a small crunch. No music.", "rendu": false}, {"id": "EP046", "n": 46, "s": 2, "t": "Le sel", "mod": "StockVision", "ch": "20- Statistiques - Agent IA et suggestions", "sur": true, "url": "https://drive.google.com/drive/folders/1QJDmtxJcqBCKRegKngmvvxAD_4q_8V57", "hook": "Un détail. Un service perdu.", "punch": "Les petites erreurs coûtent cher quand personne ne les voit.", "heygen": "L'IA remonte ce que tu n'as pas le temps de voir : un coût qui monte, un plat qui décroche, un stock qui dort. Le petit détail devient visible.", "hf": "Vertical 9:16, 10 seconds, photorealistic, extreme slow-motion macro, dramatic side light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Macro slow motion of a hand seasoning a pan with a pinch of salt, grains falling in a beautiful arc. The shot widens slightly: the lid of the salt cellar has come off entirely and the whole contents are pouring into the pan in the same slow, elegant arc. Final 2 seconds: the empty cellar, a white mound in the pan, and a hand frozen mid-gesture. Audio: gentle sizzling, a delicate granular patter that becomes a heavy pour, a hollow plastic clatter as the lid lands, then sizzling alone. No music.", "rendu": false}, {"id": "EP047", "n": 47, "s": 2, "t": "Le camion dans la ruelle", "mod": "HACCP", "ch": "25-Contrôle à réception", "sur": true, "url": "https://drive.google.com/drive/folders/1gZmtvcVR5A6PnBuwf01gFFDioWJ5EQ_V", "hook": "La livraison de 7 h.", "punch": "Réceptionner, contrôler, tracer. Sans y penser.", "heygen": "À la livraison, tu contrôles la température, tu prends la photo, c'est tracé. Sept heures du matin, et ta conformité est déjà faite.", "hf": "Vertical 9:16, 10 seconds, photorealistic, high-angle then street level, narrow European alley, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A delivery truck reverses into an alley barely wider than itself, mirrors folding against the walls. A cook stands behind it waving both arms with increasing energy and decreasing accuracy. At 5 seconds the truck stops with the bumper one centimetre from a stack of crates. Final 2 seconds: the cook gives an enthusiastic double thumbs up; the driver's arm emerges from the window with a single flat thumbs up. Audio: diesel engine, reversing beeper, tyre scrub on cobbles, a shouted French \"Encore ! Encore ! Stop !\", a hiss of air brakes. No music.", "rendu": false}, {"id": "EP048", "n": 48, "s": 2, "t": "La pyramide de sucre", "mod": "Configuration", "ch": "1 - Monter votre boutique", "sur": true, "url": "https://drive.google.com/drive/folders/1xCJAtFHgNO8DwcZ_Im4VgV_EqX0yV0Vf", "hook": "Ce que tu construis chaque jour.", "punch": "Un système fragile finit toujours par tomber.", "heygen": "Tu poses ta base une fois : établissement, TVA, zones, équipements. Tout le reste de FoodEatUp s'appuie dessus sans que tu y reviennes.", "hf": "Vertical 9:16, 10 seconds, photorealistic, café table close-up, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A child builds a tall precarious pyramid out of sugar sachets on a café table while the adults talk off-frame. The camera pushes in slowly as the structure grows to an improbable height. At 6 seconds an adult's elbow enters frame and clips it; the pyramid collapses in slow motion. Final 2 seconds: the child looks at the camera with genuine devastation, one sachet still balanced on a finger. Audio: café ambience, tiny paper sachets sliding, a soft cardboard collapse, one small disappointed sigh, a spoon in a cup. No music.", "rendu": false}, {"id": "EP049", "n": 49, "s": 2, "t": "Le chien du pass", "mod": "HACCP", "ch": "3-Enregistrer une température", "sur": true, "url": "https://drive.google.com/drive/folders/1ohzkWaC6hB6wEa2ow1gOtoLWz_zjd5_O", "hook": "Il envoie plus vite que ton pass.", "punch": "Un KDS, et la cuisine avance toute seule.", "heygen": "Tu relèves tes frigos depuis ton téléphone. La mesure est datée, signée, archivée. Un contrôle, et tu sors trois mois d'historique en un clic.", "hf": "Vertical 9:16, 10 seconds, photorealistic, kitchen pass, warm service light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A dog sits at the kitchen pass, exactly where a chef would stand, front paws on the counter. It looks at a plate, then raises one paw and rings the service bell decisively. A waiter appears, takes the plate, and leaves. At 5 seconds the dog rings the bell twice more, faster. Final 2 seconds: it stares down the empty pass, waiting for the next plate, entirely professional. Audio: kitchen ambience, a crisp service bell ding, hurried footsteps, plates, two more bell dings, one impatient dog huff. No music.", "rendu": false}, {"id": "EP050", "n": 50, "s": 2, "t": "La casserole brûlante", "mod": "HACCP", "ch": "2-Ajouter un équipement", "sur": true, "url": "https://drive.google.com/drive/folders/1WQDVmCZUct__2ovbFBELmewN_Vp-GkHw", "hook": "Apprendre sur le tas.", "punch": "Il y a plus rapide pour former quelqu'un.", "heygen": "Chaque frigo, chaque chambre froide est déclaré avec ses seuils. Hors zone, tu es alerté. Tu sauves la marchandise avant de la jeter.", "hf": "Vertical 9:16, 10 seconds, photorealistic, handheld kitchen, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A cook grabs a pan handle bare-handed, instantly regrets it, and juggles the pan between his hands in a rapid improvised dance while trying not to spill the contents. At 5 seconds he manages to drop it onto the counter, upright, without losing a single thing inside. Final 2 seconds: he stands very still, both hands pressed against his own earlobes, staring at the pan. Audio: sizzling, a sharp metallic clang, fast shuffling feet, a sucked-in French \"Ah ah ah !\", a heavy pan settling on steel. No music.", "rendu": false}, {"id": "EP051", "n": 51, "s": 2, "t": "La mousse", "mod": "HACCP", "ch": "15-Créer les étiquettes de production", "sur": true, "url": "https://drive.google.com/drive/folders/1LP5M_d-WFsTZCb1ddBTNlTGfUQhEzO76", "hook": "Un mauvais réglage. Une seule fois.", "punch": "Les process, ça évite ça.", "heygen": "Étiquette produite, date de fabrication, DLC calculée. Ton bac étiqueté n'est plus un pari.", "hf": "Vertical 9:16, 10 seconds, photorealistic, dishwashing area, cool light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A commercial dishwasher hums. A slow column of white foam begins to rise from its seams, then from underneath, spreading across the floor. A kitchen porter watches it approach his shoes without moving. At 6 seconds the foam reaches his knees. Final 2 seconds: only his head and shoulders are visible above a sea of foam; he blows a small tuft off his nose. Audio: dishwasher hum, wet bubbling and hissing foam, squeaking rubber boots, a single blown puff of air. No music.", "rendu": false}, {"id": "EP052", "n": 52, "s": 2, "t": "Le tablier coincé", "mod": "HACCP", "ch": "8-Traçabilité complète", "sur": true, "url": "https://drive.google.com/drive/folders/1KjJgNDZmrf1NR_6aihWwN9Q77UaHp2Yk", "hook": "Encore un truc qui te retient.", "punch": "Enlève-les tous, un par un.", "heygen": "Chaque lot reçu est rattaché à ce que tu produis. En cas de rappel, tu remontes la chaîne en quelques secondes.", "hf": "Vertical 9:16, 10 seconds, photorealistic, kitchen corridor, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef strides purposefully out of the kitchen carrying two plates. His apron string catches in the swinging door behind him. He is yanked to a dead stop mid-stride, plates still perfectly level. At 5 seconds he calmly reverses two steps, unhooks the string without putting the plates down, and continues. Final 2 seconds: he walks off, dignity fully intact, as the door swings behind him. Audio: kitchen ambience, brisk footsteps, a fabric snap and door creak, one abrupt stop, then footsteps resuming at the exact same rhythm. No music.", "rendu": false}, {"id": "EP053", "n": 53, "s": 2, "t": "La file et la salle vide", "mod": "HACCP", "ch": "25-Contrôle à réception", "sur": true, "url": "https://drive.google.com/drive/folders/1gZmtvcVR5A6PnBuwf01gFFDioWJ5EQ_V", "hook": "Complet dehors. Vide dedans.", "punch": "Ta salle et ta file devraient se parler.", "heygen": "Contrôle à réception : température, aspect, quantité, non-conformités. Tout part dans le dossier HACCP tout seul.", "hf": "Vertical 9:16, 10 seconds, photorealistic, street level then interior, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A long queue of people waits patiently outside a restaurant door on the pavement. The camera moves past them, through the doorway, and reveals a completely empty dining room with every table free and one waiter standing alone. At 6 seconds the waiter notices the camera and shrugs. Final 2 seconds: back outside, the queue has grown by three people. Audio: street ambience, murmuring queue, a door chime on entry, sudden interior quiet with a faint fridge hum, one shrugging exhale. No music.", "rendu": false}, {"id": "EP054", "n": 54, "s": 2, "t": "Le pois", "mod": "HACCP", "ch": "11-Éditer le plan de nettoyage", "sur": true, "url": "https://drive.google.com/drive/folders/19-6NubgRphdSbQ3C2HNN3KmWavmfKUvO", "hook": "Ton prix ne raconte pas ton coût.", "punch": "Marge réelle par plat. Ça change les décisions.", "heygen": "Tes zones et tes postes de nettoyage sont listés. Qui a fait quoi, quand, c'est enregistré. Le plan de nettoyage vit vraiment.", "hf": "Vertical 9:16, 10 seconds, photorealistic, fine-dining table, dramatic spotlight, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A waiter places a large silver cloche in front of a hungry-looking guest and lifts it with a theatrical flourish. Steam curls upward. In the centre of an enormous white plate sits one single pea, immaculately placed. At 6 seconds the guest looks up at the waiter, who nods proudly. Final 2 seconds: the guest looks back at the pea, then at the camera. Audio: refined dining ambience, a soft cloche lift and metallic ring, a delicate steam hiss, a long silence, one quiet stomach rumble. No music.", "rendu": false}, {"id": "EP055", "n": 55, "s": 2, "t": "Le ventilateur", "mod": "HACCP", "ch": "22-Créer une check-list hygiène", "sur": true, "url": "https://drive.google.com/drive/folders/15CwOKunwpcys81_j-rwf0W2bLfghvsXv", "hook": "Ta compta, au format papier.", "punch": "Scanne. Classe. Oublie.", "heygen": "Tu crées ta checklist une fois, l'équipe la valide chaque jour. Ce qui est coché est daté et signé.", "hf": "Vertical 9:16, 10 seconds, photorealistic, back office, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A manager sits at a paper-covered desk in a hot back office and switches on a floor fan for relief. He closes his eyes with pleasure for two seconds. At 5 seconds every invoice, ticket and delivery note on the desk lifts into the air at once and swirls around the room in slow motion. Final 2 seconds: the room is full of drifting paper; he has not opened his eyes, still enjoying the breeze. Audio: fan motor spinning up, a hot room's stillness, an escalating paper flutter, sheets slapping walls, one contented sigh. No music.", "rendu": false}, {"id": "EP056", "n": 56, "s": 2, "t": "Le passager clandestin", "mod": "HACCP", "ch": "1-Accueil et Historique", "sur": true, "url": "https://drive.google.com/drive/folders/14eutFL8vuT8ImEadyltp1UBs15KWmEZ_", "hook": "Il y a toujours un truc en trop.", "punch": "Ou en moins. Et tu le vois trop tard.", "heygen": "Tes relevés, tes réceptions et tes validations sont conservés. Le jour du contrôle, tu ne cherches rien.", "hf": "Vertical 9:16, 10 seconds, photorealistic, street level, delivery scene, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A delivery rider unzips a large insulated backpack on the pavement to check an order. A cat's head pops out from between the food bags, blinking in the daylight. The rider stares. At 5 seconds the cat settles back down comfortably among the bags. Final 2 seconds: the rider slowly zips the bag half-closed, leaving the cat's head out, and rides off. Audio: street ambience, a zip opening, a single questioning meow, a long human pause, purring, a scooter starting up. No music.", "rendu": false}, {"id": "EP057", "n": 57, "s": 2, "t": "Les pièces", "mod": "HACCP", "ch": "3-Enregistrer une température", "sur": true, "url": "https://drive.google.com/drive/folders/1ohzkWaC6hB6wEa2ow1gOtoLWz_zjd5_O", "hook": "La clôture de caisse.", "punch": "Un Z propre, en une minute.", "heygen": "Une température hors seuil déclenche une alerte immédiate. Tu réagis pendant le service, pas le lendemain.", "hf": "Vertical 9:16, 10 seconds, photorealistic, close-up at a bar counter at night, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A manager counts coins into stacks on a bar counter, tongue between teeth, deeply focused. He reaches for the last stack and knocks the whole arrangement over. Coins spread across the counter and cascade off the edge in slow motion, rolling in every direction across the floor. Final 2 seconds: one coin rolls a long way alone, wobbles, and settles flat. Audio: quiet closed bar, coins clinking into stacks, a sudden metallic cascade, coins rolling and spinning on tiles, a final wobble and flat clack. No music.", "rendu": false}, {"id": "EP058", "n": 58, "s": 2, "t": "Les bougies", "mod": "HACCP", "ch": "Rôles", "sur": false, "url": "https://drive.google.com/drive/folders/10rqzHFjXbjkGi73uJyjt3XQM92eaIMK_", "hook": "L'anniversaire de la table 12.", "punch": "Anticiper, c'est aussi ça, le service.", "heygen": "Chaque agent signe ses propres relevés. La responsabilité est claire, sans paperasse supplémentaire.", "hf": "Vertical 9:16, 10 seconds, photorealistic, dim restaurant, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A waiter carries a birthday cake crowned with far too many sparkling candles through a darkened dining room, guests turning to look. At 5 seconds a ceiling smoke detector begins flashing directly above him. Final 2 seconds: the sprinkler has not gone off, but every guest is looking up at the ceiling instead of the cake, and the waiter closes his eyes. Audio: murmured happy-birthday singing, crackling sparklers, a shrill smoke alarm cutting through everything, chairs scraping, then the alarm alone. No music.", "rendu": false}, {"id": "EP059", "n": 59, "s": 2, "t": "L'ardoise", "mod": "HACCP", "ch": "23-Contrôles de conformité", "sur": true, "url": "https://drive.google.com/drive/folders/14aDxJMZU_ZnneMXrv0ucr2B1cpKJnAWl", "hook": "Ta com', chaque matin.", "punch": "Il y a plus solide qu'une ardoise.", "heygen": "Tu déclares une non-conformité, tu notes l'action corrective. C'est exactement ce qu'on te demandera de prouver.", "hf": "Vertical 9:16, 10 seconds, photorealistic, windy pavement outside a bistro, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurant owner sets a wooden A-frame chalkboard sign on the pavement. The wind knocks it flat immediately. He stands it up again, angles it differently — it falls again. At 5 seconds he props it with a stone, steps back to admire it, and it falls a third time. Final 2 seconds: he sits down on the kerb next to the fallen sign and simply holds it upright with one hand. Audio: gusty wind, wood clattering on pavement, chalk scraping, a resigned French \"Bon.\", street traffic. No music.", "rendu": false}, {"id": "EP060", "n": 60, "s": 2, "t": "Le poulpe multitâche", "mod": "HACCP", "ch": "25-Contrôle à réception", "sur": true, "url": "https://drive.google.com/drive/folders/1gZmtvcVR5A6PnBuwf01gFFDioWJ5EQ_V", "hook": "Ce qu'on te demande d'être.", "punch": "Ou alors, un seul outil fait le reste.", "heygen": "Tu enregistres une mise en congélation avec sa date et sa quantité. Plus de sac sans nom au fond du bac.", "hf": "Vertical 9:16, 10 seconds, photorealistic, surreal but grounded, professional kitchen, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A large octopus sits in a stainless-steel sink in a working kitchen, calmly operating eight things at once with its arms: stirring a pot, flipping a pan, wiping a counter, ringing the service bell, holding a knife, plating, adjusting a burner and answering a wall phone. Human cooks work around it without reacting. Final 2 seconds: it pauses every arm simultaneously and turns one eye toward the camera. Audio: full busy kitchen soundscape layered dense — sizzling, bell, phone ringing, chopping, extractor — then all of it stopping at once for the final beat. No music.", "rendu": false}, {"id": "EP061", "n": 61, "s": 3, "t": "Le badge introuvable", "mod": "HACCP", "ch": "30-Exporter l'historique HACCP", "sur": true, "url": "https://drive.google.com/drive/folders/1zW01WAMfEsT4x62i4D1nwm4BCb3cYM_e", "hook": "Ton système de pointage.", "punch": "Un badge, un QR code, un code PIN. Point.", "heygen": "Tu édites ton dossier de conformité sur la période de ton choix, prêt à présenter.", "hf": "Vertical 9:16, 10 seconds, photorealistic, cinematic handheld camera, shallow depth of field, natural light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. Early morning at a restaurant staff entrance. A young employee taps a supermarket loyalty card against the door reader. Nothing. He tries a metro pass. Nothing. He tries his wrapped sandwich. At 5 seconds the door opens on its own because a colleague pushes it from inside, and he walks in holding the sandwich against the reader. Final 2 seconds: the reader blinks red, alone, as the door closes. Audio: quiet street ambience, three flat error beeps, plastic tapping on a reader, a door hinge, a colleague's mumbled \"Bonjour\", then one last error beep. No music.", "rendu": false}, {"id": "EP062", "n": 62, "s": 3, "t": "La photo de pointage", "mod": "HACCP", "ch": "Routine du jour", "sur": false, "url": "https://drive.google.com/drive/folders/10rqzHFjXbjkGi73uJyjt3XQM92eaIMK_", "hook": "Je te jure, j'étais là à 8 h.", "punch": "Photo, heure, poste. Le débat est clos.", "heygen": "La conformité devient une routine de deux minutes par service, au lieu d'un dimanche de rattrapage.", "hf": "Vertical 9:16, 10 seconds, photorealistic, front-on framing as if from a tablet camera, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. An employee stands in front of a wall-mounted tablet at the staff entrance, taking his clock-in photo. He tries a neutral face, then a serious face, then a slight smile, then a full grin, adjusting his hair between each. At 5 seconds he settles on an intensely dramatic, chin-lifted expression. Final 2 seconds: he holds it perfectly still, absolutely committed. Audio: staff room ambience, a soft camera shutter repeated five times, fabric rustling, one satisfied exhale. No music.", "rendu": false}, {"id": "EP063", "n": 63, "s": 3, "t": "Le post-it perdu", "mod": "Équipe & Planning", "ch": "4-Horaires d'un employé", "sur": true, "url": "https://drive.google.com/drive/folders/1LH1Yc5W_TjOZlRh3yalK5FGLesAKKNA4", "hook": "Ta demande de congé.", "punch": "Demandée, reçue, validée. Sans papier.", "heygen": "Tu crées ta fiche employé avec son rôle et ses horaires. Elle alimente le planning, les pointages et la paie.", "hf": "Vertical 9:16, 10 seconds, photorealistic, office corridor, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. An employee writes carefully on a yellow sticky note, presses it firmly onto the manager's office door, and walks away satisfied. The camera stays on the door. At 5 seconds the note peels off in slow motion, drifts sideways and slides down the gap behind a radiator. Final 2 seconds: the empty door, one corner of yellow just visible behind the radiator grille. Audio: corridor ambience, pen on paper, a sticky note pressed to wood, footsteps leaving, a faint paper slide, a metallic radiator tick. No music.", "rendu": false}, {"id": "EP064", "n": 64, "s": 3, "t": "Le planning au marqueur", "mod": "Équipe & Planning", "ch": "16-Planning et tâches de l'employé", "sur": true, "url": "https://drive.google.com/drive/folders/1IRoEhrDK6gE4PqPwSDmhXOP7XjjFi6xq", "hook": "Le planning de la semaine.", "punch": "Par employé ou par poste. Imprimable. À jour.", "heygen": "Le planning se construit en glisser-déposer, avec le coût de la semaine qui s'affiche pendant que tu poses les shifts.", "hf": "Vertical 9:16, 10 seconds, photorealistic, staff room, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A whiteboard weekly rota covered in layers of crossings-out, arrows, magnets and three different marker colours. A manager studies it, then adds a strip of masking tape over one section and writes a new name on the tape. At 5 seconds a magnet gives way and half the paper slips sideways. Final 2 seconds: he presses it back with one finger and holds it there, looking at the camera. Audio: staff room ambience, squeaky marker on whiteboard, tape tearing, a magnet clattering to the floor, one long exhale. No music.", "rendu": false}, {"id": "EP065", "n": 65, "s": 3, "t": "Le stagiaire au bureau", "mod": "Équipe & Planning", "ch": "12-Historique des pointages", "sur": true, "url": "https://drive.google.com/drive/folders/165Pq4ZXw8IGWVge3kACbiiLJ162oDYij", "hook": "Qui a accès à quoi ?", "punch": "Chaque rôle voit exactement ce qu'il doit voir.", "heygen": "Les heures réelles sont pointées. Tu compares le prévu et le réalisé, sans discussion de fin de mois.", "hf": "Vertical 9:16, 10 seconds, photorealistic, back office, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A very young intern sits in the manager's oversized leather chair, feet up on the desk, slowly spinning, holding the manager's coffee mug. He opens a drawer, looks inside, nods approvingly. At 5 seconds the office door opens off-frame; he freezes mid-spin, feet still on the desk. Final 2 seconds: he is standing perfectly straight beside the chair, mug behind his back. Audio: office ambience, a chair spinning and creaking, a drawer sliding, a door handle turning, an abrupt scramble, then silence. No music.", "rendu": false}, {"id": "EP066", "n": 66, "s": 3, "t": "Le grille-pain qui ne répond pas", "mod": "Équipe & Planning", "ch": "17-Demande d'absence ou de congé", "sur": true, "url": "https://drive.google.com/drive/folders/1Y_WxNxLa301L_2rhVS2zjpi2CqqrS5iw", "hook": "Ta cuisine n'a personne à qui parler.", "punch": "Jarvis répond, lui. Et il note.", "heygen": "Une demande de congé arrive, tu valides ou tu refuses depuis l'écran. Le planning se met à jour tout seul.", "hf": "Vertical 9:16, 10 seconds, photorealistic, professional kitchen, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A cook, hands covered in flour, leans toward a stainless-steel toaster on the counter and speaks to it clearly, waiting for an answer. Nothing. He speaks again, louder, more articulately. At 5 seconds the toaster ejects two slices of toast violently. He takes this as a response and nods. Final 2 seconds: he goes back to work, satisfied, having received his answer. Audio: kitchen ambience, a muffled human question, a pause, a second louder question, a metallic toaster spring-pop, one accepting \"Ah, d'accord.\" No music.", "rendu": false}, {"id": "EP067", "n": 67, "s": 3, "t": "Le thermomètre humain", "mod": "Équipe & Planning", "ch": "3-Salaire et contrat", "sur": true, "url": "https://drive.google.com/drive/folders/1KduEmNhweEXZBv2CJ6nUr6rwNnkx3k6F", "hook": "Ton relevé de température.", "punch": "Un vrai relevé, horodaté, par équipement.", "heygen": "Contrats et documents employés sont rangés au même endroit, avec leurs échéances.", "hf": "Vertical 9:16, 10 seconds, photorealistic, kitchen fridge close-up, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef opens a fridge door, holds his bare hand inside for exactly two seconds, withdraws it, and gives a confident single nod as if a precise measurement has been taken. He writes nothing down. At 5 seconds he repeats the procedure on the freezer, this time with two fingers, and nods even more confidently. Final 2 seconds: he closes the door and walks away, hands in pockets, entirely satisfied with his data collection. Audio: fridge seal opening and closing, compressor hum, kitchen ambience, one decisive \"Hm.\" repeated twice. No music.", "rendu": false}, {"id": "EP068", "n": 68, "s": 3, "t": "Le second avis", "mod": "Équipe & Planning", "ch": "6-Planning par employé ou par poste", "sur": true, "url": "https://drive.google.com/drive/folders/1sLZB_zcuk_uL3BpFvj63LdU2W_7oKU-X", "hook": "Le test scientifique du nez.", "punch": "Une étiquette DLC, et plus personne ne renifle.", "heygen": "Ton coût de personnel s'affiche en face de ton chiffre d'affaires prévu. Tu ajustes avant, pas après.", "hf": "Vertical 9:16, 10 seconds, photorealistic, kitchen close-up, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A cook opens a large tub of cream and sniffs it long and deeply, eyes narrowed in genuine scientific concentration. He sniffs again. Uncertain, he holds it out toward a colleague. The colleague sniffs, makes exactly the same face, and hands it back without a word. At 5 seconds a third cook enters frame, sniffs, and shrugs. Final 2 seconds: all three stand in a small circle staring at the tub, nobody deciding. Audio: kitchen ambience, deep deliberate sniffing, plastic lid flexing, a noncommittal grunt, a shrug of fabric, silence. No music.", "rendu": false}, {"id": "EP069", "n": 69, "s": 3, "t": "Le livreur fantôme", "mod": "Équipe & Planning", "ch": "Recrutement", "sur": false, "url": "https://drive.google.com/drive/folders/1wboT7bVjEwxbhpU9Xgz8sRjjqn9XEd7X", "hook": "Tu as vérifié la livraison ?", "punch": "Température, DLC, code EAN. En scannant.", "heygen": "Tu publies ton offre, tu suis les candidatures par statut, tu décides. Le recrutement arrête de traîner sur ton téléphone.", "hf": "Vertical 9:16, 10 seconds, photorealistic, restaurant back door, morning, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A delivery driver stacks fifteen boxes and crates against the back door with impressive speed, drops a crumpled delivery note on top, and is already jogging back to his van before anyone appears. At 5 seconds the kitchen door opens and a cook steps out holding a pen, looking at an empty street. Final 2 seconds: the van pulls away in the background; the cook looks down at the tower of unchecked boxes. Audio: crates thudding on concrete, fast footsteps, a van door sliding shut, an engine pulling away, a kitchen door creak, then street quiet. No music.", "rendu": false}, {"id": "EP070", "n": 70, "s": 3, "t": "La dalle propre", "mod": "Équipe & Planning", "ch": "2-Configuration des employés", "sur": true, "url": "https://drive.google.com/drive/folders/1GYwVOPg4veg-cFhZh_rxhvWmwOFy_4mB", "hook": "C'est fait.", "punch": "Photo analysée par l'IA. Rapport objectif.", "heygen": "Le nouveau arrive avec son accès, son planning et ses vidéos de formation. Jour un, il est utile.", "hf": "Vertical 9:16, 10 seconds, photorealistic, high angle then low angle, kitchen floor, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. An employee mops a single floor tile with extraordinary dedication, back and forth, until it gleams. The camera pulls back slowly to reveal the entire rest of the kitchen floor untouched and grimy. At 6 seconds he steps back to admire his one perfect tile, hands on hips. Final 2 seconds: he takes a photo of that single tile with his phone. Audio: kitchen ambience, wet mop strokes on tile, a bucket handle clank, a phone camera shutter, one proud sigh. No music.", "rendu": false}, {"id": "EP071", "n": 71, "s": 3, "t": "La liste à l'envers", "mod": "Équipe & Planning", "ch": "6-Planning par employé ou par poste", "sur": true, "url": "https://drive.google.com/drive/folders/1sLZB_zcuk_uL3BpFvj63LdU2W_7oKU-X", "hook": "La check-list du soir.", "punch": "Cochée, horodatée, signée par qui l'a faite.", "heygen": "Tu affectes tes équipes par poste et par zone. Chacun sait où il est attendu ce soir.", "hf": "Vertical 9:16, 10 seconds, photorealistic, kitchen corridor, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A cook ticks boxes on a paper checklist at high speed without ever looking at the sheet, walking down a corridor. Tick, tick, tick, tick. At 5 seconds he reaches the end, signs it with a flourish, and pins it to the wall. Final 2 seconds: the camera holds on the sheet, which is pinned completely upside down. Audio: brisk footsteps, rapid pen ticking on paper, a satisfied hum, a pin pushing into a corkboard, then corridor quiet. No music.", "rendu": false}, {"id": "EP072", "n": 72, "s": 3, "t": "Le classeur", "mod": "Équipe & Planning", "ch": "17-Demande d'absence ou de congé", "sur": true, "url": "https://drive.google.com/drive/folders/1Y_WxNxLa301L_2rhVS2zjpi2CqqrS5iw", "hook": "Contrôle sanitaire. Ce matin.", "punch": "Tout l'historique HACCP, exporté en un clic.", "heygen": "Une absence, et tu vois immédiatement quel service est découvert. Tu remplaces avant l'ouverture.", "hf": "Vertical 9:16, 10 seconds, photorealistic, restaurant office, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A health inspector in a jacket stands waiting with a clipboard. The manager hauls an enormous overstuffed ring binder onto the desk between them. He opens it. At 5 seconds the rings give way and several hundred loose pages fan out across the desk and floor in slow motion. Final 2 seconds: the two men look at each other over a desk covered in paper; the inspector clicks his pen once. Audio: office ambience, a heavy binder thud, metal rings snapping open, a long paper cascade, one pen click, total silence. No music.", "rendu": false}, {"id": "EP073", "n": 73, "s": 3, "t": "Pile ou face", "mod": "Configuration", "ch": "3 - Profil entreprise", "sur": true, "url": "https://drive.google.com/drive/folders/1PVGsQbmoDU3_qmv3NFnx_zSovCNaxWjA", "hook": "Combien tu commandes pour samedi ?", "punch": "Tes ventes le savent. Demande-leur.", "heygen": "Tu paramètres ton établissement une fois : horaires, coordonnées, TVA. Tout FoodEatUp s'appuie dessus.", "hf": "Vertical 9:16, 10 seconds, photorealistic, bakery kitchen at dawn, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef stands in front of empty bread racks holding a coin. He flips it, catches it on the back of his hand, looks at it, and writes a number on an order pad. Unsatisfied, he flips again. At 5 seconds he flips a third time, misses the catch, and the coin rolls under a rack. Final 2 seconds: he writes a number anyway, without the coin. Audio: quiet early-morning kitchen, a coin ringing off a thumb, a slap on skin, pen on paper, a coin rolling on tiles, then silence. No music.", "rendu": false}, {"id": "EP074", "n": 74, "s": 3, "t": "La liste oubliée", "mod": "Configuration", "ch": "7 - Vos catégories", "sur": true, "url": "https://drive.google.com/drive/folders/1l4i6EF6MJikoXuL4vKDglHiwunFS0WT9", "hook": "Tu as oublié la liste.", "punch": "Elle se construit toute seule. Et elle part au fournisseur.", "heygen": "Tes catégories de produits, d'ingrédients et de recettes structurent tout le reste. Cinq minutes qui t'en font gagner cent.", "hf": "Vertical 9:16, 10 seconds, photorealistic, wholesale market aisle, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurateur stands still in the middle of a busy wholesale market aisle, patting every pocket of his jacket, then his trousers, then his jacket again. He looks at his empty hands. At 5 seconds he turns a full slow circle on the spot, trolley beside him, surrounded by produce, remembering nothing. Final 2 seconds: he picks up one random cabbage and looks at it as if it might help. Audio: busy market ambience, forklift beeps, fabric patting, a trolley wheel squeak, one hopeless \"Bon…\", crowd murmur. No music.", "rendu": false}, {"id": "EP075", "n": 75, "s": 3, "t": "La facture dans la poche", "mod": "Configuration", "ch": "4 - Vos taux de TVA", "sur": true, "url": "https://drive.google.com/drive/folders/1lIal8J0XjvMrxQ7a3Hb3eZi93GwH8XsX", "hook": "Ta facture fournisseur.", "punch": "Photographie-la. Les prix se mettent à jour seuls.", "heygen": "Tes taux de TVA sont posés une fois, appliqués partout : caisse, factures, comptabilité.", "hf": "Vertical 9:16, 10 seconds, photorealistic, macro on a stainless counter, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A hand pulls a heavily crumpled paper invoice out of an apron pocket and unfolds it on a counter, smoothing it flat with the side of the hand. The paper is stained with oil and sauce, and one corner is torn away. At 5 seconds the hand rotates it ninety degrees, trying to find a readable angle. Final 2 seconds: the paper slowly re-folds itself back into its crumpled shape on its own. Audio: paper crackling and unfolding, a hand smoothing paper on steel, kitchen ambience, one defeated exhale, a soft paper rustle as it curls back. No music.", "rendu": false}, {"id": "EP076", "n": 76, "s": 3, "t": "Le recomptage", "mod": "Configuration", "ch": "11 - Recettes et étapes", "sur": true, "url": "https://drive.google.com/drive/folders/1Y-vOFdJvRgFuder7nb8GHK2AIlM2es10", "hook": "Ton inventaire du mardi.", "punch": "La production sort les ingrédients du stock. Automatiquement.", "heygen": "Tu dessines ta salle : zones, tables, capacités. Ton plan de salle devient vivant pendant le service.", "hf": "Vertical 9:16, 10 seconds, photorealistic, walk-in fridge, cold light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A chef counts vacuum-packed steaks on a shelf out loud, pointing at each one. He reaches the end, frowns, and starts again from the beginning. Second count gives a different number. He starts a third time, now moving each pack physically to the other side of the shelf as he counts. At 6 seconds a colleague walks past and takes one. Final 2 seconds: the chef finishes his count, satisfied, unaware. Audio: cold room compressor drone, vacuum plastic crinkling, murmured counting in French, footsteps passing, plastic rustle, then counting continuing. No music.", "rendu": false}, {"id": "EP077", "n": 77, "s": 3, "t": "Le devis sur le set de table", "mod": "Configuration", "ch": "Équipements", "sur": false, "url": "https://drive.google.com/drive/folders/19xTrrkXtWO3yfJqtC3SIlDgpBjSEc4N9", "hook": "Ton devis pour le mariage de samedi.", "punch": "Devis, envoi, acceptation, facture. Une seule chaîne.", "heygen": "Tu déclares tes équipements et leurs seuils. Ils remontent ensuite dans ton suivi HACCP.", "hf": "Vertical 9:16, 10 seconds, photorealistic, restaurant table, warm light, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurant owner sits across from a couple planning a wedding. Having no notepad, he writes numbers on a paper placemat, then continues onto a second placemat, then onto a napkin. At 5 seconds he slides all three across the table toward them as a formal proposal. Final 2 seconds: the bride picks up the napkin, turns it over, and finds a coffee ring on the total. Audio: restaurant ambience, pen scratching on textured paper, paper sliding on wood, a polite \"Voilà !\", one uncertain \"Ah.\", cutlery in the background. No music.", "rendu": false}, {"id": "EP078", "n": 78, "s": 3, "t": "La boîte à chaussures", "mod": "Configuration", "ch": "Utilisateurs", "sur": false, "url": "https://drive.google.com/drive/folders/19xTrrkXtWO3yfJqtC3SIlDgpBjSEc4N9", "hook": "Ta comptabilité annuelle.", "punch": "Chaque dépense rattachée à sa livraison. Toute l'année.", "heygen": "Chaque membre de l'équipe a son accès et ses droits. Tout le monde ne voit pas la compta.", "hf": "Vertical 9:16, 10 seconds, photorealistic, accountant's office, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A restaurateur places a shoebox on an accountant's desk and lifts the lid. It is packed to the brim with crumpled receipts and invoices, some folded, some torn. The accountant looks into the box for a long moment without moving. At 5 seconds a single receipt escapes and drifts to the floor. Final 2 seconds: the accountant slowly puts the lid back on and slides the box six centimetres to one side. Audio: quiet office ambience, cardboard lid lifting, dense paper settling, a clock ticking, a single sheet fluttering to the floor, a cardboard slide on wood. No music.", "rendu": false}, {"id": "EP079", "n": 79, "s": 3, "t": "Les quatorze cartes", "mod": "Configuration", "ch": "Import de carte", "sur": false, "url": "https://drive.google.com/drive/folders/19xTrrkXtWO3yfJqtC3SIlDgpBjSEc4N9", "hook": "Ton programme de fidélité.", "punch": "Un compte, tous les canaux, zéro carton.", "heygen": "Tu importes ta carte entière en un appel : catégories, sous-catégories, plats, prix.", "hf": "Vertical 9:16, 10 seconds, photorealistic, café counter close-up, 4K. NO text overlay, NO subtitles, NO watermark, NO logo. A customer at a counter pulls a thick stack of paper loyalty cards from his wallet and fans them out like a poker hand. He searches through them one by one, checking the stamps. Every card is partially stamped; none i
