  :root {

    overflow: hidden;
    background: #000;
    font-family: "Nunito", "Poppins", system-ui, sans-serif;
  }
  .clip { position: absolute; inset: 0; visibility: hidden; }
  video.media-fill, .clip.media-fill img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Sequence-level color grading: sans = 60% desaturated LUT, avec = full color */
  .seq-sans video.media-fill, .seq-sans .media-fill img { filter: saturate(0.4) grayscale(0.35) contrast(0.96); }
  .seq-avec video.media-fill, .seq-avec .media-fill img { filter: none; }
  .seq-neutre video.media-fill, .seq-neutre .media-fill img { filter: none; }

  /* The signature blue wipe: a vertical line sweeping left -> right, revealing color */
  .wipe-sweep {
    position: absolute; inset: 0; z-index: 50; pointer-events: none;
  }
  .wipe-sweep .line {
    position: absolute; top: 0; bottom: 0;
    left: calc(var(--wipe-progress) * 100%);
    width: 6px; margin-left: -3px;
    background: var(--avec-blue);
    box-shadow: 0 0 60px 10px var(--avec-blue), 0 0 120px 30px rgba(30,155,240,0.5);
  }
  .wipe-sweep .veil-left {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: calc(var(--wipe-progress) * 100%);
    background: transparent;
  }
  /* Grey snap (avec -> sans): a hard, sourceless flash line, no glow, no easing */
  .snap-sweep .line { box-shadow: none; background: var(--sans-grey); width: 4px; }

  /* No burned-in text anywhere in the composition: no subtitles, no speaker
     tags, no title card, no on-screen labels. The film plays with sound;
     the .vtt track (generated separately from hero.json) carries the same
     words for accessibility without cluttering the frame. */

  .black-frame { position: absolute; inset: 0; background: #000; z-index: 80; }

  /* Beat A — convergence multi-canal (motion graphic, wordless: icons only) */
  .converge-stage { position: absolute; inset: 0; background: var(--avec-navy); }
  .converge-node {
    position: absolute; width: 120px; height: 120px; border-radius: 24px;
    background: rgba(255,255,255,0.08); border: 2px solid var(--avec-blue);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .converge-node img { width: 60%; height: 60%; object-fit: contain; }
  .converge-node[data-corner="tl"] { top: 10%; left: 10%; }
  .converge-node[data-corner="tr"] { top: 10%; right: 10%; }
  .converge-node[data-corner="bl"] { bottom: 10%; left: 10%; }
  .converge-node[data-corner="br"] { bottom: 10%; right: 10%; }
  .converge-target {
    position: absolute; left: 50%; top: 50%; width: 180px; height: 180px;
    margin-left: -90px; margin-top: -90px; border-radius: 50%;
    background: var(--avec-blue); display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.6);
    box-shadow: 0 0 80px 20px rgba(30,155,240,0.45);
  }
  .converge-target img { width: 55%; height: 55%; object-fit: contain; filter: brightness(0) invert(1); }

  /* Beat D — cascade de notifications (motion graphic, wordless: icon badge only) */
  .iris-stage { position: absolute; inset: 0; background: var(--avec-offwhite); }
  .iris-device {
    position: absolute; width: 260px; height: 160px; border-radius: 18px;
    background: #fff; box-shadow: 0 20px 60px rgba(27,42,65,0.25);
    display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
  }
  .iris-device .toast {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--avec-orange); display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateY(14px) scale(0.7); overflow: hidden;
  }
  .iris-device .toast img { width: 62%; height: 62%; object-fit: contain; filter: brightness(0) invert(1); }
  .iris-device[data-slot="1"] { top: 18%; left: 12%; }
  .iris-device[data-slot="2"] { top: 40%; left: 42%; }
  .iris-device[data-slot="3"] { top: 62%; left: 66%; }

  .triptych { position: absolute; inset: 0; display: flex; }
  .triptych .panel { position: relative; flex: 1; overflow: hidden; }
  .triptych .panel video { width: 100%; height: 100%; object-fit: cover; }
  .triptych .panel::after { content: ""; position: absolute; inset: 0; border-right: 2px solid rgba(255,255,255,0.15); }

  /* Closing card: the logo mark only, no baked-in slogan/CTA text — the
     narratrice speaks the tagline, the site's own CTA carries the click. */
  .cta-card { position: absolute; inset: 0; background: var(--avec-navy); display: flex; align-items: center; justify-content: center; }
  .cta-card img.logo { height: 220px; }
</style>
