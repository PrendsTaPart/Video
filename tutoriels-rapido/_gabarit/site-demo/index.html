<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Studio Lumière — Création de sites web (site de démonstration)</title>
<!-- Site FICTIF pour filmer CRM47 : montre un formulaire RapidoCRM intégré en iframe dans un autre site. -->
<style>
  body { margin: 0; font-family: Georgia, serif; color: #1f2937; background: #faf7f2; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 22px 56px; background: #fff; border-bottom: 1px solid #eee; }
  header b { font-size: 22px; letter-spacing: .5px; }
  nav a { margin-left: 26px; color: #555; text-decoration: none; font-family: system-ui, sans-serif; font-size: 15px; }
  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 56px; align-items: start; }
  h1 { font-size: 44px; line-height: 1.15; margin: 10px 0 18px; }
  p { font-family: system-ui, sans-serif; line-height: 1.7; color: #4b5563; font-size: 17px; }
  .points { font-family: system-ui, sans-serif; color: #374151; line-height: 2; padding-left: 20px; }
</style>
</head>
<body>
  <header><b>Studio Lumière</b><nav><a href="#">Réalisations</a><a href="#">Tarifs</a><a href="#">Contact</a></nav></header>
  <section class="hero">
    <div>
      <p style="color:#7e57c2;font-weight:600;letter-spacing:1px">CRÉATION DE SITES WEB À BORDEAUX</p>
      <h1>Un site qui fait venir vos clients</h1>
      <p>Sites vitrines de 5 pages, livrés en 3 semaines, optimisés pour être trouvés sur Google.</p>
      <ul class="points"><li>Devis gratuit sous 24 h</li><li>Maintenance incluse 3 mois</li><li>Accompagnement personnalisé</li></ul>
    </div>
    <div>
      <!-- Code d'intégration copié depuis RapidoCRM (Formulaires > Design et intégration) -->
      <iframe id="rapido-form-demo-devis-studio-lumiere" src="http://127.0.0.1:8124/f/demo-devis-studio-lumiere?integre=1" style="width:100%;max-width:640px;border:0;min-height:520px" loading="lazy" title="Demande de devis site web"></iframe>
      <script>window.addEventListener("message",function(e){if(e.data&&e.data.rapidoFormulaire==="demo-devis-studio-lumiere"){document.getElementById("rapido-form-demo-devis-studio-lumiere").style.height=e.data.hauteur+"px";}});</script>
    </div>
  </section>
</body>
</html>
