<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Salle de visio (démo)</title>
<!-- Salle de visioconférence FICTIVE pour le tournage de CRM34 : remplace le service de visio réel
     (non configuré sur la copie de tournage). Aucune marque, participants fictifs. -->
<style>
  body { margin: 0; height: 100vh; background: #1f2430; font-family: system-ui, sans-serif; color: #fff; display: flex; flex-direction: column; }
  .grille { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .tuile { border-radius: 14px; display: flex; align-items: center; justify-content: center; position: relative; }
  .a { background: linear-gradient(135deg, #3d6b4f, #2c4a39); }
  .b { background: linear-gradient(135deg, #5b4a8a, #3e3263); }
  .avatar { width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 600; }
  .nom { position: absolute; left: 14px; bottom: 12px; background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 8px; font-size: 14px; }
  .parle { box-shadow: 0 0 0 3px #4caf50 inset; }
  .barre { display: flex; justify-content: center; gap: 14px; padding: 14px; }
  .bouton { width: 46px; height: 46px; border-radius: 50%; background: #343b4b; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .quitter { background: #e5484d; width: 70px; border-radius: 23px; }
</style>
</head>
<body>
  <div class="grille">
    <div class="tuile a parle"><div class="avatar">LM</div><span class="nom">Léa Martin</span></div>
    <div class="tuile b"><div class="avatar">LL</div><span class="nom">Lotus Lounge</span></div>
  </div>
  <div class="barre"><div class="bouton">🎙</div><div class="bouton">📷</div><div class="bouton">🖥</div><div class="bouton quitter">✕</div></div>
</body>
</html>
